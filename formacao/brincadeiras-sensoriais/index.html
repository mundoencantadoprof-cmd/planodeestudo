CURSO.ap.m5 = {
  intro: 'Este capítulo trata de sentidos frequentemente esquecidos no planejamento: o olfato, o paladar e os sentidos do movimento, vestibular e proprioceptivo. Discute a alimentação como experiência sensorial, apresenta propostas de movimento e valoriza o movimento livre e as brincadeiras tradicionais.',
  secoes: [
    { t: '5.1 Cheiros: memória, afeto e descoberta', p: [
      'O olfato é um sentido antigo e poderoso. As informações olfativas chegam a regiões do cérebro ligadas à emoção e à memória de forma muito direta, e é por isso que um cheiro pode trazer de volta, de repente, uma lembrança inteira da infância. Desde os primeiros dias, o bebê reconhece o cheiro de quem cuida dele, e cheiros familiares podem acalmá-lo. Na adaptação à creche, um paninho com o cheiro de casa às vezes ajuda mais do que muitas palavras.',
      'Apesar disso, o olfato raramente aparece no planejamento da educação infantil. A BNCC inclui, entre os objetivos para os bebês, explorar e descobrir as propriedades de objetos e materiais, como odor, cor, sabor e temperatura (Brasil, 2018). Horn (2004) dedica o título de sua obra a "sabores, cores, sons, aromas", lembrando que os ambientes da infância também deveriam ter cheiro e sabor.',
      'Os potes de cheiro são uma proposta simples: potes opacos, com pequenos furos na tampa, contendo cravo, canela em pau, café, erva-doce, casca de laranja ou limão, folhas de hortelã, manjericão, alecrim. As crianças cheiram, dizem se gostaram, tentam adivinhar, comparam e depois descobrem o conteúdo. Com as maiores, é possível formar pares de potes com o mesmo cheiro.',
      'Os cuidados são importantes. Os cheiros são oferecidos por convite, a uma distância segura do nariz, e a criança que não quer cheirar é respeitada. Não se usam produtos de limpeza, perfumes fortes, essências irritantes ou pimentas. Crianças com rinite, asma ou sensibilidade a cheiros precisam de atenção especial, e a conversa com as famílias ajuda a conhecer essas condições.'
    ], av: { e: 'Segundo o texto, por que um paninho com o cheiro de casa pode ajudar na adaptação à creche?', o: ['Porque substitui a família.', 'Porque o olfato está ligado à emoção e à memória, e cheiros familiares acalmam.', 'Porque evita alergias.', 'Porque é obrigatório.'], a: 1, r: 'O olfato tem ligação direta com emoção e memória; cheiros conhecidos acolhem.' } },
    { t: '5.2 Sabores e alimentação como experiência sensorial', fig: 'horta', p: [
      'A alimentação é uma das experiências sensoriais mais completas da infância: envolve cor, cheiro, textura, temperatura, som (o crocante da cenoura, o borbulhar da panela) e sabor. Na creche, os momentos de refeição são também momentos de educação, e as DCNEI tratam o cuidado como indissociável do educar (Brasil, 2009).',
      'O Guia Alimentar para Crianças Brasileiras Menores de 2 Anos, do Ministério da Saúde, orienta oferecer alimentos in natura e minimamente processados, evitar ultraprocessados e não oferecer açúcar antes dos 2 anos. O documento recomenda também que a criança seja estimulada a explorar os alimentos, inclusive com as mãos, que a refeição aconteça em ambiente tranquilo, sem telas, e que o adulto respeite os sinais de fome e saciedade (Brasil, 2019).',
      'Recusar alimentos novos é comum na primeira infância. Muitas crianças precisam ter contato várias vezes com um alimento antes de aceitá-lo. Forçar, fazer chantagem, distrair com telas para "a comida entrar" ou premiar com doces tendem a piorar a relação da criança com a comida. Algumas crianças apresentam seletividade alimentar intensa, ligada à textura ou ao cheiro dos alimentos, o que merece conversa com a família e, quando necessário, encaminhamento.',
      'As propostas pedagógicas podem aproximar as crianças dos alimentos de forma lúdica: a horta, em canteiros ou vasos, permite plantar, regar, observar o crescimento, colher, cheirar e provar; o preparo de receitas simples, como salada de frutas, suco ou pão, envolve medir, misturar e transformar; feiras de frutas permitem comparar cores, cascas, cheiros e sabores. Em todas elas, é indispensável conhecer as alergias e restrições de cada criança e seguir as orientações de higiene.'
    ], av: { e: 'De acordo com o Guia Alimentar para Crianças Menores de 2 Anos, diante da recusa de um alimento novo, o adulto deve:', o: ['forçar a criança a comer.', 'oferecer o alimento outras vezes, sem pressão, respeitando os sinais da criança.', 'premiar com doces.', 'nunca mais oferecer aquele alimento.'], a: 1, r: 'A aceitação costuma exigir várias exposições, sem pressão, chantagem ou recompensa com doces (Brasil, 2019).' } },
    { t: '5.3 Balançar, girar, rolar: o sistema vestibular', fig: 'movimento', p: [
      'O sistema vestibular, como vimos no módulo 1, informa ao cérebro a posição da cabeça e os movimentos do corpo no espaço. Ele trabalha junto com a visão e a propriocepção para manter o equilíbrio, regular o tônus muscular e estabilizar o olhar durante os movimentos. Ayres (2005) considerava o sistema vestibular um dos grandes organizadores das demais sensações.',
      'As crianças pequenas procuram espontaneamente experiências vestibulares: pedem colo para serem balançadas, giram até ficar tontas, rolam na grama, escorregam, ficam de cabeça para baixo. Essas experiências são importantes para o desenvolvimento do equilíbrio e da consciência corporal e costumam provocar grande prazer.',
      'O planejamento pode oferecê-las de forma intencional: balanços e redes; rolar em rampas de colchonete ou na grama; escorregadores; brincadeiras de embalar em lençol (com dois adultos segurando as pontas e movimentos suaves); circuitos com subir, descer, passar por baixo, equilibrar-se em uma trave baixa ou em uma linha no chão; dançar girando devagar e depois mais rápido.',
      'É preciso observar as reações. Algumas crianças buscam intensamente esses movimentos e parecem nunca se cansar; outras sentem medo ou desconforto quando os pés saem do chão e evitam balanços e escorregadores. As duas reações merecem respeito e mediação: para quem busca, oferecer oportunidades seguras e frequentes; para quem evita, começar com movimentos lentos, com os pés apoiados, com o adulto por perto e com a possibilidade de parar a qualquer momento. Girar de forma intensa e forçada nunca é recomendado.'
    ], av: { e: 'Uma criança tem medo quando os pés saem do chão e evita o balanço. Segundo o texto, o adulto deve:', o: ['colocá-la no balanço e empurrar forte.', 'começar com movimentos lentos, com os pés apoiados e possibilidade de parar.', 'proibi-la de ir ao parque.', 'girar a criança para ela perder o medo.'], a: 1, r: 'Respeito e mediação: movimentos suaves, apoio e controle pela criança.' } },
    { t: '5.4 Empurrar, puxar, carregar: a propriocepção', p: [
      'A propriocepção, também já apresentada no módulo 1, é o sentido que informa onde está cada parte do corpo e quanta força está sendo usada. Ela depende de receptores localizados nos músculos, tendões e articulações e é ativada principalmente quando o corpo faz força contra uma resistência: empurrar, puxar, carregar, pendurar-se, apertar, pular, rastejar.',
      'Na literatura de integração sensorial, essas atividades são às vezes chamadas de "trabalho pesado" e são reconhecidas por seu efeito organizador: depois de empurrar caixas, carregar almofadas ou puxar uma corda, muitas crianças ficam mais calmas e atentas (Bundy; Lane, 2020). Por isso, propostas proprioceptivas são úteis em momentos de transição, depois de períodos em que as crianças ficaram sentadas e antes de atividades que exigem concentração.',
      'Exemplos de propostas: empurrar carrinhos ou caixas com blocos; carregar baldes com areia ou água (na medida da força da criança); arrumar a sala levando almofadas e colchonetes; cabo de guerra com corda grossa; andar como bichos (urso, caranguejo, sapo); pular em colchonetes ou dentro de bambolês; rastejar por baixo de cadeiras ou túneis; amassar e sovar massa; abraços apertados e brincadeiras de "rolinho" no tapete, apenas quando a criança quer.',
      'A propriocepção também participa de habilidades finas. Graduar a força do lápis, apertar o tubo de cola sem esvaziá-lo, segurar o copo sem amassar dependem de uma boa percepção do próprio corpo. Muitas dificuldades que aparecem mais tarde, como letra muito forte ou muito fraca, relacionam-se a experiências corporais que a criança teve ou não teve nos primeiros anos.'
    ], av: { e: 'Propostas de "trabalho pesado", como empurrar caixas e carregar almofadas, costumam:', o: ['deixar a criança mais agitada.', 'ter efeito organizador, ajudando muitas crianças a ficar mais calmas e atentas.', 'ser perigosas em qualquer situação.', 'servir apenas como castigo.'], a: 1, r: 'Estímulos proprioceptivos tendem a organizar (Bundy; Lane, 2020).' } },
    { t: '5.5 Movimento livre e brincadeiras tradicionais', p: [
      'A pediatra húngara Emmi Pikler, que dirigiu o Instituto Lóczy, em Budapeste, a partir de 1946, desenvolveu uma abordagem que valoriza a motricidade livre. Suas observações mostraram que bebês colocados em ambientes seguros, com roupas confortáveis e espaço para se mover, conquistam por iniciativa própria as posturas de virar, rastejar, engatinhar, sentar e andar, com movimentos mais seguros e harmoniosos. Por isso, a abordagem orienta que o adulto não coloque o bebê em posições que ele ainda não alcança sozinho, como sentá-lo com almofadas ou fazê-lo andar segurando pelas mãos (Falk, 2011).',
      'Essa perspectiva tem consequências práticas para a creche: mais tempo no chão, sobre superfícies firmes, e menos tempo em cadeirinhas, bebês-conforto e cercados; objetos interessantes um pouco fora do alcance, para motivar o deslocamento; estruturas baixas para subir e descer; e um adulto que observa e confia na competência do bebê, intervindo quando há risco.',
      'Com as crianças maiores, as brincadeiras tradicionais são uma fonte inesgotável de experiências sensoriais e motoras. Amarelinha envolve equilíbrio em um pé só e salto; pula-corda, ritmo, coordenação e propriocepção; cirandas e brincadeiras de roda, giro, canto e contato; cabra-cega, audição e tato; esconde-esconde e pega-pega, deslocamentos rápidos, mudanças de direção e regras. Kishimoto (1996) e Friedmann (1996) mostram que essas brincadeiras, transmitidas oralmente entre gerações, são parte da cultura da infância e merecem lugar na escola.',
      'Resgatar essas brincadeiras com as crianças pode envolver as famílias: avós e pais podem ensinar as brincadeiras de seu tempo e de sua região, ampliando o repertório da turma e fortalecendo os vínculos entre a escola e a comunidade.'
    ], av: { e: 'Segundo a abordagem de Emmi Pikler, o adulto:', o: ['coloca o bebê sentado com almofadas antes que ele consiga sozinho.', 'oferece ambiente seguro e deixa o bebê conquistar as posturas por iniciativa própria.', 'faz o bebê andar segurando pelas mãos para acelerar.', 'mantém o bebê no cercado a maior parte do tempo.'], a: 1, r: 'Motricidade livre: o bebê conquista as posturas sozinho, em ambiente seguro (Falk, 2011).' } }
  ],

CURSO.ap.m6 = {
  intro: 'Este capítulo final reúne o que foi estudado para pensar o cotidiano. Apresenta os perfis sensoriais e o acolhimento de crianças que sentem o mundo de maneira diferente, discute o planejamento com intencionalidade, a observação, o registro e a documentação, e termina com a parceria com as famílias.',
  secoes: [
    { t: '6.1 Cada criança sente o mundo de um jeito: perfis sensoriais', fig: 'dunn', p: [
      'Ao longo do curso, vimos que as crianças reagem de formas diferentes aos mesmos estímulos. Algumas mergulham as mãos na tinta sem hesitar; outras observam de longe. Algumas giram até cair; outras não sobem no escorregador. A terapeuta ocupacional Winnie Dunn (1997) propôs um modelo para compreender essas diferenças, que se tornou referência na área.',
      'O modelo cruza dois eixos. O primeiro é o limiar neurológico: algumas pessoas precisam de muito estímulo para perceber e reagir (limiar alto), enquanto outras percebem e reagem a estímulos mínimos (limiar baixo). O segundo é a estratégia de resposta: algumas pessoas respondem de forma passiva, deixando os estímulos acontecerem, e outras agem ativamente, buscando ou evitando estímulos. Do cruzamento resultam quatro padrões: baixo registro (limiar alto, resposta passiva: a criança parece não perceber o que acontece ao redor); busca sensorial (limiar alto, resposta ativa: procura movimento, sons e toques intensos); sensibilidade sensorial (limiar baixo, resposta passiva: percebe e se incomoda com muitos estímulos, distrai-se com facilidade); e evitação sensorial (limiar baixo, resposta ativa: afasta-se, foge, cria rotinas para evitar estímulos).',
      'Esses padrões não são diagnósticos e todos nós temos um pouco de cada um, dependendo do sentido e da situação. Eles ajudam o professor a ler o comportamento da criança com outros olhos: a criança que "não para quieta" pode estar buscando os estímulos de que seu sistema nervoso precisa; a que "faz birra" na festa pode estar sobrecarregada pelo barulho.',
      'Diferenças sensoriais intensas aparecem com frequência em crianças autistas. O DSM-5-TR inclui, entre os critérios do transtorno do espectro autista, a hiper ou hiporreatividade a estímulos sensoriais ou o interesse incomum por aspectos sensoriais do ambiente, como indiferença aparente a dor ou temperatura, reação adversa a sons ou texturas específicas, cheirar ou tocar objetos de forma excessiva e fascinação visual por luzes ou movimento (American Psychiatric Association, 2023). Mas elas também aparecem em crianças sem qualquer diagnóstico, e o acolhimento não depende de laudo.'
    ], av: { e: 'Segundo o texto, os padrões sensoriais de Dunn:', o: ['são diagnósticos médicos.', 'não são diagnósticos e ajudam o professor a compreender o comportamento das crianças.', 'só existem em crianças autistas.', 'servem para classificar as crianças em turmas.'], a: 1, r: 'Os padrões ajudam a ler o comportamento; todos temos um pouco de cada um (Dunn, 1997).' } },
    { t: '6.2 Acolher sem forçar: ajustes e inclusão', p: [
      'Quando uma criança evita uma experiência sensorial, a tentação é insistir para que ela "se acostume". Segurar a mão dela na massa, colocá-la à força na piscina de bolinhas ou mantê-la no salão barulhento costuma ter o efeito oposto: aumenta o medo, associa a escola ao desconforto e pode levar a reações intensas. O caminho é o convite, a alternativa e o tempo.',
      'Alguns ajustes simples ajudam muito: antecipar o que vai acontecer, com palavras e imagens; oferecer ferramentas como pincéis, colheres, palitos, luvas ou sacos plásticos lacrados com tinta dentro, que permitem explorar sem contato direto; deixar a criança observar de perto antes de participar; oferecer o material em menor quantidade ou intensidade (água morna em vez de gelada, sons mais suaves); permitir que ela saia e volte; organizar pequenos grupos; usar abafador de ruídos; ter um canto calmo, que nunca é lugar de castigo. Para a criança que busca estímulos, o ajuste é inverso: oferecer mais oportunidades de movimento, de "trabalho pesado" e de exploração intensa, de modo seguro e organizado.',
      'Esses ajustes, quando pensados desde o início do planejamento, beneficiam toda a turma. É o princípio do Desenho Universal para a Aprendizagem, que propõe oferecer múltiplas formas de engajamento, de representação e de ação e expressão, em vez de adaptar depois para alguns (CAST, 2018). Uma proposta de tinta com mãos, pincéis e esponjas à escolha já inclui a criança que evita o contato direto, sem destacá-la.',
      'No plano normativo, a Lei Brasileira de Inclusão garante o sistema educacional inclusivo em todos os níveis e a adoção de medidas individualizadas e coletivas que maximizem o desenvolvimento dos estudantes com deficiência (Brasil, 2015, art. 28). A Política Nacional de Educação Especial Inclusiva, instituída pelo Decreto nº 12.686/2025, reafirma que o atendimento educacional especializado não depende de laudo médico, e a Lei nº 12.764/2012 reconhece a pessoa com transtorno do espectro autista como pessoa com deficiência para todos os efeitos legais. Na educação infantil, isso significa que o planejamento das brincadeiras sensoriais considera desde o início as crianças público da educação especial, em parceria com o professor do AEE quando houver.'
    ], av: { e: 'Para a criança que evita tocar a massa, o texto recomenda:', o: ['segurar a mão dela na massa.', 'convite, alternativas (ferramentas, luvas, saco lacrado) e tempo.', 'retirar a massa da turma toda.', 'deixá-la fora da sala.'], a: 1, r: 'O caminho é convidar, oferecer alternativas e respeitar o tempo da criança.' } },
    { t: '6.3 Planejar com intencionalidade', fig: 'plano', p: [
      'Brincadeira sensorial não é passatempo para ocupar o tempo nem "atividade de enfeite" para fotografar. As DCNEI exigem que as propostas pedagógicas tenham intencionalidade educativa e garantam experiências diversificadas (Brasil, 2009). Na prática, isso significa planejar.',
      'Um bom planejamento responde a algumas perguntas. Para quem? (a idade e os interesses do grupo, o que as crianças já viveram, as necessidades de cada uma). Para quê? (os objetivos, relacionados aos campos de experiências e aos direitos de aprendizagem da BNCC). Com quê? (os materiais, verificados quanto à segurança, à quantidade e à variedade). Onde? (o espaço e sua organização: chão, mesa baixa, pátio, canto escurecido). Quando e por quanto tempo? (o momento da rotina e a duração, com flexibilidade para seguir o interesse das crianças). Com quantas crianças? (o grupo inteiro, pequenos grupos ou rodízio entre cantos). E qual é o papel do adulto? (organizar, convidar, observar, nomear, propor desafios, garantir a segurança).',
      'O planejamento não termina quando a proposta acontece. O que o professor observa (o que as crianças fizeram com os materiais, o que disseram, o que as surpreendeu, quem não participou e por quê) alimenta o replanejamento: repetir a proposta, acrescentar uma ferramenta, mudar o espaço, levar a investigação para outro material. Esse ciclo de planejar, oferecer, observar, registrar e replanejar é o que dá continuidade e profundidade às experiências.',
      'Um exemplo: depois de observar que um grupo de crianças bem pequenas se interessou por encher e esvaziar potes na bandeja de areia, a professora decide oferecer, na semana seguinte, a mesma bandeja com água e funis; depois, com areia molhada e forminhas; e, por fim, leva a investigação para o pátio, com baldes e mangueira. As crianças aprofundam uma mesma investigação, encher e esvaziar, em diferentes materiais, e a professora documenta esse percurso.'
    ], av: { e: 'Segundo o texto, o que dá continuidade e profundidade às experiências sensoriais é:', o: ['trocar de atividade todos os dias, sem relação entre elas.', 'o ciclo de planejar, oferecer, observar, registrar e replanejar.', 'fotografar para as redes sociais.', 'usar materiais cada vez mais caros.'], a: 1, r: 'A observação alimenta o replanejamento e permite aprofundar a investigação das crianças.' } },
    { t: '6.4 Observar, registrar e documentar', p: [
      'As DCNEI determinam que as instituições de educação infantil criem procedimentos para acompanhamento do trabalho pedagógico e para avaliação do desenvolvimento das crianças, sem objetivo de seleção, promoção ou classificação, garantindo a observação crítica e criativa das atividades, das brincadeiras e interações das crianças no cotidiano e a utilização de múltiplos registros realizados por adultos e crianças, como relatórios, fotografias, desenhos e álbuns (Brasil, 2009, art. 10).',
      'As brincadeiras sensoriais são momentos privilegiados de observação. O professor pode registrar quais materiais cada criança escolhe, como os explora, por quanto tempo se concentra, o que diz, como interage com os colegas, que hipóteses levanta, que reações tem aos diferentes estímulos. Anotações rápidas em um caderno, fotos e pequenos vídeos, sempre com autorização das famílias, e as falas das crianças transcritas compõem esse acervo.',
      'Ostetto (2017) mostra que o registro não é apenas um instrumento de controle, mas um modo de o professor refletir sobre sua prática, perceber o que antes passava despercebido e reconhecer a singularidade de cada criança. Na abordagem de Reggio Emilia, a documentação pedagógica, com painéis que combinam imagens, falas e interpretações, torna visível o processo de aprendizagem para as crianças, os professores e as famílias (Edwards; Gandini; Forman, 1999).',
      'A observação também é a base para perceber as diferenças sensoriais apresentadas na seção 6.1. Registros que mostram que uma criança sempre se afasta das propostas com tinta ou se desorganiza nos momentos barulhentos ajudam a equipe a planejar ajustes e a conversar com a família de modo descritivo, a partir de fatos e não de rótulos.'
    ], av: { e: 'De acordo com as DCNEI (art. 10), a avaliação na educação infantil:', o: ['tem objetivo de promoção e classificação.', 'se faz pela observação e por múltiplos registros, sem seleção, promoção ou classificação.', 'usa provas escritas.', 'é feita apenas no fim do ano.'], a: 1, r: 'Observação crítica e criativa e múltiplos registros, sem classificar (Brasil, 2009, art. 10).' } },
    { t: '6.5 Escola e famílias: parceria nas experiências sensoriais', p: [
      'As experiências sensoriais às vezes geram estranhamento nas famílias: a criança chega com a roupa suja de tinta ou terra, conta que "brincou com lama", e alguns pais podem achar que ela "não fez nada" na escola. A parceria com as famílias começa por explicar o sentido dessas propostas: o que a criança aprende quando explora texturas, sons, cores e movimentos, e por que isso é parte do currículo da educação infantil.',
      'Alguns combinados práticos ajudam: pedir uma "roupa de brincar" que possa sujar, usar aventais, avisar com antecedência os dias de propostas com água ou tinta e ter roupas extras na escola. A família também é uma fonte importante de informações: alergias, restrições alimentares, medos, preferências e sensibilidades da criança, que precisam ser conhecidos antes do planejamento.',
      'Compartilhar a documentação pedagógica, com fotos, falas e pequenas narrativas, mostra às famílias o que as crianças vivem e aprendem e valoriza o trabalho da escola. Reuniões em que os próprios pais experimentam as propostas (mexer na massa, explorar a mesa de luz, fazer a caminhada sonora) costumam transformar o olhar dos adultos.',
      'Por fim, a escola pode sugerir brincadeiras simples para casa, que não exigem compra de materiais: cesto com objetos da cozinha para o bebê, ajudar a preparar uma receita, brincar com água no banho, cantar as cantigas da família, caminhar prestando atenção aos sons do bairro, deitar no chão e olhar as nuvens. Quando família e escola compreendem juntas que a criança pequena aprende com o corpo inteiro, as experiências sensoriais deixam de ser "bagunça" e passam a ser reconhecidas como aquilo que são: direito da criança e caminho de desenvolvimento.'
    ], av: { e: 'Segundo o texto, a parceria com as famílias nas experiências sensoriais começa por:', o: ['suspender as propostas que sujam.', 'explicar o sentido das propostas e o que a criança aprende com elas.', 'pedir que a família compre materiais caros.', 'evitar mostrar o que as crianças fazem.'], a: 1, r: 'Explicar o sentido pedagógico, combinar roupa de brincar e compartilhar registros.' } }
  ],

  CURSO.siglas.forEach(function (s) {
    var sig = s[0], ext = s[1], q = sig.replace(/[.*+?^${}()|[\]\\\/-]/g, '\\$&');

    if (vistos[sig]) return;
    var m = re.exec(txt); if (!m) return;
    vistos[sig] = true;
    var i = m.index + m[1].length;
    /* já veio por extenso ou está dentro de citação (Sigla, ano) */
    if (txt.slice(Math.max(0, i - ext.length - 3), i).toLowerCase().indexOf(ext.toLowerCase().slice(0, 20)) >= 0) return;
    if (/^[A-Z\/-]+, \d{4}/.test(txt.slice(i))) { vistos[sig] = false; return; }
    txt = txt.slice(0, i) + ext + ' (' + sig + ')' + txt.slice(i + sig.length);
  });

};

<script>/* Formação Continuada no site publicado: login Google (mesmo projeto Firebase do Plano de Estudo), matrícula pelo
   Mercado Pago (pePagamento), progresso guardado na conta (peProgresso), certificado e validação (peCertificado)
   e apostila em PDF (peApostila). */
window.FC_NUVEM = (function () {
  var CFG = window.PE_CONFIG, CURSO_ID = CURSO.id, ITEM = 'pe-formacao-' + CURSO_ID, APOST = 'ap-formacao-' + CURSO_ID;
  var FUN = CFG.funcoes.replace(/\/$/, ''), FB = null, A = function () { return window.FC_APP; };
  function firebase() {
    if (FB) return FB;
    var SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
    FB = Promise.all([import(SDK + 'firebase-app.js'), import(SDK + 'firebase-auth.js')]).then(function (m) {
      var app = m[0].getApps().length ? m[0].getApp() : m[0].initializeApp(CFG.firebase);
      return { A: m[1], auth: m[1].getAuth(app) };
    });
    FB.catch(function () { FB = null; });
    return FB;
  }
  function token() { return firebase().then(function (f) { if (!f.auth.currentUser) throw new Error('Entre com a sua conta Google.'); return f.auth.currentUser.getIdToken(); }); }
  function post(fn, corpo, semLogin) {
    return (semLogin ? Promise.resolve(null) : token()).then(function (tk) {
      var h = { 'Content-Type': 'application/json' }; if (tk) h.Authorization = 'Bearer ' + tk;
      return fetch(FUN + '/' + fn, { method: 'POST', headers: h, body: JSON.stringify(corpo) });
    }).then(function (r) {
      var ct = r.headers.get('content-type') || '';
      if (ct.indexOf('application/json') < 0) { if (!r.ok) throw new Error('Não foi possível agora. Tente de novo.'); return r; }
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.erro || 'Não foi possível agora. Tente de novo.'); return j; });
    });
  }
  function dataIso(s) { var p = String(s || '').split('-'); return p.length === 3 ? new Date(+p[0], +p[1] - 1, +p[2], 12).getTime() : null; }
  function certLocal(c) {
    return c ? { nome: c.nome, rg: c.rgCompleto || c.rg, org: c.orgao || '', cod: c.codigo, emit: c.emitido ? new Date(c.emitido).getTime() : Date.now(), nota: c.nota, ini: dataIso(c.inicio), fimD: dataIso(c.fim) } : null;
  }
  /* progresso: um item cu-<módulo> por módulo e cu-fin para a avaliação final */
  function pacoteCu() {
    var S = A().S, cu = { _t: {} }, agora = Date.now();
    Object.keys(S.mods).forEach(function (id) { cu['cu-' + id] = S.mods[id]; cu._t['cu-' + id] = agora; });
    cu['cu-fin'] = { tent: S.fin.tent || [], ok: !!S.fin.ok, nota: S.fin.nota || 0, em: S.fin.em || 0, fim: S.fin.ok ? (S.fin.em || agora) : 0 };
    cu._t['cu-fin'] = agora;
    return cu;
  }
  function pontos(x) { return x ? (x.fim ? 1000 : 0) + (x.e || []).length + (x.c || []).length + Object.keys(x.a || {}).length + (x.q && x.q.ok ? 5 : 0) : -1; }
  function juntar(cu) {
    var S = A().S, mudou = false;
    Object.keys(cu || {}).forEach(function (k) {
      if (k === '_t' || k.indexOf('cu-') !== 0) return;
      var r = cu[k];
      if (k === 'cu-fin') {
        if ((r.fim && !S.fin.ok) || (!S.fin.ok && (r.tent || []).length > (S.fin.tent || []).length)) { S.fin = { tent: r.tent || [], ok: !!r.ok, nota: r.nota, em: r.em }; mudou = true; }
        return;
      }
      var id = k.slice(3);
      if (pontos(r) > pontos(S.mods[id])) { S.mods[id] = r; mudou = true; }
    });
    return mudou;
  }
  var tm = null, ultimo = '';
  function sincronizar() {
    clearTimeout(tm);
    var cu = pacoteCu(), txt = JSON.stringify(cu, function (k, v) { return k === '_t' ? undefined : v; });
    if (txt === ultimo) return Promise.resolve();
    return post('peProgresso', { acao: 'gravar', conc: 'formacao', cargo: CURSO_ID, cu: cu }).then(function () { ultimo = txt; });
  }
  function agendar() { clearTimeout(tm); tm = setTimeout(function () { sincronizar().catch(function () {}); }, 2500); }
  window.addEventListener('pagehide', function () { if (tm) sincronizar().catch(function () {}); });
  function estado() {
    var app = A(), E = app.est;
    E.carregando = true; app.render();
    return post('peCertificado', { acao: 'estado', curso: CURSO_ID }).then(function (j) {
      E.liberado = !!j.liberado; E.liberaEm = j.liberaEm || null;
      if (!j.liberado) return;

      return post('peProgresso', { acao: 'todos' }).then(function (p) {
        var it = p.itens && p.itens['formacao-' + CURSO_ID];
        if (it && it.cu && juntar(it.cu)) app.save();
        app.C.modulos.forEach(function (m) { var s = app.S.mods[m.id]; if (s && !s.fim) { /* revalida a conclusão */ } });
        app.save();

    }).catch(function (e) { E.aviso = e.message; }).then(function () { E.carregando = false; E.pronto = true; app.render(); });
  }
  function retorno() {
    var q = new URLSearchParams(location.search), st = q.get('pagamento'), c = q.get('c');
    if (st || c) history.replaceState(null, '', location.pathname);
    if (c) setTimeout(function () { A().validarInicial(c); }, 0);
    else if (location.hash === '#validar') setTimeout(function () { A().go('validar'); }, 0);
    return st;
  }
  function iniciar() {
    var st = retorno(), E = A().est;
    if (st === 'aprovado') E.aviso = 'Pagamento aprovado! Estamos liberando o seu acesso…';
    if (st === 'pendente') E.aviso = 'Pagamento em análise. O acesso é liberado assim que o Mercado Pago confirmar (no Pix, em instantes).';
    if (st === 'falha') E.aviso = 'O pagamento não foi concluído. Você pode tentar de novo.';
    firebase().then(function (f) {
      f.A.onAuthStateChanged(f.auth, function (u) {
        A().setUser(u ? { email: u.email, displayName: u.displayName } : null);
        if (!u) { E.liberado = false; A().render(); return; }
        estado().then(function () {
          if ((st === 'aprovado' || st === 'pendente') && !E.liberado) {
            var n = 0, iv = setInterval(function () { n++; estado().then(function () { if (E.liberado || n > 12) { clearInterval(iv); if (!E.liberado && st === 'aprovado') { E.aviso = 'O pagamento foi aprovado, mas a liberação está demorando. Atualize a página em alguns minutos ou escreva para mundo.encantado.prof@gmail.com.'; A().render(); } } }); }, 5000);
          }
        });
      });
    }).catch(function () { E.aviso = 'Não foi possível carregar o login. Verifique a internet e atualize a página.'; A().render(); });
  }
  return {
    iniciar: iniciar, estado: estado, agendar: agendar, sincronizar: sincronizar,
    entrar: function () { return firebase().then(function (f) { return f.A.signInWithPopup(f.auth, new f.A.GoogleAuthProvider()); }).catch(function (e) { if (e && e.code !== 'auth/popup-closed-by-user') alert('Não foi possível entrar: ' + (e.message || e)); }); },
    sair: function () { return sincronizar().catch(function () {}).then(firebase).then(function (f) { return f.A.signOut(f.auth); }).then(function () { location.reload(); }); },
    pagar: function (cad) { return post('pePagamento', { item: ITEM, cadastro: cad, voltar: location.origin + location.pathname }).then(function (j) { if (!j.url && !j.jaLiberado) throw new Error('Não foi possível abrir o pagamento agora.'); return j; }); },
    emitir: function (d) { return post('peCertificado', { acao: 'emitir', curso: CURSO_ID, nome: d.nome, rg: d.rg, orgao: d.orgao }).then(function (j) { A().S.cert = certLocal(j.cert); A().save(); }); },
    validar: function (cod) {
      return post('peCertificado', { acao: 'validar', codigo: cod }, true).then(function (j) {
        if (!j.achou) return null; var c = j.cert;
        return { nome: c.nome, rg: c.rg, curso: c.curso, horas: c.horas, ini: dataIso(c.inicio), fim: dataIso(c.fim), emit: c.emitido ? new Date(c.emitido).getTime() : null };
      });
    },
    apostila: function () {
      return post('peApostila', { item: APOST }).then(function (r) { return r.blob(); }).then(function (b) {
        var u = URL.createObjectURL(b), a = document.createElement('a'); a.href = u; a.download = 'apostila-' + CURSO_ID + '.pdf'; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(u); a.remove(); }, 4000);
