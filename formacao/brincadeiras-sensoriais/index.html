*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Source Sans 3',system-ui,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3,.sora{font-family:Sora,system-ui,sans-serif;line-height:1.25;margin:0}
button{font:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.previa{background:var(--gold-wash);color:#6b4b00;font-size:13.5px;text-align:center;padding:6px 12px;border-bottom:1px solid #EBD9A8}
header.top{background:var(--sheet);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--brand);cursor:pointer}
.logo img{width:34px;height:34px}
.logo b{font-family:Sora;font-size:15px;line-height:1.05}.logo b i{font-style:normal;color:var(--gold);display:block}
.tag{margin-left:auto;font-size:13px;color:var(--soft);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--brand);color:#fff;text-decoration:none;min-height:46px}
.btn.gold{background:var(--gold2);color:#1d1400}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:14.5px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.hero{background:linear-gradient(135deg,#13285E,#1d3a80);color:#fff;padding:34px 0 30px}
.hero.foto{position:relative;padding:0 0 34px;background:#13285E}.hero.foto .ft{height:clamp(190px,34vw,430px);background:linear-gradient(180deg,rgba(19,40,94,0) 55%,#13285E 100%),var(--foto) center 28%/cover no-repeat}.hero.foto .wrap{margin-top:-28px;position:relative}
.hero .kick{color:#F5C04A;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.hero h1{font-size:clamp(24px,5vw,34px);margin:8px 0 12px}
.hero p{color:#D9E0F2;margin:0 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600}
.price{font-family:Sora;font-size:28px;font-weight:800;color:#F5C04A}.price small{font-size:14px;color:#D9E0F2;font-weight:600;font-family:'Source Sans 3'}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0}
.card h2{font-size:19px;margin-bottom:10px;color:var(--brand)}
.mods{list-style:none;margin:0;padding:0}
.mods li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.mods li:first-child{border-top:0}
.num{flex:0 0 32px;height:32px;border-radius:50%;background:var(--brand-wash);color:var(--brand);display:grid;place-items:center;font-weight:800;font-family:Sora;font-size:14px}
.mods .h{margin-left:auto;font-weight:700;color:var(--gold);white-space:nowrap;font-size:14px}
ul.ok{padding-left:20px;margin:0}ul.ok li{margin:4px 0}
.note{font-size:14px;color:var(--soft)}

/* sala */

.mi.done .num{background:var(--ok);color:#fff}.st.done{color:var(--ok)}.st.go{color:var(--gold)}

.mtitle{font-size:20px;color:var(--brand);margin:6px 0 4px}

/* cartões */
.flash{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:22px 20px;min-height:260px;display:flex;flex-direction:column;box-shadow:0 6px 20px rgba(19,40,94,.06)}

.dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:6px 0}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.v{background:var(--brand)}
/* leitura */
details.acc{background:var(--sheet);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}

.seen{color:var(--ok);font-size:14px}
/* atividades */

.assoc{display:grid;gap:10px}@media(min-width:640px){.assoc{grid-template-columns:1fr 1.6fr}}

.secoes .wrap{display:flex!important;height:auto!important;gap:2px;padding-block:5px;justify-content:space-between}
.secoes .sec{display:inline-flex;align-items:center;gap:7px;color:#DCE4F7;font:600 .9rem/1.1 Sora,sans-serif;padding:9px 8px;border-radius:12px;text-decoration:none;white-space:nowrap}
.secoes .sec svg{width:19px;height:19px;flex:none}
.secoes .sec:hover{background:rgba(255,255,255,.09);color:#fff}
.secoes .sec.on{background:#fff;color:#13285E}
.secoes .sec .ss{display:none}
@media(max-width:700px){.secoes .wrap{display:grid!important;grid-template-columns:repeat(6,minmax(0,1fr))}.secoes .sec{flex-direction:column;gap:4px;padding:8px 1px 7px;font-size:10.5px;letter-spacing:-.01em;border-radius:10px;min-width:0}.secoes .sec svg{width:21px;height:21px}.secoes .sec .sl{display:none}.secoes .sec .ss{display:inline}header.top.site .tag{display:none}.loginbtn{margin-left:auto;padding:8px 11px}.loginbtn span{display:none}}

header.top.site{background:#F7F5EF}
header.top.site .r1{padding-block:12px 6px}
header.top.site .logo{display:flex;align-items:center;gap:10px;text-decoration:none}
header.top.site .logo img{width:48px;height:48px}
header.top.site .wm{display:grid;line-height:1;border-left:2px solid #13285E;padding-left:10px}
header.top.site .wm b{color:#13285E;font:800 1.05rem/1 Sora,sans-serif}
header.top.site .wm i{color:#E0A100;font:800 1.3rem/1.05 Sora,sans-serif;font-style:normal}
header.top.site .loginbtn{margin-left:auto}
header.top.site .vozb{width:34px;height:34px;border-radius:50%;border:1px solid #E2DED2;background:#fff;display:flex;align-items:center;justify-content:center;color:#13285E;margin-left:8px}
header.top.site .r2{display:flex;gap:8px;align-items:center;padding-block:4px 12px;height:auto}
header.top.site .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #E2DED2;background:#fff;border-radius:999px;padding:8px 13px;font:700 .86rem/1 Sora,sans-serif;color:#13285E;text-decoration:none;white-space:nowrap}
header.top.site .busca{flex:1;display:flex;align-items:center;gap:8px;border:1px solid #E2DED2;background:#fff;border-radius:999px;padding:9px 14px;color:#6B7390;text-decoration:none;font-size:.9rem;min-width:0}
header.top.site .busca span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.secoes .sec.on{background:rgba(242,190,69,.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(242,190,69,.6)}
@media(max-width:700px){header.top.site .logo img{width:40px;height:40px}header.top.site .r2 .pill{padding:8px 10px;font-size:.8rem}header.top.site .busca span{font-size:.82rem}}
@media(max-width:420px){header.top.site .busca span{display:none}header.top.site .busca{flex:0 0 auto}}
/* ---------- plano de estudo (versão 2) ---------- */
.eyebrow{display:block;font:700 .72rem/1.3 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#9A6B00}
.plano-top{border-top:5px solid #F2BE45;margin-top:16px}
.plano-top .mtitle{margin:6px 0 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 14px}
.stats div{background:#F4F6FB;border-radius:14px;padding:12px;text-align:center}
.stats b{display:block;font:800 1.6rem/1 Sora,sans-serif;color:#13285E}
.stats b small{font-size:.9rem;color:#6B7390;font-weight:700}
.stats span{font-size:.82rem;color:#4A5470}
.btn.big{width:100%;padding:16px 18px;font-size:1.02rem;text-align:left;white-space:normal;line-height:1.3}
details.mcardp{background:#fff;border:1px solid #E2DED2;border-radius:16px;margin-top:12px;overflow:hidden}
details.mcardp.done{border-color:#BFE3CC}
details.mcardp summary{list-style:none;display:flex;gap:12px;align-items:center;padding:14px 16px;cursor:pointer}
details.mcardp summary::-webkit-details-marker{display:none}
details.mcardp summary .num{flex:0 0 38px;height:38px;border-radius:50%;background:#13285E;color:#fff;display:flex;align-items:center;justify-content:center;font:800 1rem Sora,sans-serif}
details.mcardp.done summary .num{background:#0B7A45}
details.mcardp .mt{flex:1;display:grid;gap:3px}
details.mcardp .mt b{color:#13285E;font-size:1rem;line-height:1.3}
.mbar{display:block;height:6px;background:#EEF1F7;border-radius:99px;overflow:hidden;margin-top:4px}.mbar i{display:block;height:100%;background:linear-gradient(90deg,#1F55A0,#F2BE45)}
details.mcardp summary:after{content:'⌄';font-size:1.3rem;color:#6B7390;transition:transform .2s}
details.mcardp[open] summary:after{transform:rotate(180deg)}
.aulas{border-top:1px solid #EEF1F7;padding:6px 10px 10px}
button.aula{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:12px;padding:10px 8px;text-align:left;cursor:pointer;font:inherit;color:inherit}
button.aula:hover{background:#F4F6FB}
button.aula .ai{flex:0 0 42px;height:32px;border-radius:10px;background:#E6EAF5;color:#13285E;display:flex;align-items:center;justify-content:center;font:700 .85rem Sora,sans-serif}
button.aula.done .ai{background:#DDF3E6;color:#0B7A45}
button.aula .at{flex:1;display:grid;font-weight:600;color:#0F1B3D;line-height:1.3}
button.aula .at small{font-weight:400;color:#4A5470;font-size:.82rem}
button.aula .ab{font:700 .82rem Sora,sans-serif;color:#13285E;border:1.5px solid #13285E;border-radius:999px;padding:6px 12px;white-space:nowrap}
button.aula.done .ab{border-color:#BFE3CC;color:#0B7A45}
button.aula.rev .ai{background:#FBF1D9;color:#9A6B00}
button.aula.lock{opacity:.55;cursor:default}button.aula.lock .ab{border-color:#ccc;color:#888}
.fases{display:flex;gap:6px;margin:4px 0 16px;flex-wrap:wrap}
.fases span{font:700 .8rem Sora,sans-serif;padding:7px 12px;border-radius:999px;background:#EEF1F7;color:#6B7390}
.fases span.on{background:#13285E;color:#fff}.fases span.ok{background:#DDF3E6;color:#0B7A45}
.memo{background:linear-gradient(135deg,#FFF7E0,#FBEFCF);border:1px solid #F2D58A;border-left:6px solid #F2BE45;border-radius:16px;padding:16px 18px;margin:14px 0}
.memo p{margin:6px 0 0;font:700 1.08rem/1.45 Sora,sans-serif;color:#13285E}
.fimaula{text-align:center}.fimaula .big{width:64px;height:64px;margin:0 auto 6px;border-radius:50%;background:#DDF3E6;color:#0B7A45;font:800 2rem/64px Sora,sans-serif}
.fimaula h3{margin:0 0 4px;color:#13285E}
p.row{display:flex;gap:10px;flex-wrap:wrap}
details.resumo summary{cursor:pointer}
.resumo .cards{display:grid;gap:10px;margin-top:12px}@media(min-width:640px){.resumo .cards{grid-template-columns:1fr 1fr}}
.resumo .rc{background:#F7F9FD;border:1px solid #E3E9F5;border-radius:12px;padding:12px}
.resumo .rc p{margin:6px 0;font-size:.92rem}.resumo .rc .m{font-weight:700;color:#9A6B00;font-size:.9rem}
.aulasp{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.aulasp span{font-size:.78rem;background:#F4F6FB;border-radius:8px;padding:4px 8px;color:#4A5470}
header.top.site{position:relative!important}

.apbox{display:flex;align-items:center;gap:12px;background:#F7F9FD;border:1px solid #E3E9F5;border-radius:14px;padding:12px;margin-top:12px}
.apbox .ic{flex:0 0 46px}.apbox .ic svg{width:46px;height:46px}.apbox div{flex:1;display:grid}.apbox small{color:#4A5470}

.cvs{display:none}@media(max-width:700px){.cvl{display:none}.cvs{display:inline}header.top.site .r2 .busca{display:none}header.top.site .r2 .pill{padding:8px 9px;font-size:.78rem;gap:4px}}

    { e: 'Além dos cinco sentidos clássicos, a teoria da integração sensorial destaca dois sentidos ligados ao movimento e ao corpo. São eles:', o: ['o vestibular e o proprioceptivo.', 'o lógico e o verbal.', 'o musical e o espacial.', 'o emocional e o social.'], a: 0 },
    { e: 'Segundo as DCNEI (Resolução CNE/CEB nº 5/2009), os eixos norteadores das práticas pedagógicas na educação infantil são:', o: ['a alfabetização e o cálculo.', 'as interações e a brincadeira.', 'a disciplina e a rotina.', 'os conteúdos e as provas.'], a: 1 },
    { e: 'O campo de experiências da BNCC que trata mais diretamente de sons, cores, formas e manifestações artísticas é:', o: ['"O eu, o outro e o nós".', '"Traços, sons, cores e formas".', '"Escuta, fala, pensamento e imaginação".', '"Espaços, tempos, quantidades, relações e transformações".'], a: 1 },
    { e: 'No cesto dos tesouros, proposto por Elinor Goldschmied, o papel do adulto é:', o: ['mostrar ao bebê como usar cada objeto.', 'ficar por perto, atento e disponível, sem dirigir a exploração.', 'retirar os objetos que o bebê leva à boca.', 'sair da sala para o bebê ficar à vontade.'], a: 1 },
    { e: 'O cesto dos tesouros é indicado principalmente para:', o: ['bebês que já se sentam e ainda não andam.', 'crianças de 4 e 5 anos.', 'crianças em fase de alfabetização.', 'bebês recém-nascidos, deitados de barriga para cima.'], a: 0 },
    { e: 'No jogo heurístico, as crianças de 1 a 2 anos exploram principalmente:', o: ['livros e figuras.', 'o encaixar, empilhar, encher e esvaziar de objetos e recipientes variados.', 'jogos de regras com dados.', 'atividades de recorte e colagem.'], a: 1 },
    { e: 'Em uma turma de bebês de 1 ano, qual material é inadequado por risco de engasgo?', o: ['Colher grande de pau.', 'Novelo de lã grande, sem fios soltos.', 'Feijões e bolinhas de gel soltos.', 'Pote plástico grande com tampa.'], a: 2 },
    { e: 'Na exploração de tintas e massas com bebês, a escolha mais segura é:', o: ['tinta guache comum, porque é lavável.', 'materiais atóxicos, com ingredientes conhecidos, sob supervisão constante e atenção às alergias.', 'cola branca misturada com purpurina.', 'massinha industrial de qualquer marca.'], a: 1 },
    { e: 'Murray Schafer chamou de "paisagem sonora":', o: ['o conjunto de sons de um ambiente, que pode ser escutado com atenção.', 'uma pintura feita ao som de música.', 'o barulho que deve ser eliminado da escola.', 'uma partitura escrita para crianças.'], a: 0 },
    { e: 'Uma "caminhada sonora" com as crianças consiste em:', o: ['marchar ao som de uma banda.', 'passear em silêncio pela escola ou pelo bairro prestando atenção aos sons e depois conversar sobre eles.', 'cantar alto durante o passeio.', 'gravar música para ouvir em casa.'], a: 1 },
    { e: 'As quatro propriedades do som exploradas nas brincadeiras sonoras são:', o: ['cor, forma, tamanho e peso.', 'altura, duração, intensidade e timbre.', 'ritmo, rima, verso e estrofe.', 'velocidade, distância, força e direção.'], a: 1 },
    { e: 'Uma criança tapa os ouvidos e chora sempre que o sinal toca. A atitude mais adequada é:', o: ['insistir para ela se acostumar.', 'antecipar o sinal, oferecer um abafador e um canto mais calmo, e conversar com a família.', 'retirá-la das atividades com música.', 'chamar a atenção dela na frente da turma.'], a: 1 },
    { e: 'Nos primeiros meses de vida, o bebê enxerga melhor:', o: ['objetos muito distantes e coloridos em tons pastel.', 'objetos próximos, a cerca de 20 a 30 cm, com forte contraste, como preto e branco.', 'letras e números.', 'telas de celular.'], a: 1 },
    { e: 'Uma proposta de luz e sombra na pré-escola pode usar:', o: ['lanternas, retroprojetor ou mesa de luz, objetos transparentes e opacos e um lençol como tela.', 'apenas folhas de exercício.', 'vídeos prontos no celular.', 'luz forte direto nos olhos das crianças.'], a: 0 },
    { e: 'Na abordagem de Reggio Emilia, o ambiente é chamado de:', o: ['primeiro castigo.', 'terceiro educador.', 'sala de espera.', 'espaço neutro.'], a: 1 },
    { e: 'Maria da Graça Horn defende que os espaços da educação infantil sejam organizados:', o: ['com mesas enfileiradas viradas para a lousa.', 'em cantos e ambientes que convidam a explorar, com materiais ao alcance das crianças.', 'sem nenhum material à vista, para evitar bagunça.', 'apenas pelos adultos, sem participação das crianças.'], a: 1 },
    { e: 'Uma "garrafa sensorial" com água, glicerina e objetos que flutuam serve principalmente para:', o: ['ensinar as letras.', 'observar movimento e cor e ajudar a criança a se acalmar.', 'medir a temperatura.', 'substituir o lanche.'], a: 1 },
    { e: 'O sistema vestibular informa ao cérebro:', o: ['os cheiros do ambiente.', 'a posição da cabeça, o equilíbrio e os movimentos do corpo no espaço.', 'a temperatura dos objetos.', 'o sabor dos alimentos.'], a: 1 },
    { e: 'Empurrar o carrinho com blocos, carregar almofadas e puxar uma corda são atividades que estimulam especialmente:', o: ['o olfato.', 'a propriocepção.', 'a visão de cores.', 'a audição.'], a: 1 },
    { e: 'Em uma experiência de cheiros com potes de temperos, a conduta adequada é:', o: ['pedir que a criança cheire de olhos vendados mesmo se recusar.', 'oferecer, convidar a cheirar a uma distância segura e respeitar quem não quiser.', 'usar perfumes fortes e produtos de limpeza.', 'colocar os temperos direto no nariz da criança.'], a: 1 },
    { e: 'Segundo o modelo de Winnie Dunn, a criança que procura intensamente estímulos (pula, gira, toca em tudo) apresenta o padrão de:', o: ['evitação.', 'busca sensorial.', 'baixo registro.', 'sensibilidade.'], a: 1 },
    { e: 'O DSM-5-TR inclui entre as características do autismo:', o: ['hiper ou hiporreatividade a estímulos sensoriais ou interesse incomum por aspectos sensoriais do ambiente.', 'apenas dificuldade de fala.', 'preferência por cores fortes.', 'ausência de qualquer sensibilidade.'], a: 0 },
    { e: 'Uma criança se recusa a pôr as mãos na massa de modelar. A melhor atitude é:', o: ['segurar as mãos dela na massa até ela se acostumar.', 'respeitar, oferecer ferramentas (colher, palito, luva) e deixar que ela observe e se aproxime no tempo dela.', 'tirá-la da turma durante a atividade.', 'dar uma advertência.'], a: 1 },
    { e: 'Nas brincadeiras sensoriais, a intencionalidade pedagógica significa que o professor:', o: ['entrega o material e se ausenta.', 'planeja objetivos, espaço, tempo e materiais, observa as crianças e usa o que observou para replanejar.', 'controla cada movimento das crianças.', 'repete a mesma atividade todos os dias, sem mudanças.'], a: 1 },
    { e: 'Segundo as DCNEI, a avaliação na educação infantil:', o: ['é feita por provas para promoção.', 'acontece pela observação crítica e criativa e pelos registros, sem objetivo de seleção, promoção ou classificação.', 'deve gerar notas de 0 a 10.', 'não deve existir.'], a: 1 },
    { e: 'A documentação pedagógica de uma brincadeira sensorial pode incluir:', o: ['apenas uma lista de presença.', 'fotos, falas das crianças, anotações do professor e pequenas narrativas compartilhadas com as famílias.', 'só os trabalhos mais bonitos.', 'notas de comportamento.'], a: 1 },
    { e: 'O Marco Legal da Primeira Infância (Lei nº 13.257/2016) considera primeira infância o período:', o: ['dos 0 aos 3 anos.', 'dos primeiros 6 anos completos, ou 72 meses de vida.', 'dos 4 aos 10 anos.', 'dos 0 aos 12 anos.'], a: 1 },
    { e: 'Uma família reclama que a criança "chega suja de tinta". Uma resposta adequada da escola é:', o: ['suspender as atividades sensoriais.', 'explicar o sentido pedagógico da proposta, combinar roupa de brincar e avental e mostrar registros do que a criança aprendeu.', 'pedir que a família traga a criança só em dias sem atividade.', 'culpar a criança.'], a: 1 },
    { e: 'Usar arroz, feijão e macarrão em bandejas sensoriais é um tema que exige da escola:', o: ['nenhuma reflexão.', 'reflexão ética sobre o uso de alimentos, considerando a realidade das famílias, a reutilização e alternativas como elementos da natureza.', 'proibição de toda atividade sensorial.', 'uso apenas de alimentos estragados.'], a: 1 }
  ]
};

  cartoes: [
    { t: 'Conhecer pelo corpo', x: 'Nos primeiros anos, a criança pensa com as mãos, a boca, os olhos e o movimento. Piaget chamou esse período, do nascimento até cerca de 2 anos, de sensório-motor: a inteligência nasce das ações sobre os objetos.', m: 'Antes da palavra, a ação: o bebê pensa agindo.' },
    { t: 'Emoção e movimento', x: 'Para Wallon, emoção, movimento e pensamento se desenvolvem juntos. O gesto do bebê é a primeira linguagem, e o adulto que lê esses gestos ajuda a criança a se organizar.', m: 'Wallon: o corpo é a primeira linguagem da criança.' },
    { t: 'Os sete sentidos', x: 'Além de tato, audição, visão, olfato e paladar, há o sentido vestibular (equilíbrio e movimento da cabeça) e o proprioceptivo (posição e força do corpo). Muitos autores incluem ainda a interocepção, a percepção do que acontece dentro do corpo.', m: '5 sentidos + vestibular + proprioceptivo (+ interocepção).' },
    { t: 'Integração sensorial', x: 'Jean Ayres descreveu a integração sensorial como a organização, pelo sistema nervoso, das sensações do corpo e do ambiente para que a criança use o corpo de modo eficiente. É a base do brincar, da atenção e da aprendizagem.', m: 'Integrar é organizar as sensações para agir.' },
    { t: 'Cérebro em construção', x: 'Nos primeiros anos, o cérebro forma conexões em ritmo muito acelerado. As experiências repetidas fortalecem conexões; as que não são usadas tendem a ser podadas. Interações afetivas e ambientes ricos fazem diferença.', m: 'Experiência repetida + vínculo = conexões fortes.' },
    { t: 'Brincar é eixo', x: 'As DCNEI (Resolução CNE/CEB nº 5/2009, art. 9º) definem as interações e a brincadeira como eixos do currículo e pedem experiências sensoriais, expressivas e corporais com movimentação ampla.', m: 'DCNEI: interações e brincadeira são os eixos.' },
    { t: 'BNCC da educação infantil', x: 'A BNCC organiza a etapa em seis direitos de aprendizagem (conviver, brincar, participar, explorar, expressar e conhecer-se) e cinco campos de experiências, entre eles "Corpo, gestos e movimentos" e "Traços, sons, cores e formas".', m: 'Seis direitos, cinco campos de experiências.' },
    { t: 'Direito de brincar', x: 'A Convenção sobre os Direitos da Criança (art. 31), o ECA (art. 16, IV) e o Marco Legal da Primeira Infância (Lei nº 13.257/2016) reconhecem o brincar como direito. A primeira infância vai até os 6 anos completos.', m: 'Brincar é direito, não prêmio.' },
    { t: 'Sensorial com intenção', x: 'Uma brincadeira sensorial não é passatempo nem "atividade de enfeite": ela tem objetivos, é planejada, observada e registrada, e é retomada para ampliar as experiências das crianças.', m: 'Material + tempo + espaço + adulto atento = proposta.' }
  ],
  leitura: { titulo: "O berçário silencioso", partes: [{ p: "A situação.", x: "Em um berçário, os bebês passam boa parte da manhã em cadeirinhas e cercados, assistindo a vídeos infantis, porque a equipe considera que assim ficam \"mais calmos e seguros\"." }, { p: "Para pensar.", x: "À luz de Piaget, Wallon e das DCNEI, que experiências esses bebês estão deixando de viver? Que mudanças simples no espaço e na rotina permitiriam mais movimento, exploração e interação, sem perder a segurança?" }, { p: "Uma pista.", x: "Tempo no chão, em superfícies firmes, objetos variados ao alcance e um adulto disponível para conversar e responder aos bebês fazem mais pelo desenvolvimento do que qualquer tela." }] },
  atividades: [],
  quiz: [
    { e: 'Piaget chamou o período que vai do nascimento até cerca de 2 anos de:', o: ['pré-operatório.', 'sensório-motor.', 'operatório concreto.', 'operatório formal.'], a: 1, r: 'No período sensório-motor a inteligência é prática: ela se constrói pelas ações e percepções sobre os objetos (Piaget, 1987).' },
    { e: 'O sentido que informa a posição das partes do corpo e a força dos músculos, mesmo de olhos fechados, é o:', o: ['vestibular.', 'proprioceptivo.', 'olfativo.', 'auditivo.'], a: 1, r: 'A propriocepção vem de receptores nos músculos, tendões e articulações e permite saber onde está cada parte do corpo.' },
    { e: 'Para Jean Ayres, a integração sensorial é:', o: ['um método de alfabetização.', 'a organização das sensações pelo sistema nervoso para que a pessoa use o corpo de modo eficiente no ambiente.', 'um diagnóstico médico.', 'um tipo de brinquedo industrializado.'], a: 1, r: 'Ayres (2005) descreve a integração sensorial como um processo neurológico de organização das sensações, base da ação adaptada.' },
    { e: 'Segundo as DCNEI, as práticas pedagógicas na educação infantil têm como eixos norteadores:', o: ['a leitura e a escrita.', 'as interações e a brincadeira.', 'o silêncio e a disciplina.', 'as datas comemorativas.'], a: 1, r: 'O art. 9º da Resolução CNE/CEB nº 5/2009 define as interações e a brincadeira como eixos do currículo.' },

CURSO.ap.m1 = {
  intro: 'Este capítulo apresenta as bases do trabalho com brincadeiras sensoriais: como a criança pequena aprende pelo corpo, quais são os sentidos envolvidos, o que significa integração sensorial e por que essas experiências são direito da criança e dever da escola de educação infantil.',
  secoes: [
    { t: '1.1 A criança pequena conhece o mundo pelo corpo', fig: 'corpo', p: [
      'Quem observa um bebê de oito meses diante de uma colher de metal percebe uma pequena investigação científica: ele a leva à boca, bate no chão, escuta o som, olha o brilho, deixa cair, procura de novo. Piaget (1987) chamou esse período, que vai do nascimento até por volta dos 2 anos, de sensório-motor, porque a inteligência da criança é prática: ela se constrói pelas ações do corpo e pelas percepções que essas ações produzem. Os esquemas de pegar, sugar, olhar e bater se coordenam aos poucos, e é dessa coordenação que nascem as primeiras noções de objeto, espaço, tempo e causalidade.',
      'Wallon (2007) acrescenta a essa compreensão o lugar da emoção e do movimento. Para o autor, nos primeiros meses o bebê se comunica sobretudo pelo tônus, pelos gestos e pelas expressões, e é o adulto que interpreta esses sinais e responde a eles. O movimento é, ao mesmo tempo, ação sobre o mundo e expressão de estados afetivos. Por isso, uma proposta sensorial nunca é só "estímulo": ela acontece numa relação em que o adulto acolhe, nomeia e dá sentido ao que a criança vive.',
      'Vigotski (2007) lembra que o desenvolvimento acontece nas interações sociais e mediado pela cultura. Os objetos que oferecemos às crianças, as canções que cantamos, os nomes que damos às texturas e aos sons são produtos culturais. Quando a professora diz "que macio!" no momento em que o bebê toca um pedaço de lã, ela empresta uma palavra à sensação e insere a experiência num mundo compartilhado.',
      'Essas três perspectivas convergem para uma ideia central deste curso: a criança pequena não aprende primeiro "na cabeça" e depois no corpo. Ela aprende com o corpo inteiro, em relação com pessoas e objetos. Brincadeiras sensoriais bem planejadas reconhecem esse modo de aprender e lhe oferecem tempo, espaço e materiais.'
    ], av: { e: 'Segundo o texto, nos primeiros anos a criança aprende principalmente:', o: ['ouvindo explicações longas dos adultos.', 'com o corpo inteiro, pelas ações e sensações, em relação com pessoas e objetos.', 'copiando modelos prontos.', 'sozinha, sem participação dos adultos.'], a: 1, r: 'Piaget, Wallon e Vigotski convergem: a criança pequena aprende agindo, sentindo e interagindo.' } },
    { t: '1.2 Os sentidos: muito além de cinco', fig: 'sentidos', p: [
      'A escola costuma falar em cinco sentidos: tato, audição, visão, olfato e paladar. A teoria da integração sensorial, desenvolvida pela terapeuta ocupacional norte-americana Anna Jean Ayres, chama a atenção para dois outros sistemas fundamentais para o desenvolvimento infantil: o vestibular e o proprioceptivo (Ayres, 2005; Bundy; Lane, 2020).',
      'O sistema vestibular, localizado no ouvido interno, informa a posição da cabeça em relação à gravidade e detecta os movimentos de aceleração, giro e balanço. É ele que permite manter o equilíbrio, orientar-se no espaço e estabilizar o olhar quando o corpo se move. Balançar, girar, rolar e escorregar são experiências vestibulares intensas, e por isso tão procuradas pelas crianças.',
      'O sistema proprioceptivo recebe informações dos músculos, tendões e articulações. Ele diz ao cérebro onde está cada parte do corpo e quanta força está sendo usada, mesmo de olhos fechados. É graças a ele que a criança consegue graduar a força para segurar um copo de plástico sem amassá-lo, empilhar blocos ou abraçar um colega sem machucar. Atividades de empurrar, puxar, carregar e apertar oferecem estímulos proprioceptivos que, em geral, ajudam a criança a se organizar.',
      'Muitos autores incluem ainda a interocepção, a percepção dos sinais internos do corpo, como fome, sede, frio, vontade de ir ao banheiro e batimento do coração (Bundy; Lane, 2020). Na primeira infância, ajudar a criança a reconhecer e nomear esses sinais ("você está com frio, vamos pôr o casaco?") faz parte do cuidado e da educação.',
      'O tato merece um destaque. A pele é o maior órgão do corpo, e o tato tem duas funções: uma discriminativa, que identifica formas, texturas e temperaturas, e uma protetora, que reage rapidamente ao que pode ser perigoso ou desagradável. Algumas crianças reagem de forma muito intensa a toques leves ou inesperados, tema que será retomado no módulo 6.'
    ], av: { e: 'De acordo com o texto, o sistema vestibular:', o: ['identifica os cheiros.', 'informa a posição da cabeça, o equilíbrio e os movimentos de giro e balanço.', 'percebe a fome e a sede.', 'reconhece as cores.'], a: 1, r: 'O sistema vestibular, no ouvido interno, informa posição da cabeça e movimentos, e sustenta o equilíbrio (Ayres, 2005).' } },
    { t: '1.3 Integração sensorial e cérebro em construção', fig: 'integracao', p: [
      'Ayres (2005) definiu a integração sensorial como o processo neurológico que organiza as sensações vindas do próprio corpo e do ambiente e torna possível usar o corpo de forma eficiente no mundo. Em suas imagens, as sensações são "alimento" para o cérebro: assim como o corpo precisa de nutrientes, o sistema nervoso precisa de experiências sensoriais variadas e organizadas para se desenvolver.',
      'A autora descreve esse desenvolvimento como uma construção em camadas. Primeiro, os sistemas tátil, vestibular e proprioceptivo se organizam e sustentam o tônus, o equilíbrio e a consciência do corpo. Sobre essa base se desenvolvem o planejamento motor, a coordenação dos dois lados do corpo e a atenção. Por fim, emergem habilidades mais complexas, como a concentração, a organização do comportamento e a aprendizagem acadêmica. A imagem é útil para o professor: antes de pedir que a criança fique sentada desenhando, é preciso que ela tenha tido muitas oportunidades de mover-se, equilibrar-se e explorar.',
      'A neurociência do desenvolvimento reforça essa compreensão. Shonkoff e Phillips (2000) mostram que nos primeiros anos o cérebro forma conexões em ritmo muito acelerado e que as experiências vividas, especialmente nas relações com adultos responsivos, influenciam quais conexões se fortalecem. O Núcleo Ciência pela Infância (2014) destaca que as interações de "servir e devolver", em que o adulto responde aos gestos, sons e olhares do bebê, estão entre os fatores que mais favorecem o desenvolvimento.',
      'É preciso cuidado, porém, com dois exageros. O primeiro é imaginar que "mais estímulo é sempre melhor": o excesso de barulho, cores e objetos pode desorganizar a criança. O segundo é transformar a brincadeira em treino, com a criança passiva recebendo estímulos. O que favorece o desenvolvimento é a experiência ativa, escolhida e vivida em relação, com variedade e repetição.'
    ], av: { e: 'Segundo o texto, o que mais favorece o desenvolvimento nos primeiros anos é:', o: ['o máximo de estímulos possível, o tempo todo.', 'a experiência ativa, variada e repetida, vivida em relação com adultos responsivos.', 'o treino com a criança parada recebendo estímulos.', 'evitar qualquer experiência sensorial até os 3 anos.'], a: 1, r: 'Excesso desorganiza e treino passivo não ajuda; o que favorece é a experiência ativa e em relação (Shonkoff; Phillips, 2000).' } },
    { t: '1.4 O brincar sensorial nas DCNEI e na BNCC', fig: 'campos', p: [
      'As Diretrizes Curriculares Nacionais para a Educação Infantil definem a criança como sujeito histórico e de direitos que, nas interações, relações e práticas cotidianas, brinca, imagina, fantasia, deseja, aprende, observa, experimenta, narra, questiona e constrói sentidos sobre a natureza e a sociedade (Brasil, 2009, art. 4º). Essa definição já contém a ideia de uma criança que aprende experimentando.',
      'O art. 9º das DCNEI estabelece que as práticas pedagógicas devem ter como eixos norteadores as interações e a brincadeira e garantir experiências que, entre outras finalidades:',
      '>>promovam o conhecimento de si e do mundo por meio da ampliação de experiências sensoriais, expressivas, corporais que possibilitem movimentação ampla, expressão da individualidade e respeito pelos ritmos e desejos da criança (Brasil, 2009, art. 9º, I).',
      'A Base Nacional Comum Curricular organiza a educação infantil em seis direitos de aprendizagem e desenvolvimento (conviver, brincar, participar, explorar, expressar e conhecer-se) e em cinco campos de experiências: "O eu, o outro e o nós"; "Corpo, gestos e movimentos"; "Traços, sons, cores e formas"; "Escuta, fala, pensamento e imaginação"; e "Espaços, tempos, quantidades, relações e transformações" (Brasil, 2018). As brincadeiras sensoriais atravessam todos eles, mas dialogam de modo especial com os dois primeiros e com "Traços, sons, cores e formas".',
      'A BNCC também organiza os objetivos por grupos etários: bebês (zero a 1 ano e 6 meses), crianças bem pequenas (1 ano e 7 meses a 3 anos e 11 meses) e crianças pequenas (4 anos a 5 anos e 11 meses). Entre os objetivos para os bebês estão explorar sons produzidos com o próprio corpo e com objetos do ambiente e explorar as propriedades de objetos e materiais, como odor, cor, sabor e temperatura (Brasil, 2018). Esses objetivos descrevem, na prática, brincadeiras sensoriais.'

    { t: '1.5 Brincar é direito: da lei à rotina da creche', p: [
      'O direito de brincar está afirmado em diferentes níveis normativos. A Convenção sobre os Direitos da Criança, promulgada no Brasil pelo Decreto nº 99.710/1990, reconhece em seu art. 31 o direito da criança ao descanso, ao lazer e às atividades recreativas próprias da idade. O Estatuto da Criança e do Adolescente inclui, no direito à liberdade, o direito de "brincar, praticar esportes e divertir-se" (Brasil, 1990, art. 16, IV).',
      'O Marco Legal da Primeira Infância (Lei nº 13.257/2016) considera primeira infância o período que abrange os primeiros 6 anos completos, ou 72 meses de vida, e inclui o brincar entre as áreas prioritárias das políticas públicas. A lei também prevê que se garantam espaços lúdicos que favoreçam o brincar e a convivência (Brasil, 2016).',
      'Kishimoto (1996) ajuda a compreender por que o brincar ocupa esse lugar. Ao brincar, a criança age com liberdade, experimenta sem medo do erro, repete por prazer e cria significados. Na brincadeira sensorial, a criança não está "só se sujando": está investigando propriedades, comparando, levantando hipóteses e desenvolvendo coordenação, linguagem e autonomia.',

CURSO.ap.m2 = {
  intro: 'Este capítulo trata das experiências táteis. Parte do papel do toque no desenvolvimento, apresenta o cesto dos tesouros e o jogo heurístico de Elinor Goldschmied, discute bandejas, massas e percursos sensoriais e termina com os cuidados de segurança, higiene e ética que tornam essas experiências possíveis no cotidiano da creche e da pré-escola.',
  secoes: [
    { t: '2.1 O tato no desenvolvimento: tocar para conhecer e para se vincular', fig: 'tato', p: [
      'O tato é um dos primeiros sentidos a se desenvolver e um dos mais presentes na vida do bebê. É pelo colo, pelo banho, pela troca e pelo aconchego que ele se sente seguro e começa a construir vínculos. Wallon (2007) mostra que, nessa fase, o tônus muscular e o contato corporal são parte da comunicação entre o bebê e quem cuida dele: o modo de segurar e de tocar já é uma forma de linguagem.',
      'Ao mesmo tempo, as mãos e a boca são instrumentos de investigação. Levar à boca, apertar, sacudir, passar de uma mão para a outra são ações com as quais o bebê descobre forma, tamanho, peso, temperatura, dureza e textura. Piaget (1987) descreve a coordenação progressiva entre olhar e pegar como uma das grandes conquistas do primeiro ano: o bebê passa a pegar o que vê e a olhar o que pega.',
      'Para crianças bem pequenas e pequenas, o tato continua sendo uma via privilegiada de conhecimento. Amassar, modelar, rasgar, enterrar e desenterrar, sentir a água correr entre os dedos e a areia molhada mudar de forma são experiências de transformação da matéria que antecedem e alimentam noções mais elaboradas sobre o mundo físico.',
      'Na prática pedagógica, isso significa oferecer variedade: liso e áspero, macio e duro, frio e morno, leve e pesado, seco e molhado. Significa também nomear as sensações, ampliando o vocabulário ("está gelado", "ficou grudento", "é rugoso"), e respeitar o tempo de cada criança, porque nem todas aceitam de imediato tocar materiais novos.'
    ], av: { e: 'Segundo o texto, ao oferecer experiências táteis o professor deve:', o: ['usar sempre o mesmo material.', 'oferecer variedade, nomear as sensações e respeitar o tempo de cada criança.', 'obrigar todas as crianças a tocar.', 'evitar falar durante a atividade.'], a: 1, r: 'Variedade de texturas e temperaturas, palavras para as sensações e respeito ao ritmo de cada criança.' } },
    { t: '2.2 O cesto dos tesouros', fig: 'cesto', p: [
      'O cesto dos tesouros foi proposto pela educadora inglesa Elinor Goldschmied e está descrito em detalhes na obra escrita com Sonia Jackson sobre a educação de crianças de 0 a 3 anos (Goldschmied; Jackson, 2006). Ele se destina a bebês que já conseguem permanecer sentados com segurança, mas que ainda não se deslocam com autonomia, em geral entre 6 e 10 ou 12 meses.',
      'O cesto deve ser baixo, firme e estável, de vime ou material semelhante, sem alça, para que o bebê alcance os objetos sem que ele tombe. Dentro dele são colocados muitos objetos, entre 50 e 100, escolhidos pela variedade de materiais, formas, pesos, texturas, sons, cheiros e temperaturas: objetos de madeira, metal, tecido, couro, borracha, papel, osso e elementos naturais, como pinhas grandes, buchas vegetais e conchas grandes. As autoras recomendam evitar o plástico, porque ele oferece pouca variedade sensorial: tudo tem praticamente a mesma temperatura, o mesmo peso e a mesma textura.',
      'O papel do adulto é decisivo e, ao mesmo tempo, discreto. Ele organiza o ambiente, garante a segurança, senta-se próximo e permanece atento e disponível, sem dirigir a exploração, sem oferecer objetos e sem comentar o tempo todo. A presença tranquila do adulto dá ao bebê a segurança afetiva para explorar, e a ausência de intervenção permite que ele escolha, se concentre e decida o que fazer.',
      'Dois ou três bebês podem explorar o mesmo cesto, o que favorece as primeiras trocas de olhares e de objetos entre eles. A sessão dura enquanto houver interesse. O cesto precisa ser cuidado: os objetos são lavados ou higienizados regularmente, os danificados são retirados e novos são acrescentados para manter o interesse.',
      'Observar é parte da proposta. Goldschmied e Jackson (2006) destacam a capacidade de concentração que os bebês demonstram diante do cesto, às vezes por longos períodos. Registrar quais objetos cada bebê escolhe, como os explora e por quanto tempo oferece ao professor informações valiosas sobre preferências, conquistas motoras e modos de investigar.'
    ], av: { e: 'No cesto dos tesouros, o adulto deve:', o: ['mostrar como usar cada objeto.', 'permanecer perto, atento e disponível, sem dirigir a exploração.', 'retirar o bebê quando ele leva objetos à boca.', 'dar um objeto de cada vez ao bebê.'], a: 1, r: 'O adulto garante segurança e presença afetiva, mas não dirige: o bebê escolhe e explora (Goldschmied; Jackson, 2006).' } },
    { t: '2.3 O jogo heurístico', p: [
      'Quando a criança começa a andar, por volta do primeiro ano, o cesto dos tesouros já não a satisfaz: ela quer se deslocar, carregar, levar objetos de um lugar a outro. Para essa fase, Goldschmied e Jackson (2006) propõem o jogo heurístico com objetos. O termo "heurístico" vem do grego e se refere à descoberta.',
      'A sessão é preparada com antecedência. O adulto organiza no chão, em vários pontos da sala, conjuntos de objetos variados e em grande quantidade, como argolas de cortina, correntes grossas, tampas de lata sem rebarbas, rolos de papelão, prendedores de madeira, bobinas, pompons, novelos grandes, junto com recipientes de diferentes tamanhos, como latas, caixas, potes e cestos. A quantidade precisa ser suficiente para que as crianças não tenham de disputar os materiais.',
      'Durante a sessão, as crianças colocam dentro e tiram, enchem e esvaziam, empilham, encaixam, enfileiram, sacodem e comparam. Essas ações estão na base de noções lógicas e matemáticas, como correspondência, classificação, seriação e quantidade, construídas de forma concreta e prazerosa. O adulto, como no cesto, observa sem dirigir.',
      'O jogo heurístico tem um momento final muito importante: guardar. O adulto convida as crianças a recolher os objetos e a colocá-los nas sacolas ou caixas correspondentes, indicando com gestos e palavras simples ("agora as argolas"). Esse momento desenvolve a atenção, a cooperação e o reconhecimento das categorias de objetos.',
      'A proposta exige cuidado com o número de crianças por sessão, com a segurança dos objetos e com a duração, que costuma ficar entre 30 e 45 minutos, incluindo a arrumação. Como no cesto, a renovação periódica dos materiais mantém a curiosidade.'
    ], av: { e: 'O momento final do jogo heurístico é:', o: ['uma avaliação escrita.', 'guardar os objetos com as crianças, por categorias.', 'premiar quem brincou melhor.', 'assistir a um vídeo.'], a: 1, r: 'Guardar faz parte da proposta: desenvolve atenção, cooperação e reconhecimento de categorias (Goldschmied; Jackson, 2006).' } },
    { t: '2.4 Bandejas, caixas, massas e percursos sensoriais', fig: 'bandeja', p: [
      'As bandejas e caixas sensoriais são recipientes rasos e largos, como bacias, caixas organizadoras ou mesas de água e areia, que recebem um material de base e algumas ferramentas. Como base, podem ser usados água, areia, terra peneirada, folhas secas, gravetos grandes, cascas, flores, papel picado, retalhos de tecido, espuma de sabão neutro ou gelo. Como ferramentas, pás, colheres grandes, funis, peneiras, potes, conchas, pincéis e esponjas.',
      'As massas caseiras são outra possibilidade rica. A mais conhecida é a de farinha de trigo, sal, água e um pouco de óleo, que pode receber corante alimentício e, com crianças maiores, essências suaves. Preparar a massa com as crianças transforma a receita em experiência de transformação: o pó vira grude e o grude vira massa. Lama de terra limpa, argila e gelatina sem sabor são outras possibilidades, cada uma com propriedades diferentes de peso, umidade e resistência.',
      'Os percursos táteis para os pés podem ser montados com tapetes ou caixas rasas contendo grama, areia, esponjas, tecidos, plástico-bolha, tampinhas grandes coladas em placas e escovas macias. Caminhar descalço sobre texturas diferentes envolve o tato, o equilíbrio e a propriocepção ao mesmo tempo, e pode ser feito no pátio ou em sala.',
      'Horn (2004) lembra que a forma de organizar essas propostas no espaço faz diferença. Bandejas no chão ou em mesas baixas, ao alcance das crianças, com poucas crianças por vez, permitem que cada uma explore com calma. Combinar algumas regras simples (os materiais ficam na bandeja; usamos avental; quando terminar, lavamos as mãos) ajuda a criança a se organizar sem que a proposta vire uma sucessão de proibições.',
      'A experiência ganha profundidade quando é retomada. Repetir a mesma bandeja em dias diferentes, acrescentando ou trocando uma ferramenta, permite que as crianças aprofundem suas investigações em vez de passar rapidamente de um estímulo a outro.'
    ], av: { e: 'Segundo o texto, a experiência com bandejas sensoriais ganha profundidade quando:', o: ['é feita uma única vez.', 'é retomada em dias diferentes, com pequenas variações de ferramentas e materiais.', 'envolve a turma inteira ao mesmo tempo, sem regras.', 'usa apenas um tipo de material para sempre.'], a: 1, r: 'Retomar a proposta, trocando ou acrescentando ferramentas, aprofunda a investigação das crianças.' } },
    { t: '2.5 Segurança, higiene e ética no uso dos materiais', fig: 'seguranca', p: [
      'A primeira regra de segurança nas propostas sensoriais com bebês e crianças bem pequenas é simples: nada que caiba inteiro na boca. Objetos pequenos podem causar engasgo e asfixia. O regulamento brasileiro de segurança de brinquedos, do Inmetro, proíbe partes pequenas em brinquedos destinados a menores de 3 anos, e a mesma lógica deve orientar a escolha de qualquer objeto oferecido às crianças dessa faixa. Grãos soltos (feijão, milho, arroz), botões, tampinhas pequenas, miçangas, pilhas, ímãs e bolinhas de hidrogel (bolinhas de gel) não devem ser oferecidos a elas. As bolinhas de gel, em particular, aumentam de volume em contato com líquidos, e órgãos de defesa do consumidor de vários países já alertaram para o risco de ingestão.',
      'A segunda regra é a supervisão constante. Água, mesmo rasa, exige um adulto atento o tempo todo. Objetos do cesto dos tesouros e do jogo heurístico precisam ser conferidos antes de cada uso, para retirar peças quebradas, lascas, fios soltos e rebarbas.',
      'Ingredientes devem ser conhecidos e atóxicos. Antes de propor massas, tintas e misturas, a escola verifica com as famílias as alergias e restrições das crianças (glúten, corantes, látex, entre outras). Para bebês, que levam tudo à boca, preferem-se misturas comestíveis e sem sal em excesso. Produtos de limpeza, cola com purpurina e tintas sem certificação não são materiais para a exploração livre.',
      'A higiene completa o quadro: lavar as mãos antes e depois, trocar a água a cada sessão, lavar e secar os objetos com regularidade, descartar materiais orgânicos que se deterioram e guardar o que estiver úmido apenas depois de seco.',
      'Por fim, há uma questão ética. O uso de alimentos como arroz, feijão e macarrão em bandejas sensoriais é cada vez mais discutido, especialmente em comunidades em que muitas famílias enfrentam insegurança alimentar. A escola não precisa tomar uma posição única, mas precisa discutir o tema com a equipe e com as famílias, reutilizar o que for possível e privilegiar alternativas: elementos da natureza (folhas, cascas, sementes grandes, areia, terra), papel, tecido e materiais reaproveitados oferecem experiências igualmente ricas.'
    ], av: { e: 'Para bebês e crianças bem pequenas, a regra de segurança mais importante é:', o: ['usar apenas materiais coloridos.', 'não oferecer nada que caiba inteiro na boca e manter supervisão constante.', 'deixar as crianças sozinhas para ganharem autonomia.', 'usar bolinhas de gel porque são macias.'], a: 1, r: 'Objetos pequenos podem causar engasgo e asfixia; supervisão constante é indispensável.' } }
  ],
  refs: [

    'HORN, Maria da Graça Souza. <b>Sabores, cores, sons, aromas</b>: a organização dos espaços na educação infantil. Porto Alegre: Artmed, 2004.',

  ]

CURSO.ap.m3 = {
  intro: 'Este capítulo trata das experiências sonoras e musicais na primeira infância. Começa pelo desenvolvimento da escuta, apresenta a ideia de paisagem sonora, discute o repertório da cultura da infância, propõe brincadeiras de exploração das propriedades do som e termina com o cuidado com o ambiente sonoro da escola.',
  secoes: [
    { t: '3.1 A escuta começa antes do nascimento', p: [
      'A audição se desenvolve cedo. Por volta do sexto mês de gestação, o feto já reage a sons, e ao nascer o bebê demonstra preferência pela voz de quem o gestou e pela língua que ouviu durante a gravidez. A experiência sonora é, portanto, uma das primeiras pontes entre o bebê e o mundo.',
      'Os adultos, de modo quase intuitivo, falam com os bebês de um jeito especial: voz mais aguda, entonação mais melodiosa, frases curtas, repetições e pausas mais longas. Essa forma de falar, chamada de fala dirigida ao bebê, atrai a atenção dele e cria turnos de conversa, nos quais o adulto fala, espera, o bebê responde com sons e movimentos, e o adulto responde de volta. Essas trocas estão na base do desenvolvimento da linguagem.',
      'Brito (2003) lembra que o bebê vive imerso em sons e que sua relação com a música começa na voz, no colo e no balanço. Os acalantos, as canções de ninar presentes em todas as culturas, unem melodia, ritmo, contato corporal e movimento, e por isso acalmam e organizam. Para a autora, o bebê não é um ouvinte passivo: ele explora os sons da própria voz, balbucia, imita e brinca com variações de altura e intensidade.',
      'Na creche, isso significa conversar com os bebês durante os cuidados, cantar para eles e com eles, imitar seus sons e dar espaço para que respondam. Cantar durante a troca de fralda ou na hora de dormir não é enfeite: é linguagem, vínculo e música ao mesmo tempo.'
    ], av: { e: 'Segundo o texto, a fala dirigida ao bebê, mais aguda e melodiosa:', o: ['atrapalha o desenvolvimento da linguagem.', 'atrai a atenção do bebê e cria turnos de conversa que favorecem a linguagem.', 'deve ser evitada na creche.', 'só serve para fazer o bebê dormir.'], a: 1, r: 'Essa forma de falar cria trocas em que o adulto fala, espera e responde, base da linguagem.' } },
    { t: '3.2 Paisagem sonora e jogos de escuta', fig: 'paisagem', p: [
      'O compositor e educador canadense Murray Schafer propôs que a educação musical começasse pela escuta do ambiente. Em O ouvido pensante, ele chama de paisagem sonora o conjunto de sons de um lugar e sugere exercícios de "limpeza de ouvidos", nos quais os alunos aprendem a perceber, identificar, descrever e comparar os sons que normalmente passam despercebidos (Schafer, 1991).',
      'Na educação infantil, essa ideia se traduz em brincadeiras simples. Na caminhada sonora, o grupo percorre a escola ou o entorno em silêncio, prestando atenção aos sons: o pássaro, o carro, a panela da cozinha, a vassoura, a torneira. Depois, as crianças contam o que ouviram, imitam os sons com a voz e com o corpo e, se quiserem, desenham. Repetida em horários diferentes, a caminhada revela que a paisagem sonora muda ao longo do dia.',
      'Os jogos de silêncio também são valiosos. Com as crianças deitadas ou sentadas de olhos fechados, o adulto convida: "Vamos ouvir o que está acontecendo lá fora?". Em seguida, cada uma conta um som que percebeu. Outros jogos de escuta incluem adivinhar sons gravados do cotidiano, descobrir de onde vem o som de um objeto escondido e reconhecer a voz dos colegas.',

    ], av: { e: 'Na "caminhada sonora", as crianças:', o: ['marcham ao som de uma banda.', 'percorrem o espaço em silêncio, prestando atenção aos sons, e depois conversam sobre eles.', 'cantam o mais alto que puderem.', 'ouvem música no fone.'], a: 1, r: 'É um exercício de escuta da paisagem sonora, inspirado em Schafer (1991).' } },
    { t: '3.3 Voz, corpo e cultura da infância', p: [
      'O corpo é o primeiro instrumento musical. Bater palmas, estalar a língua, bater os pés, dar tapinhas no peito e nas pernas, assobiar e brincar com a voz são formas de produzir sons que estão sempre disponíveis. A BNCC inclui entre os objetivos para os bebês explorar sons produzidos com o próprio corpo e com objetos do ambiente (Brasil, 2018).',
      'O repertório da cultura da infância é imenso: acalantos, brincos (brincadeiras de colo, como "serra, serra, serrador"), parlendas, trava-línguas, cantigas de roda e brincadeiras cantadas. Esse repertório une palavra, ritmo, melodia, gesto e interação e é transmitido de geração em geração. Valorizar as canções que as famílias conhecem, incluindo as de diferentes regiões e culturas, enriquece o repertório da turma e fortalece o vínculo entre escola e comunidade.',
      'Brito (2003) faz uma crítica importante: na educação infantil, a música muitas vezes é usada apenas para formar hábitos ("musiquinha do lanche", "musiquinha para guardar os brinquedos") ou para apresentações em datas comemorativas, com as crianças repetindo gestos ensaiados. Para a autora, a música deve ser trabalhada como linguagem, o que envolve escutar, explorar, improvisar, criar e conhecer repertórios variados.',
      'No plano legal, a Lei nº 11.769/2008 tornou a música conteúdo obrigatório do ensino de Arte na educação básica, e a Lei nº 13.278/2016 deu nova redação ao art. 26 da LDB, estabelecendo que as artes visuais, a dança, a música e o teatro são as linguagens que constituem o componente curricular Arte. Na educação infantil, que se organiza por campos de experiências, a música está presente sobretudo em "Traços, sons, cores e formas".'
    ], av: { e: 'A crítica de Teca Alencar de Brito (2003) é que, muitas vezes, a música na educação infantil:', o: ['é trabalhada como linguagem.', 'fica reduzida à formação de hábitos e às apresentações em datas comemorativas.', 'tem tempo demais na rotina.', 'é ensinada com partituras.'], a: 1, r: 'A autora defende a música como linguagem: escuta, exploração, criação e repertório.' } },
    { t: '3.4 Explorar o som: timbres, instrumentos e paredes sonoras', fig: 'som', p: [
      'O som tem quatro propriedades que as crianças podem descobrir brincando: a altura (sons graves e agudos), a duração (curtos e longos), a intensidade (fortes e fracos) e o timbre, a "cor" do som que permite reconhecer a fonte sonora, como a diferença entre um tambor, um chocalho e a voz de um colega. Brito (2003) sugere que a exploração venha antes da nomeação: primeiro a criança percebe que o balde soa diferente da panela; depois, aos poucos, aprende palavras para descrever essas diferenças.',
      'Instrumentos construídos com materiais simples ampliam as possibilidades. Chocalhos de garrafa PET com sementes grandes, arroz ou pedrinhas, sempre com a tampa bem fechada e colada; tambores de balde, lata ou caixa; paus de chuva feitos com tubos de papelão e pregos ou palitos internos, bem vedados; reco-recos de garrafa com ranhuras; guizos costurados em tecido. Construir os instrumentos com as crianças maiores é parte da experiência.',
      'A "parede sonora" é uma proposta muito apreciada: em um muro ou cerca do pátio são fixados panelas, tampas, colheres, canos, chaves e outros objetos que produzem sons diferentes quando percutidos com baquetas ou colheres de pau. As crianças exploram livremente, descobrem sons, inventam ritmos e brincam de conversar com sons.',
      'Brincadeiras de contraste ajudam a perceber as propriedades: andar pesado como elefante quando o tambor toca grave e na ponta dos pés quando o triângulo toca agudo; congelar quando a música para; tocar bem baixinho e bem forte; fazer sons curtos e longos com a voz. Gravar as produções da turma e escutá-las depois é uma forma de documentar e de valorizar o que as crianças criaram.'
    ], av: { e: 'As quatro propriedades do som são:', o: ['altura, duração, intensidade e timbre.', 'cor, forma, peso e tamanho.', 'ritmo, rima, verso e estrofe.', 'velocidade, força, direção e distância.'], a: 0, r: 'Altura (grave/agudo), duração (curto/longo), intensidade (forte/fraco) e timbre (a cor do som).' } },
    { t: '3.5 Ruído, sobrecarga e cuidado com o ambiente sonoro', p: [
      'A escola de educação infantil costuma ser um lugar ruidoso: muitas crianças, ambientes com eco, cadeiras arrastadas, sinal estridente, música ambiente constante. O excesso de ruído cansa adultos e crianças, dificulta a compreensão da fala e prejudica a atenção. A Organização Mundial da Saúde tem alertado para os efeitos da exposição prolongada a sons intensos e recomenda reduzir a intensidade e o tempo de exposição, especialmente para crianças.',
      'Cuidar do ambiente sonoro é uma tarefa pedagógica. Algumas medidas simples ajudam: evitar música de fundo o tempo todo, para que a música seja escutada de verdade quando estiver presente; usar tapetes, tecidos e cortinas que reduzem o eco; colocar feltro nos pés das cadeiras; falar mais baixo e mais perto das crianças, em vez de gritar para o grupo; reservar momentos de silêncio na rotina.',
      'Algumas crianças são especialmente sensíveis a sons altos, agudos ou inesperados. Elas podem tapar os ouvidos, chorar, fugir ou se desorganizar diante do sinal, do liquidificador, de palmas ou de festas. Essa reação não é birra nem frescura: é uma resposta do sistema nervoso a um estímulo que, para ela, é excessivo. O DSM-5-TR inclui a hiper ou hiporreatividade a estímulos sensoriais entre as características do transtorno do espectro autista, mas crianças sem diagnóstico também podem apresentar sensibilidade auditiva (American Psychiatric Association, 2023).',
      'Para essas crianças, ajudam a antecipação ("daqui a pouco o sinal vai tocar"), o abafador de ruídos, a possibilidade de participar das atividades musicais de um lugar um pouco mais afastado ou tocando instrumentos de som mais suave, e um canto calmo para onde possam ir quando precisarem. Conversar com a família sobre o que a criança sente em casa ajuda a escola a planejar. O tema dos perfis sensoriais será aprofundado no módulo 6.'
    ], av: { e: 'Uma criança que tapa os ouvidos e chora com o sinal da escola está, segundo o texto:', o: ['fazendo birra.', 'reagindo a um estímulo que, para o sistema nervoso dela, é excessivo.', 'querendo chamar a atenção.', 'com problema de disciplina.'], a: 1, r: 'É uma resposta sensorial, não birra. Ajudam antecipação, abafador e um canto calmo.' } }
  ],
  refs: [
    'AMERICAN PSYCHIATRIC ASSOCIATION. <b>Manual diagnóstico e estatístico de transtornos mentais</b>: DSM-5-TR. 5. ed., texto revisado. Porto Alegre: Artmed, 2023.',
    'BRASIL. Lei nº 11.769, de 18 de agosto de 2008. Altera a Lei nº 9.394, de 20 de dezembro de 1996, para dispor sobre a obrigatoriedade do ensino da música na educação básica. <b>Diário Oficial da União</b>, Brasília, DF, 19 ago. 2008.',
    'BRASIL. Lei nº 13.278, de 2 de maio de 2016. Altera o § 6º do art. 26 da Lei nº 9.394, de 20 de dezembro de 1996, referente ao ensino da arte. <b>Diário Oficial da União</b>, Brasília, DF, 3 maio 2016.',
    'BRASIL. Ministério da Educação. <b>Base Nacional Comum Curricular</b>. Brasília, DF: MEC, 2018.',
    'BRITO, Teca Alencar de. <b>Música na educação infantil</b>: propostas para a formação integral da criança. São Paulo: Peirópolis, 2003.',
    'SCHAFER, R. Murray. <b>O ouvido pensante</b>. São Paulo: Fundação Editora da UNESP, 1991.'
  ]
};

CURSO.ap.m4 = {
  intro: 'Este capítulo trata das experiências visuais. Parte do desenvolvimento da visão nos primeiros meses, apresenta propostas de luz e sombra inspiradas na abordagem de Reggio Emilia, discute cores, tintas naturais e garrafas sensoriais, valoriza o contato com a natureza e termina com a organização do ambiente como "terceiro educador".',
  secoes: [
    { t: '4.1 Como o bebê começa a ver', fig: 'visao', p: [
      'Ao nascer, o bebê tem uma visão ainda imatura. Ele enxerga melhor objetos próximos, a cerca de 20 a 30 centímetros, distância que corresponde ao rosto de quem o segura no colo ou o amamenta, e é especialmente atraído por contrastes fortes, como preto e branco, por contornos bem definidos e por rostos humanos. Ao longo dos primeiros meses, a acuidade visual melhora, os olhos passam a trabalhar juntos, a percepção das cores se amplia e o bebê consegue acompanhar objetos em movimento e, mais tarde, perceber profundidade.',
      'Esse desenvolvimento acontece em conjunto com o motor. Quando o bebê passa a sustentar a cabeça, a ficar de bruços apoiado nos antebraços e a se sentar, o campo visual se amplia e a coordenação entre ver e pegar se fortalece. Por isso, oferecer tempo de bruços em superfícies firmes e seguras, com objetos interessantes ao alcance da vista, é também uma proposta visual.',
      'Algumas propostas simples favorecem esse momento. Espelhos inquebráveis fixados na altura do bebê, no chão ou na parede, convidam a olhar o próprio rosto e o dos colegas. Móbiles com contraste, posicionados ao lado e não exatamente acima do rosto, para que o bebê possa escolher olhar ou não, estimulam o acompanhamento visual. Tecidos coloridos que se movem ao vento, bolhas de sabão, sombras de folhas na parede e o rosto expressivo do adulto que conversa com o bebê são experiências visuais ricas.',
      'O cuidado aqui é com o excesso: luz forte direto nos olhos, telas e ambientes muito carregados de cores e objetos não ajudam. A Sociedade Brasileira de Pediatria, por exemplo, recomenda evitar a exposição de crianças menores de 2 anos a telas. O que o bebê precisa é de um ambiente que convide a olhar, com contraste, movimento suave e, sobretudo, rostos humanos disponíveis.'
    ], av: { e: 'Segundo o texto, o recém-nascido enxerga melhor:', o: ['objetos distantes e em tons claros.', 'objetos próximos, com forte contraste, e rostos humanos.', 'desenhos em telas.', 'letras grandes.'], a: 1, r: 'A visão do bebê é mais nítida a 20–30 cm e atraída por contrastes e rostos.' } },
    { t: '4.2 Luz e sombra: investigar o invisível', fig: 'luz', p: [
      'Poucas experiências encantam tanto as crianças quanto a luz e a sombra. Na abordagem de Reggio Emilia, desenvolvida no norte da Itália a partir do trabalho de Loris Malaguzzi, a luz é um tema frequente de investigação. As escolas contam com ateliês, mesas de luz, retroprojetores e espaços escurecidos em que as crianças exploram como a luz atravessa, reflete e projeta (Edwards; Gandini; Forman, 1999).',
      'Não é preciso equipamento sofisticado. Uma lanterna em um canto escurecido da sala, um lençol branco esticado como tela, uma caixa de papelão com abertura para a luz ou uma mesa de luz improvisada com uma caixa organizadora transparente e uma luminária de LED já permitem muitas investigações. Sobre a mesa de luz, objetos transparentes (copos, garrafas com água colorida), translúcidos (papel de seda, folhas de árvore, papel celofane) e opacos (blocos, chaves, bonecos) revelam diferenças: uns deixam a luz passar, outros a colorem, outros formam sombra.',
      'No pátio, a sombra do próprio corpo vira brincadeira: a criança descobre que a sombra acompanha seus movimentos, que muda de tamanho e de lugar ao longo do dia e que é possível "pisar" na sombra do colega. Contornar a sombra com giz em horários diferentes é uma forma de registrar essas mudanças. Teatros de sombras com recortes ou com as mãos unem a investigação da luz à narrativa e ao faz de conta.',
      'O papel do professor é organizar o ambiente, propor perguntas abertas ("o que acontece se a lanterna ficar mais perto?", "por que essa sombra é colorida?") e escutar as hipóteses das crianças, sem a pressa de dar a resposta certa. Malaguzzi defendia que a criança tem "cem linguagens" para conhecer e expressar o mundo, e a luz é um convite a muitas delas: o gesto, o desenho, a fala, a dança e a construção (Edwards; Gandini; Forman, 1999).'
    ], av: { e: 'Na mesa de luz, objetos opacos:', o: ['deixam a luz passar inteira.', 'barram a luz e formam sombra.', 'ficam coloridos com a luz.', 'brilham no escuro.'], a: 1, r: 'Opacos barram a luz; transparentes deixam passar; translúcidos deixam passar parte e podem colorir.' } },
    { t: '4.3 Cores, tintas naturais e garrafas sensoriais', fig: 'cores', p: [
      'A exploração das cores começa muito antes de a criança saber nomeá-las. Misturar tinta com as mãos, ver a água mudar de cor ao receber uma gota de corante, observar o amarelo e o azul virarem verde dentro de um saco plástico bem lacrado são experiências de descoberta que dispensam explicações. O campo de experiências "Traços, sons, cores e formas", da BNCC, propõe justamente que as crianças vivenciem diversas formas de expressão e linguagens, incluindo as visuais (Brasil, 2018).',
      'Os pigmentos naturais ampliam essa exploração e aproximam a criança da natureza e da cultura. O urucum produz vermelho e laranja; a cúrcuma (açafrão-da-terra), amarelo; a beterraba, rosa e roxo; o café, marrom; o carvão, preto; terras de diferentes lugares, uma gama de ocres e vermelhos. Preparar as tintas com as crianças, ralando, misturando com água e coando, faz parte da experiência. Com bebês, as tintas comestíveis e sem sal em excesso são as mais seguras, sempre com atenção às alergias.',
      'A pintura pode acontecer em diferentes suportes e posições: no chão sobre papel pardo, em cavaletes, em azulejos e vidros, em tecidos, com pincéis grossos, esponjas, rolinhos, gravetos e com o próprio corpo, como mãos e pés. Pintar ao ar livre, com água e pincel em muros e calçadas, é uma proposta simples e muito apreciada: a "pintura" evapora e pode ser refeita.',
      'As garrafas sensoriais, também chamadas de garrafas da calma, são garrafas transparentes bem vedadas, com a tampa colada, contendo água, glicerina ou óleo, glitter grosso, lantejoulas, miçangas grandes ou pequenos objetos. Ao serem viradas, mostram um movimento lento que atrai o olhar. Além de proporcionar experiência visual, elas podem ajudar a criança a se acalmar, observando o que cai devagar até parar. Ficam bem em um canto aconchegante, à disposição das crianças.'
    ], av: { e: 'Uma garrafa sensorial (garrafa da calma) deve ter:', o: ['tampa bem vedada e colada.', 'tampa solta, para a criança abrir.', 'líquidos tóxicos.', 'objetos cortantes.'], a: 0, r: 'O conteúdo não pode ficar acessível: tampa vedada e colada, e conferência frequente.' } },
    { t: '4.4 Natureza e olhar investigativo', fig: 'natureza', p: [
      'Boa parte da infância nas cidades acontece entre paredes: em casa, no carro, na sala de aula. Léa Tiriba (2010) chama a atenção para esse "emparedamento" das crianças e defende que a educação infantil garanta o contato cotidiano com a natureza, com o sol, a terra, a água, as plantas e os bichos, como condição de saúde, de bem-estar e de aprendizagem. Para a autora, não se trata de levar a natureza para dentro da sala como enfeite, mas de levar as crianças para fora.',
      'A natureza é um laboratório sensorial completo. O pátio oferece texturas (casca de árvore, grama, areia, pedra), cores que mudam com as estações, cheiros de terra molhada e de folhas amassadas, sons de pássaros e de vento e desafios de movimento, como subir, descer e equilibrar-se. As DCNEI estabelecem que as propostas pedagógicas devem promover a interação, o cuidado, a preservação e o conhecimento da biodiversidade e da sustentabilidade da vida na Terra (Brasil, 2009, art. 9º, X).',
      'Algumas propostas favorecem o olhar investigativo: caminhadas para coletar folhas, sementes grandes, cascas e flores caídas, que depois são organizadas em coleções por cor, tamanho ou forma; observação de formigas, caracóis e minhocas com lupas, devolvendo-os ao lugar depois; o cultivo de uma horta ou de vasos com plantas de crescimento rápido, como feijão e girassol; o registro das mudanças de uma mesma árvore ao longo do ano.',
      'A segurança também vale aqui: conhecer as plantas do pátio e retirar as tóxicas, como comigo-ninguém-pode e espirradeira, verificar o espaço antes da brincadeira, usar protetor solar e chapéu e garantir água. Com esses cuidados, o ar livre deixa de ser apenas o lugar do "recreio" e passa a ser espaço de currículo.'
    ], av: { e: 'Léa Tiriba (2010) critica o "emparedamento" das crianças e defende:', o: ['mais tempo em sala, sentadas.', 'o contato cotidiano com a natureza, levando as crianças para fora.', 'o uso de imagens da natureza em telas.', 'que a natureza seja só enfeite da sala.'], a: 1, r: 'Para Tiriba, o contato com terra, água, plantas e bichos é condição de saúde e de aprendizagem.' } },
    { t: '4.5 O ambiente como terceiro educador', p: [
      'Na abordagem de Reggio Emilia, o ambiente é chamado de "terceiro educador", ao lado dos professores e das famílias. A ideia é que a organização dos espaços, a escolha dos materiais, a luz, as cores e a estética comunicam às crianças o que é possível fazer ali e o quanto elas são respeitadas (Edwards; Gandini; Forman, 1999).',
      'No Brasil, Maria da Graça Horn (2004) mostrou, em pesquisa realizada em escolas de educação infantil, que a forma de organizar o espaço interfere diretamente nas interações e na autonomia das crianças. Salas com mesas e cadeiras dispostas para atividades dirigidas e materiais guardados no alto concentram as ações no adulto. Salas organizadas em cantos ou ambientes (canto da leitura, do faz de conta, das construções, das experiências sensoriais), com materiais ao alcance das crianças, favorecem as escolhas, as interações entre pares e a autonomia.',
      'Para as experiências sensoriais, isso significa pensar em ambientes que convidem a explorar: um canto com cestos de materiais naturais, uma mesa de água e areia, um espaço com espelhos e tecidos, um canto aconchegante com almofadas, livros e garrafas sensoriais, para onde a criança possa ir quando precisar de calma. Os materiais organizados de forma bonita e acessível, em cestos e potes transparentes, contribuem para que as crianças cuidem deles.',
      'A estética importa. Paredes cobertas de personagens comerciais, cartazes e enfeites do chão ao teto produzem poluição visual e competem pela atenção, especialmente das crianças mais sensíveis. Um ambiente com cores mais neutras, luz natural, plantas e as produções das próprias crianças expostas na altura dos olhos delas tende a ser mais acolhedor e a favorecer a concentração. Como lembra Horn (2004), o espaço nunca é neutro: ele sempre educa, para o bem ou para o mal.'
    ], av: { e: 'Segundo Horn (2004), salas organizadas em cantos, com materiais ao alcance das crianças, favorecem:', o: ['a dependência do adulto.', 'as escolhas, as interações entre as crianças e a autonomia.', 'o silêncio absoluto.', 'a competição.'], a: 1, r: 'A pesquisa de Horn mostra que o espaço organizado em cantos amplia a autonomia e as interações.' } }
  ],
  refs: [
