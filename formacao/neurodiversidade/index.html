CURSO.modulos.push({
  id: 'm5', h: 4,
  titulo: 'Práticas inclusivas: Desenho Universal, PEI e AEE',
  objetivo: 'Planejar aulas pelos princípios do Desenho Universal para a Aprendizagem, elaborar objetivos de um Plano de Ensino Individualizado e compreender o papel do AEE e do profissional de apoio.',
  cartoes: [
    { t: 'Desenho Universal para a Aprendizagem (DUA)', x: 'O DUA, desenvolvido pelo CAST (EUA), propõe planejar a aula desde o início para a diversidade, em vez de adaptar depois para alguns. Assim como a rampa serve ao cadeirante, ao carrinho de bebê e a quem carrega mala, a aula flexível serve a todos.', m: 'DUA: planejar para todos desde o início.' },
    { t: 'Os três princípios do DUA', x: '1. Múltiplos meios de engajamento (o porquê da aprendizagem: interesse, motivação, persistência). 2. Múltiplos meios de representação (o quê: apresentar o conteúdo por texto, imagem, áudio, objeto). 3. Múltiplos meios de ação e expressão (o como: o aluno mostra o que aprendeu falando, escrevendo, desenhando, montando).', m: 'Engajamento (por quê), representação (o quê), ação e expressão (como).' },
    { t: 'DUA na prática', x: 'Uma aula sobre o ciclo da água pode começar com uma pergunta do cotidiano (engajamento), usar experiência, vídeo curto e esquema (representação) e deixar o aluno escolher entre explicar oralmente, desenhar o ciclo ou montar uma maquete (ação e expressão). O objetivo é o mesmo para todos.', m: 'Objetivo igual; caminhos variados.' },
    { t: 'Adaptar sem empobrecer', x: 'Adaptação pode envolver o acesso (material ampliado, CAA), a metodologia (passos menores), o tempo e a forma de avaliar. Quando necessário, ajustam-se também os objetivos, sempre buscando o máximo de participação no currículo comum. Dar ao aluno "atividade de pintar" enquanto a turma estuda é exclusão disfarçada.', m: 'Adaptar o caminho, não esvaziar o conteúdo.' },
    { t: 'O que é o PEI', x: 'O Plano de Ensino (ou Educacional) Individualizado é um documento pedagógico elaborado pela equipe (professor regente, professor do AEE, gestão, família) que registra o perfil do aluno, suas potencialidades e necessidades, objetivos, estratégias, recursos, formas de avaliação, responsáveis e prazos de revisão.', m: 'PEI: quem é o aluno, aonde queremos chegar, como e quando revisar.' },
    { t: 'Objetivo bem escrito', x: 'Um bom objetivo de PEI é observável e tem prazo: "Até o fim do bimestre, Ana vai ler e escrever palavras de duas sílabas simples com apoio de imagens" é melhor que "melhorar na leitura". Ele parte do que o aluno já faz.', m: 'Objetivo de PEI: observável, com prazo e a partir do que o aluno já sabe.' },
    { t: 'Atendimento Educacional Especializado (AEE)', x: 'O AEE identifica, elabora e organiza recursos pedagógicos e de acessibilidade. Pela Resolução CNE/CEB nº 4/2009, é complementar ou suplementar à escolarização, realizado prioritariamente na sala de recursos multifuncionais, no contraturno, e não substitui a classe comum.', m: 'AEE: complementar ou suplementar, no contraturno, nunca substitutivo.' },
    { t: 'Laudo não é condição', x: 'A Nota Técnica MEC/SECADI/DPEE nº 04/2014 esclarece que o laudo médico não é documento obrigatório para o AEE, porque o atendimento é pedagógico. O professor do AEE faz o estudo de caso e o plano de atendimento. O laudo pode complementar, mas não pode atrasar o apoio.', m: 'Sem laudo, o atendimento pedagógico continua.' },
    { t: 'Profissional de apoio escolar', x: 'Pela LBI (art. 3º, XIII), o profissional de apoio escolar auxilia na alimentação, higiene e locomoção e atua nas atividades escolares em que for necessário. Ele não substitui o professor: o planejamento e o ensino do aluno continuam com o professor regente.', m: 'Apoio cuida do acesso; o professor cuida do ensino.' },
    { t: 'Ensino colaborativo', x: 'No ensino colaborativo, professor regente e professor de educação especial planejam e, quando possível, atuam juntos na sala comum. O regente conhece o currículo e a turma; o especialista conhece recursos e estratégias. Juntos, decidem os ajustes.', m: 'Regente + especialista planejando juntos.' }
  ],

      { p: 'Como era a aula antes?', x: 'Na turma do 3º ano, a aula de frações era sempre igual: explicação no quadro, exercícios no caderno e correção. Metade da turma acompanhava; os outros copiavam sem entender. Davi, autista, ficava agitado com o barulho. Bia, com dislexia, travava nos enunciados.' },
      { p: 'O que mudou com o DUA?', x: 'A professora começou com uma pizza de papel e a pergunta "como dividir para 4 amigos sem briga?". Usou peças de encaixe, desenhos e uma explicação curta, com as palavras-chave no quadro. Para registrar, cada aluno podia escolher: desenhar, recortar as frações ou escrever. Davi trabalhou com as peças em um canto mais calmo; os enunciados de Bia vieram com imagens.' },

    { tipo: 'caso', e: 'A família de Miguel, 6 anos, relata suspeita de autismo e aguarda consulta no serviço de saúde, que deve demorar meses. A diretora diz à professora: "Sem laudo, não podemos fazer nada diferente para ele." Qual é a orientação correta?', o: ['A diretora está certa: sem laudo, a escola não pode oferecer AEE nem adaptações.', 'A escola deve aguardar o laudo e, enquanto isso, reduzir o horário do aluno.', 'O laudo não é exigido para o AEE nem para as adaptações pedagógicas. A escola deve observar, fazer o estudo de caso e iniciar os apoios, enquanto a família segue com a avaliação de saúde.', 'A professora deve fazer o diagnóstico para agilizar o processo.'], a: 2, fb: ['A Nota Técnica nº 04/2014 do MEC deixa claro que o laudo não é obrigatório para o AEE, que é atendimento pedagógico.', 'Reduzir horário enquanto se espera um laudo é negar o direito à educação.', 'Correto. O apoio pedagógico começa pela observação e pelo estudo de caso, sem depender do laudo.', 'O professor não diagnostica. Ele observa, registra e apoia; o diagnóstico é da equipe de saúde.'], m: 'Laudo atrasa? O apoio não pode atrasar.' },
    { tipo: 'pratica', e: 'Escreva um objetivo de PEI', x: 'Pense em um aluno (real, sem nome completo, ou imaginário). Descreva em uma frase o que ele já faz, escreva um objetivo observável e com prazo, e uma estratégia para alcançá-lo.', check: ['Descrevi o que o aluno já faz (ponto de partida)', 'O objetivo é observável (dá para ver se foi alcançado)', 'O objetivo tem prazo', 'Indiquei uma estratégia e um recurso', 'Indiquei quem acompanha e quando revisar'], min: 150, dica: 'Exemplo: "Hoje, Léo reconhece as letras do próprio nome. Objetivo: até o fim do bimestre, reconhecer as 26 letras do alfabeto em letra de forma. Estratégia: bingo de letras e alfabeto móvel 3 vezes por semana; acompanha a professora regente com o AEE; revisão em 30 dias."' }

CURSO.ap.m5 = {
  intro: 'Este capítulo apresenta o Desenho Universal para a Aprendizagem, o Plano Educacional Individualizado e a organização do atendimento educacional especializado, com ênfase no trabalho colaborativo entre professores.',
  secoes: [
    { t: '5.1 Desenho Universal para a Aprendizagem', p: [
      'O Desenho Universal para a Aprendizagem (DUA) é uma abordagem desenvolvida pelo CAST, organização norte-americana de pesquisa educacional, inspirada no desenho universal da arquitetura. Assim como uma rampa planejada desde o projeto beneficia o cadeirante, a pessoa com carrinho de bebê e o idoso, um currículo planejado desde o início para a variabilidade dos estudantes reduz a necessidade de adaptações posteriores (Meyer; Rose; Gordon, 2014).',
      'As diretrizes do DUA se organizam em três princípios: oferecer múltiplos meios de engajamento, relacionados ao "porquê" da aprendizagem (interesse, esforço, persistência e autorregulação); múltiplos meios de representação, relacionados ao "o quê" (formas variadas de apresentar a informação); e múltiplos meios de ação e expressão, relacionados ao "como" (formas variadas de o estudante agir e demonstrar o que aprendeu) (CAST, 2024).',
      'Meyer, Rose e Gordon (2014) enfatizam que a variabilidade é a regra, e não a exceção: não existe um "aluno médio" para quem a aula possa ser desenhada. O objetivo de aprendizagem pode ser o mesmo para todos, enquanto os caminhos para alcançá-lo são flexíveis.'
    ], av: { e: 'Nas diretrizes do CAST (2024), oferecer diferentes formas de o aluno demonstrar o que aprendeu corresponde ao princípio de múltiplos meios de:', o: ['engajamento.', 'representação.', 'ação e expressão.', 'avaliação externa.'], a: 2, r: 'Ação e expressão referem-se ao "como" o estudante age e demonstra a aprendizagem (CAST, 2024).' } },
    { t: '5.2 O Plano Educacional Individualizado', p: [
      'O Plano Educacional Individualizado (PEI), também chamado de Plano de Ensino Individualizado, é um instrumento de planejamento que registra as características, potencialidades e necessidades de um estudante e define objetivos, estratégias, recursos, responsáveis e formas de avaliação. A Política Nacional de Educação Especial Inclusiva determina que o estudo de caso seja a etapa inicial para identificar as necessidades do estudante, que seus resultados fundamentem o Plano de Atendimento Educacional Especializado e o PEI, e que esse documento pedagógico individualizado tenha atualização contínua e oriente o trabalho na sala comum, no AEE, nas atividades colaborativas e nas ações intersetoriais (Brasil, 2025, arts. 11 e 12). Por isso, o PEI deve ser construído coletivamente, com o professor da turma, o professor do AEE, a equipe gestora e a família.',
      'Tannús-Valadão e Mendes (2018), ao comparar práticas de planejamento individualizado em diferentes países, observam que o plano cumpre melhor sua função quando está articulado ao currículo comum e quando os objetivos são definidos de forma clara e avaliável, em vez de se limitar a listas genéricas de dificuldades.',
      'Um objetivo bem formulado descreve um comportamento observável, indica as condições e o apoio e estabelece um prazo. "Melhorar na leitura" é vago; "até o final do bimestre, ler palavras de duas sílabas simples com apoio de imagens" orienta a ação do professor e permite verificar o avanço.'
    ], av: { e: 'Segundo o texto e a Política Nacional de Educação Especial Inclusiva (Brasil, 2025), o PEI deve ser:', o: ['elaborado exclusivamente pelo médico do aluno.', 'fundamentado no estudo de caso, construído coletivamente e atualizado continuamente.', 'elaborado apenas pelo profissional de apoio escolar.', 'feito uma única vez, na matrícula.'], a: 1, r: 'O Decreto nº 12.686/2025 (arts. 11 e 12) liga o PEI ao estudo de caso e exige atualização contínua; a construção é coletiva.' } },
    { t: '5.3 O atendimento educacional especializado', p: [
      'A Resolução CNE/CEB nº 4/2009 estabelece que o atendimento educacional especializado (AEE) tem função complementar ou suplementar à formação do aluno e deve ser realizado prioritariamente na sala de recursos multifuncionais da própria escola ou de outra escola de ensino regular, no turno inverso ao da escolarização, não sendo substitutivo às classes comuns (Brasil, 2009).',
      'A Nota Técnica nº 04/2014 do Ministério da Educação esclarece que o laudo médico não é documento obrigatório para o AEE, porque se trata de atendimento pedagógico, e que cabe ao professor do AEE realizar o estudo de caso e elaborar o plano de atendimento (Brasil, 2014). O laudo pode complementar as informações, mas a sua ausência não pode impedir o apoio. A Política Nacional de Educação Especial Inclusiva confirmou essa orientação: a oferta do AEE não será condicionada à exigência de diagnóstico, laudo ou relatório (Brasil, 2025, art. 11, § 7º).',
      'A Lei Brasileira de Inclusão prevê ainda o profissional de apoio escolar, que exerce atividades de alimentação, higiene e locomoção do estudante e atua em todas as atividades escolares nas quais se fizer necessário (Brasil, 2015, art. 3º, XIII). O Decreto nº 12.686/2025 detalhou essa função (locomoção e participação, higiene e alimentação, interação e comunicação, uso de tecnologias assistivas), exigiu ao menos ensino médio e 180 horas de formação continuada e determinou que a oferta desse apoio, definida no estudo de caso, independe de laudo (Brasil, 2025, arts. 14 e 15). Esse profissional não substitui o professor: a responsabilidade pelo ensino continua com o docente da turma.'
    ], av: { e: 'De acordo com a Nota Técnica nº 04/2014 do MEC, o laudo médico para o AEE:', o: ['é obrigatório e deve ser renovado a cada ano.', 'não é documento obrigatório, pois o AEE é atendimento pedagógico.', 'é exigido apenas para alunos com TEA.', 'substitui o estudo de caso do professor.'], a: 1, r: 'A Nota Técnica nº 04/2014 (Brasil, 2014) afirma que o laudo não é obrigatório; o estudo de caso do professor do AEE fundamenta o atendimento.' } },
    { t: '5.4 Ensino colaborativo', p: [
      'Mendes, Vilaronga e Zerbato (2014) apresentam o ensino colaborativo, ou coensino, como modelo de apoio à inclusão em que o professor do ensino comum e o professor de educação especial dividem a responsabilidade de planejar, ensinar e avaliar uma turma heterogênea. O professor da turma domina o currículo e conhece o grupo; o especialista contribui com estratégias e recursos de acessibilidade.',
      'As autoras observam que esse modelo exige tempo para planejamento conjunto, apoio da gestão e uma relação de parceria, e não de hierarquia, entre os profissionais (Mendes; Vilaronga; Zerbato, 2014). Quando funciona, o especialista deixa de atender o aluno de forma isolada e passa a contribuir para que a sala comum se torne mais acessível para todos.',
      'O DUA, o PEI e o ensino colaborativo se complementam: o DUA orienta o planejamento da turma, o PEI garante que as necessidades específicas de cada estudante sejam consideradas, e o ensino colaborativo organiza o trabalho conjunto dos professores.'
    ], av: { e: 'No ensino colaborativo descrito por Mendes, Vilaronga e Zerbato (2014):', o: ['o professor especialista assume sozinho os alunos com deficiência.', 'professor do ensino comum e professor de educação especial dividem o planejamento, o ensino e a avaliação da turma.', 'o aluno com deficiência é retirado da sala para ser atendido.', 'o profissional de apoio substitui o professor.'], a: 1, r: 'O coensino é a divisão de responsabilidades entre professor comum e especialista (Mendes; Vilaronga; Zerbato, 2014).' } }
  ],
  refs: [
    'BRASIL. Conselho Nacional de Educação. Câmara de Educação Básica. Resolução nº 4, de 2 de outubro de 2009. Institui Diretrizes Operacionais para o Atendimento Educacional Especializado na Educação Básica, modalidade Educação Especial. <b>Diário Oficial da União</b>, Brasília, DF, 5 out. 2009.',
    'BRASIL. Ministério da Educação. Secretaria de Educação Continuada, Alfabetização, Diversidade e Inclusão. <b>Nota Técnica nº 04/2014/MEC/SECADI/DPEE</b>: orientação quanto a documentos comprobatórios de alunos com deficiência, transtornos globais do desenvolvimento e altas habilidades/superdotação no Censo Escolar. Brasília, DF: MEC, 2014.',
    'BRASIL. Decreto nº 12.686, de 20 de outubro de 2025. Institui a Política Nacional de Educação Especial Inclusiva e a Rede Nacional de Educação Especial Inclusiva. <b>Diário Oficial da União</b>, Brasília, DF, 21 out. 2025. Alterado pelo Decreto nº 12.773, de 8 de dezembro de 2025.',
    'BRASIL. Lei nº 13.146, de 6 de julho de 2015. Institui a Lei Brasileira de Inclusão da Pessoa com Deficiência (Estatuto da Pessoa com Deficiência). <b>Diário Oficial da União</b>, Brasília, DF, 7 jul. 2015.',
    'CAST. <b>Universal Design for Learning Guidelines</b>: version 3.0. Lynnfield, MA: CAST, 2024. Disponível em: https://udlguidelines.cast.org. Acesso em: 31 out. 2026.',
    'MENDES, Enicéia Gonçalves; VILARONGA, Carla Ariela Rios; ZERBATO, Ana Paula. <b>Ensino colaborativo como apoio à inclusão escolar</b>: unindo esforços entre educação comum e especial. São Carlos: EdUFSCar, 2014.',
    'MEYER, Anne; ROSE, David H.; GORDON, David. <b>Universal design for learning</b>: theory and practice. Wakefield, MA: CAST Professional Publishing, 2014.',
    'TANNÚS-VALADÃO, Gabriela; MENDES, Enicéia Gonçalves. Inclusão escolar e o planejamento educacional individualizado: estudo comparativo sobre práticas de planejamento em diferentes países. <b>Revista Brasileira de Educação</b>, Rio de Janeiro, v. 23, e230076, p. 1-18, 2018. DOI: https://doi.org/10.1590/S1413-24782018230076.'
  ]
};

    { t: 'A família como parceira', x: 'A família conhece a história, os gostos e as estratégias que funcionam em casa. A escola conhece o aluno no grupo e no currículo. Quando as duas trocam informações sem culpa e sem julgamento, o aluno ganha.', m: 'Família e escola: cada uma sabe uma parte do aluno.' },
    { t: 'Professor não diagnostica', x: 'Ao conversar com a família, descreva o que observou ("ele tapa os ouvidos no recreio e chora quando o sinal toca"), não o rótulo ("acho que ele é autista"). O diagnóstico é de profissionais de saúde. Comportamento descrito com exemplos é muito mais útil para todos.', m: 'Descreva o comportamento; não nomeie o diagnóstico.' },
    { t: 'Como dar uma notícia difícil', x: 'Comece pelo que o aluno faz bem, apresente as observações com exemplos e datas, ouça a família, combine ações de casa e da escola e marque um retorno. Evite termos técnicos e frases como "seu filho tem um problema".', m: 'Forças, fatos, escuta, combinados e retorno.' },
    { t: 'Rede intersetorial', x: 'A escola não dá conta sozinha. A rede envolve saúde (UBS, CAPS infantojuvenil, centros de reabilitação), assistência social (CRAS, CREAS), Conselho Tutelar quando há violação de direitos e a própria Secretaria de Educação. Conhecer os serviços do município agiliza os encaminhamentos.', m: 'Educação, saúde e assistência social: rede, não ilha.' },
    { t: 'Bullying', x: 'A Lei nº 13.185/2015 instituiu o Programa de Combate à Intimidação Sistemática (bullying) e atribui às escolas o dever de prevenir e combater a violência. Desde 2024, a Lei nº 14.811 incluiu a intimidação sistemática no Código Penal. Alunos neurodivergentes estão entre os mais vulneráveis.', m: 'Prevenir bullying é dever da escola (Lei nº 13.185/2015).' },

    { tipo: 'ordem', e: 'Ordene as etapas de uma boa reunião com a família.', itens: ['Acolher e começar pelos pontos fortes do aluno', 'Apresentar as observações com exemplos e datas', 'Ouvir a família sobre como é em casa', 'Combinar ações da escola e da família', 'Marcar uma data de retorno'], r: 'Começar pelas forças diminui a defesa da família; os fatos dão concretude; a escuta e os combinados constroem a parceria; o retorno garante continuidade.', m: 'Acolher, mostrar fatos, ouvir, combinar e retornar.' },

  quiz: [
    { e: 'A Lei nº 13.185/2015:', o: ['instituiu o Programa de Combate à Intimidação Sistemática (bullying).', 'criou a CIPTEA.', 'trata da dislexia e do TDAH.', 'instituiu o AEE.'], a: 0, r: 'A Lei nº 13.185/2015 instituiu o programa de combate ao bullying em todo o país.' },
    { e: 'Em uma reunião com a família, a forma mais adequada de apresentar uma preocupação é:', o: ['"Acho que seu filho tem TDAH."', '"Seu filho é um problema na sala."', '"Nas últimas duas semanas, o Pedro deixou de terminar 6 das 10 atividades e levantou muitas vezes durante a explicação. Como é em casa?"', '"Só converso se a senhora trouxer um laudo."'], a: 2, r: 'Descrição objetiva, com dados, seguida de escuta. Sem rótulo e sem exigência de laudo.' },
    { e: 'Revelar à turma o diagnóstico de um aluno, sem autorização:', o: ['é recomendado para gerar empatia.', 'viola a privacidade do aluno e da família e pode aumentar a exposição.', 'é obrigatório pela LBI.', 'é indiferente.'], a: 1, r: 'Trabalhar o respeito às diferenças não exige expor um aluno. O diagnóstico pertence à família e ao aluno.' },
    { e: 'O registro pedagógico contínuo é importante porque:', o: ['substitui o laudo.', 'mostra a evolução do aluno, fundamenta o PEI, apoia o diálogo com a família e garante continuidade nas transições.', 'serve apenas para justificar reprovações.', 'só é exigido na educação especial.'], a: 1, r: 'Registros transformam impressões em informação útil para planejar e para conversar com família e rede.' },
    { e: 'O serviço da rede de saúde voltado ao atendimento em saúde mental de crianças e adolescentes é:', o: ['o CRAS.', 'o CAPS infantojuvenil (CAPSi).', 'o Conselho Tutelar.', 'a sala de recursos multifuncionais.'], a: 1, r: 'O CAPSi integra a Rede de Atenção Psicossocial e atende crianças e adolescentes com sofrimento psíquico intenso.' }

CURSO.ap.m6 = {
  intro: 'Este capítulo discute a relação entre escola e família, a articulação com a rede intersetorial, o enfrentamento do bullying e o registro pedagógico como instrumentos de uma escola inclusiva.',
  secoes: [
    { t: '6.1 Escola e família: uma parceria possível', p: [
      'Polonia e Dessen (2005) compreendem a família e a escola como os dois principais contextos de desenvolvimento da criança e defendem que a relação entre elas seja construída como parceria, com responsabilidades distintas e complementares. As autoras observam que essa relação costuma ser marcada por queixas mútuas, e que a escola tende a chamar a família apenas quando há problemas.',
      'Paro (2000) argumenta que a participação dos pais contribui para a qualidade do ensino quando a escola deixa de vê-los apenas como destinatários de cobranças e passa a envolvê-los no projeto educativo, por meio de diálogo e de informação clara sobre o que se pretende com a aprendizagem dos filhos.',
      'No caso de estudantes neurodivergentes, a família conhece a história de desenvolvimento, os interesses e as estratégias que funcionam em casa; a escola conhece o aluno no grupo e diante do currículo. Uma comunicação respeitosa, que começa pelas potencialidades, apresenta observações concretas e escuta antes de propor, é condição para essa parceria.'
    ], av: { e: 'Segundo Polonia e Dessen (2005), a relação entre escola e família deve ser construída como:', o: ['uma relação de cobrança da escola sobre a família.', 'uma parceria, com responsabilidades distintas e complementares.', 'um contato apenas em casos de indisciplina.', 'uma transferência de responsabilidades da escola para a família.'], a: 1, r: 'Polonia e Dessen (2005) defendem a parceria entre os dois contextos de desenvolvimento, com papéis complementares.' } },
    { t: '6.2 O professor observa, registra e encaminha', p: [
      'O diagnóstico de condições como TEA, TDAH e transtornos de aprendizagem é atribuição de profissionais de saúde. Ao professor cabe observar, descrever e registrar o que acontece em sala, intervir pedagogicamente e, quando necessário, sugerir à família uma avaliação. Descrever o comportamento ("nas últimas duas semanas, não concluiu seis de dez atividades") é mais útil e mais ético do que nomear um diagnóstico ("acho que ele tem TDAH").',
      'Zabalza (2004) mostra que os diários de aula e outros registros do professor são instrumentos de reflexão sobre a própria prática e de acompanhamento dos alunos. Registros com data, situação, intervenção realizada e resultado transformam impressões em informações que orientam o planejamento, fundamentam o PEI e dão continuidade ao trabalho quando o aluno muda de professor.',
      'Esses registros também qualificam a comunicação com a rede de serviços. A Rede de Atenção Psicossocial, instituída pela Portaria nº 3.088/2011, inclui os Centros de Atenção Psicossocial Infantojuvenis (CAPSi), voltados a crianças e adolescentes em sofrimento psíquico intenso (Brasil, 2011). A escola também se articula com a atenção básica de saúde, com a assistência social e, quando há violação de direitos, com o Conselho Tutelar (Brasil, 1990).'
    ], av: { e: 'De acordo com o texto, ao perceber sinais de possível neurodivergência, o papel do professor é:', o: ['comunicar o diagnóstico provável à família.', 'observar, registrar, intervir pedagogicamente e, se necessário, sugerir avaliação por profissionais de saúde.', 'aguardar o laudo antes de qualquer ação.', 'encaminhar o aluno diretamente ao CAPSi sem falar com a família.'], a: 1, r: 'O diagnóstico é da saúde; o professor observa, registra (Zabalza, 2004), intervém e dialoga com a família e a rede.' } },
    { t: '6.3 Bullying e cultura de respeito', p: [
      'Olweus (1993), pioneiro nos estudos sobre o tema, define o bullying como a exposição repetida de um estudante a ações negativas de um ou mais colegas, em uma relação marcada por desequilíbrio de poder. No Brasil, Fante (2005) mostrou a presença do fenômeno nas escolas e defendeu programas de prevenção que envolvam toda a comunidade escolar e eduquem para a paz.',
      'A Lei nº 13.185/2015 instituiu o Programa de Combate à Intimidação Sistemática (bullying) e estabeleceu que é dever do estabelecimento de ensino assegurar medidas de conscientização, prevenção, diagnose e combate à violência (Brasil, 2015). Em 2024, a Lei nº 14.811 incluiu a intimidação sistemática no Código Penal (Brasil, 2024).',
      'Estudantes neurodivergentes estão entre os mais expostos ao bullying, porque suas diferenças de comportamento, comunicação ou desempenho são frequentemente alvo de zombaria. A resposta da escola envolve interromper a situação, acolher a vítima, envolver gestão e famílias, registrar e, sobretudo, desenvolver com as turmas um trabalho contínuo de respeito às diferenças, sem expor o diagnóstico de nenhum aluno.'
    ], av: { e: 'Para Olweus (1993), o bullying caracteriza-se por:', o: ['uma briga isolada entre colegas de mesma força.', 'ações negativas repetidas contra um estudante, em uma relação de desequilíbrio de poder.', 'qualquer brincadeira entre crianças.', 'conflitos entre professores e alunos.'], a: 1, r: 'Olweus (1993): repetição, intenção de causar dano e desequilíbrio de poder.' } }
  ],
  refs: [
    'BRASIL. Lei nº 8.069, de 13 de julho de 1990. Dispõe sobre o Estatuto da Criança e do Adolescente e dá outras providências. <b>Diário Oficial da União</b>, Brasília, DF, 16 jul. 1990.',
    'BRASIL. Ministério da Saúde. Portaria nº 3.088, de 23 de dezembro de 2011. Institui a Rede de Atenção Psicossocial para pessoas com sofrimento ou transtorno mental e com necessidades decorrentes do uso de crack, álcool e outras drogas, no âmbito do Sistema Único de Saúde (SUS). <b>Diário Oficial da União</b>, Brasília, DF, 26 dez. 2011.',
    'BRASIL. Lei nº 13.185, de 6 de novembro de 2015. Institui o Programa de Combate à Intimidação Sistemática (Bullying). <b>Diário Oficial da União</b>, Brasília, DF, 9 nov. 2015.',
    'BRASIL. Lei nº 14.811, de 12 de janeiro de 2024. Institui medidas de proteção à criança e ao adolescente contra a violência nos estabelecimentos educacionais ou similares. <b>Diário Oficial da União</b>, Brasília, DF, 15 jan. 2024.',
    'FANTE, Cleo. <b>Fenômeno bullying</b>: como prevenir a violência nas escolas e educar para a paz. 2. ed. Campinas: Verus, 2005.',
    'OLWEUS, Dan. <b>Bullying at school</b>: what we know and what we can do. Oxford: Blackwell, 1993.',
    'PARO, Vitor Henrique. <b>Qualidade do ensino</b>: a contribuição dos pais. São Paulo: Xamã, 2000.',
    'POLONIA, Ana da Costa; DESSEN, Maria Auxiliadora. Em busca de uma compreensão das relações entre família e escola. <b>Psicologia Escolar e Educacional</b>, Campinas, v. 9, n. 2, p. 303-312, 2005.',
    'ZABALZA, Miguel A. <b>Diários de aula</b>: um instrumento de pesquisa e desenvolvimento profissional. Porto Alegre: Artmed, 2004.'
  ]
};

CURSO.mais.m1 = [
  [
    { e: 'Quem difundiu o termo neurodiversidade, no final da década de 1990?', o: ['O psicólogo Thomas Armstrong.', 'A socióloga australiana Judy Singer.', 'O psicólogo bielo-russo Lev Vigotski.', 'A pesquisadora Adele Diamond.'], a: 1, r: 'O termo foi difundido por Judy Singer, socióloga australiana, em trabalho de conclusão de curso e em capítulo de coletânea (Singer, 1999).' },
    { e: 'Para explicar a ideia de neurodiversidade, Singer (1999) fez uma comparação com:', o: ['a biodiversidade nos ecossistemas.', 'a evolução das espécies por seleção natural.', 'o funcionamento de um computador.', 'as fases do desenvolvimento infantil.'], a: 0, r: 'Singer propôs compreender as diferenças neurológicas como parte da diversidade humana, à semelhança da biodiversidade nos ecossistemas.' },
    { e: 'O "nicho positivo" proposto por Armstrong (2012) é:', o: ['uma sala separada para alunos neurodivergentes.', 'um laudo que descreve as dificuldades do aluno.', 'um conjunto de ajustes no ambiente, nas estratégias e nas relações, construído a partir das potencialidades do aluno.', 'um programa de recompensas para corrigir comportamentos.'], a: 2, r: 'Armstrong (2012) defende uma pedagogia baseada em forças: o professor parte das potencialidades do aluno e organiza ajustes que lhe permitem participar e aprender.' }
  ],
  [
    { e: 'No modelo médico da deficiência, o "problema" está localizado:', o: ['nas barreiras da sociedade.', 'no corpo do indivíduo, que deve ser diagnosticado, tratado e corrigido.', 'nas leis que regulam a escola.', 'na formação dos professores.'], a: 1, r: 'O modelo médico localiza a deficiência no corpo da pessoa; na escola, isso produziu classes especiais e a expectativa de que o aluno se "normalizasse".' },
    { e: 'Segundo a LBI (Brasil, 2015, art. 3º), são tipos de barreira:', o: ['apenas as arquitetônicas e as de transporte.', 'somente as barreiras ligadas à saúde da pessoa.', 'urbanísticas, arquitetônicas, nos transportes, nas comunicações e na informação, atitudinais e tecnológicas.', 'apenas as barreiras atitudinais.'], a: 2, r: 'A lei lista barreiras urbanísticas, arquitetônicas, nos transportes, nas comunicações e na informação, atitudinais e tecnológicas (Brasil, 2015, art. 3º, IV).' },
    { e: 'Para Vigotski (1997), o desenvolvimento da criança com deficiência depende sobretudo:', o: ['do grau do comprometimento biológico.', 'das condições sociais que lhe são oferecidas e dos caminhos alternativos criados pela educação.', 'da idade em que o diagnóstico foi feito.', 'do uso de medicamentos adequados.'], a: 1, r: 'Vigotski afirmava que as consequências sociais do "defeito" pesam mais do que o próprio defeito, e que a educação deve criar caminhos alternativos de desenvolvimento.' }
  ],
  [
    { e: 'Na fase de segregação descrita por Sassaki (1997), as pessoas com deficiência:', o: ['eram atendidas em instituições e classes separadas.', 'frequentavam a escola comum com apoio.', 'eram totalmente mantidas fora de qualquer escola.', 'tinham a escola reorganizada para recebê-las.'], a: 0, r: 'Sassaki (1997) descreve as fases: exclusão (fora da escola), segregação (instituições e classes separadas), integração (adaptar-se à escola) e inclusão (a escola se modifica).' },
    { e: 'Para Mantoan (2003), a inclusão é:', o: ['a soma de adaptações feitas para alguns alunos.', 'a criação de turmas homogêneas por nível.', 'a reorganização da escola como um todo, que questiona currículos rígidos e avaliações classificatórias.', 'o encaminhamento dos alunos para a sala de recursos.'], a: 2, r: 'Mantoan (2003) afirma que a inclusão não é soma de adaptações, mas reorganização da escola, que reconhece e valoriza as diferenças.' },
    { e: 'Segundo Mittler (2003), a inclusão diz respeito:', o: ['apenas aos alunos com laudo médico.', 'a todos os estudantes em risco de exclusão, por razões sociais, culturais ou de aprendizagem.', 'somente aos alunos com deficiência física.', 'apenas às escolas especiais.'], a: 1, r: 'Mittler (2003) entende a inclusão como reforma do sistema, das práticas e das atitudes, voltada a todos os estudantes que correm risco de exclusão.' }
  ],
  [
    { e: 'A Constituição Federal (Brasil, 1988, art. 208, III) garante o atendimento educacional especializado:', o: ['exclusivamente em escolas especiais.', 'preferencialmente na rede regular de ensino.', 'somente a partir do ensino médio.', 'apenas mediante pagamento.'], a: 1, r: 'O art. 208, III, garante o atendimento educacional especializado aos educandos com deficiência, preferencialmente na rede regular de ensino.' },
    { e: 'A Convenção sobre os Direitos das Pessoas com Deficiência tem, no Brasil, equivalência de:', o: ['lei municipal.', 'resolução do Conselho Nacional de Educação.', 'emenda constitucional, por ter sido aprovada pelo rito do art. 5º, § 3º.', 'simples recomendação internacional.'], a: 2, r: 'Aprovada pelo rito do art. 5º, § 3º, da Constituição, a Convenção tem equivalência de emenda constitucional e foi promulgada pelo Decreto nº 6.949/2009.' },
    { e: 'O Decreto nº 12.686/2025 (Política Nacional de Educação Especial Inclusiva) reafirma que a matrícula no atendimento educacional especializado:', o: ['substitui a frequência à classe comum.', 'só pode ocorrer em escola especial.', 'não substitui a frequência à classe comum.', 'depende de autorização judicial.'], a: 2, r: 'O decreto reafirma que o AEE não substitui a classe comum e nomeia o público como estudantes com deficiência, com TEA e com altas habilidades ou superdotação (Brasil, 2025).' }
  ]
];
CURSO.mais.m2 = [
  [
    { e: 'Segundo Cosenza e Guerra (2011), no plano biológico a aprendizagem corresponde:', o: ['ao aumento do número de neurônios na idade adulta.', 'à formação e à consolidação de ligações entre neurônios.', 'ao crescimento do tamanho do cérebro.', 'à memorização de respostas prontas.'], a: 1, r: 'A aprendizagem corresponde à formação e consolidação de conexões entre neurônios, possibilitada pela plasticidade (Cosenza; Guerra, 2011).' },
    { e: 'A plasticidade cerebral:', o: ['existe apenas nos primeiros anos de vida.', 'é intensa na infância, mas persiste ao longo de toda a vida.', 'só ocorre em pessoas neurotípicas.', 'não sofre influência das experiências escolares.'], a: 1, r: 'A plasticidade é a capacidade do sistema nervoso de se modificar com a experiência; é mais intensa na infância, mas continua por toda a vida.' },
    { e: 'Por que a atenção é chamada de "porta de entrada" da aprendizagem?', o: ['Porque o cérebro registra igualmente todos os estímulos.', 'Porque aquilo que não recebe atenção dificilmente será registrado.', 'Porque só alunos com TDAH precisam de atenção.', 'Porque a atenção substitui a memória.'], a: 1, r: 'O cérebro seleciona apenas parte dos estímulos; o que não recebe atenção dificilmente é registrado. Ambientes ruidosos e instruções longas prejudicam toda a turma (Cosenza; Guerra, 2011).' }
  ],
  [
    { e: 'A função executiva que permite resistir a impulsos e distrações chama-se:', o: ['flexibilidade cognitiva.', 'memória de longo prazo.', 'controle inibitório.', 'percepção visual.'], a: 2, r: 'Diamond (2013) descreve o controle inibitório como a capacidade de resistir a impulsos e distrações.' },
    { e: 'Barkley (2008) relaciona as dificuldades do TDAH principalmente a:', o: ['falta de vontade e preguiça do aluno.', 'prejuízo na autorregulação e no controle inibitório.', 'baixa inteligência.', 'problemas de visão.'], a: 1, r: 'Para Barkley (2008), o TDAH envolve prejuízo na autorregulação e no controle inibitório; não se trata de falta de vontade.' },
    { e: 'Qual prática apoia externamente as funções executivas?', o: ['Dar instruções longas apenas oralmente.', 'Dividir tarefas em etapas, deixar instruções visíveis e oferecer listas de verificação.', 'Retirar todos os materiais visuais da sala.', 'Aumentar o número de passos por tarefa.'], a: 1, r: 'Como a memória de trabalho é limitada, dividir tarefas, deixar instruções visíveis e usar listas de verificação apoiam as funções executivas (Diamond, 2013).' }
  ],
  [
    { e: 'Segundo Cosenza e Guerra (2011), o estresse intenso e prolongado:', o: ['melhora a memória de longo prazo.', 'prejudica a atenção e a memória.', 'não interfere na aprendizagem.', 'aumenta o engajamento dos alunos.'], a: 1, r: 'Emoção e cognição funcionam juntas: situações significativas são mais lembradas, mas o estresse intenso e prolongado prejudica atenção e memória.' },
    { e: 'De acordo com Dunlosky et al. (2013), reler e grifar o texto são técnicas de:', o: ['alta utilidade.', 'utilidade moderada, superior à testagem.', 'baixa utilidade.', 'uso exclusivo para alunos neurodivergentes.'], a: 2, r: 'Reler e grifar, embora populares, mostraram baixa utilidade; testagem e prática distribuída foram as de alta utilidade.' },
    { e: 'Qual prática de sala de aula está de acordo com as evidências apresentadas no texto?', o: ['Retomar conteúdos anteriores com perguntas rápidas, sem caráter punitivo.', 'Corrigir o erro do aluno em voz alta diante da turma.', 'Evitar qualquer retomada de conteúdo já trabalhado.', 'Pedir ao aluno apenas para copiar o resumo do quadro.'], a: 0, r: 'Perguntas rápidas de retomada, sem punição, combinam prática de testagem e prática distribuída, num ambiente seguro para errar.' }
  ],
  [
    { e: 'Howard-Jones (2014) chama de neuromitos:', o: ['as descobertas mais recentes da neurociência.', 'as crenças equivocadas sobre o cérebro que circulam na educação.', 'os diagnósticos de transtornos do neurodesenvolvimento.', 'as técnicas de estudo de alta utilidade.'], a: 1, r: 'Neuromitos são crenças equivocadas sobre o cérebro difundidas na educação (Howard-Jones, 2014).' },
    { e: 'Qual das afirmações abaixo é um neuromito citado no texto?', o: ['O cérebro se modifica com a experiência.', 'A atenção influencia o que é registrado.', 'Usamos apenas 10% do cérebro.', 'O retorno sobre o erro ajuda a aprender.'], a: 2, r: 'A ideia de que usamos só 10% do cérebro é um dos neuromitos mais difundidos, ao lado dos "hemisférios" e dos estilos de aprendizagem.' },
    { e: 'Por que apresentar o conteúdo por texto, imagem, objeto e fala é benéfico?', o: ['Porque cada aluno tem um estilo fixo que precisa ser atendido.', 'Porque oferece mais caminhos de acesso para todos os alunos.', 'Porque substitui a explicação do professor.', 'Porque é exigido pelos estilos de aprendizagem.'], a: 1, r: 'Variar as linguagens ajuda todos por oferecer mais caminhos de acesso, e não porque cada aluno tenha um estilo fixo (Pashler et al., 2008).' }
  ]
];

CURSO.mais.m3 = [
  [
    { e: 'Em 1943, Leo Kanner descreveu crianças que apresentavam, desde muito cedo:', o: ['dificuldade de contato afetivo, apego intenso à rotina e uso peculiar da linguagem.', 'atraso motor grave e deficiência visual.', 'dificuldades exclusivas de leitura e escrita.', 'desatenção e hiperatividade.'], a: 0, r: 'Kanner (1943) descreveu onze crianças com dificuldade de contato afetivo, apego à rotina e uso peculiar da linguagem.' },
    { e: 'O DSM-5-TR descreve, para o TEA, três níveis de:', o: ['inteligência.', 'gravidade da deficiência física.', 'suporte: exigindo apoio, apoio substancial e apoio muito substancial.', 'escolaridade.'], a: 2, r: 'Os níveis 1, 2 e 3 referem-se ao suporte necessário: "exigindo apoio", "apoio substancial" e "apoio muito substancial" (APA, 2023).' },
    { e: 'Grandin e Panek (2015) chamam atenção para:', o: ['a homogeneidade das pessoas autistas.', 'a enorme variação dentro do espectro e as diferentes formas de pensar, como por imagens, padrões ou palavras.', 'a necessidade de eliminar os interesses intensos.', 'o caráter raro do autismo.'], a: 1, r: 'Temple Grandin, mulher autista e pesquisadora, destaca a variação no espectro e as formas de pensar, em vez de enxergar apenas déficits.' }
  ],
  [
    { e: 'Segundo a Lei nº 12.764/2012 (Lei Berenice Piana), a pessoa com TEA:', o: ['não tem direito ao atendimento educacional especializado.', 'é considerada pessoa com deficiência, para todos os efeitos legais.', 'deve estudar em escola especial.', 'só tem direitos após receber a CIPTEA.'], a: 1, r: 'O art. 1º, § 2º, da lei considera a pessoa com TEA pessoa com deficiência para todos os efeitos legais, o que inclui o AEE.' },
    { e: 'O gestor escolar que recusar a matrícula de aluno com TEA está sujeito a:', o: ['advertência verbal apenas.', 'multa de 3 a 20 salários-mínimos.', 'nenhuma penalidade.', 'transferência automática do aluno.'], a: 1, r: 'A Lei nº 12.764/2012, art. 7º, prevê multa de 3 a 20 salários-mínimos para quem recusar a matrícula.' },
    { e: 'Sobre a CIPTEA, criada pela Lei Romeo Mion (Brasil, 2020), é correto afirmar:', o: ['é requisito obrigatório para a matrícula.', 'é necessária para o aluno receber apoio pedagógico.', 'garante atenção integral e prioridade nos serviços, mas não é requisito para matrícula nem para apoio pedagógico.', 'substitui o laudo médico em qualquer situação.'], a: 2, r: 'A carteira garante atenção integral, pronto atendimento e prioridade, mas não pode ser exigida para matrícula ou apoio pedagógico.' }
  ],
  [
    { e: 'Como tornar uma instrução mais acessível para um aluno autista que compreende a linguagem de forma literal?', o: ['Usar ironias para descontrair.', 'Usar instruções diretas, curtas e com apoio visual.', 'Dar várias instruções ao mesmo tempo, oralmente.', 'Usar metáforas para estimular a imaginação.'], a: 1, r: 'Instruções diretas, curtas e com apoio visual reduzem a ambiguidade para quem compreende a linguagem de forma literal.' },
    { e: 'A Comunicação Aumentativa e Alternativa (CAA) inclui:', o: ['apenas a língua de sinais.', 'pranchas com figuras, cartões, aplicativos e gestos.', 'somente a escrita no caderno.', 'exercícios de fala repetida.'], a: 1, r: 'Pranchas, cartões, aplicativos e gestos ampliam a expressão de estudantes que não falam ou falam pouco e reduzem a frustração.' },
    { e: 'Durante uma crise por sobrecarga sensorial, a prioridade do professor deve ser:', o: ['conversar longamente com o aluno sobre o comportamento.', 'aplicar uma punição imediata.', 'garantir a segurança, reduzir estímulos e esperar a regulação.', 'chamar a turma para observar.'], a: 2, r: 'Na crise, a prioridade é segurança, redução de estímulos e espera pela regulação; a conversa fica para depois.' }

    var sig = s[0], ext = s[1], q = sig.replace(/[.*+?^${}()|[\]\\\/-]/g, '\\$&');

    if (vistos[sig]) return;
    var m = re.exec(txt); if (!m) return;
    vistos[sig] = true;
    var i = m.index + m[1].length;
    /* já veio por extenso ou está dentro de citação (Sigla, ano) */
    if (txt.slice(Math.max(0, i - ext.length - 3), i).toLowerCase().indexOf(ext.toLowerCase().slice(0, 20)) >= 0) return;

  });
  return txt;
};

<script>/* Formação Continuada no site publicado: login Google (mesmo projeto Firebase do Plano de Estudo), matrícula pelo

      return r.json().then(function (j) { if (!r.ok) throw new Error(j.erro || 'Não foi possível agora. Tente de novo.'); return j; });

    sair: function () { return sincronizar().catch(function () {}).then(firebase).then(function (f) { return f.A.signOut(f.auth); }).then(function () { location.reload(); }); },

  function save() { mem = S; try { localStorage.setItem(chave(), JSON.stringify(S)); } catch (e) {} if (PROD && NV && USER) NV.agendar(); }
  load();
  function M(id) { var x = S.mods[id] || (S.mods[id] = { c: [], l: [], a: {}, q: null, fim: null }); if (!x.e) x.e = []; return x; }

  /* ---------- utilidades ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function hoje() { return Date.now() + S.pulo * 864e5; }
  function dataBR(t) { var d = new Date(t); return d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear(); }
  function dataC(t) { var d = new Date(t); return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear(); }
  function shuf(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  var ORD = {}; /* embaralhamento fixo das alternativas durante a visita */
  function ordem(key, n) { if (!ORD[key] || ORD[key].length !== n) { var a = []; for (var i = 0; i < n; i++) a.push(i); ORD[key] = shuf(a); } return ORD[key]; }
  function hFeitas() { var h = 0; C.modulos.forEach(function (m) { if (M(m.id).fim) h += m.h; }); if (S.fin.ok) h += C.finalH; return h; }
  function modsOk() { return C.modulos.every(function (m) { return M(m.id).fim; }); }
  function liberaEm() { return S.mat ? S.mat + DIAS_MIN * 864e5 : null; }
  function inicioDia(t) { var d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }

  /* progresso de um módulo, em etapas */
  function etapas(m) {
    var s = M(m.id);
    return {
      e: s.e.length >= C.ap[m.id].secoes.length,
      c: s.c.length >= m.cartoes.length,
      a: m.atividades.every(function (x, i) { return s.a[i]; }),
      q: !!(s.q && s.q.ok)
    };
  }
  function checaFim(m) {
    var e = etapas(m), s = M(m.id);
    if (e.e && e.c && e.a && e.q && !s.fim) { s.fim = Date.now(); save(); return true; }
    return false;
  }

  /* ---------- rotas ---------- */

      '<p>' + esc(C.sigla(C.resumo, {})) + '</p><div class="chips"><span class="chip">' + C.horas + ' horas</span><span class="chip">100% on-line</span><span class="chip">Certificado com QR Code</span></div>' +
      '<div class="price">' + (C.parcelas ? C.parcelas + 'x de R$ ' + C.parcela + ' <small style="display:block;margin-top:6px">sem juros no cartão ou R$ ' + C.preco + ' à vista no Pix, pelo Mercado Pago</small>' : 'R$ ' + C.preco + ' <small>à vista, pagamento pelo Mercado Pago</small>') + '</div><div style="margin-top:16px">' +

      '<div class="feat"><span class="ic">🧩</span><div><b>Atividades interativas</b><div class="note">Questões comentadas, associação, ordenação, estudo de caso e prática.</div></div></div>' +
      '<div class="feat"><span class="ic">🎓</span><div><b>Certificado</b><div class="note">Após aprovação na avaliação final e cumprido o prazo mínimo de ' + DIAS_MIN + ' dias desde a matrícula (8 horas por dia).</div></div></div>' +

    h += '<div class="card"><h2>Coordenação</h2><p style="margin:0"><b>' + esc(C.coord.nome) + '</b><br>' + esc(C.coord.cargo) + ' · ' + esc(C.coord.area) + '</p></div>';

  }

  function botaoProd() {

    return h + '<div class="card"><p style="margin-top:0"><b>' + esc(C.titulo) + '</b><br>' + C.horas + ' horas · ' + (C.parcelas ? C.parcelas + 'x de R$ ' + C.parcela + ' sem juros no cartão ou R$ ' + C.preco + ' à vista no Pix' : 'R$ ' + C.preco) + '</p>' +
      '<p class="note">Conta Google: <b>' + esc(USER.email) + '</b>. O acesso é liberado nessa conta assim que o Mercado Pago confirmar o pagamento.</p>' +

      '<button class="btn gold" data-a="pagar">Ir para o pagamento</button><p class="note" style="margin-bottom:0">Pagamento seguro pelo Mercado Pago (Pix, cartão ou boleto). Você pode pedir o reembolso em até 7 dias.</p></div></div>';
  }

  /* ---------- sala ---------- */
  function barra() {
    var f = hFeitas();
    return '<div class="prog"><div class="wrap"><div class="lbl"><span>Carga horária cumprida</span><span>' + f + ' de ' + C.horas + 'h</span></div><div class="bar"><i style="width:' + (f / C.horas * 100) + '%"></i></div></div></div>';
  }
  function sala() {
    var h = barra() + '<div class="wrap"><h1 class="mtitle" style="margin-top:16px">' + esc(C.titulo) + '</h1><p class="note">Matrícula em ' + dataC(S.mat) + '. A carga horária só conta quando o módulo inteiro é concluído: estudo do texto (com as perguntas para avançar), cartões de revisão, atividades e questionário com pelo menos ' + Math.round(C.quizMin * 100) + '% de acertos.</p><div class="mlist">';
    C.modulos.forEach(function (m, i) {
      var s = M(m.id), e = etapas(m), n = [e.e, e.c, e.a, e.q].filter(Boolean).length;
      var st = s.fim ? '<span class="st done">✓ ' + m.h + 'h</span>' : n ? '<span class="st go">' + n + ' de 4 etapas</span>' : '<span class="st">' + m.h + 'h</span>';
      h += '<button class="mi' + (s.fim ? ' done' : '') + '" data-mod="' + i + '"><span class="num">' + (s.fim ? '✓' : i + 1) + '</span><span><b>' + esc(m.titulo) + '</b></span>' + st + '</button>';
    });
    var ok = modsOk();
    h += '<button class="mi' + (S.fin.ok ? ' done' : ok ? '' : ' lock') + '" data-go="' + (ok ? 'final' : '') + '"><span class="num">' + (S.fin.ok ? '✓' : '★') + '</span><span><b>Avaliação final</b><div class="note">' + (ok ? 'Liberada' : 'Libera quando os 6 módulos estiverem concluídos') + '</div></span><span class="st' + (S.fin.ok ? ' done' : '') + '">' + (S.fin.ok ? '✓ ' + C.finalH + 'h' : C.finalH + 'h') + '</span></button>';
    h += '<button class="mi' + (S.fin.ok ? '' : ' lock') + '" data-go="' + (S.fin.ok ? 'cert' : '') + '"><span class="num">🎓</span><span><b>Certificado</b><div class="note">' + certStatus() + '</div></span></button>';
    h += '</div>';
    if (PROD) h += '<div class="card" style="margin-top:16px"><b>Apostila do curso em PDF</b><p class="note">O texto completo de estudo, com figuras e referências, para ler ou imprimir.</p><button class="btn ghost sm" data-a="apostila">Baixar a apostila</button> <span class="note" id="aperr"></span></div>';
    h += '</div>';
    return h;
  }
  function certStatus() {
    if (S.cert) return 'Emitido · código ' + S.cert.cod;
    if (PROD && EST.liberaEm && S.fin.ok && Date.now() < EST.liberaEm) return 'Aprovado! Liberado a partir de ' + dataC(EST.liberaEm) + ' (prazo mínimo de ' + DIAS_MIN + ' dias)';
    if (PROD && S.fin.ok) return 'Pronto para emitir';
    if (!S.fin.ok) return 'Libera após aprovação na avaliação final e a partir de ' + dataC(liberaEm());
    if (hoje() < inicioDia(liberaEm())) return 'Aprovado! Liberado a partir de ' + dataC(liberaEm()) + ' (prazo mínimo de ' + DIAS_MIN + ' dias)';
    return 'Pronto para emitir';
  }

  /* ---------- módulo ---------- */
  var PASSOS = [['e', 'Estudo'], ['c', 'Cartões de revisão'], ['a', 'Atividades'], ['q', 'Questionário']];
  function modulo() {
    var m = C.modulos[V.mod], e = etapas(m), s = M(m.id);
    var h = barra() + '<div class="wrap"><button class="back" data-go="sala">← Módulos</button><div class="note"><b>Módulo ' + (V.mod + 1) + ' · ' + m.h + ' horas</b></div><h2 class="mtitle">' + esc(m.titulo) + '</h2>';
    if (V.passo === 'e') h += '<p class="note"><b>Objetivo:</b> ' + esc(m.objetivo) + '</p>';
    if (s.fim) h += '<div class="banner ok">✓ Módulo concluído em ' + dataC(s.fim) + '. ' + m.h + ' horas creditadas.</div>';
    h += '<div class="steps">' + PASSOS.map(function (p, i) { return '<button class="' + (V.passo === p[0] ? 'on ' : '') + (e[p[0]] ? 'ok' : '') + '" data-passo="' + p[0] + '">' + (e[p[0]] ? '✓ ' : (i + 1) + '. ') + p[1] + '</button>'; }).join('') + '</div>';
    if (V.passo === 'c') h += cartoes(m);
    if (V.passo === 'e') h += estudo(m);
    if (V.passo === 'a') h += atividades(m);
    if (V.passo === 'q') h += quiz(m);
    return h + '</div>';
  }
  function cartoes(m) {
    var s = M(m.id), i = V.card, c = m.cartoes[i];
    if (s.c.indexOf(i) < 0) { s.c.push(i); save(); checaFim(m); }
    var h = '<div class="dots">' + m.cartoes.map(function (_, j) { return '<i class="' + (s.c.indexOf(j) >= 0 ? 'v' : '') + '"></i>'; }).join('') + '</div>';
    h += '<div class="flash"><span class="k">Cartão ' + (i + 1) + ' de ' + m.cartoes.length + '</span><h3>' + esc(c.t) + '</h3><p>' + esc(c.x) + '</p><div class="mem">' + esc(c.m) + '</div></div>';
    h += '<div class="nav"><button class="btn ghost sm" data-card="' + (i - 1) + '"' + (i ? '' : ' disabled') + '>← Anterior</button>' +
      (i < m.cartoes.length - 1 ? '<button class="btn sm" data-card="' + (i + 1) + '">Próximo →</button>' : '<button class="btn sm gold" data-passo="a">Ir para as atividades →</button>') + '</div>';
    return h;
  }
  function avs(id, i) { var sc = C.ap[id].secoes[i]; return [sc.av].concat((C.mais && C.mais[id] && C.mais[id][i]) || []); }
  var AV = {}; /* respostas erradas recentes nas perguntas para avançar */
  function estudo(m) {
    var ap = C.ap[m.id], s = M(m.id), VS = {}, h = '<p class="note">Leia cada parte do texto. Ao final de cada parte há quatro perguntas. Acerte todas para liberar a próxima parte.</p>';
    h += '<div class="apost"><p class="ai">' + esc(C.sigla(ap.intro, VS)) + '</p>';
    for (var i = 0; i < ap.secoes.length; i++) {
      var sc = ap.secoes[i], ok = s.e.indexOf(i) >= 0;
      h += '<h3>' + esc(sc.t) + '</h3>' + sc.p.map(function (p) { return p.slice(0, 2) === '>>' ? '<p class="cit">' + esc(p.slice(2)) + '</p>' : '<p>' + esc(C.sigla(p, VS)) + '</p>'; }).join('');
      if (sc.fig && C.figs[sc.fig]) h += '<figure class="fg"><figcaption><b>Figura</b> – ' + esc(C.figs[sc.fig].t) + '</figcaption>' + C.figs[sc.fig].svg + '<div class="fonte">Fonte: elaboração própria (2026)' + (C.figs[sc.fig].svg.indexOf('data-ud') >= 0 ? ', com ilustrações adaptadas de unDraw (undraw.co)' : '') + '.</div></figure>';
      var QS = avs(m.id, i), ev = s.ev || {}, para = false;
      for (var j = 0; j < QS.length; j++) {
        var q = QS[j], qok = ok || ev[i + '.' + j], key = m.id + 'av' + i + '.' + j, o = ordem(key, q.o.length), w = AV[m.id + i + '.' + j];
        h += '<div class="act av' + (qok ? ' done' : '') + '" id="av' + i + '_' + j + '"><div class="tp">Pergunta ' + (j + 1) + ' de ' + QS.length + ' para avançar' + (qok ? ' · ✓ acertou' : '') + '</div><div class="en">' + esc(q.e) + '</div>';
        o.forEach(function (oi, z) {
          var cls = qok ? (oi === q.a ? ' right' : '') : (w && w.indexOf(oi) >= 0 ? ' wrong' : '');
          h += '<button class="opt' + cls + '" data-av="' + i + '.' + j + ':' + oi + '"' + (qok || (w && w.indexOf(oi) >= 0) ? ' disabled' : '') + '><span class="l">' + LET[z] + '</span><span>' + esc(q.o[oi]) + '</span></button>';
        });
        if (qok) h += '<div class="res okk"><b class="t">✓ Correto!</b>' + esc(q.r) + '</div>';
        else if (w) h += '<div class="res nok"><b class="t">✗ Ainda não. Releia a parte ' + esc(sc.t.split(' ')[0]) + ' acima e tente outra alternativa.</b></div>';
        h += '</div>';
        if (!qok) { para = true; break; }
      }
      if (!ok) { h += '<p class="note lock">🔒 ' + (para && j < QS.length - 1 ? 'A próxima pergunta aparece quando você acertar esta. ' : '') + 'As próximas partes do texto aparecem quando você acertar as ' + QS.length + ' perguntas.</p>'; break; }
    }
    if (etapas(m).e) {
      h += '<h3>' + esc(m.leitura.titulo) + ' (caso para refletir)</h3>' + m.leitura.partes.map(function (p) { return '<p><b>' + esc(p.p) + '</b> ' + esc(p.x) + '</p>'; }).join('');
      h += '<h3>Referências</h3><div class="refs">' + ap.refs.map(function (r) { return '<p>' + r + '</p>'; }).join('') + '</div>';
    }
    h += '</div>';
    if (etapas(m).e) h += '<div class="nav"><span></span><button class="btn sm gold" data-passo="c">Ir para os cartões de revisão →</button></div>';
    return h;
  }
  function leitura(m) {
    var s = M(m.id), h = '<p class="note">Abra cada parte e leia com atenção. As perguntas guiam a leitura.</p><h3 style="color:var(--brand);margin:8px 0">' + esc(m.leitura.titulo) + '</h3>';
    m.leitura.partes.forEach(function (p, i) {
      var v = s.l.indexOf(i) >= 0;
      h += '<details class="acc" data-ler="' + i + '"><summary>' + esc(p.p) + (v ? ' <span class="seen">✓ lida</span>' : '') + '</summary><div class="in">' + esc(p.x) + '</div></details>';
    });
    h += '<div class="nav"><span></span><button class="btn sm' + (etapas(m).l ? ' gold' : '') + '" data-passo="a"' + (etapas(m).l ? '' : ' disabled') + '>Ir para as atividades →</button></div>';
    if (!etapas(m).l) h += '<p class="note" style="text-align:right">Abra todas as partes para liberar.</p>';
    return h;
  }

  /* ---------- atividades ---------- */
  var T = {}; /* estado temporário das atividades de associação e ordenação */
  var NOMES = { q: 'Questão comentada', assoc: 'Associação de conceitos', ordem: 'Ordenação', caso: 'Estudo de caso', pratica: 'Prática' };
  function atividades(m) {
    var h = '';
    m.atividades.forEach(function (a, i) { h += '<div class="act' + (M(m.id).a[i] ? ' done' : '') + '" id="at' + i + '"><div class="tp">' + NOMES[a.tipo] + (M(m.id).a[i] ? ' · ✓ feita' : '') + '</div>' + ativ(m, a, i) + '</div>'; });
    var ok = etapas(m).a;
    h += '<div class="nav"><span></span><button class="btn sm' + (ok ? ' gold' : '') + '" data-passo="q"' + (ok ? '' : ' disabled') + '>Ir para o questionário →</button></div>';
    if (!ok) h += '<p class="note" style="text-align:right">Conclua as ' + m.atividades.length + ' atividades para liberar.</p>';
    return h;
  }
  function ativ(m, a, i) {
    var s = M(m.id), key = m.id + '-' + i, feito = s.a[i];
    if (a.tipo === 'q' || a.tipo === 'caso') {
      var o = ordem(key, a.o.length), h = '<div class="en">' + esc(a.e) + '</div>';
      o.forEach(function (oi, j) {
        var cls = '';
        if (feito) { if (oi === a.a) cls = ' right'; else if (oi === feito.esc) cls = ' wrong'; }
        h += '<button class="opt' + cls + '" data-op="' + i + ':' + oi + '"' + (feito ? ' disabled' : '') + '><span class="l">' + LET[j] + '</span><span>' + esc(a.o[oi]) + '</span></button>';
      });
      if (feito) {
        var certo = feito.esc === a.a;
        h += '<div class="res ' + (certo ? 'okk' : 'nok') + '"><b class="t">' + (certo ? '✓ Correto!' : '✗ Não é essa. A resposta é a alternativa destacada em verde.') + '</b>' +
          (a.fb ? esc(a.fb[feito.esc]) + (certo ? '' : '<br><br><b>Por que a correta é a melhor:</b> ' + esc(a.fb[a.a])) : esc(a.r)) + '<div class="mem">' + esc(a.m) + '</div></div>';
      }
      return h;
