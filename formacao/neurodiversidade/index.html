*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Source Sans 3',system-ui,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3,.sora{font-family:Sora,system-ui,sans-serif;line-height:1.25;margin:0}
button{font:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.previa{background:var(--gold-wash);color:#6b4b00;font-size:13.5px;text-align:center;padding:6px 12px;border-bottom:1px solid #EBD9A8}
header.top{background:var(--sheet);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--brand);cursor:pointer}
.logo img{width:34px;height:34px}
.logo b{font-family:Sora;font-size:15px;line-height:1.05}.logo b i{font-style:normal;color:var(--gold);display:block}
.tag{margin-left:auto;font-size:13px;color:var(--soft);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--brand);color:#fff;text-decoration:none;min-height:46px}
.btn.gold{background:var(--gold2);color:#1d1400}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:14.5px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.hero{background:linear-gradient(135deg,#13285E,#1d3a80);color:#fff;padding:34px 0 30px}
.hero.foto{position:relative;padding:0 0 34px;background:#13285E}.hero.foto .ft{height:clamp(190px,34vw,430px);background:linear-gradient(180deg,rgba(19,40,94,0) 55%,#13285E 100%),url(/img/formacao/neuro30.jpg) center 28%/cover no-repeat}@media(max-width:700px){.hero.foto .ft{background-image:linear-gradient(180deg,rgba(19,40,94,0) 55%,#13285E 100%),url(/img/formacao/neuro30-m.jpg)}}.hero.foto .wrap{margin-top:-28px;position:relative}
.hero .kick{color:#F5C04A;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.hero h1{font-size:clamp(24px,5vw,34px);margin:8px 0 12px}
.hero p{color:#D9E0F2;margin:0 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600}
.price{font-family:Sora;font-size:28px;font-weight:800;color:#F5C04A}.price small{font-size:14px;color:#D9E0F2;font-weight:600;font-family:'Source Sans 3'}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0}
.card h2{font-size:19px;margin-bottom:10px;color:var(--brand)}
.mods{list-style:none;margin:0;padding:0}
.mods li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}

var CURSO = {
  id: 'neuro30',
  titulo: 'Neurodiversidade e Aprendizagem: Desafios da Escola Contemporânea',
  horas: 30, preco: '39,80', parcelas: 2, parcela: '19,90',
  resumo: 'Curso livre de formação continuada, on-line e autoinstrucional, para professores, auxiliares, coordenadores e gestores que querem compreender o autismo, o TDAH, a dislexia, as altas habilidades e outras formas de neurodivergência e transformar esse conhecimento em práticas inclusivas na sala de aula.',
  publico: 'Professores da educação infantil, do ensino fundamental e médio, professores de educação especial, auxiliares e profissionais de apoio, coordenadores e gestores escolares.',
  objetivos: [
    'Compreender o conceito de neurodiversidade e o modelo social da deficiência.',
    'Relacionar os processos de atenção, memória e funções executivas à aprendizagem.',
    'Reconhecer características do TEA, do TDAH, dos transtornos de aprendizagem e das altas habilidades.',
    'Aplicar o Desenho Universal para a Aprendizagem e elaborar objetivos de PEI.',
    'Construir parceria com famílias e rede de apoio e prevenir o bullying.'
  ],
  coord: { nome: 'Profa. Dra. Sandra Medina Benini', cargo: 'Coordenação Acadêmica e Científica', area: 'Formação Continuada de Professores' },
  finalH: 2, finalN: 15, finalMin: 0.7, finalTent: 3, quizMin: 0.6,
  modulos: [],
  final: [
    { e: 'Uma escola organiza as salas de aula para que alunos autistas fiquem todos juntos, em turma separada, "para receberem atenção especial". Essa organização corresponde a:', o: ['inclusão.', 'segregação.', 'ensino colaborativo.', 'Desenho Universal.'], a: 1 },
    { e: 'O modelo social da deficiência, adotado pela LBI, desloca o foco:', o: ['da escola para o diagnóstico.', 'do impedimento individual para a interação entre a pessoa e as barreiras do ambiente.', 'do professor para o médico.', 'da aprendizagem para o comportamento.'], a: 1 },
    { e: 'A Convenção da ONU sobre os Direitos das Pessoas com Deficiência foi aprovada pelo Congresso com equivalência de emenda constitucional (Decreto Legislativo nº 186/2008) e promulgada pelo:', o: ['Decreto nº 6.949/2009.', 'Decreto nº 7.611/2011.', 'Decreto nº 5.154/2004.', 'Decreto nº 3.298/1999.'], a: 0 },
    { e: 'Uma professora comenta: "Ele não vai aprender a ler, então deixo ele desenhando." Essa fala revela principalmente uma barreira:', o: ['arquitetônica.', 'tecnológica.', 'atitudinal.', 'nos transportes.'], a: 2 },
    { e: 'Qual estratégia está mais alinhada ao que a neurociência indica sobre memória?', o: ['Revisar todo o conteúdo apenas na véspera da prova.', 'Propor perguntas de recuperação em aulas de dias diferentes.', 'Pedir que o aluno grife o texto inteiro.', 'Evitar retomar conteúdos já ensinados.'], a: 1 },
    { e: 'A capacidade de mudar de estratégia quando a primeira não funciona é chamada de:', o: ['controle inibitório.', 'memória de trabalho.', 'flexibilidade cognitiva.', 'atenção sustentada.'], a: 2 },
    { e: 'A afirmação "alunos cinestésicos só aprendem se manipularem objetos" é:', o: ['uma evidência consolidada da neurociência.', 'um neuromito, pois não há evidência de que ensinar só pelo estilo preferido melhore a aprendizagem.', 'verdadeira apenas para alunos com TDAH.', 'uma determinação da BNCC.'], a: 1 },
    { e: 'Um ambiente de sala em que o erro é tratado com risos e punição tende a:', o: ['acelerar a aprendizagem pelo medo.', 'prejudicar a aprendizagem, porque o aluno passa a evitar tentar.', 'ser neutro para a aprendizagem.', 'ajudar alunos com TDAH a se concentrarem.'], a: 1 },
    { e: 'Pelo DSM-5-TR, o nível 3 de suporte no TEA indica:', o: ['nenhuma necessidade de apoio.', 'necessidade de apoio.', 'necessidade de apoio substancial.', 'necessidade de apoio muito substancial.'], a: 3 },
    { e: 'O professor diz a um aluno autista: "Vamos voar para o pátio!". O aluno fica parado, confuso. A melhor explicação é:', o: ['desobediência.', 'compreensão literal da linguagem; o professor deve usar instruções diretas.', 'deficiência auditiva.', 'falta de interesse pela aula.'], a: 1 },
    { e: 'Segundo a Lei nº 12.764/2012, o gestor escolar que recusar a matrícula de aluno com TEA:', o: ['não sofre qualquer penalidade.', 'pode ser punido com multa de 3 a 20 salários-mínimos.', 'deve apenas justificar por escrito.', 'só é punido em escola particular.'], a: 1 },
    { e: 'Uma aluna autista se desorganiza todas as vezes que a aula de educação física muda de horário. A estratégia preventiva mais adequada é:', o: ['não avisar, para que ela se acostume com imprevistos.', 'antecipar a mudança com a agenda visual no início do dia.', 'retirá-la da educação física.', 'pedir à família que a busque mais cedo.'], a: 1 },
    { e: 'Sobre as estereotipias motoras em alunos autistas, é correto afirmar:', o: ['devem sempre ser reprimidas.', 'frequentemente ajudam na autorregulação e só exigem intervenção quando causam risco ou prejuízo.', 'indicam falta de limites em casa.', 'desaparecem com castigos.'], a: 1 },
    { e: 'Aluno de 10 anos perde materiais, esquece tarefas, se distrai com qualquer ruído e "parece não ouvir", mas não é agitado. Esses sinais são compatíveis com:', o: ['TDAH de apresentação predominantemente desatenta, a ser avaliado por profissionais de saúde.', 'dislexia.', 'altas habilidades.', 'discalculia.'], a: 0 },
    { e: 'Para um aluno com TDAH, a organização mais adequada de uma atividade longa é:', o: ['entregar tudo de uma vez e cobrar no fim da aula.', 'dividir em partes curtas, com conferência e retorno a cada etapa.', 'aumentar a quantidade de exercícios para "treinar a atenção".', 'deixá-lo sem a atividade.'], a: 1 },
    { e: 'A diferença central entre dificuldade e transtorno de aprendizagem é que o transtorno:', o: ['some com a idade.', 'persiste mesmo com intervenção pedagógica adequada e contínua.', 'é sempre causado por falta de estudo.', 'impede qualquer aprendizagem.'], a: 1 },
    { e: 'Um aluno com dislexia faz prova de Ciências. Para avaliar o que ele sabe de Ciências, é adequado:', o: ['descontar pontos por erros de ortografia.', 'ler os enunciados e valorizar o conteúdo da resposta, aceitando respostas orais quando necessário.', 'aplicar uma prova sobre outro conteúdo, mais fácil.', 'dispensá-lo da avaliação.'], a: 1 },
    { e: 'A Lei nº 14.254/2021 prevê, entre outras medidas:', o: ['matrícula de alunos com dislexia em escolas especiais.', 'identificação precoce, encaminhamento para diagnóstico e apoio educacional e terapêutico a educandos com dislexia, TDAH ou outro transtorno de aprendizagem.', 'proibição de adaptações de avaliação.', 'exigência de laudo para matrícula.'], a: 1 },
    { e: 'Aluno com altas habilidades/superdotação que também é autista apresenta:', o: ['dupla excepcionalidade.', 'discalculia.', 'integração escolar.', 'capacitismo.'], a: 0 },
    { e: 'Para alunos com altas habilidades/superdotação, o AEE oferece atendimento:', o: ['complementar.', 'suplementar, com enriquecimento curricular.', 'substitutivo à sala comum.', 'apenas com aceleração de série.'], a: 1 },
    { e: 'No Desenho Universal para a Aprendizagem, apresentar um conteúdo com texto, imagem, objeto e áudio corresponde ao princípio de múltiplos meios de:', o: ['engajamento.', 'representação.', 'ação e expressão.', 'avaliação.'], a: 1 },
    { e: 'Uma professora planeja que os alunos possam mostrar o que aprenderam sobre animais com um cartaz, uma apresentação oral ou uma maquete. Ela aplica o princípio do DUA de múltiplos meios de:', o: ['representação.', 'engajamento.', 'ação e expressão.', 'avaliação externa.'], a: 2 },
    { e: 'Qual objetivo está mais bem escrito para um PEI?', o: ['"Desenvolver a autonomia."', '"Até o fim do semestre, guardar o próprio material na mochila ao final da aula, com apoio de um cartão de passos, em 4 de 5 dias."', '"Comportar-se melhor."', '"Acompanhar a turma."'], a: 1 },
    { e: 'Segundo a Resolução CNE/CEB nº 4/2009, o AEE é realizado prioritariamente:', o: ['na classe comum, no lugar do professor regente.', 'na sala de recursos multifuncionais, no turno inverso ao da escolarização.', 'em clínicas de saúde.', 'no mesmo horário da aula regular, retirando o aluno da sala.'], a: 1 },
    { e: 'A função do profissional de apoio escolar, segundo a LBI, inclui:', o: ['planejar o currículo do aluno.', 'auxiliar em alimentação, higiene e locomoção e atuar nas atividades escolares em que for necessário.', 'aplicar e corrigir as avaliações no lugar do professor.', 'emitir relatórios diagnósticos.'], a: 1 },
    { e: 'Uma escola exige laudo para iniciar o AEE de um aluno. De acordo com a orientação do MEC (Nota Técnica nº 04/2014), essa exigência:', o: ['é obrigatória.', 'não se sustenta, porque o laudo não é documento obrigatório para o AEE.', 'vale só para TEA.', 'vale só para escolas estaduais.'], a: 1 },
    { e: 'Em uma reunião, a forma mais adequada de compartilhar uma preocupação com a família é:', o: ['apresentar uma hipótese diagnóstica.', 'começar pelos pontos fortes, descrever fatos observados com exemplos e ouvir a família.', 'enviar um bilhete dizendo que o aluno "tem problema".', 'pedir transferência do aluno.'], a: 1 },
    { e: 'Alunos repetidamente humilham um colega com dislexia quando ele lê em voz alta. Pela Lei nº 13.185/2015, a escola deve:', o: ['proibir o aluno com dislexia de ler.', 'prevenir e combater a intimidação sistemática, com ações de conscientização e intervenção.', 'aguardar que a família registre ocorrência.', 'considerar brincadeira da idade.'], a: 1 },
    { e: 'O serviço que oferece proteção social básica e acompanha famílias em situação de vulnerabilidade é:', o: ['o CRAS.', 'o CAPSi.', 'a UBS.', 'a sala de recursos.'], a: 0 },
    { e: 'Na transição de um aluno autista do 5º para o 6º ano, a medida mais adequada é:', o: ['não informar o novo professor, para evitar rótulos.', 'planejar a transição com visita prévia, apresentação dos novos professores e passagem dos registros e do PEI.', 'manter o aluno no 5º ano.', 'retirá-lo das aulas nas primeiras semanas.'], a: 1 }
  ]
};

CURSO.modulos.push({
  id: 'm1', h: 5,
  titulo: 'Neurodiversidade: conceitos e mudança de olhar',
  objetivo: 'Compreender o conceito de neurodiversidade, a passagem do modelo médico ao modelo social da deficiência e os marcos legais da educação inclusiva no Brasil.',
  cartoes: [
    { t: 'O que é neurodiversidade', x: 'É a ideia de que os cérebros humanos funcionam de formas naturalmente diferentes, e que essa variação faz parte da diversidade humana, como acontece com a cor dos olhos ou a altura. O termo ficou conhecido no fim dos anos 1990, a partir dos estudos da socióloga australiana Judy Singer.', m: 'Neurodiversidade não é diagnóstico: é um jeito de olhar para a variação humana.' },
    { t: 'Neurodivergente e neurotípico', x: 'Neurodivergente é a pessoa cujo funcionamento neurológico difere do considerado típico, como pessoas autistas, com TDAH ou com dislexia. Neurotípico é quem tem o funcionamento mais comum. Uma turma é neurodiversa; um aluno pode ser neurodivergente.', m: 'Diversidade é do grupo; divergência é da pessoa.' },
    { t: 'Modelo médico', x: 'No modelo médico, o problema está na pessoa: o foco é o diagnóstico, a falta e a tentativa de "corrigir" o aluno para que ele se encaixe na escola. A escola permanece igual e espera que o estudante mude.', m: 'Modelo médico: o problema está no aluno.' },
    { t: 'Modelo social', x: 'No modelo social, a deficiência resulta da interação entre as características da pessoa e as barreiras do ambiente. A Lei Brasileira de Inclusão (Lei nº 13.146/2015, art. 2º) adota essa visão: a deficiência aparece quando o impedimento encontra barreiras que dificultam a participação plena.', m: 'Modelo social: a deficiência surge do encontro com as barreiras.' },
    { t: 'As barreiras', x: 'A LBI (art. 3º, IV) cita barreiras urbanísticas, arquitetônicas, nos transportes, nas comunicações e na informação, atitudinais e tecnológicas. Na escola, a mais frequente e a mais difícil de ver é a atitudinal: a baixa expectativa, o "ele não vai conseguir".', m: 'A barreira atitudinal começa na expectativa do adulto.' },
    { t: 'Capacitismo', x: 'Capacitismo é o preconceito contra pessoas com deficiência, que as trata como menos capazes. Aparece em frases como "nem parece autista" ou "coitado, não precisa fazer a prova". Elogiar a pessoa por ser "quase normal" também é capacitismo.', m: 'Baixa expectativa também é discriminação.' },
    { t: 'Diferença não é ausência de apoio', x: 'Valorizar a neurodiversidade não significa negar as dificuldades. Um aluno autista pode precisar de muito apoio para lidar com barulho, e isso é real. O paradigma muda a pergunta: em vez de "o que falta nele?", a escola pergunta "que apoio e que ajustes permitem que ele aprenda?".', m: 'Reconhecer forças e oferecer apoios: as duas coisas juntas.' },
    { t: 'Exclusão, segregação, integração e inclusão', x: 'Na exclusão, o aluno fica fora da escola. Na segregação, estuda em espaços separados. Na integração, entra na sala comum mas precisa se adaptar sozinho. Na inclusão, a escola se transforma para que todos aprendam juntos.', m: 'Integração: o aluno se adapta. Inclusão: a escola se transforma.' },
    { t: 'Linha do tempo legal', x: 'Constituição de 1988 (art. 208, III: atendimento educacional especializado, preferencialmente na rede regular). Declaração de Salamanca (1994). LDB (1996). Política Nacional de Educação Especial na Perspectiva da Educação Inclusiva (2008). Convenção da ONU, com força de emenda constitucional (Decreto nº 6.949/2009). Lei nº 12.764/2012 (TEA). LBI (2015). Lei nº 14.254/2021 (dislexia, TDAH e outros transtornos de aprendizagem).', m: 'De 1988 a 2021: o direito saiu do "preferencialmente" para o sistema educacional inclusivo.' }
  ],
  leitura: {
    titulo: 'Da sala especial à sala de todos',
    partes: [
      { p: 'Por que a escola levou tanto tempo para mudar?', x: 'Durante boa parte do século XX, estudantes com deficiência eram encaminhados para classes e escolas especiais. A lógica era proteger e tratar. O resultado, porém, foi o afastamento do convívio com os colegas e expectativas de aprendizagem muito baixas. A partir dos anos 1990, documentos como a Declaração de Salamanca afirmaram que as escolas regulares com orientação inclusiva são o meio mais eficaz de combater atitudes discriminatórias.' },
      { p: 'O que muda quando a pergunta muda?', x: 'Quando o professor pergunta "qual é o diagnóstico?", a resposta costuma encerrar a conversa. Quando pergunta "o que este aluno já sabe, do que gosta, o que o desorganiza e que apoio funciona?", abre-se um plano de trabalho. O diagnóstico ajuda a entender, mas é a observação pedagógica que orienta a aula.' },
      { p: 'Inclusão é só para quem tem laudo?', x: 'Não. Uma aula planejada com variedade de caminhos (falar, desenhar, montar, escrever) beneficia o aluno autista, o aluno com dislexia, o aluno que chegou de outra cidade e o aluno que simplesmente aprende de outro jeito. Inclusão é um princípio da escola inteira, não um atendimento para poucos.' },
      { p: 'Para refletir', x: 'Pense em um aluno que você já teve e que "não se encaixava". O que ele fazia bem? Que barreira da escola (barulho, tempo, forma de avaliar, olhar dos colegas) mais atrapalhava? O que teria mudado se a escola tivesse ajustado essa barreira?' }
    ]
  },
  atividades: [
    { tipo: 'q', e: 'De acordo com a Lei Brasileira de Inclusão (Lei nº 13.146/2015), a deficiência deve ser compreendida como:', o: ['uma doença que precisa ser tratada antes da matrícula escolar.', 'um impedimento de longo prazo que, em interação com uma ou mais barreiras, pode obstruir a participação plena e efetiva da pessoa na sociedade.', 'uma condição individual que dispensa adaptações do ambiente.', 'uma incapacidade permanente de aprender os conteúdos do currículo comum.'], a: 1, r: 'A LBI adota o modelo social (biopsicossocial): a deficiência resulta da interação entre o impedimento e as barreiras. Por isso, retirar barreiras é responsabilidade de todos, inclusive da escola.', m: 'Impedimento + barreira = deficiência (LBI, art. 2º).' },
    { tipo: 'assoc', e: 'Associe cada termo à sua descrição.', pares: [['Exclusão', 'O estudante fica fora da escola.'], ['Segregação', 'O estudante estuda em classes ou escolas separadas.'], ['Integração', 'O estudante está na sala comum, mas precisa se adaptar sozinho.'], ['Inclusão', 'A escola se transforma para que todos aprendam juntos.']], r: 'A diferença central entre integração e inclusão é quem muda: na integração, o aluno; na inclusão, a escola.', m: 'Integração: o aluno se adapta. Inclusão: a escola se transforma.' },
    { tipo: 'ordem', e: 'Coloque os marcos em ordem cronológica, do mais antigo ao mais recente.', itens: ['Constituição Federal', 'Declaração de Salamanca', 'Política Nacional de Educação Especial na Perspectiva da Educação Inclusiva', 'Lei nº 12.764 (direitos da pessoa com TEA)', 'Lei Brasileira de Inclusão', 'Lei nº 14.254 (dislexia e TDAH)'], anos: ['1988', '1994', '2008', '2012', '2015', '2021'], r: 'Constituição (1988), Salamanca (1994), Política Nacional (2008), Lei Berenice Piana (2012), LBI (2015) e Lei nº 14.254 (2021).', m: '88, 94, 2008, 2012, 2015, 2021.' },
    { tipo: 'caso', e: 'Na reunião pedagógica, uma colega diz: "O Pedro tem autismo. Ele é aluno do AEE, não da minha turma. Eu só cuido para ele não atrapalhar os outros." Qual é a resposta mais adequada, de acordo com a perspectiva inclusiva?', o: ['Concordar, porque a responsabilidade pedagógica do aluno com TEA é do professor do AEE.', 'Sugerir que o Pedro estude em horário reduzido até ter laudo atualizado.', 'Lembrar que o Pedro é aluno da turma e do professor regente; o AEE complementa, não substitui a sala comum, e os dois professores devem planejar juntos.', 'Propor que o Pedro faça as atividades no pátio, com o profissional de apoio, para não atrapalhar a aula.'], a: 2, fb: ['O AEE é complementar ou suplementar à sala comum. A aprendizagem do currículo continua sendo responsabilidade do professor da turma.', 'Reduzir horário sem necessidade comprovada e por decisão pedagógica conjunta é uma forma de exclusão, e laudo não é condição para o atendimento.', 'Correto. O aluno é da turma. O professor do AEE apoia com recursos e estratégias, em trabalho colaborativo com o regente.', 'Retirar o aluno da sala para "não atrapalhar" é segregação e transfere ao profissional de apoio uma função pedagógica que não é dele.'], m: 'O AEE complementa a sala comum; nunca a substitui.' },
    { tipo: 'pratica', e: 'Mapeie as barreiras da sua escola', x: 'Pense na sua escola ou em uma escola que você conhece. Marque as barreiras que já observou e descreva, em poucas linhas, uma delas e um ajuste simples que poderia diminuí-la.', check: ['Barulho ou excesso de estímulos nas salas e no pátio', 'Instruções longas, só faladas ou só escritas', 'Provas com tempo e formato únicos para todos', 'Comentários e expectativas baixas sobre alguns alunos', 'Falta de recursos visuais (rotina, imagens, esquemas)', 'Espaços sem acessibilidade física'], min: 120, dica: 'Exemplo: "No pátio, o sinal é muito alto e o Lucas tapa os ouvidos e chora. Ajuste: avisar o horário do sinal com antecedência e oferecer abafador na saída."' }
  ],
  quiz: [
    { e: 'O termo neurodiversidade refere-se:', o: ['a um diagnóstico médico que reúne autismo e TDAH.', 'à variação natural do funcionamento neurológico entre as pessoas.', 'a um método de ensino para alunos com deficiência.', 'à lista de transtornos que dão direito ao AEE.'], a: 1, r: 'Neurodiversidade descreve a variação humana. Não é diagnóstico nem método.' },
    { e: 'Uma professora afirma que "na inclusão, o aluno precisa se esforçar para acompanhar a turma do jeito que a aula já é". Essa ideia descreve, na verdade:', o: ['a inclusão.', 'a integração.', 'o ensino colaborativo.', 'o Desenho Universal para a Aprendizagem.'], a: 1, r: 'Quando apenas o aluno precisa se adaptar, trata-se de integração. A inclusão exige mudança da escola.' },
    { e: 'Dizer a uma mãe que o filho autista "nem parece autista, de tão inteligente" é um exemplo de:', o: ['elogio adequado.', 'capacitismo.', 'barreira arquitetônica.', 'adaptação curricular.'], a: 1, r: 'A frase parte da ideia de que ser autista é ser menos capaz. É uma forma sutil de capacitismo.' },
    { e: 'Segundo a LBI, a barreira que corresponde a atitudes ou comportamentos que impedem ou prejudicam a participação da pessoa com deficiência é a barreira:', o: ['tecnológica.', 'arquitetônica.', 'atitudinal.', 'urbanística.'], a: 2, r: 'Barreiras atitudinais são atitudes e comportamentos. Na escola, incluem a baixa expectativa e a exclusão disfarçada.' },
    { e: 'A Constituição Federal de 1988 garante o atendimento educacional especializado aos educandos com deficiência:', o: ['exclusivamente em escolas especiais.', 'preferencialmente na rede regular de ensino.', 'somente após laudo médico.', 'apenas na educação infantil.'], a: 1, r: 'Art. 208, III: atendimento educacional especializado aos portadores de deficiência, preferencialmente na rede regular de ensino (expressão da época).' }
  ]
});
CURSO.ap.m1 = {
  intro: 'Este capítulo apresenta a origem do conceito de neurodiversidade, discute a passagem do modelo médico para o modelo social da deficiência e situa a educação inclusiva no quadro normativo brasileiro.',
  secoes: [
    { t: '1.1 A origem do conceito de neurodiversidade', p: [
      'O termo neurodiversidade foi difundido no final da década de 1990 pela socióloga australiana Judy Singer, que, em seu trabalho de conclusão de curso e em capítulo publicado na coletânea organizada por Corker e French, propôs compreender as diferenças neurológicas como parte da diversidade humana, à semelhança da biodiversidade nos ecossistemas (Singer, 1999). Para a autora, pessoas autistas e outras pessoas com funcionamento neurológico atípico constituem uma minoria que reivindica reconhecimento, e não apenas tratamento (Singer, 2017).',
      'Armstrong (2012) levou o conceito para a sala de aula ao defender uma pedagogia baseada em forças: em vez de partir do déficit, o professor identifica as potencialidades do aluno neurodivergente e constrói, a partir delas, um "nicho positivo" de aprendizagem, isto é, um conjunto de ajustes no ambiente, nas estratégias e nas relações que permite ao estudante participar e aprender.',
      'É importante distinguir os termos. Neurodiversidade descreve a variação presente em qualquer grupo humano; neurodivergente designa a pessoa cujo funcionamento se afasta do padrão considerado típico; neurotípico refere-se a quem se aproxima desse padrão. Assim, uma turma é neurodiversa, enquanto um aluno pode ser neurodivergente.'
    ], av: { e: 'De acordo com o texto, a expressão correta é:', o: ['"Aquele aluno é neurodiverso."', '"Minha turma é neurodiversa e tem alunos neurodivergentes."', '"Neurodiversidade é o nome do diagnóstico de autismo."', '"Neurotípico é o aluno que tem dislexia."'], a: 1, r: 'Neurodiversidade é característica do grupo; neurodivergente é a pessoa cujo funcionamento difere do típico (Singer, 1999; Armstrong, 2012).' } },
    { t: '1.2 Do modelo médico ao modelo social da deficiência', p: [
      'No modelo médico, a deficiência é entendida como um problema localizado no corpo do indivíduo, que deve ser diagnosticado, tratado e, se possível, corrigido. Na escola, essa perspectiva produziu classes especiais e a expectativa de que o aluno se "normalizasse" para ser aceito.',
      'O modelo social, formulado a partir dos movimentos de pessoas com deficiência no Reino Unido nos anos 1970, inverteu a pergunta: a deficiência passa a ser compreendida como resultado da relação entre o corpo com impedimentos e uma sociedade que impõe barreiras (Diniz, 2007). Para Diniz (2007), essa mudança retirou a deficiência do campo exclusivo da medicina e a inseriu no campo dos direitos humanos e da justiça social.',
      'A Lei Brasileira de Inclusão adota essa compreensão ao definir:',
      '>>Considera-se pessoa com deficiência aquela que tem impedimento de longo prazo de natureza física, mental, intelectual ou sensorial, o qual, em interação com uma ou mais barreiras, pode obstruir sua participação plena e efetiva na sociedade em igualdade de condições com as demais pessoas (Brasil, 2015, art. 2º).',
      'A mesma lei classifica as barreiras em urbanísticas, arquitetônicas, nos transportes, nas comunicações e na informação, atitudinais e tecnológicas (Brasil, 2015, art. 3º, IV).',
      'Muito antes desse debate, Vigotski já afirmava que o desenvolvimento da criança com deficiência depende sobretudo das condições sociais que lhe são oferecidas: as consequências sociais do "defeito" pesam mais do que o próprio defeito, e a educação deve criar caminhos alternativos de desenvolvimento (Vigotski, 1997).'
    ], av: { e: 'Segundo o modelo social, adotado pela LBI, a deficiência:', o: ['é uma doença que deve ser curada antes da escolarização.', 'resulta da interação entre impedimentos de longo prazo e barreiras presentes na sociedade.', 'depende apenas das características biológicas da pessoa.', 'é responsabilidade exclusiva da área da saúde.'], a: 1, r: 'Diniz (2007) e o art. 2º da LBI (Brasil, 2015) definem a deficiência como resultado da interação entre impedimentos e barreiras.' } },
    { t: '1.3 Exclusão, segregação, integração e inclusão', p: [
      'Sassaki (1997) descreve a história do atendimento às pessoas com deficiência em fases: a exclusão, em que elas eram mantidas fora da escola; a segregação, com instituições e classes separadas; a integração, em que o aluno era inserido na escola comum desde que se adaptasse a ela; e a inclusão, em que a própria escola e a sociedade se modificam para acolher todas as pessoas.',
      'Mantoan (2003) reforça que a inclusão não é a soma de adaptações para alguns alunos, mas uma reorganização da escola como um todo, que questiona a homogeneidade das turmas, os currículos rígidos e as avaliações classificatórias. Para a autora, a escola inclusiva reconhece e valoriza as diferenças e não exige que o aluno se ajuste a um padrão.',
      'Mittler (2003) acrescenta que a inclusão envolve uma reforma do sistema educacional, das práticas pedagógicas e das atitudes, e que não se limita aos alunos com deficiência: diz respeito a todos os estudantes que correm risco de exclusão, por razões sociais, culturais ou de aprendizagem.'
    ], av: { e: 'Para Sassaki (1997) e Mantoan (2003), a principal diferença entre integração e inclusão é que:', o: ['na integração, a escola se transforma; na inclusão, o aluno se adapta.', 'na integração, o aluno precisa se adaptar à escola; na inclusão, a escola se reorganiza para atender a todos.', 'as duas palavras são sinônimas.', 'a inclusão só vale para alunos com laudo.'], a: 1, r: 'Na integração, o esforço de adaptação recai sobre o aluno; na inclusão, a escola se modifica (Sassaki, 1997; Mantoan, 2003).' } },
    { t: '1.4 O marco normativo brasileiro', p: [
      'A Constituição Federal garante o atendimento educacional especializado aos educandos com deficiência, preferencialmente na rede regular de ensino (Brasil, 1988, art. 208, III). Em 1994, a Declaração de Salamanca afirmou que as escolas regulares com orientação inclusiva constituem o meio mais eficaz de combater atitudes discriminatórias (UNESCO, 1994).',
      'A Política Nacional de Educação Especial na Perspectiva da Educação Inclusiva definiu o público-alvo da educação especial (alunos com deficiência, transtornos globais do desenvolvimento e altas habilidades/superdotação) e o caráter complementar ou suplementar do atendimento educacional especializado (Brasil, 2008). A Convenção sobre os Direitos das Pessoas com Deficiência foi aprovada pelo Congresso Nacional pelo rito do art. 5º, § 3º, da Constituição, o que lhe conferiu equivalência de emenda constitucional, e promulgada pelo Decreto nº 6.949/2009 (Brasil, 2009).',

CURSO.ap.m2 = {
  intro: 'Este capítulo reúne contribuições da neurociência cognitiva para a compreensão de como o cérebro aprende, com atenção especial às funções executivas, à memória e às emoções, e discute o cuidado necessário para não transformar a ciência em mito.',
  secoes: [
    { t: '2.1 O cérebro que aprende: plasticidade e atenção', p: [
      'Cosenza e Guerra (2011) explicam que a aprendizagem corresponde, no plano biológico, à formação e à consolidação de ligações entre neurônios. Essa capacidade do sistema nervoso de se modificar a partir da experiência é chamada de plasticidade. Ela é especialmente intensa na infância, mas persiste ao longo da vida, o que confere à escola um papel decisivo: as experiências que o professor organiza literalmente modificam o cérebro dos alunos.',
      'Os mesmos autores destacam que a atenção é a porta de entrada da aprendizagem. O cérebro recebe uma quantidade enorme de estímulos e seleciona apenas uma parte deles; aquilo que não recebe atenção dificilmente será registrado. Por isso, aulas com estímulos competindo entre si, instruções longas e ambientes ruidosos dificultam a aprendizagem de toda a turma, e de modo mais intenso a de alunos com TDAH ou com sensibilidade sensorial (Cosenza; Guerra, 2011).',
      'Dehaene (2022) identifica quatro pilares da aprendizagem: a atenção, o engajamento ativo, o retorno sobre o erro (feedback) e a consolidação. Para o autor, um aluno passivo aprende pouco; o cérebro aprende quando formula hipóteses, testa respostas e recebe informação sobre seus acertos e erros.'
    ], av: { e: 'Segundo Dehaene (2022), os quatro pilares da aprendizagem são:', o: ['visão, audição, tato e movimento.', 'atenção, engajamento ativo, retorno sobre o erro e consolidação.', 'memória, inteligência, motivação e disciplina.', 'leitura, escrita, cálculo e oralidade.'], a: 1, r: 'Dehaene (2022) aponta atenção, engajamento ativo, feedback (retorno sobre o erro) e consolidação.' } },
    { t: '2.2 Funções executivas', p: [
      'Diamond (2013) define as funções executivas como um conjunto de processos mentais necessários quando precisamos nos concentrar e agir de modo planejado, em vez de seguir o impulso ou o automatismo. A autora identifica três funções nucleares: a memória de trabalho, que mantém e manipula informações por curto período; o controle inibitório, que permite resistir a impulsos e distrações; e a flexibilidade cognitiva, que permite mudar de perspectiva ou de estratégia. A partir delas se constroem funções mais complexas, como o raciocínio, a resolução de problemas e o planejamento.',
      'Barkley (2008) relaciona as dificuldades características do TDAH a um prejuízo na autorregulação e no controle inibitório, o que afeta a organização do tempo, a persistência nas tarefas e a capacidade de seguir regras. Essa compreensão desloca a leitura do comportamento: não se trata de falta de vontade, mas de uma dificuldade no sistema que regula a ação.',
      'Na prática, a memória de trabalho tem capacidade limitada. Instruções com muitos passos, apresentadas apenas oralmente, podem ultrapassar esse limite. Dividir tarefas em etapas, deixar as instruções visíveis e oferecer listas de verificação são formas de apoiar externamente as funções executivas (Diamond, 2013; Cosenza; Guerra, 2011).'
    ], av: { e: 'Segundo Diamond (2013), as três funções executivas nucleares são:', o: ['atenção, percepção e linguagem.', 'memória de trabalho, controle inibitório e flexibilidade cognitiva.', 'planejamento, raciocínio e criatividade.', 'leitura, escrita e cálculo.'], a: 1, r: 'Diamond (2013) descreve memória de trabalho, controle inibitório e flexibilidade cognitiva como funções nucleares; o planejamento e o raciocínio derivam delas.' } },
    { t: '2.3 Emoção, memória e estratégias de estudo', p: [
      'Cosenza e Guerra (2011) mostram que emoção e cognição não funcionam separadamente. Situações emocionalmente significativas tendem a ser mais bem lembradas, enquanto o estresse intenso e prolongado prejudica a atenção e a memória. Um ambiente em que o aluno se sente seguro para errar favorece o engajamento; um ambiente de exposição e humilhação leva o estudante a evitar tentar.',
      'A pesquisa em psicologia cognitiva avaliou a eficácia de diferentes técnicas de estudo. Dunlosky et al. (2013) concluíram que duas técnicas têm alta utilidade: a prática de testagem (recuperar a informação respondendo perguntas, explicando ou resolvendo problemas) e a prática distribuída (retomar o conteúdo em sessões espaçadas no tempo). Técnicas muito populares, como reler e grifar, mostraram baixa utilidade.',
      'Essas evidências justificam aulas que retomam conteúdos anteriores com perguntas rápidas, sem caráter punitivo, e atividades que pedem ao aluno para explicar com as próprias palavras. Para alunos neurodivergentes, a repetição espaçada e a previsibilidade da retomada costumam ser especialmente úteis.'
    ], av: { e: 'De acordo com Dunlosky et al. (2013), quais técnicas de estudo apresentam alta utilidade?', o: ['Reler e grifar o texto.', 'Prática de testagem (recuperação) e prática distribuída (espaçada).', 'Resumir e copiar o conteúdo.', 'Estudar tudo de uma vez na véspera.'], a: 1, r: 'Dunlosky et al. (2013) classificaram a testagem e a prática distribuída como de alta utilidade; reler e grifar tiveram baixa utilidade.' } },
    { t: '2.4 Neuromitos: quando a ciência vira crença', p: [
      'Howard-Jones (2014) chama de neuromitos as crenças equivocadas sobre o cérebro que circulam na educação. Entre as mais difundidas estão a ideia de que usamos apenas 10% do cérebro, a de que existem pessoas de "hemisfério esquerdo" e de "hemisfério direito" e a de que os alunos aprendem melhor quando recebem a informação em seu estilo de aprendizagem preferido (visual, auditivo ou cinestésico).',
      'Pashler et al. (2008) revisaram os estudos sobre estilos de aprendizagem e não encontraram evidência adequada de que ajustar o ensino ao estilo declarado do aluno melhore os resultados. Isso não significa que variar as linguagens seja inútil: apresentar o conteúdo por texto, imagem, objeto e fala é benéfico para todos, porque oferece mais caminhos de acesso, e não porque cada aluno tenha um estilo fixo.',
      'Cosenza e Guerra (2011) lembram que a neurociência não oferece receitas prontas para a sala de aula. Ela ajuda a compreender por que certas estratégias funcionam, mas a transposição para o ensino é tarefa da pedagogia e do professor, que conhece seus alunos e seu contexto.'
    ], av: { e: 'Segundo Pashler et al. (2008), a ideia de ensinar cada aluno apenas pelo seu estilo de aprendizagem:', o: ['é comprovada por muitos estudos.', 'não tem evidência adequada de que melhore a aprendizagem.', 'só funciona com alunos cinestésicos.', 'é obrigatória pela BNCC.'], a: 1, r: 'A revisão de Pashler et al. (2008) não encontrou evidência adequada para a hipótese dos estilos; variar linguagens é bom para todos por outros motivos.' } }

  objetivo: 'Compreender as características do Transtorno do Espectro Autista, os direitos garantidos em lei e as estratégias de comunicação, previsibilidade e regulação sensorial em sala de aula.',
  cartoes: [
    { t: 'O que é o TEA', x: 'O Transtorno do Espectro Autista é uma condição do neurodesenvolvimento. Pelo DSM-5-TR, envolve dois grupos de características: dificuldades persistentes na comunicação e na interação social, e padrões restritos e repetitivos de comportamento, interesses ou atividades, o que inclui reações sensoriais aumentadas ou diminuídas.', m: 'TEA: comunicação e interação social + padrões restritos e repetitivos.' },
    { t: 'Por que "espectro"', x: 'As manifestações variam muito: há autistas que falam com fluência e autistas não falantes; uns precisam de pouco apoio, outros de apoio constante. O DSM-5-TR descreve três níveis de suporte: nível 1 (exige apoio), nível 2 (apoio substancial) e nível 3 (apoio muito substancial).', m: 'Se você conheceu um autista, conheceu um autista.' },
    { t: 'Direitos: Lei nº 12.764/2012', x: 'A Lei Berenice Piana institui a Política Nacional de Proteção dos Direitos da Pessoa com TEA e determina que ela é considerada pessoa com deficiência para todos os efeitos legais. Em caso de comprovada necessidade, o aluno incluído na classe comum tem direito a acompanhante especializado. O gestor que recusar a matrícula pode ser multado.', m: 'Pessoa com TEA é pessoa com deficiência para todos os efeitos legais.' },
    { t: 'CIPTEA', x: 'A Lei nº 13.977/2020 (Lei Romeo Mion) criou a Carteira de Identificação da Pessoa com TEA, que facilita o acesso a atendimento prioritário. A carteira não é exigência para matrícula nem para apoio pedagógico.', m: 'CIPTEA identifica; não é requisito para a escola atender.' },
    { t: 'O corpo sente diferente', x: 'Muitos autistas percebem sons, luzes, cheiros e toques com mais (ou menos) intensidade. O sinal da escola, o refeitório cheio ou a etiqueta da camiseta podem ser insuportáveis. Abafadores de ruído, um canto mais calmo e aviso antes de barulhos previstos reduzem crises.', m: 'Muitas "birras" são sobrecarga sensorial.' },
    { t: 'Comunicação clara', x: 'Use frases curtas e diretas, diga o que fazer (e não só o que não fazer) e evite ironias e expressões figuradas sem explicação: "estou morrendo de fome" pode ser entendido ao pé da letra. Dê tempo para a resposta antes de repetir.', m: 'Diga o que é para fazer, de forma literal e curta.' },
    { t: 'Comunicação Alternativa', x: 'A Comunicação Aumentativa e Alternativa (CAA) usa cartões com figuras, pranchas, tablets e gestos para ampliar ou substituir a fala. Usar CAA não atrasa a fala; pelo contrário, oferece um caminho de comunicação e reduz frustração.', m: 'CAA dá voz; não atrapalha a fala.' },
    { t: 'Rotina e previsibilidade', x: 'Saber o que vai acontecer traz segurança. Uma agenda visual com as etapas do dia e o aviso antecipado de mudanças ("hoje não teremos educação física, teremos teatro") evitam desorganização. Quando a mudança for inevitável, mostre-a na agenda.', m: 'Antecipar a mudança evita a crise.' },
    { t: 'Estereotipias e hiperfoco', x: 'Balançar o corpo, mexer as mãos ou repetir sons (estereotipias) costumam ajudar a pessoa a se regular e não devem ser reprimidos sem motivo. O hiperfoco, interesse intenso por um tema, pode ser uma porta de entrada: dinossauros podem ensinar leitura, medidas e ciências.', m: 'Use o interesse do aluno como ponte para o currículo.' },
    { t: 'Crise não é birra', x: 'Na crise (meltdown), a pessoa perde o controle por sobrecarga; não é manipulação. Não é momento de dar lição de moral nem de castigar. O adulto reduz estímulos, garante segurança, fala pouco e espera a regulação. A conversa vem depois, com calma.', m: 'Na crise: menos estímulo, menos palavras, mais segurança.' }
  ],
  leitura: {
    titulo: 'Um dia na escola pelos olhos da Ana',
    partes: [
      { p: 'O que a Ana sente ao chegar?', x: 'Ana tem 7 anos e é autista, nível 1 de suporte. Ao entrar na escola, o portão barulhento, as vozes misturadas e o cheiro forte do refeitório chegam todos ao mesmo tempo. Ela tapa os ouvidos e anda colada à parede. Não é timidez nem má vontade: é muita informação sensorial de uma vez.' },
      { p: 'O que ajuda a Ana na sala?', x: 'A professora deixa a agenda do dia no quadro com figuras. Ana confere a agenda várias vezes e fica mais tranquila. Quando há mudança, a professora avisa no começo do dia e troca a figura. Ana senta longe da porta e pode usar o abafador quando a turma fica agitada.' },
      { p: 'E no recreio?', x: 'O recreio é o momento mais difícil. A professora combinou com a Ana uma alternativa: em alguns dias, ela pode ficar na biblioteca com duas colegas, jogando um jogo de tabuleiro com regras claras. Aos poucos, Ana passou a pedir para ir ao pátio em dias mais calmos.' },
      { p: 'Para refletir', x: 'Quais momentos da rotina da sua escola são mais difíceis para um aluno com sensibilidade sensorial? Que ajuste simples poderia ser feito sem mudar a rotina da turma toda?' }
    ]
  },
  atividades: [
    { tipo: 'q', e: 'De acordo com a Lei nº 12.764/2012, a pessoa com Transtorno do Espectro Autista:', o: ['só tem direitos educacionais após receber a CIPTEA.', 'é considerada pessoa com deficiência para todos os efeitos legais.', 'deve ser matriculada preferencialmente em escola especial.', 'tem direito a acompanhante especializado em todos os casos, independentemente da necessidade.'], a: 1, r: 'O art. 1º, § 2º, da lei estabelece que a pessoa com TEA é considerada pessoa com deficiência para todos os efeitos legais. O acompanhante especializado é garantido em caso de comprovada necessidade.', m: 'TEA = deficiência para todos os efeitos legais (Lei nº 12.764/2012).' },
    { tipo: 'assoc', e: 'Associe cada necessidade a uma estratégia adequada.', pares: [['Sensibilidade a sons altos', 'Abafador de ruído e aviso antes do sinal.'], ['Insegurança com mudanças', 'Agenda visual e antecipação das mudanças.'], ['Pouca ou nenhuma fala', 'Comunicação Aumentativa e Alternativa (pranchas e cartões).'], ['Entendimento literal da linguagem', 'Frases curtas e diretas, explicando expressões figuradas.'], ['Interesse intenso por um tema', 'Usar o tema como ponte para os conteúdos.']], r: 'Cada estratégia responde a uma característica, e não ao rótulo. Por isso, a observação do aluno vem antes da escolha da estratégia.', m: 'Estratégia certa nasce da observação do aluno, não do rótulo.' },
    { tipo: 'ordem', e: 'Ordene as ações do professor diante de uma crise de desregulação.', itens: ['Perceber os sinais de sobrecarga (tapar ouvidos, agitação crescente)', 'Reduzir estímulos (luz, barulho, plateia)', 'Garantir a segurança do aluno e dos colegas', 'Esperar a regulação falando pouco e com calma', 'Conversar sobre o ocorrido depois, quando o aluno estiver calmo', 'Registrar o episódio e rever os gatilhos com a equipe'], r: 'O ideal é agir cedo, nos sinais. Durante a crise, o foco é segurança e redução de estímulos. A conversa e o registro vêm depois, para prevenir novas crises.', m: 'Perceber, reduzir, proteger, esperar, conversar depois e registrar.' },
    { tipo: 'caso', e: 'O passeio ao museu foi cancelado por causa da chuva. Ao saber da notícia no momento da saída, João, aluno autista, começa a gritar e a se jogar no chão. Qual é a conduta mais adequada?', o: ['Explicar com firmeza que ele precisa se comportar e que vai perder o recreio se continuar.', 'Ignorar completamente até ele parar sozinho, mantendo a turma ao redor.', 'Levar a turma para outra atividade, reduzir estímulos perto de João, garantir sua segurança com poucas palavras e, depois, mostrar na agenda o que vai acontecer agora; em próximas mudanças, avisar com antecedência.', 'Chamar a família para buscá-lo imediatamente, pois a escola não está preparada.'], a: 2, fb: ['Castigo e sermão não ajudam durante a crise: o aluno está sem condições de processar a fala e a punição aumenta a ansiedade.', 'Deixar a plateia ao redor mantém os estímulos e expõe o aluno. Esperar é parte da conduta, mas com redução de estímulos e segurança.', 'Correto. Segurança, menos estímulos, poucas palavras e uma nova previsibilidade (agenda). A prevenção vem de antecipar mudanças.', 'Mandar o aluno para casa a cada crise é exclusão e não ensina a escola a lidar com a situação.'], m: 'Mudança inesperada + plateia = crise. Antecipe e reduza.' },
    { tipo: 'pratica', e: 'Monte uma agenda visual', x: 'Escreva a agenda visual de um dia da sua turma (ou de uma turma imaginária), com 5 a 8 etapas. Para cada etapa, indique a figura que usaria. Diga também como avisaria uma mudança.', check: ['Listei as etapas na ordem em que acontecem', 'Cada etapa tem uma figura simples', 'Previ como sinalizar uma mudança (ex.: figura com X)', 'Pensei onde a agenda ficará visível para o aluno'], min: 120, dica: 'Exemplo: "1. Entrada (mochila). 2. Roda de conversa (círculo de crianças). 3. Leitura (livro). 4. Lanche (prato). 5. Parque (escorregador). 6. Arte (pincel). 7. Saída (porta). Mudança: cubro a figura com um X vermelho e coloco a nova ao lado."' }
  ],
  quiz: [
    { e: 'Pelo DSM-5-TR, o diagnóstico de TEA considera dois grupos de características:', o: ['desatenção e hiperatividade.', 'dificuldades na comunicação e interação social e padrões restritos e repetitivos de comportamento, interesses ou atividades.', 'dificuldades de leitura e de escrita.', 'deficiência intelectual e deficiência motora.'], a: 1, r: 'São os dois domínios centrais do TEA. As alterações sensoriais estão dentro dos padrões restritos e repetitivos.' },
    { e: 'A carteira de identificação da pessoa com TEA (CIPTEA) foi criada pela:', o: ['Lei nº 13.977/2020.', 'Lei nº 14.254/2021.', 'LDB.', 'Lei nº 13.185/2015.'], a: 0, r: 'A Lei Romeo Mion (nº 13.977/2020) alterou a Lei nº 12.764/2012 para criar a CIPTEA.' },
    { e: 'Sobre a Comunicação Aumentativa e Alternativa (CAA), é correto afirmar:', o: ['deve ser evitada, pois impede o desenvolvimento da fala.', 'só pode ser usada por fonoaudiólogos.', 'amplia ou substitui a fala e pode ser usada em sala pelo professor.', 'é indicada apenas para adultos.'], a: 2, r: 'A CAA amplia as possibilidades de comunicação, reduz a frustração e pode ser usada por toda a equipe escolar.' },
    { e: 'Um aluno autista balança o corpo enquanto ouve a história. A atitude mais adequada do professor é:', o: ['pedir que pare imediatamente.', 'avaliar se o movimento atrapalha alguém; se não atrapalha, permitir, pois pode ajudar na autorregulação.', 'retirá-lo da roda.', 'chamar a coordenação.'], a: 1, r: 'Estereotipias muitas vezes ajudam na regulação. Só se intervém quando há risco ou prejuízo real, oferecendo uma alternativa.' },
    { e: 'Segundo a Lei nº 12.764/2012, o acompanhante especializado em classe comum é garantido:', o: ['a todo aluno com TEA, automaticamente.', 'em casos de comprovada necessidade.', 'somente na educação infantil.', 'somente com laudo de nível 3.'], a: 1, r: 'O parágrafo único do art. 3º garante o acompanhante especializado em casos de comprovada necessidade.' }
  ]
});
CURSO.ap.m3 = {
  intro: 'Este capítulo apresenta a evolução histórica do conceito de autismo, os critérios diagnósticos atuais, os direitos assegurados pela legislação brasileira e as principais estratégias pedagógicas para a inclusão de estudantes autistas.',
  secoes: [
    { t: '3.1 Do autismo de Kanner ao espectro', p: [
      'Em 1943, o psiquiatra Leo Kanner descreveu onze crianças que apresentavam, desde muito cedo, dificuldade de estabelecer contato afetivo com as pessoas, apego intenso à rotina e uso peculiar da linguagem (Kanner, 1943). Durante décadas, o autismo foi entendido como uma condição rara e relativamente homogênea.',
      'A compreensão atual é muito mais ampla. O Manual Diagnóstico e Estatístico de Transtornos Mentais, em sua versão revisada, reúne essas manifestações sob o nome de transtorno do espectro autista (TEA), caracterizado por déficits persistentes na comunicação e na interação social em múltiplos contextos e por padrões restritos e repetitivos de comportamento, interesses ou atividades, o que inclui hiper ou hiporreatividade a estímulos sensoriais (American Psychiatric Association, 2023). O manual descreve três níveis de suporte: nível 1, "exigindo apoio"; nível 2, "exigindo apoio substancial"; e nível 3, "exigindo apoio muito substancial".',
      'Grandin e Panek (2015), ao discutir o cérebro autista a partir da experiência da própria Temple Grandin, mulher autista e pesquisadora, chamam atenção para a enorme variação dentro do espectro e para a importância de reconhecer as diferentes formas de pensar, como o pensamento por imagens, por padrões ou por palavras, em vez de enxergar apenas déficits.'
    ], av: { e: 'Segundo o DSM-5-TR (American Psychiatric Association, 2023), o TEA caracteriza-se por:', o: ['desatenção e hiperatividade antes dos 12 anos.', 'déficits persistentes na comunicação e interação social e padrões restritos e repetitivos de comportamento, interesses ou atividades.', 'dificuldade específica de leitura.', 'deficiência intelectual em todos os casos.'], a: 1, r: 'Os dois domínios do TEA no DSM-5-TR são comunicação/interação social e padrões restritos e repetitivos, que incluem as alterações sensoriais.' } },
    { t: '3.2 Direitos da pessoa com TEA', p: [
      'A Lei nº 12.764/2012, conhecida como Lei Berenice Piana, instituiu a Política Nacional de Proteção dos Direitos da Pessoa com Transtorno do Espectro Autista e estabeleceu que "a pessoa com transtorno do espectro autista é considerada pessoa com deficiência, para todos os efeitos legais" (Brasil, 2012, art. 1º, § 2º). Com isso, os estudantes autistas passaram a ter assegurados todos os direitos previstos para as pessoas com deficiência, inclusive o atendimento educacional especializado.',
      'A mesma lei garante que, em casos de comprovada necessidade, a pessoa com TEA incluída nas classes comuns de ensino regular terá direito a acompanhante especializado (Brasil, 2012, art. 3º, parágrafo único), e prevê multa de 3 a 20 salários-mínimos ao gestor escolar ou à autoridade competente que recusar a matrícula de aluno com TEA (Brasil, 2012, art. 7º).',
      'Posteriormente, a Lei nº 13.977/2020, chamada Lei Romeo Mion, criou a Carteira de Identificação da Pessoa com Transtorno do Espectro Autista (CIPTEA), destinada a garantir atenção integral, pronto atendimento e prioridade no acesso aos serviços (Brasil, 2020). A carteira não é requisito para a matrícula nem para o apoio pedagógico.'
    ], av: { e: 'Segundo a Lei nº 12.764/2012, o acompanhante especializado em classe comum é assegurado:', o: ['a todos os alunos com TEA, automaticamente.', 'em casos de comprovada necessidade.', 'somente a quem possui a CIPTEA.', 'apenas na educação infantil.'], a: 1, r: 'O art. 3º, parágrafo único, da Lei nº 12.764/2012 garante o acompanhante especializado em casos de comprovada necessidade.' } },
    { t: '3.3 Comunicação, sensorialidade e previsibilidade', p: [
      'Muitas pessoas autistas compreendem a linguagem de forma literal e têm dificuldade com ironias, metáforas e subentendidos. Instruções diretas, curtas e acompanhadas de apoio visual reduzem a ambiguidade. Para estudantes que não falam ou que falam pouco, a Comunicação Aumentativa e Alternativa (pranchas com figuras, cartões, aplicativos e gestos) amplia as possibilidades de expressão e reduz a frustração.',
      'As diferenças sensoriais, reconhecidas no DSM-5-TR como parte dos padrões restritos e repetitivos (American Psychiatric Association, 2023), ajudam a explicar reações intensas a sons, luzes, cheiros ou toques. Grandin e Panek (2015) enfatizam que essas questões sensoriais costumam ser subestimadas pelos adultos e podem ser a causa de comportamentos interpretados como "birra".',
      'A previsibilidade é outro eixo central. Agendas visuais com as etapas do dia, a antecipação de mudanças e rotinas claras diminuem a ansiedade. Quando ocorre uma crise por sobrecarga, a prioridade é a segurança, a redução de estímulos e a espera pela regulação, deixando a conversa para depois.'
    ], av: { e: 'De acordo com o texto, uma reação intensa de um aluno autista ao sinal da escola deve ser compreendida, antes de tudo, como:', o: ['falta de limites em casa.', 'possível sobrecarga sensorial, ligada às diferenças sensoriais descritas no TEA.', 'desobediência intencional.', 'sintoma de deficiência auditiva.'], a: 1, r: 'As alterações sensoriais fazem parte do quadro do TEA (APA, 2023) e frequentemente explicam reações vistas como "birra" (Grandin; Panek, 2015).' } },
    { t: '3.4 Aprender a partir dos interesses', p: [
      'Orrú (2016) propõe a aprendizagem por eixos de interesse: em vez de tratar os interesses intensos do aluno autista como obstáculo a ser eliminado, o professor os utiliza como ponto de partida para o currículo. Um interesse por trens, por exemplo, pode conduzir à leitura de textos, à resolução de problemas com horários e distâncias e ao estudo da história e da geografia.',
      'Para a autora, essa abordagem se opõe a práticas excludentes e centradas no treino de comportamentos, e se aproxima de uma educação que reconhece o aluno como sujeito, com desejos e singularidades (Orrú, 2016). O interesse funciona como ponte para a participação na turma e para a construção de vínculos com os colegas.',
      'Essa perspectiva converge com a pedagogia baseada em forças de Armstrong (2012), estudada no módulo 1: identificar o que o aluno faz bem e de que gosta é o primeiro passo para planejar o apoio.'
    ], av: { e: 'Na proposta de Orrú (2016), os interesses intensos do aluno autista devem ser:', o: ['eliminados para que ele se concentre no currículo.', 'usados como eixo e ponto de partida para a aprendizagem.', 'permitidos apenas no recreio.', 'tratados como sintoma a ser corrigido.'], a: 1, r: 'Orrú (2016) propõe a aprendizagem por eixos de interesse, que parte dos interesses do aluno para chegar ao currículo.' } }
  ],
  refs: [
    'AMERICAN PSYCHIATRIC ASSOCIATION. <b>Manual diagnóstico e estatístico de transtornos mentais</b>: DSM-5-TR. 5. ed., texto revisado. Porto Alegre: Artmed, 2023.',
    'ARMSTRONG, Thomas. <b>Neurodiversity in the classroom</b>: strength-based strategies to help students with special needs succeed in school and life. Alexandria: ASCD, 2012.',
    'BRASIL. Lei nº 12.764, de 27 de dezembro de 2012. Institui a Política Nacional de Proteção dos Direitos da Pessoa com Transtorno do Espectro Autista. <b>Diário Oficial da União</b>, Brasília, DF, 28 dez. 2012.',
    'BRASIL. Lei nº 13.977, de 8 de janeiro de 2020. Altera a Lei nº 12.764, de 27 de dezembro de 2012 (Lei Berenice Piana), e a Lei nº 9.265, de 12 de fevereiro de 1996, para instituir a Carteira de Identificação da Pessoa com Transtorno do Espectro Autista (Ciptea). <b>Diário Oficial da União</b>, Brasília, DF, 9 jan. 2020.',
    'GRANDIN, Temple; PANEK, Richard. <b>O cérebro autista</b>: pensando através do espectro. Rio de Janeiro: Record, 2015.',
    'KANNER, Leo. Autistic disturbances of affective contact. <b>Nervous Child</b>, [S. l.], v. 2, p. 217-250, 1943.',
    'ORRÚ, Sílvia Ester. <b>Aprendizes com autismo</b>: aprendizagem por eixos de interesse em espaços não excludentes. Petrópolis: Vozes, 2016.'
  ]
};
CURSO.modulos.push({
  id: 'm4', h: 5,
  titulo: 'TDAH, dislexia, discalculia e altas habilidades',
  objetivo: 'Identificar sinais de TDAH, de transtornos específicos da aprendizagem e de altas habilidades/superdotação, diferenciar dificuldade de transtorno e conhecer o acompanhamento previsto na Lei nº 14.254/2021.',
  cartoes: [
    { t: 'TDAH', x: 'O Transtorno do Déficit de Atenção com Hiperatividade envolve um padrão persistente de desatenção e/ou hiperatividade-impulsividade. Pelo DSM-5-TR, vários sintomas aparecem antes dos 12 anos e em dois ou mais ambientes (por exemplo, casa e escola), com prejuízo real no dia a dia.', m: 'TDAH: persistente, antes dos 12 anos, em mais de um ambiente.' },
    { t: 'Três apresentações', x: 'O TDAH pode ter apresentação predominantemente desatenta (a criança "sonha acordada", perde materiais, não termina tarefas), predominantemente hiperativa-impulsiva (não para, interrompe, age sem pensar) ou combinada. A desatenta passa despercebida com mais frequência, sobretudo em meninas.', m: 'Nem todo TDAH é agitado: o desatento também existe.' },
    { t: 'Na sala, com TDAH', x: 'Ajudam: sentar perto do professor e longe de janelas e portas; tarefas divididas em partes curtas com conferência; listas de verificação; pausas ativas; retorno imediato e elogio específico ao esforço. Não é falta de educação nem de vontade: é uma dificuldade de autorregulação.', m: 'Tarefa curta, retorno rápido, pausa ativa.' },
    { t: 'Transtorno específico da aprendizagem', x: 'É uma dificuldade persistente em habilidades acadêmicas básicas, apesar de ensino adequado, que não se explica por deficiência intelectual, problema de visão ou audição nem falta de oportunidade. O DSM-5-TR especifica prejuízos na leitura, na expressão escrita e na matemática.', m: 'Transtorno de aprendizagem persiste mesmo com bom ensino.' },
    { t: 'Dislexia', x: 'É o prejuízo na leitura: dificuldade em reconhecer palavras com precisão e fluência e na decodificação, muitas vezes com dificuldade na ortografia. Tem origem neurobiológica e não tem relação com falta de inteligência. Leitura silabada e cansativa, trocas e omissões persistentes são sinais de alerta.', m: 'Dislexia é dificuldade de decodificar, não de pensar.' },
    { t: 'Discalculia e disgrafia', x: 'Na discalculia, o prejuízo está no senso numérico, na memorização de fatos aritméticos e no cálculo. Na disgrafia, a dificuldade está no traçado da letra e na organização da escrita no papel. Em todos os casos, o raciocínio oral pode ser muito bom.', m: 'Discalculia: número. Disgrafia: traçado.' },
    { t: 'Dificuldade ou transtorno?', x: 'Muitos alunos têm dificuldade por faltas, método inadequado, problemas emocionais ou de visão. A dificuldade costuma melhorar com boa intervenção pedagógica. O transtorno persiste mesmo com intervenção adequada e contínua. Por isso, a primeira resposta da escola é sempre pedagógica, sem esperar laudo.', m: 'Primeiro intervir e observar; depois, se persistir, encaminhar.' },
    { t: 'Lei nº 14.254/2021', x: 'Determina que o poder público mantenha programa de acompanhamento integral para educandos com dislexia, TDAH ou outro transtorno de aprendizagem: identificação precoce, encaminhamento para diagnóstico, apoio educacional na escola e apoio terapêutico na rede de saúde. Prevê também formação continuada dos professores.', m: 'Lei nº 14.254/2021: identificar cedo, encaminhar e apoiar.' },
    { t: 'Quem é público-alvo do AEE', x: 'Pela Política Nacional de 2008, o público-alvo da educação especial são alunos com deficiência, com transtornos globais do desenvolvimento (hoje TEA) e com altas habilidades/superdotação. TDAH e dislexia, isoladamente, não estão nesse grupo, mas esses alunos têm direito a apoio pela Lei nº 14.254/2021.', m: 'AEE: deficiência, TEA e AH/SD. TDAH e dislexia: apoio pela Lei nº 14.254.' },
    { t: 'Altas habilidades/superdotação', x: 'O modelo dos três anéis, de Joseph Renzulli, descreve o comportamento superdotado como o encontro de habilidade acima da média, envolvimento com a tarefa e criatividade. Esses alunos também precisam de atendimento (enriquecimento curricular). Alguns têm dupla excepcionalidade: são superdotados e também autistas ou com TDAH, por exemplo.', m: 'Três anéis: habilidade, envolvimento com a tarefa e criatividade.' }
  ],
  leitura: {
    titulo: 'O caso do Rafael: inteligente, mas "não lê"',
    partes: [
      { p: 'O que a professora percebeu?', x: 'Rafael, 9 anos, 4º ano, conta histórias com riqueza de detalhes, resolve problemas de cabeça e participa das discussões. Mas lê silabando, troca letras como b e d, e evita ler em voz alta. Nas provas escritas, vai mal; quando a professora lê as questões, ele acerta quase tudo.' },
      { p: 'O que foi feito primeiro?', x: 'A professora registrou suas observações e passou a oferecer intervenções: leitura diária em dupla, atividades de consciência fonológica e textos mais curtos. Também passou a ler os enunciados das provas para ele. Depois de dois meses de intervenção constante, Rafael melhorou pouco na leitura, embora continuasse ótimo oralmente.' },
      { p: 'E depois?', x: 'Com os registros, a escola conversou com a família e sugeriu avaliação multiprofissional. Enquanto isso, as adaptações continuaram, porque o apoio pedagógico não depende de laudo. Meses depois, veio o diagnóstico de dislexia, e as estratégias passaram a fazer parte do plano do aluno.' },
      { p: 'Para refletir', x: 'Por que foi importante a professora registrar as intervenções e os resultados antes de sugerir a avaliação? Que adaptações de prova você ofereceria a um aluno como o Rafael?' }

  atividades: [
    { tipo: 'q', e: 'Sobre a Lei nº 14.254/2021, assinale a alternativa correta.', o: ['Garante atendimento apenas aos alunos com laudo de deficiência intelectual.', 'Determina acompanhamento integral para educandos com dislexia, TDAH ou outro transtorno de aprendizagem, com identificação precoce, encaminhamento e apoio educacional e terapêutico.', 'Transfere para a família toda a responsabilidade pelo diagnóstico e pelo apoio.', 'Proíbe adaptações de avaliação para alunos com dislexia.'], a: 1, r: 'A lei prevê programa de acompanhamento integral, com identificação precoce, encaminhamento para diagnóstico, apoio educacional e terapêutico, e formação continuada de professores.', m: 'Lei nº 14.254/2021: dislexia, TDAH e outros transtornos de aprendizagem.' },
    { tipo: 'assoc', e: 'Associe cada condição a uma característica típica.', pares: [['Dislexia', 'Leitura lenta, com dificuldade de decodificar palavras.'], ['Discalculia', 'Dificuldade persistente com senso numérico e cálculos.'], ['Disgrafia', 'Dificuldade no traçado das letras e na organização da escrita.'], ['TDAH desatento', 'Perde materiais, não termina tarefas, parece "no mundo da lua".'], ['Altas habilidades', 'Habilidade acima da média, envolvimento com a tarefa e criatividade.']], r: 'Reconhecer as características ajuda a escolher o apoio, mas o diagnóstico cabe à equipe de saúde. O professor observa, registra e intervém.', m: 'O professor observa e registra; o diagnóstico é da saúde.' },
    { tipo: 'ordem', e: 'Ordene o caminho da escola diante de um aluno com dificuldade persistente.', itens: ['Observar e registrar as dificuldades e os pontos fortes', 'Fazer intervenções pedagógicas em sala por um período', 'Avaliar os resultados das intervenções', 'Conversar com a família, mostrando os registros', 'Sugerir avaliação multiprofissional se a dificuldade persistir', 'Manter e ajustar os apoios pedagógicos durante todo o processo'], r: 'A escola não espera laudo para agir. A intervenção vem primeiro e os registros orientam a conversa com a família e o encaminhamento.', m: 'Observar, intervir, avaliar, conversar, encaminhar e manter o apoio.' },
    { tipo: 'caso', e: 'Lívia, 2º ano, termina todas as atividades em poucos minutos, faz perguntas muito além do conteúdo e cria jogos complexos com regras próprias. Ultimamente tem atrapalhado os colegas e diz que "a escola é chata". Qual é a hipótese e a conduta mais adequadas?', o: ['Indisciplina; aplicar advertência e mais tarefas iguais às da turma.', 'Possíveis altas habilidades/superdotação; observar e registrar, conversar com a equipe e oferecer enriquecimento curricular (desafios, projetos, aprofundamento).', 'TDAH; pedir à família que procure medicação.', 'Imaturidade; segurar a aluna no mesmo ritmo até que se acostume.'], a: 1, fb: ['A advertência não resolve a causa. Mais do mesmo aumenta o desinteresse.', 'Correto. Rapidez, curiosidade intensa e criatividade sugerem AH/SD. O atendimento envolve enriquecimento e o AEE, e o tédio costuma diminuir com desafios adequados.', 'O professor não diagnostica nem indica medicação. O comportamento descrito sugere mais falta de desafio do que desatenção.', 'Conter o ritmo de um aluno com altas habilidades leva ao desinteresse. Ele tem direito a atendimento.'], m: 'Tédio + facilidade + criatividade: pense em altas habilidades.' },
    { tipo: 'pratica', e: 'Adapte uma avaliação', x: 'Imagine uma prova de 10 questões para uma turma do 4º ano. Descreva as adaptações que faria para um aluno com dislexia e para um aluno com TDAH, sem diminuir o que se espera que eles aprendam.', check: ['Leitura dos enunciados em voz alta (ledor) ou áudio', 'Enunciados curtos, fonte maior e espaçamento', 'Tempo adicional ou prova dividida em partes', 'Possibilidade de responder oralmente parte da prova', 'Ambiente com menos distrações', 'Critérios que valorizam o conteúdo, não a ortografia'], min: 150, dica: 'Exemplo: "Dislexia: leio os enunciados, aceito respostas orais em 3 questões e corrijo o conteúdo, não a ortografia. TDAH: entrego a prova em duas folhas, uma de cada vez, com uma pausa de 5 minutos entre elas, e sento o aluno perto de mim."' }

  quiz: [
    { e: 'Pelos critérios do DSM-5-TR, no TDAH vários sintomas estão presentes:', o: ['só na escola.', 'antes dos 12 anos e em dois ou mais ambientes.', 'apenas na adolescência.', 'somente em meninos.'], a: 1, r: 'Os sintomas precisam aparecer antes dos 12 anos e em mais de um ambiente, com prejuízo no funcionamento.' },
    { e: 'A dislexia caracteriza-se principalmente por:', o: ['dificuldade de compreensão oral.', 'deficiência intelectual.', 'dificuldade no reconhecimento preciso e fluente de palavras e na decodificação.', 'falta de interesse pela leitura.'], a: 2, r: 'A dislexia afeta a decodificação e a fluência; a inteligência e a compreensão oral podem ser plenas.' },
    { e: 'Segundo a Política Nacional de Educação Especial na Perspectiva da Educação Inclusiva (2008), são público-alvo da educação especial:', o: ['alunos com dislexia e TDAH.', 'alunos com deficiência, transtornos globais do desenvolvimento (TEA) e altas habilidades/superdotação.', 'todos os alunos com notas baixas.', 'apenas alunos com deficiência física.'], a: 1, r: 'O público-alvo é: deficiência, TGD (hoje TEA) e AH/SD. TDAH e dislexia têm apoio garantido pela Lei nº 14.254/2021.' },

CURSO.ap.m4 = {
  intro: 'Este capítulo trata do TDAH, dos transtornos específicos da aprendizagem e das altas habilidades/superdotação, discutindo critérios de identificação, o papel da intervenção pedagógica e o acompanhamento previsto na legislação.',
  secoes: [
    { t: '4.1 Transtorno do déficit de atenção com hiperatividade', p: [
      'O TDAH é definido pelo DSM-5-TR como um padrão persistente de desatenção e/ou hiperatividade-impulsividade que interfere no funcionamento ou no desenvolvimento. Vários sintomas devem estar presentes antes dos 12 anos de idade e em dois ou mais ambientes, e o manual descreve três apresentações: predominantemente desatenta, predominantemente hiperativa-impulsiva e combinada (American Psychiatric Association, 2023).',
      'Rohde e Mattos (2003) destacam que o TDAH é um dos transtornos mais estudados da infância e que seu diagnóstico é clínico, baseado em informações de diferentes fontes, entre elas a escola. O relato do professor, descrevendo comportamentos concretos em sala, é valioso para a avaliação, mas não substitui o diagnóstico feito por profissionais de saúde.',
      'Barkley (2008) compreende o transtorno como uma dificuldade de autorregulação, ligada ao controle inibitório, que compromete a capacidade de organizar o comportamento em direção a metas futuras. Por isso, estratégias que tornam o tempo e as etapas visíveis, oferecem retorno imediato e dividem tarefas longas em partes menores tendem a ser mais eficazes do que advertências e castigos.'
    ], av: { e: 'Segundo o DSM-5-TR, para o diagnóstico de TDAH, vários sintomas devem estar presentes:', o: ['apenas na escola, após os 12 anos.', 'antes dos 12 anos e em dois ou mais ambientes.', 'somente em meninos hiperativos.', 'apenas durante as provas.'], a: 1, r: 'O DSM-5-TR (APA, 2023) exige sintomas antes dos 12 anos e em dois ou mais ambientes, com prejuízo no funcionamento.' } },
    { t: '4.2 Transtornos específicos da aprendizagem e dislexia', p: [
      'O DSM-5-TR descreve o transtorno específico da aprendizagem como dificuldade persistente para aprender e usar habilidades acadêmicas, que não se explica por deficiência intelectual, problemas sensoriais não corrigidos, adversidade psicossocial, falta de proficiência na língua ou instrução inadequada. O manual especifica prejuízos na leitura, na expressão escrita e na matemática (American Psychiatric Association, 2023).',
      'Shaywitz (2006) caracteriza a dislexia como uma dificuldade inesperada de leitura em pessoas que têm inteligência, motivação e escolarização compatíveis com uma leitura fluente. Segundo a autora, o núcleo da dificuldade está no processamento fonológico, isto é, na habilidade de perceber e manipular os sons da fala e associá-los às letras, o que torna a decodificação lenta e trabalhosa. Ao mesmo tempo, a pessoa com dislexia pode ter excelente raciocínio, vocabulário e compreensão oral.',
      'A discalculia refere-se a dificuldades persistentes no senso numérico, na memorização de fatos aritméticos e no cálculo; a disgrafia, a dificuldades no traçado e na organização da escrita. Em todos os casos, a escola deve garantir que o aluno possa demonstrar o que sabe por caminhos que não dependam exclusivamente da habilidade prejudicada.'
    ], av: { e: 'Para Shaywitz (2006), o núcleo da dificuldade na dislexia está:', o: ['na falta de inteligência.', 'no processamento fonológico, que torna a decodificação lenta e trabalhosa.', 'na falta de interesse pela leitura.', 'em problemas de visão.'], a: 1, r: 'Shaywitz (2006) localiza o núcleo da dislexia no processamento fonológico, em pessoas com inteligência e escolarização adequadas.' } },
    { t: '4.3 Dificuldade ou transtorno? O papel da intervenção', p: [
      'Nem toda dificuldade de aprendizagem é um transtorno. Faltas, métodos inadequados, problemas emocionais e condições de vida podem produzir dificuldades que se resolvem com boa intervenção pedagógica. Fletcher et al. (2009) defendem modelos de resposta à intervenção: o aluno com dificuldade recebe ensino de qualidade e apoio adicional, sua evolução é acompanhada, e a persistência da dificuldade apesar da intervenção adequada é um dos indicadores mais consistentes de transtorno.',
      'Essa perspectiva tem duas consequências práticas. A primeira é que a escola não precisa e não deve esperar o laudo para agir: a intervenção começa assim que a dificuldade é percebida. A segunda é que os registros da intervenção (o que foi feito, por quanto tempo e com que resultado) qualificam o encaminhamento e a avaliação multiprofissional.',
      'A Lei nº 14.254/2021 reforça esse caminho ao determinar que educandos com dislexia, TDAH ou outro transtorno de aprendizagem tenham acompanhamento específico, o mais precocemente possível, por seus educadores, com identificação precoce, encaminhamento para diagnóstico, apoio educacional na rede de ensino e apoio terapêutico na rede de saúde, além de prever a formação continuada de professores (Brasil, 2021).'
    ], av: { e: 'No modelo de resposta à intervenção, discutido por Fletcher et al. (2009), um forte indicador de transtorno de aprendizagem é:', o: ['a nota baixa em uma única prova.', 'a persistência da dificuldade mesmo após intervenção pedagógica adequada.', 'a opinião da família.', 'o comportamento agitado na sala.'], a: 1, r: 'Fletcher et al. (2009): a dificuldade que persiste apesar de intervenção adequada e monitorada indica transtorno.' } },
    { t: '4.4 Altas habilidades/superdotação', p: [
      'A Política Nacional de 2008 inclui os alunos com altas habilidades/superdotação no público-alvo da educação especial, com direito a atendimento educacional especializado de caráter suplementar (Brasil, 2008). Renzulli (1986) propôs a concepção dos três anéis, segundo a qual o comportamento superdotado resulta da interação entre habilidade acima da média, envolvimento com a tarefa e criatividade.',
      'Alencar e Fleith (2001) alertam para mitos que dificultam a identificação desses alunos, como a ideia de que eles sempre tiram boas notas, não precisam de ajuda ou se desenvolvem bem sozinhos. Na realidade, a falta de desafio pode gerar desinteresse, comportamentos de oposição e baixo rendimento.',
      'Há ainda estudantes com dupla excepcionalidade, que apresentam altas habilidades associadas a outra condição, como TEA, TDAH ou dislexia. Nesses casos, a dificuldade pode encobrir o potencial, e o potencial pode encobrir a dificuldade, o que exige observação cuidadosa e atendimento que contemple as duas dimensões.'
    ], av: { e: 'Na concepção dos três anéis de Renzulli (1986), o comportamento superdotado resulta da interação entre:', o: ['QI, idade e notas escolares.', 'habilidade acima da média, envolvimento com a tarefa e criatividade.', 'memória, atenção e disciplina.', 'leitura, escrita e matemática.'], a: 1, r: 'Renzulli (1986): habilidade acima da média, envolvimento com a tarefa e criatividade.' } }
  ],
  refs: [
    'ALENCAR, Eunice M. L. Soriano de; FLEITH, Denise de Souza. <b>Superdotados</b>: determinantes, educação e ajustamento. 2. ed. São Paulo: EPU, 2001.',
    'AMERICAN PSYCHIATRIC ASSOCIATION. <b>Manual diagnóstico e estatístico de transtornos mentais</b>: DSM-5-TR. 5. ed., texto revisado. Porto Alegre: Artmed, 2023.',
    'BARKLEY, Russell A. <b>Transtorno de déficit de atenção/hiperatividade</b>: manual para diagnóstico e tratamento. 3. ed. Porto Alegre: Artmed, 2008.',
    'BRASIL. Ministério da Educação. <b>Política Nacional de Educação Especial na Perspectiva da Educação Inclusiva</b>. Brasília, DF: MEC/SEESP, 2008.',
    'BRASIL. Lei nº 14.254, de 30 de novembro de 2021. Dispõe sobre o acompanhamento integral para educandos com dislexia ou Transtorno do Déficit de Atenção com Hiperatividade (TDAH) ou outro transtorno de aprendizagem. <b>Diário Oficial da União</b>, Brasília, DF, 1 dez. 2021.',
    'FLETCHER, Jack M. et al. <b>Transtornos de aprendizagem</b>: da identificação à intervenção. Porto Alegre: Artmed, 2009.',
    'RENZULLI, Joseph S. The three-ring conception of giftedness: a developmental model for creative productivity. In: STERNBERG, Robert J.; DAVIDSON, Janet E. (ed.). <b>Conceptions of giftedness</b>. Cambridge: Cambridge University Press, 1986. p. 53-92.',
    'ROHDE, Luis Augusto; MATTOS, Paulo (org.). <b>Princípios e práticas em TDAH</b>. Porto Alegre: Artmed, 2003.',
    'SHAYWITZ, Sally. <b>Entendendo a dislexia</b>: um novo e completo programa para todos os níveis de problemas de leitura. Porto Alegre: Artmed, 2006.'
  ]
