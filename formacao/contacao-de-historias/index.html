*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Source Sans 3',system-ui,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3,.sora{font-family:Sora,system-ui,sans-serif;line-height:1.25;margin:0}
button{font:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.previa{background:var(--gold-wash);color:#6b4b00;font-size:13.5px;text-align:center;padding:6px 12px;border-bottom:1px solid #EBD9A8}
header.top{background:var(--sheet);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--brand);cursor:pointer}
.logo img{width:34px;height:34px}
.logo b{font-family:Sora;font-size:15px;line-height:1.05}.logo b i{font-style:normal;color:var(--gold);display:block}
.tag{margin-left:auto;font-size:13px;color:var(--soft);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--brand);color:#fff;text-decoration:none;min-height:46px}
.btn.gold{background:var(--gold2);color:#1d1400}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:14.5px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.hero{background:linear-gradient(135deg,#13285E,#1d3a80);color:#fff;padding:34px 0 30px}
.hero.foto{position:relative;padding:0 0 34px;background:#13285E}.hero.foto .ft{height:clamp(190px,34vw,430px);background:linear-gradient(180deg,rgba(19,40,94,0) 55%,#13285E 100%),var(--foto) center 28%/cover no-repeat}.hero.foto .wrap{margin-top:-28px;position:relative}
.hero .kick{color:#F5C04A;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.hero h1{font-size:clamp(24px,5vw,34px);margin:8px 0 12px}
.hero p{color:#D9E0F2;margin:0 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600}
.price{font-family:Sora;font-size:28px;font-weight:800;color:#F5C04A}.price small{font-size:14px;color:#D9E0F2;font-weight:600;font-family:'Source Sans 3'}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0}
.card h2{font-size:19px;margin-bottom:10px;color:var(--brand)}
.mods{list-style:none;margin:0;padding:0}
.mods li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.mods li:first-child{border-top:0}
.num{flex:0 0 32px;height:32px;border-radius:50%;background:var(--brand-wash);color:var(--brand);display:grid;place-items:center;font-weight:800;font-family:Sora;font-size:14px}
.mods .h{margin-left:auto;font-weight:700;color:var(--gold);white-space:nowrap;font-size:14px}
ul.ok{padding-left:20px;margin:0}ul.ok li{margin:4px 0}
.note{font-size:14px;color:var(--soft)}

/* sala */

.mi.done .num{background:var(--ok);color:#fff}.st.done{color:var(--ok)}.st.go{color:var(--gold)}

.mtitle{font-size:20px;color:var(--brand);margin:6px 0 4px}

/* cartões */
.flash{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:22px 20px;min-height:260px;display:flex;flex-direction:column;box-shadow:0 6px 20px rgba(19,40,94,.06)}

.dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:6px 0}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.v{background:var(--brand)}
/* leitura */
details.acc{background:var(--sheet);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}

.seen{color:var(--ok);font-size:14px}
/* atividades */

.assoc{display:grid;gap:10px}@media(min-width:640px){.assoc{grid-template-columns:1fr 1.6fr}}

.secoes .wrap{display:flex!important;height:auto!important;gap:2px;padding-block:5px;justify-content:space-between}
.secoes .sec{display:inline-flex;align-items:center;gap:7px;color:#DCE4F7;font:600 .9rem/1.1 Sora,sans-serif;padding:9px 8px;border-radius:12px;text-decoration:none;white-space:nowrap}
.secoes .sec svg{width:19px;height:19px;flex:none}
.secoes .sec:hover{background:rgba(255,255,255,.09);color:#fff}
.secoes .sec.on{background:#fff;color:#13285E}
.secoes .sec .ss{display:none}
@media(max-width:700px){.secoes .wrap{display:grid!important;grid-template-columns:repeat(6,minmax(0,1fr))}.secoes .sec{flex-direction:column;gap:4px;padding:8px 1px 7px;font-size:10.5px;letter-spacing:-.01em;border-radius:10px;min-width:0}.secoes .sec svg{width:21px;height:21px}.secoes .sec .sl{display:none}.secoes .sec .ss{display:inline}header.top.site .tag{display:none}.loginbtn{margin-left:auto;padding:8px 11px}.loginbtn span{display:none}}

header.top.site{background:#F7F5EF}
header.top.site .r1{padding-block:12px 6px}
header.top.site .logo{display:flex;align-items:center;gap:10px;text-decoration:none}
header.top.site .logo img{width:48px;height:48px}
header.top.site .wm{display:grid;line-height:1;border-left:2px solid #13285E;padding-left:10px}
header.top.site .wm b{color:#13285E;font:800 1.05rem/1 Sora,sans-serif}
header.top.site .wm i{color:#E0A100;font:800 1.3rem/1.05 Sora,sans-serif;font-style:normal}
header.top.site .loginbtn{margin-left:auto}
header.top.site .vozb{width:34px;height:34px;border-radius:50%;border:1px solid #E2DED2;background:#fff;display:flex;align-items:center;justify-content:center;color:#13285E;margin-left:8px}
header.top.site .r2{display:flex;gap:8px;align-items:center;padding-block:4px 12px;height:auto}
header.top.site .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #E2DED2;background:#fff;border-radius:999px;padding:8px 13px;font:700 .86rem/1 Sora,sans-serif;color:#13285E;text-decoration:none;white-space:nowrap}
header.top.site .busca{flex:1;display:flex;align-items:center;gap:8px;border:1px solid #E2DED2;background:#fff;border-radius:999px;padding:9px 14px;color:#6B7390;text-decoration:none;font-size:.9rem;min-width:0}
header.top.site .busca span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.secoes .sec.on{background:rgba(242,190,69,.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(242,190,69,.6)}
@media(max-width:700px){header.top.site .logo img{width:40px;height:40px}header.top.site .r2 .pill{padding:8px 10px;font-size:.8rem}header.top.site .busca span{font-size:.82rem}}
@media(max-width:420px){header.top.site .busca span{display:none}header.top.site .busca{flex:0 0 auto}}
/* ---------- plano de estudo (versão 2) ---------- */
.eyebrow{display:block;font:700 .72rem/1.3 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#9A6B00}
.plano-top{border-top:5px solid #F2BE45;margin-top:16px}
.plano-top .mtitle{margin:6px 0 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 14px}
.stats div{background:#F4F6FB;border-radius:14px;padding:12px;text-align:center}
.stats b{display:block;font:800 1.6rem/1 Sora,sans-serif;color:#13285E}
.stats b small{font-size:.9rem;color:#6B7390;font-weight:700}
.stats span{font-size:.82rem;color:#4A5470}
.btn.big{width:100%;padding:16px 18px;font-size:1.02rem;text-align:left;white-space:normal;line-height:1.3}
details.mcardp{background:#fff;border:1px solid #E2DED2;border-radius:16px;margin-top:12px;overflow:hidden}
details.mcardp.done{border-color:#BFE3CC}
details.mcardp summary{list-style:none;display:flex;gap:12px;align-items:center;padding:14px 16px;cursor:pointer}
details.mcardp summary::-webkit-details-marker{display:none}
details.mcardp summary .num{flex:0 0 38px;height:38px;border-radius:50%;background:#13285E;color:#fff;display:flex;align-items:center;justify-content:center;font:800 1rem Sora,sans-serif}
details.mcardp.done summary .num{background:#0B7A45}
details.mcardp .mt{flex:1;display:grid;gap:3px}
details.mcardp .mt b{color:#13285E;font-size:1rem;line-height:1.3}
.mbar{display:block;height:6px;background:#EEF1F7;border-radius:99px;overflow:hidden;margin-top:4px}.mbar i{display:block;height:100%;background:linear-gradient(90deg,#1F55A0,#F2BE45)}
details.mcardp summary:after{content:'⌄';font-size:1.3rem;color:#6B7390;transition:transform .2s}
details.mcardp[open] summary:after{transform:rotate(180deg)}
.aulas{border-top:1px solid #EEF1F7;padding:6px 10px 10px}
button.aula{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:12px;padding:10px 8px;text-align:left;cursor:pointer;font:inherit;color:inherit}
button.aula:hover{background:#F4F6FB}
button.aula .ai{flex:0 0 42px;height:32px;border-radius:10px;background:#E6EAF5;color:#13285E;display:flex;align-items:center;justify-content:center;font:700 .85rem Sora,sans-serif}
button.aula.done .ai{background:#DDF3E6;color:#0B7A45}
button.aula .at{flex:1;display:grid;font-weight:600;color:#0F1B3D;line-height:1.3}
button.aula .at small{font-weight:400;color:#4A5470;font-size:.82rem}
button.aula .ab{font:700 .82rem Sora,sans-serif;color:#13285E;border:1.5px solid #13285E;border-radius:999px;padding:6px 12px;white-space:nowrap}
button.aula.done .ab{border-color:#BFE3CC;color:#0B7A45}
button.aula.rev .ai{background:#FBF1D9;color:#9A6B00}
button.aula.lock{opacity:.55;cursor:default}button.aula.lock .ab{border-color:#ccc;color:#888}
.fases{display:flex;gap:6px;margin:4px 0 16px;flex-wrap:wrap}
.fases span{font:700 .8rem Sora,sans-serif;padding:7px 12px;border-radius:999px;background:#EEF1F7;color:#6B7390}
.fases span.on{background:#13285E;color:#fff}.fases span.ok{background:#DDF3E6;color:#0B7A45}
.memo{background:linear-gradient(135deg,#FFF7E0,#FBEFCF);border:1px solid #F2D58A;border-left:6px solid #F2BE45;border-radius:16px;padding:16px 18px;margin:14px 0}
.memo p{margin:6px 0 0;font:700 1.08rem/1.45 Sora,sans-serif;color:#13285E}
.fimaula{text-align:center}.fimaula .big{width:64px;height:64px;margin:0 auto 6px;border-radius:50%;background:#DDF3E6;color:#0B7A45;font:800 2rem/64px Sora,sans-serif}
.fimaula h3{margin:0 0 4px;color:#13285E}
p.row{display:flex;gap:10px;flex-wrap:wrap}
details.resumo summary{cursor:pointer}
.resumo .cards{display:grid;gap:10px;margin-top:12px}@media(min-width:640px){.resumo .cards{grid-template-columns:1fr 1fr}}
.resumo .rc{background:#F7F9FD;border:1px solid #E3E9F5;border-radius:12px;padding:12px}
.resumo .rc p{margin:6px 0;font-size:.92rem}.resumo .rc .m{font-weight:700;color:#9A6B00;font-size:.9rem}
.aulasp{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.aulasp span{font-size:.78rem;background:#F4F6FB;border-radius:8px;padding:4px 8px;color:#4A5470}
header.top.site{position:relative!important}

.apbox{display:flex;align-items:center;gap:12px;background:#F7F9FD;border:1px solid #E3E9F5;border-radius:14px;padding:12px;margin-top:12px}
.apbox .ic{flex:0 0 46px}.apbox .ic svg{width:46px;height:46px}.apbox div{flex:1;display:grid}.apbox small{color:#4A5470}

.cvs{display:none}@media(max-width:700px){.cvl{display:none}.cvs{display:inline}header.top.site .r2 .busca{display:none}header.top.site .r2 .pill{padding:8px 9px;font-size:.78rem;gap:4px}}

    { e: 'Na BNCC, o campo de experiências mais diretamente ligado à contação de histórias é:', o: ['"Espaços, tempos, quantidades, relações e transformações".', '"Escuta, fala, pensamento e imaginação".', '"Corpo, gestos e movimentos".', '"O eu, o outro e o nós".'], a: 1 },
    { e: 'Para Walter Benjamin, o narrador tradicional:', o: ['lê em voz alta um texto que não conhece.', 'retira da experiência, própria ou alheia, aquilo que conta e a incorpora à experiência de quem ouve.', 'explica a moral da história ao final.', 'conta apenas fatos verdadeiros.'], a: 1 },
    { e: 'Uma professora quer fortalecer o repertório da turma com narrativas indígenas e afro-brasileiras. Essa escolha está amparada:', o: ['apenas no gosto pessoal da professora.', 'nas Leis nº 10.639/2003 e nº 11.645/2008 e nas DCNEI, que valorizam a diversidade cultural.', 'somente no calendário de datas comemorativas.', 'em uma exigência exclusiva do ensino médio.'], a: 1 },
    { e: 'Na perspectiva de Nelly Novaes Coelho e de Regina Zilberman, a literatura infantil deve ser entendida principalmente como:', o: ['instrumento para ensinar regras de comportamento.', 'arte da palavra, que amplia a experiência estética e a compreensão do mundo.', 'material para treinar a decodificação.', 'passatempo sem valor educativo.'], a: 1 },
    { e: 'Bettelheim defende que, ao contar um conto de fadas, o adulto:', o: ['explique à criança o significado psicológico de cada personagem.', 'deixe a criança elaborar os sentidos da história sem impor interpretações.', 'retire os vilões para não assustar.', 'troque o final feliz por um final realista.'], a: 1 },
    { e: 'Em um livro ilustrado, quando a imagem mostra algo que o texto não diz (por exemplo, um gato escondido em todas as páginas), a relação entre palavra e imagem é de:', o: ['simetria.', 'complementaridade ou ampliação.', 'redundância total.', 'ausência de relação.'], a: 1 },
    { e: 'Para os bebês, os livros mais adequados são:', o: ['livros longos, com muito texto e poucas imagens.', 'livros de pano, de banho e cartonados, com imagens nítidas, texturas e textos curtos e rítmicos.', 'apenas livros sem imagens.', 'livros didáticos de alfabetização.'], a: 1 },
    { e: 'Na leitura dialógica (Whitehurst et al., 1988), o adulto:', o: ['lê sem interrupções e proíbe comentários.', 'faz perguntas, retoma e amplia as falas da criança, que se torna narradora ativa.', 'pede que a criança decore a história.', 'corrige cada palavra que a criança pronuncia.'], a: 1 },
    { e: 'Antes de contar uma história para a turma, a recomendação mais importante dos autores estudados é:', o: ['decorar o texto palavra por palavra.', 'conhecer bem a história, lê-la antes e apropriar-se dela.', 'improvisar sem preparo para parecer espontâneo.', 'escolher sempre a história mais curta.'], a: 1 },
    { e: 'O silêncio, durante a contação, serve principalmente para:', o: ['mostrar que o contador esqueceu a história.', 'criar suspense, dar tempo para a imagem se formar e marcar momentos importantes.', 'esperar que as crianças fiquem quietas.', 'encerrar a atividade.'], a: 1 },
    { e: 'Flanelógrafo, avental de histórias, caixa ou baú de histórias e objetos do cotidiano são exemplos de:', o: ['recursos que apoiam a narração e despertam a atenção.', 'materiais proibidos na educação infantil.', 'substitutos do livro, que não deve aparecer.', 'avaliações de leitura.'], a: 0 },
    { e: 'A sequência "situação inicial, conflito, clímax e desfecho" ajuda a criança a:', o: ['memorizar datas.', 'perceber a estrutura narrativa e organizar o próprio reconto.', 'aprender a ortografia.', 'identificar o autor do livro.'], a: 1 },
    { e: 'Para Vigotski, a brincadeira de faz de conta é importante porque:', o: ['ocupa o tempo livre da criança.', 'cria uma situação imaginária em que a criança age além do seu comportamento habitual, como se fosse "maior" do que é.', 'deve ser substituída pelo ensino formal aos 4 anos.', 'serve apenas para gastar energia.'], a: 1 },
    { e: 'Peter Slade chama de "jogo projetado" aquele em que a criança:', o: ['usa o corpo inteiro para representar.', 'projeta a imaginação em objetos, bonecos e brinquedos, que ganham vida nas suas mãos.', 'assiste a uma peça no teatro.', 'joga um jogo de regras.'], a: 1 },
    { e: 'Nos jogos teatrais de Viola Spolin, as três perguntas que estruturam a cena são:', o: ['Quem? Onde? O quê?', 'Quando? Quanto? Por quê?', 'Qual? Quantos? Como?', 'Quem? Quando? Quanto?'], a: 0 },
    { e: 'O mamulengo é:', o: ['um tipo de livro de pano.', 'o teatro de bonecos popular de Pernambuco, parte do Teatro de Bonecos Popular do Nordeste, reconhecido como patrimônio cultural do Brasil.', 'uma técnica de leitura dialógica.', 'um jogo de regras.'], a: 1 },
    { e: 'Ao manipular um fantoche, o contador deve:', o: ['olhar sempre para o público e esquecer o boneco.', 'dar ao boneco movimento, voz e foco próprios, olhando para ele quando ele fala, para que a plateia acredite na sua vida.', 'manter o boneco parado o tempo todo.', 'usar a mesma voz para todos os personagens sem variação.'], a: 1 },
    { e: 'Para Vigotski (2009), a imaginação:', o: ['surge do nada e independe da experiência.', 'combina elementos da experiência; quanto mais rica a experiência, mais rica a imaginação.', 'é exclusiva dos artistas.', 'deve ser corrigida pela escola.'], a: 1 },
    { e: 'O "binômio fantástico" de Gianni Rodari consiste em:', o: ['juntar duas palavras distantes entre si para provocar uma história nova.', 'repetir duas vezes a mesma história.', 'ler dois livros no mesmo dia.', 'dividir a turma em dois grupos.'], a: 0 },
    { e: 'Uma história acumulativa, como aquelas em que personagens vão se somando e a fala se repete, favorece especialmente:', o: ['a participação das crianças, que antecipam e repetem as falas.', 'o silêncio absoluto da turma.', 'a cópia de palavras.', 'a avaliação classificatória.'], a: 0 },
    { e: 'Quando a professora escreve no cartaz o reconto ditado pelas crianças, ela atua como:', o: ['corretora.', 'escriba, mostrando que a fala pode ser registrada pela escrita.', 'avaliadora externa.', 'ilustradora.'], a: 1 },
    { e: 'Rimas, parlendas e trava-línguas na educação infantil contribuem principalmente para:', o: ['a consciência fonológica e o prazer de brincar com a língua.', 'a memorização de regras gramaticais.', 'a caligrafia.', 'a cópia do quadro.'], a: 0 },
    { e: 'Na sequência básica de letramento literário proposta por Cosson (2006), o primeiro passo é:', o: ['a interpretação.', 'a motivação.', 'a avaliação.', 'a leitura silenciosa.'], a: 1 },
    { e: 'Para incluir uma criança cega na roda de história, uma boa estratégia é:', o: ['pedir que ela apenas escute, sem participar.', 'oferecer objetos e texturas que representem elementos da história e descrever as imagens.', 'deixá-la em outra atividade.', 'contar somente histórias sem personagens.'], a: 1 },
    { e: 'Para uma criança autista que se desorganiza com mudanças, a contação fica mais acessível quando:', o: ['a rotina da roda é previsível, com sinal de início e fim e apoio visual.', 'a história começa sem aviso, para surpreender.', 'há muito barulho e luzes piscando.', 'ela é obrigada a falar na frente de todos.'], a: 0 },
    { e: 'A "sacola literária" que circula entre as casas tem como objetivo:', o: ['cobrar tarefas das famílias.', 'levar livros e propostas de leitura compartilhada para casa e aproximar escola e família.', 'avaliar a leitura dos pais.', 'substituir a biblioteca da escola.'], a: 1 },
    { e: 'Segundo a LDB (art. 31) e as DCNEI, a avaliação na educação infantil deve ser feita:', o: ['com provas e notas.', 'por acompanhamento e registro do desenvolvimento, sem objetivo de promoção.', 'apenas no fim do ano.', 'pela comparação entre as crianças.'], a: 1 },
    { e: 'Um bom registro sobre a participação de uma criança na hora da história descreve:', o: ['se a criança é "boa" ou "ruim" em ouvir.', 'o que ela disse, fez, perguntou e recontou, com datas e exemplos.', 'a nota da criança.', 'apenas as faltas.'], a: 1 },
    { e: 'Contar a mesma história várias vezes, a pedido das crianças:', o: ['é perda de tempo.', 'é desejável: a repetição dá segurança, permite antecipar e participar e aprofunda a compreensão.', 'deve ser evitado na creche.', 'só vale se a história for mudada a cada vez.'], a: 1 }
  ]
};

  cartoes: [
    { t: 'Narrar é humano', x: 'Todas as culturas conhecidas contam histórias. Antes da escrita, mitos, lendas e contos guardavam a memória dos povos e eram transmitidos de boca em boca, de geração em geração.', m: 'Antes de ler, a humanidade contou.' },
    { t: 'O narrador de Benjamin', x: 'Para Walter Benjamin, o narrador retira da experiência aquilo que conta e a incorpora à experiência de quem ouve. Contar é partilhar experiência, e não só transmitir informação.', m: 'Contar é passar experiência adiante.' },
    { t: 'Pensamento narrativo', x: 'Bruner descreve o modo narrativo de pensamento: organizamos a experiência em histórias, com personagens, intenções, conflitos e desfechos. As crianças entendem o mundo, desde cedo, por meio de histórias.', m: 'A criança entende o mundo em forma de história.' },
    { t: 'Criança que narra', x: 'As DCNEI definem a criança como sujeito histórico e de direitos que brinca, imagina, fantasia, observa, experimenta, narra e questiona, produzindo cultura (art. 4º).', m: 'Narrar é um direito da criança, não um extra.' },
    { t: 'Experiências de narrativa', x: 'O art. 9º das DCNEI determina que as práticas garantam experiências de narrativas, de apreciação e interação com a linguagem oral e escrita e convívio com diferentes suportes e gêneros textuais.', m: 'DCNEI, art. 9º, III: narrativas como experiência garantida.' },
    { t: 'Ouvir para falar', x: 'A linguagem oral se desenvolve na interação. Quando ouve histórias e conversa sobre elas, a criança amplia o vocabulário, aprende a sequenciar fatos e conhece formas da língua que não aparecem nas conversas do dia a dia.', m: 'História ouvida hoje é vocabulário falado amanhã.' },
    { t: 'Campo de experiências', x: 'Na BNCC, a contação está no centro do campo "Escuta, fala, pensamento e imaginação", que se articula aos demais campos e aos seis direitos de aprendizagem: conviver, brincar, participar, explorar, expressar e conhecer-se.', m: 'Escuta, fala, pensamento e imaginação.' },
    { t: 'Repertório diverso', x: 'Contos populares brasileiros, narrativas indígenas e africanas e afro-brasileiras ampliam o repertório e combatem o preconceito. As Leis nº 10.639/2003 e nº 11.645/2008 tornaram obrigatório o estudo dessas culturas.', m: 'Repertório diverso, infância sem preconceito.' },
    { t: 'Ler e contar', x: 'Ler em voz alta mantém as palavras do autor e mostra o livro como objeto. Contar sem o livro, de memória, aproxima o narrador da plateia. As duas práticas são complementares.', m: 'Ler e contar: duas portas para a mesma casa.' }
  ],
  quiz: [
    { e: 'Para Walter Benjamin, o narrador tradicional:', o: ['transmite informações objetivas e verificáveis.', 'retira da experiência aquilo que conta e a incorpora à experiência dos ouvintes.', 'lê textos escritos por outros, sem participação pessoal.', 'conta histórias apenas para divertir.'], a: 1, r: 'Benjamin (1985) associa a narração à troca de experiências, transmitidas de pessoa a pessoa.' },
    { e: 'As DCNEI (Brasil, 2009, art. 9º) determinam que as práticas da educação infantil garantam, entre outras, experiências:', o: ['de memorização do alfabeto.', 'de narrativas, de apreciação e interação com a linguagem oral e escrita.', 'de provas escritas mensais.', 'de cópia diária de palavras.'], a: 1, r: 'O inciso III do art. 9º menciona expressamente as experiências de narrativas e o convívio com diferentes suportes e gêneros textuais.' },
    { e: 'O campo de experiências da BNCC que tem a escuta, a fala e a imaginação como centro é:', o: ['"Traços, sons, cores e formas".', '"Escuta, fala, pensamento e imaginação".', '"Espaços, tempos, quantidades, relações e transformações".', '"Corpo, gestos e movimentos".'], a: 1, r: 'É no campo "Escuta, fala, pensamento e imaginação" que a BNCC situa as experiências com histórias, conversas e livros.' },
    { e: 'Ao ouvir uma história, a criança tem contato com palavras e estruturas que raramente aparecem nas conversas cotidianas. Isso contribui principalmente para:', o: ['a ampliação do vocabulário e da compreensão da linguagem.', 'a caligrafia.', 'a memorização de regras gramaticais.', 'a cópia correta de palavras.'], a: 0, r: 'A linguagem das histórias é mais elaborada que a do cotidiano e amplia vocabulário e compreensão.' },
    { e: 'As Leis nº 10.639/2003 e nº 11.645/2008 se relacionam à contação de histórias porque:', o: ['proíbem contos de fadas europeus.', 'tornam obrigatório o estudo da história e da cultura afro-brasileira e indígena, o que inclui suas narrativas.', 'determinam o número de livros por sala.', 'tratam apenas do ensino médio.'], a: 1, r: 'As leis alteraram a LDB e incluíram a história e a cultura afro-brasileira e indígena no currículo; mitos e contos dessas culturas são parte desse repertório.' }

CURSO.ap.m1 = {
  intro: 'Este capítulo apresenta a contação de histórias como uma das práticas culturais mais antigas da humanidade, discute o seu lugar nos documentos que orientam a educação infantil brasileira e mostra como ouvir e contar histórias participa do desenvolvimento da linguagem oral.',
  secoes: [
    { t: '1.1 Narrar: uma prática tão antiga quanto a humanidade', fig: 'roda', p: [
      'Muito antes da escrita, os grupos humanos já se reuniam para contar histórias. Mitos de origem, lendas, fábulas e contos explicavam o mundo, ensinavam valores e guardavam a memória coletiva. Ong (1998) lembra que, nas culturas orais, o conhecimento só permanece se for repetido e lembrado, e por isso se organiza em narrativas, fórmulas, ritmos e repetições, recursos que facilitam a memória e que reencontramos ainda hoje nos contos para crianças.',
      'Walter Benjamin, em ensaio clássico sobre o narrador, associa a arte de narrar à troca de experiências. Para o autor, o narrador retira da experiência, própria ou relatada por outros, aquilo que conta, e incorpora as coisas narradas à experiência dos seus ouvintes (Benjamin, 1985). A narrativa não se esgota na informação: ela conserva a sua força e pode ser recontada muitas vezes, a cada vez ganhando novos sentidos para quem ouve.',
      'O psicólogo Jerome Bruner (1986) propõe que existem dois modos de pensar: o paradigmático, que busca explicações lógicas e verificáveis, e o narrativo, que organiza a experiência em histórias, com personagens, intenções, obstáculos e desfechos. Desde muito pequenas, as crianças compreendem o que acontece ao seu redor por meio desse modo narrativo: "primeiro aconteceu isso, depois aquilo, porque alguém queria tal coisa".',
      'Na escola de educação infantil, a roda de história recupera, de certo modo, a antiga roda em torno do fogo. O círculo permite que todos se vejam e ouçam, que a voz do narrador chegue a cada criança e que a história seja vivida em comunidade. Contar histórias, portanto, não é apenas uma técnica didática: é a entrada da criança em uma prática cultural que a liga às gerações anteriores.'
    ], av: { e: 'De acordo com o texto, para Walter Benjamin o narrador:', o: ['apenas informa fatos objetivos.', 'retira da experiência aquilo que conta e a incorpora à experiência de quem ouve.', 'precisa sempre ler o texto escrito.', 'conta histórias apenas para entreter.'], a: 1, r: 'Benjamin (1985) associa a narração à troca de experiências entre quem conta e quem ouve.' } },
    { t: '1.2 Por que contar histórias na educação infantil', p: [
      'As Diretrizes Curriculares Nacionais para a Educação Infantil (DCNEI) colocam a narrativa no centro da concepção de criança. O art. 4º da Resolução CNE/CEB nº 5/2009 afirma que as propostas pedagógicas devem considerar a criança como',
      '>>sujeito histórico e de direitos, que, nas interações, relações e práticas cotidianas que vivencia, constrói sua identidade pessoal e coletiva, brinca, imagina, fantasia, deseja, aprende, observa, experimenta, narra, questiona e constrói sentidos sobre a natureza e a sociedade, produzindo cultura (Brasil, 2009, art. 4º).',
      'O art. 9º das mesmas diretrizes define as interações e a brincadeira como eixos norteadores e determina que as práticas garantam experiências que possibilitem às crianças experiências de narrativas, de apreciação e interação com a linguagem oral e escrita, e convívio com diferentes suportes e gêneros textuais orais e escritos (Brasil, 2009, art. 9º, III). Ouvir e contar histórias é, assim, um direito, e não um passatempo para preencher o fim da tarde.',
      'Abramovich (1997) defende que ouvir muitas histórias é o início da formação do leitor: ao escutá-las, a criança descobre emoções, conhece outros lugares, tempos e modos de agir, e experimenta, com segurança, sentimentos como medo, raiva, tristeza e alegria. A autora alerta, porém, que a história não deve ser usada apenas como pretexto para ensinar uma lição ou um conteúdo: o prazer de ouvir é, por si só, uma experiência formativa.',
      'Coelho (1999) acrescenta que a hora do conto educa a atenção, estimula a imaginação, desenvolve o gosto pelos livros e fortalece o vínculo entre o adulto e a criança. Esse vínculo é especialmente importante na creche: para o bebê e para a criança bem pequena, a voz conhecida da professora que conta é também uma forma de cuidado.'
    ], av: { e: 'Segundo o texto, nas DCNEI (Brasil, 2009) a experiência com narrativas é:', o: ['opcional, a critério de cada professora.', 'um direito garantido nas práticas pedagógicas da educação infantil.', 'exclusiva das turmas de pré-escola.', 'uma atividade de alfabetização formal.'], a: 1, r: 'O art. 9º, III, das DCNEI determina que as práticas garantam experiências de narrativas e de interação com a linguagem oral e escrita.' } },
    { t: '1.3 Oralidade e linguagem: aprender a falar ouvindo e conversando', fig: 'linguagem', p: [
      'Para Vigotski (2007), a linguagem nasce nas interações sociais e, aos poucos, se torna instrumento do pensamento. A criança se apropria da fala do grupo em que vive: primeiro usa a palavra para se comunicar com os outros e, depois, para organizar as próprias ações e ideias. Por isso, a qualidade das interações verbais que a criança vive na creche e na pré-escola faz diferença no seu desenvolvimento.',
      'As histórias oferecem uma linguagem mais rica que a das conversas do cotidiano. Nelas aparecem palavras pouco frequentes ("floresta sombria", "sussurrou", "de repente"), conectores que organizam o tempo ("era uma vez", "no dia seguinte", "então") e frases mais longas e elaboradas. Ao ouvir, a criança se familiariza com essas formas, e começa a usá-las nos seus próprios relatos e brincadeiras.',
      'Marcuschi (2001) mostra que fala e escrita não são opostas, mas formam um contínuo de práticas sociais. A criança que ouve histórias lidas em voz alta tem contato com a "linguagem que se escreve" antes mesmo de saber ler: ela aprende que os livros dizem sempre as mesmas palavras, que a escrita guarda as histórias e que há um jeito próprio de contar. Esse conhecimento é parte importante do letramento.',
      'O Referencial Curricular Nacional para a Educação Infantil já destacava que a ampliação das capacidades de comunicação oral ocorre gradativamente, por meio de conversas, de escuta de histórias e de situações em que a criança relata, explica e argumenta (Brasil, 1998). A roda de conversa depois da história, com perguntas abertas como "o que você achou?" e "o que você faria no lugar dele?", completa a contação e dá à criança a vez de falar.'
    ], av: { e: 'Segundo o texto, as histórias contribuem para a linguagem oral porque:', o: ['usam apenas palavras que a criança já conhece.', 'oferecem vocabulário e estruturas mais ricos do que as conversas do cotidiano.', 'substituem a conversa com as crianças.', 'ensinam a escrever com letra cursiva.'], a: 1, r: 'A linguagem das histórias traz palavras pouco frequentes, conectores e frases elaboradas, que a criança passa a usar nos seus relatos.' } },
    { t: '1.4 A BNCC e o campo "Escuta, fala, pensamento e imaginação"', fig: 'bncc', p: [
      'A Base Nacional Comum Curricular organiza a educação infantil em cinco campos de experiências e seis direitos de aprendizagem e desenvolvimento: conviver, brincar, participar, explorar, expressar e conhecer-se (Brasil, 2018). Os objetivos são distribuídos em três grupos etários: bebês (zero a 1 ano e 6 meses), crianças bem pequenas (1 ano e 7 meses a 3 anos e 11 meses) e crianças pequenas (4 anos a 5 anos e 11 meses).',
      'A contação de histórias está no centro do campo "Escuta, fala, pensamento e imaginação". O texto da BNCC destaca que as experiências com a literatura infantil, propostas pelo educador, mediador entre os textos e as crianças, contribuem para o desenvolvimento do gosto pela leitura, do estímulo à imaginação e da ampliação do conhecimento de mundo, além de familiarizar as crianças com os livros, as ilustrações e os diferentes gêneros (Brasil, 2018).',
      'Entre os objetivos desse campo estão, por exemplo, formular e responder perguntas sobre fatos da história narrada, identificando cenários, personagens e principais acontecimentos (EI02EF04), e recontar histórias ouvidas e planejar coletivamente roteiros de vídeos e de encenações, definindo contextos, personagens e estrutura da história (EI03EF04). Para os bebês, os objetivos envolvem demonstrar interesse ao ouvir histórias e reconhecer elementos das ilustrações.',
      'A contação dialoga também com outros campos: "Corpo, gestos e movimentos" (dramatizar, usar o corpo para expressar), "Traços, sons, cores e formas" (cenários, fantoches, sonoplastia), "O eu, o outro e o nós" (emoções e convivência) e "Espaços, tempos, quantidades, relações e transformações" (sequência temporal, antes e depois). Uma boa sessão de histórias raramente toca um só campo.'
    ], av: { e: 'Na BNCC, o campo de experiências que tem a contação de histórias no centro é:', o: ['"Escuta, fala, pensamento e imaginação".', '"Espaços, tempos, quantidades, relações e transformações".', '"O eu, o outro e o nós".', '"Corpo, gestos e movimentos".'], a: 0, r: 'A BNCC situa as experiências com a literatura infantil no campo "Escuta, fala, pensamento e imaginação" (Brasil, 2018).' } },
    { t: '1.5 Um repertório brasileiro e diverso', p: [
      'O Brasil tem uma tradição oral riquíssima. Câmara Cascudo (2004) reuniu contos populares de encantamento, de animais, de exemplo e de adivinhação, que circulavam nas vozes de contadores de diferentes regiões, muitos deles com raízes europeias, africanas e indígenas entrelaçadas. Contar esses contos é apresentar às crianças a cultura do lugar em que vivem.',

CURSO.ap.m2 = {
  intro: 'Este capítulo discute o que é literatura infantil, apresenta os principais gêneros e tipos de livro para a primeira infância, analisa a relação entre texto e imagem no livro ilustrado e propõe critérios e estratégias para escolher e ler livros com as crianças.',
  secoes: [
    { t: '2.1 O que é literatura infantil', p: [
      'Nelly Novaes Coelho (2000) define a literatura infantil como fenômeno de linguagem e arte, que expressa, por meio da palavra, experiências humanas e visões de mundo. Para a autora, ela é ao mesmo tempo arte e instrumento de formação, mas a formação acontece justamente porque a obra emociona, provoca e faz pensar, e não porque transmite regras.',
      'Regina Zilberman (2003) analisa a relação histórica entre a literatura infantil e a escola. A autora mostra que, desde sua origem, os livros para crianças estiveram ligados à intenção de ensinar, o que muitas vezes produziu obras moralizantes e didáticas, com pouco valor estético. Para Zilberman, a escola deve superar o uso da literatura como pretexto e garantir a experiência literária em si.',

      'Para os bebês, os livros são também objetos de exploração sensorial. Livros de pano, de banho, de plástico e cartonados, com cantos arredondados, imagens grandes e nítidas, texturas, abas e poucas palavras ritmadas podem ser mordidos, sacudidos e manuseados sem medo. A leitura acontece no colo ou em pequenos grupos, com a voz, o gesto e a música.',
      'Para as crianças bem pequenas, são adequados livros com histórias curtas, repetitivas e acumulativas, animais e objetos do cotidiano, rimas, cantigas e livros-brinquedo. Elas gostam de ouvir a mesma história muitas vezes, antecipam as falas e completam as frases. Para as crianças pequenas, o repertório se amplia com contos de fadas, contos populares, fábulas, poemas mais longos, livros de imagem complexos e livros informativos.',
      'Coelho (1999) recomenda que o contador considere o interesse e a maturidade das crianças ao escolher: histórias simples e com muita repetição para os menores e enredos com mais personagens, suspense e humor para os maiores. A autora insiste, porém, em um critério que vale para todas as idades: o contador precisa gostar da história, porque o encantamento de quem conta se transmite a quem ouve.',
      'Outros critérios importantes são a qualidade do texto (ritmo, sonoridade, humor, ausência de didatismo excessivo), a qualidade gráfica e das ilustrações e a diversidade de personagens e culturas. Uma boa prática é montar com a equipe uma lista de livros por faixa etária, revista a cada semestre, e organizar o acervo em caixas ou cestos ao alcance das crianças.'
    ], av: { e: 'Para os bebês, segundo o texto, são mais adequados:', o: ['livros longos e sem imagens.', 'livros de pano, de banho e cartonados, com imagens nítidas e poucas palavras ritmadas.', 'livros didáticos.', 'apenas livros informativos.'], a: 1, r: 'Os bebês exploram o livro com o corpo; materiais resistentes, imagens nítidas e textos curtos e ritmados são os mais adequados.' } },
    { t: '2.5 Leitura em voz alta e leitura dialógica', fig: 'dialogica', p: [
      'Ler em voz alta para as crianças é diferente de contar de memória. Na leitura, as palavras do autor são preservadas e o livro aparece como objeto cultural: a criança percebe que a escrita guarda a história e que ela será sempre a mesma. Por isso, vale apresentar a capa, o título, o autor e o ilustrador, segurar o livro de modo que todos vejam as imagens e ler com expressão, respeitando pontuação e pausas.',
      'Whitehurst e colaboradores (1988) propuseram a leitura dialógica, em que o adulto deixa de ser apenas leitor e passa a conversar com a criança sobre o livro. O adulto faz perguntas abertas, avalia a resposta, amplia a fala da criança com novas palavras e pede que ela repita a forma ampliada. Os estudos com crianças pequenas mostraram ganhos de vocabulário e de expressão oral em relação à leitura sem interação.',
      'As perguntas podem ser de diferentes tipos: completar a frase ("e o lobo soprou, soprou e..."), lembrar ("o que aconteceu com a primeira casa?"), abertas ("o que está acontecendo nesta página?"), com quem, onde, por quê ("por que ele ficou com medo?") e de distanciamento, que ligam a história à vida da criança ("você já sentiu medo assim?").',
      'Cosson (2006) propõe, para o letramento literário, a sequência básica de motivação, introdução, leitura e interpretação. Adaptada à educação infantil, a motivação pode ser uma adivinha ou um objeto misterioso; a introdução apresenta o livro e o autor; a leitura acontece com as pausas de conversa; e a interpretação ganha forma no reconto, no desenho, na dramatização ou na conversa final.'
    ], av: { e: 'Na leitura dialógica (Whitehurst et al., 1988), o adulto:', o: ['lê sem interrupções.', 'conversa com a criança sobre o livro, faz perguntas e amplia as suas falas.', 'proíbe comentários.', 'pede que a criança decore o texto.'], a: 1, r: 'A leitura dialógica transforma a leitura em conversa: o adulto pergunta, avalia, amplia e pede a repetição, e a criança vira narradora.' } }

    { t: 'Apropriar-se, não decorar', x: 'Sisto e Machado defendem que o contador se aproprie da história: conheça a sequência, as imagens e as falas-chave, e conte com as próprias palavras, sem recitar um texto decorado.', m: 'Decorar prende; apropriar-se liberta.' },
    { t: 'A voz', x: 'Volume, altura, ritmo e timbre variam conforme o personagem e a emoção. Mas a voz do narrador deve ser natural; excesso de vozes caricatas pode desviar a atenção da história.', m: 'A voz serve à história, não ao contador.' },

    { t: 'O silêncio', x: 'A pausa cria suspense, marca a mudança de cena e dá tempo para a imagem se formar na cabeça de quem ouve. O silêncio também é parte da narração.', m: 'A pausa é onde a imaginação trabalha.' },

    { e: 'A recomendação mais importante antes de contar uma história é:', o: ['decorar o texto palavra por palavra.', 'conhecer bem a história e apropriar-se dela.', 'escolher sempre a mais curta.', 'improvisar para parecer espontâneo.'], a: 1, r: 'Autores como Abramovich, Sisto e Machado insistem na preparação: ler antes e apropriar-se da história.' },

CURSO.ap.m3 = {
  intro: 'Este capítulo trata do ofício do contador de histórias: a preparação da história, o uso da voz, do corpo, do olhar e do silêncio, os recursos que apoiam a narração, a organização do espaço e do ritual e o conhecimento da estrutura narrativa.',
  secoes: [
    { t: '3.1 Preparar a história: escolher, estudar e apropriar-se', p: [
      'Contar bem começa muito antes da roda. Abramovich (1997) recomenda que o professor leia a história antes, quantas vezes for necessário, para conhecer o enredo, perceber o ritmo, as palavras bonitas, os momentos de suspense e as falas que merecem destaque. Pegar um livro ao acaso na estante e contá-lo pela primeira vez diante das crianças costuma produzir tropeços, hesitações e perda da atenção.',
      'Sisto (2001) distingue decorar de apropriar-se. Decorar é repetir um texto palavra por palavra, com o risco de "dar branco" e de narrar de forma mecânica. Apropriar-se é conhecer a história por dentro: a sequência dos acontecimentos, as imagens principais, os personagens e as poucas frases que devem ser ditas exatamente como no texto, como as fórmulas mágicas e os refrões. O restante é contado com as palavras do próprio narrador.',
      'Regina Machado (2004) propõe que o contador trabalhe com as imagens da história. Em vez de memorizar palavras, ele visualiza as cenas como se fossem um filme interior, percebe o que cada imagem desperta em si e procura transmitir essa experiência. Para a autora, contar histórias é uma arte que envolve o contador por inteiro, e não a simples reprodução de um texto.',
      'Um roteiro simples de preparação inclui: ler a história várias vezes; dividir em cenas e desenhar ou anotar cada uma em um cartão; identificar as falas-chave; contar em voz alta sozinho, ou para um colega, ao menos uma vez; decidir se haverá recurso de apoio; e pensar na conversa que pode vir depois.'
    ], av: { e: 'Segundo Sisto (2001), apropriar-se de uma história significa:', o: ['decorar o texto palavra por palavra.', 'conhecê-la por dentro e contá-la com as próprias palavras, mantendo as falas-chave.', 'ler o livro pela primeira vez diante das crianças.', 'contar sempre a mesma versão do filme.'], a: 1, r: 'Apropriar-se é conhecer a sequência, as imagens e as falas-chave, e narrar com as próprias palavras, sem recitar.' } },
    { t: '3.2 Voz, corpo, olhar e silêncio', fig: 'voz', p: [
      'A voz é o principal instrumento do contador. O volume pode baixar no momento de mistério e subir no momento de alegria; o ritmo pode acelerar na perseguição e desacelerar quando o personagem se perde na floresta; a altura e o timbre podem distinguir personagens. Sisto (2001) alerta, porém, que a voz do narrador deve permanecer natural e que o excesso de vozes caricatas transforma a contação em espetáculo do contador, e não da história.',
      'O corpo acompanha a voz. Expressões do rosto, gestos simples e a postura ajudam a criar o clima de cada cena. Coelho (1999) recomenda gestos econômicos: um gesto bem escolhido, como as mãos que se abrem para mostrar o tamanho do gigante, vale mais que muitos movimentos que distraem. As crianças precisam de espaço para criar suas próprias imagens.',
      'O olhar cria o vínculo. O contador olha para todas as crianças da roda, inclusive para as que estão nas pontas e para as mais tímidas, e percebe as reações do grupo: o susto, o riso, a dispersão. A contação é uma conversa, e o contador ajusta o ritmo de acordo com a escuta da turma.',
      'O silêncio, por fim, é também linguagem. Uma pausa antes de abrir a porta do castelo cria suspense; uma pausa depois de uma frase importante dá tempo para a imagem se formar; uma pausa no fim da história deixa a emoção reverberar antes da conversa. Contadores iniciantes costumam ter medo do silêncio e preenchê-lo, mas é nele que a imaginação trabalha.'
    ], av: { e: 'Segundo o texto, as pausas durante a narração servem para:', o: ['mostrar que o contador esqueceu a história.', 'criar suspense e dar tempo para a imaginação das crianças.', 'pedir silêncio à turma.', 'encerrar rapidamente a atividade.'], a: 1, r: 'O silêncio é linguagem: cria suspense, marca cenas e dá tempo para a imagem se formar.' } },
    { t: '3.3 Recursos que apoiam a narração', fig: 'recursos', p: [
      'Betty Coelho (1999) apresenta várias formas de apresentar a história: a narrativa simples, só com a voz e o corpo; a narração com o livro, mostrando as ilustrações; o uso de gravuras ou de sequências de imagens; o flanelógrafo, quadro de feltro em que personagens recortados são colocados e retirados durante a narração; e os desenhos feitos ao vivo pelo contador, entre outras. A autora lembra que cada história pede uma forma diferente.',
      'Outros recursos muito usados na educação infantil são o avental de histórias, com bolsos dos quais saem personagens e objetos; a caixa ou o baú de histórias, que guarda elementos revelados um a um; os objetos do cotidiano, como uma colher que vira personagem; os instrumentos musicais e a sonoplastia feita pelas crianças; o teatro de sombras; e os fantoches, que serão estudados no próximo módulo.',
      'O recurso deve servir à história, e não o contrário. Um material muito elaborado, com muitas peças, pode prender a atenção do contador, que se perde manuseando, e das crianças, que passam a olhar o objeto e esquecem o enredo. Antes de usar um recurso, vale perguntar: ele ajuda as crianças a compreender e imaginar, ou apenas enfeita?',
      'Contar sem nenhum recurso também é uma escolha valiosa. A narrativa só com a voz exige mais da imaginação das crianças e é a forma mais antiga de contar. Alternar sessões com e sem recurso, com e sem livro, amplia as experiências da turma.'
    ], av: { e: 'De acordo com o texto, ao escolher um recurso para contar uma história, o professor deve verificar se ele:', o: ['é o mais caro disponível.', 'ajuda as crianças a compreender e imaginar, e não apenas enfeita.', 'tem muitas peças.', 'substitui totalmente a narração oral.'], a: 1, r: 'O recurso serve à história; materiais excessivos podem desviar a atenção do enredo.' } },
    { t: '3.4 O ambiente e o ritual da hora da história', p: [
      'Horn (2004) defende que o espaço da educação infantil não é um pano de fundo neutro, mas um elemento do currículo, que convida ou desestimula determinadas experiências. Um cantinho de leitura acolhedor, com tapete, almofadas, boa iluminação e livros com a capa à vista, ao alcance das crianças, comunica que ler e ouvir histórias é importante e prazeroso.',
      'A organização em roda permite que todas as crianças vejam o contador e as imagens e que o contador veja todas as crianças. O contador se posiciona de modo que a luz não fique às suas costas, ofuscando o grupo, e escolhe um momento do dia em que a turma esteja disponível para a escuta, evitando, por exemplo, os minutos que antecedem a saída ou a chegada de outra turma ao corredor.',
      'O ritual marca a passagem do tempo comum para o tempo da história. Pode ser uma música, um chapéu de contador, um tapete que só aparece nesse momento, uma vela de mentira que se "acende" e se "apaga", ou fórmulas tradicionais de abertura e de fechamento, como "Era uma vez..." e "Entrou por uma porta, saiu por outra, quem quiser que conte outra". O ritual dá previsibilidade às crianças e ajuda a concentrar a atenção.',
      'A duração varia com a idade. Com os bebês, a leitura acontece em pequenos grupos ou no colo, por poucos minutos, e pode ser retomada várias vezes ao dia. Com as crianças maiores, a sessão pode durar mais, intercalando narração e participação. O mais importante é encerrar enquanto o interesse ainda está vivo.'
    ], av: { e: 'Segundo o texto, o ritual de início e de fim da hora da história serve para:', o: ['controlar o comportamento das crianças pelo medo.', 'marcar a passagem para o tempo da história e dar previsibilidade.', 'substituir a narração.', 'avaliar a atenção de cada criança.'], a: 1, r: 'Músicas, objetos e fórmulas marcam o início e o fim, ajudam a concentrar a atenção e dão segurança.' } },
    { t: '3.5 A estrutura da narrativa', fig: 'arco', p: [
      'Vladimir Propp (1984), ao estudar uma centena de contos maravilhosos russos, mostrou que, embora os personagens e os cenários variem muito, as ações se repetem em uma sequência regular. O autor identificou 31 funções, como o afastamento de um membro da família, a proibição, a transgressão, a partida do herói, a ajuda de um elemento mágico, a luta contra o antagonista, a vitória e o retorno. Conhecer essa regularidade ajuda a entender por que os contos são tão fáceis de lembrar.',
      'Para o trabalho com as crianças, é comum simplificar a estrutura em cinco momentos: situação inicial (quem, onde, quando), conflito ou complicação (o problema que muda tudo), desenvolvimento (as tentativas de resolver), clímax (o momento de maior tensão) e desfecho (a solução e a nova situação). A fórmula "Era uma vez... até que um dia... então... e, finalmente..." resume esse esquema.',
      'Quando o contador conhece a estrutura, ele sabe onde acelerar, onde fazer pausa e onde está o ponto de maior suspense. As crianças, ao ouvirem muitas histórias, internalizam essa estrutura e passam a usá-la nos seus próprios relatos e brincadeiras de faz de conta: começam a contar com "era uma vez", criam um problema e buscam uma solução.',
      'A repetição tem papel especial nesse aprendizado. As crianças pedem a mesma história muitas vezes porque, conhecendo o enredo, podem antecipar o que vai acontecer, participar das falas e saborear o suspense sem medo. Coelho (1999) observa que a criança pequena prefere as histórias já conhecidas e que a repetição lhe dá segurança. Atender ao pedido de "conta de novo!" é uma decisão pedagógica.'
    ], av: { e: 'De acordo com o texto, Propp (1984) mostrou que os contos maravilhosos:', o: ['não têm regularidade.', 'seguem uma sequência regular de funções, embora personagens e cenários variem.', 'foram escritos para a escola.', 'não têm herói nem conflito.'], a: 1, r: 'Propp identificou 31 funções que se repetem, em ordem, nos contos maravilhosos.' } }
  ],

CURSO.ap.m4 = {
  intro: 'Este capítulo parte do faz de conta como forma própria de a criança pensar e se expressar, apresenta o jogo dramático e os jogos teatrais adequados à educação infantil e estuda o teatro de formas animadas, com atenção especial aos fantoches: tipos, construção com as crianças e manipulação.',
  secoes: [
    { t: '4.1 Do faz de conta ao jogo dramático', fig: 'fazdeconta', p: [
      'Para Vigotski (2007), a brincadeira de faz de conta é uma atividade central no desenvolvimento da criança pequena. Ao brincar, ela cria uma situação imaginária, em que um cabo de vassoura vira cavalo e uma caixa vira barco, e passa a agir de acordo com as regras do papel que assume: quem brinca de mãe cuida, quem brinca de motorista dirige. O autor afirma que, no brinquedo, a criança se comporta além do comportamento habitual da sua idade, como se fosse maior do que é na realidade, e por isso a brincadeira cria uma zona de desenvolvimento iminente.',
      'O educador inglês Peter Slade (1978) estudou o jogo dramático infantil e distinguiu duas formas. No jogo pessoal, a criança usa o corpo inteiro para ser o personagem: anda como o leão, voa como o pássaro. No jogo projetado, ela projeta a imaginação em objetos, bonecos e brinquedos, que ganham vida nas suas mãos enquanto ela permanece "fora" da cena. Segundo o autor, o jogo projetado predomina nas crianças menores, e o pessoal se amplia com o crescimento.',
      'Essa distinção ajuda o professor a planejar. Para as crianças bem pequenas, brincar com bonecos, carrinhos e fantoches a partir de uma história é uma forma natural de dramatizar. Para as crianças pequenas, propostas de "ser" o personagem, com o corpo inteiro, ganham força. As duas formas convivem e se alimentam.',
      'Slade (1978) insiste também que o jogo dramático não é teatro no sentido de espetáculo. Na educação infantil, a dramatização é um processo de experimentação, sem texto decorado e sem a obrigação de se apresentar para uma plateia de pais. O valor está no fazer, no imaginar junto e no expressar-se, e não no produto final.'
    ], av: { e: 'Segundo Slade (1978), no jogo projetado a criança:', o: ['usa o corpo inteiro para ser o personagem.', 'projeta a imaginação em objetos e bonecos.', 'assiste a um espetáculo.', 'decora um texto teatral.'], a: 1, r: 'No jogo projetado, a imaginação da criança dá vida a objetos e bonecos; no jogo pessoal, o corpo é o personagem.' } },
    { t: '4.2 Jogos teatrais na educação infantil', fig: 'spolin', p: [
      'Viola Spolin (2001) desenvolveu os jogos teatrais como forma de ensinar teatro por meio do jogo, com regras simples e um foco claro, em vez de instruções sobre como atuar. Ingrid Koudela (1984), que introduziu e estudou essa proposta no Brasil, mostra que os jogos teatrais desenvolvem a percepção, a atenção, a comunicação e a capacidade de improvisar em grupo.',
      'Spolin estrutura a cena em três perguntas: Quem são os personagens? Onde a cena acontece? O que eles estão fazendo? Com as crianças pequenas, o professor ajuda a construir essas respostas a partir da história ouvida: "Quem vai ser a avó? Onde ela mora? O que ela está fazendo quando o lobo bate na porta?". As respostas viram combinados da brincadeira.',
      'Alguns jogos adequados à educação infantil são: o espelho, em que uma criança imita os movimentos da outra; as estátuas, em que o grupo congela ao som de uma palavra ou de uma música, formando uma cena da história; o objeto imaginário, passado de mão em mão (uma bola de fogo, um bebê dormindo, uma pena); caminhar como os personagens (o gigante, o ratinho, a bruxa velha); e as cenas mudas, em que o grupo adivinha o que está sendo representado.',
      'Esses jogos se ligam diretamente ao campo "Corpo, gestos e movimentos" da BNCC, que prevê, entre outros objetivos, criar com o corpo formas diversificadas de expressão de sentimentos, sensações e emoções, e ao campo "Escuta, fala, pensamento e imaginação", com o reconto e a encenação de histórias (Brasil, 2018). O papel do professor é propor, observar, ajudar a resolver problemas e valorizar as soluções das crianças, sem corrigir a "atuação".'
    ], av: { e: 'Nos jogos teatrais de Spolin (2001), a cena é estruturada pelas perguntas:', o: ['Quem? Onde? O quê?', 'Quanto? Quando? Qual?', 'Por quê? Como? Para quem?', 'Quem? Quanto? Quando?'], a: 0, r: 'Quem (personagens), Onde (lugar) e O quê (ação) são os três elementos da cena.' } },
    { t: '4.3 O teatro de formas animadas e os tipos de boneco', fig: 'bonecos', p: [
      'Ana Maria Amaral (1991) chama de teatro de formas animadas o teatro que usa bonecos, máscaras, objetos e sombras. Para a autora, o que define esse teatro é a transferência de vida do ator para a forma: o boneco, por si só, é matéria inerte, e só se torna personagem quando recebe movimento, ritmo e intenção de quem o anima. Por isso, o boneco tem uma força simbólica especial para as crianças, que acreditam na sua vida com facilidade.',
      'Há muitos tipos de boneco. O fantoche de luva é vestido na mão, com o indicador na cabeça e os outros dedos nos braços. O dedoche cabe em um dedo. O boneco de boca, muitas vezes feito de meia, abre e fecha a boca com o movimento da mão. O boneco de vara ou de palito é movido por uma haste. A marionete é movida por fios, a partir de cima. Os bonecos de sombra são silhuetas projetadas em um tecido iluminado por trás. E há ainda o teatro de objetos, em que uma colher, um pente ou uma luva viram personagens.',
      'O Brasil tem uma rica tradição de teatro de bonecos popular. O mamulengo, de Pernambuco, o babau, da Paraíba, o João Redondo, do Rio Grande do Norte, e o Cassimiro Coco, do Ceará e do Maranhão, compõem o Teatro de Bonecos Popular do Nordeste, reconhecido pelo Iphan como patrimônio cultural imaterial do Brasil (Iphan, 2014). Esses espetáculos, apresentados em feiras e festas, combinam humor, música, improviso e conversa com a plateia.',
      'Apresentar às crianças essa tradição, por meio de vídeos, imagens ou da visita de um grupo de bonequeiros, amplia o repertório cultural e mostra que o teatro de bonecos é também uma arte brasileira, feita por mestres populares.'
    ], av: { e: 'Segundo Amaral (1991), o boneco se torna personagem quando:', o: ['é feito de material caro.', 'recebe movimento, ritmo e intenção de quem o anima.', 'tem a boca articulada.', 'é exposto em uma prateleira.'], a: 1, r: 'No teatro de formas animadas, a vida do boneco vem do movimento e da intenção do manipulador.' } },
    { t: '4.4 Construir fantoches com as crianças', fig: 'construir', p: [
      'Construir bonecos com as crianças é uma atividade rica, que articula artes visuais, linguagem e imaginação. Ao escolher os olhos, o cabelo e a roupa, a criança já começa a criar o personagem: ele é bravo ou tímido? Como fala? Como anda? Do que gosta? Essas decisões preparam a dramatização e alimentam a linguagem oral.',
      'Há bonecos simples, adequados a cada faixa etária. Com as crianças bem pequenas, o professor prepara a base e elas decoram: um saco de papel com rosto desenhado, um rolo de papel com olhos colados, um palito com a figura de um personagem. Com as crianças pequenas, é possível fazer bonecos de meia, com olhos de botão ou de feltro e cabelo de lã; bonecos de colher de pau; dedoches de feltro ou de papel; e bonecos de sucata, com caixas e tampinhas.',
      'Alguns cuidados são importantes: usar materiais limpos e seguros, evitar peças pequenas com os menores, preferir cola branca e fitas a materiais tóxicos, e oferecer tempo para que cada criança termine o seu boneco e brinque com ele livremente antes de qualquer proposta de cena.',
      'Uma empanada simples, que é o "palco" do teatro de bonecos, pode ser feita com um tecido estendido entre duas cadeiras, uma caixa grande de papelão recortada ou uma mesa virada de lado. Com a empanada, as crianças se escondem e só os bonecos aparecem, o que ajuda as mais tímidas a falar por meio do personagem.'
    ], av: { e: 'De acordo com o texto, a empanada ajuda as crianças tímidas porque:', o: ['as obriga a se apresentar.', 'esconde a criança, e só o boneco aparece, permitindo falar por meio dele.', 'impede que falem.', 'substitui o boneco.'], a: 1, r: 'Escondida atrás da empanada, a criança fala pelo personagem, o que reduz a timidez.' } },
    { t: '4.5 Manipular e dar voz ao boneco', p: [
      'Para que a plateia acredite na vida do boneco, o manipulador precisa de alguns cuidados técnicos. O primeiro é o foco: quando o boneco fala, o manipulador olha para ele, e não para a plateia, conduzindo o olhar das crianças. O segundo é o movimento da boca, que abre a cada sílaba, sem ficar batendo sem parar. O terceiro é a altura: o boneco aparece sempre no mesmo nível na empanada, sem "afundar" nem "flutuar" (Amaral, 1991).',
      'Cada boneco precisa de um jeito próprio: uma voz, um modo de andar, uma postura. Um boneco que respira, que olha em volta antes de falar e que reage ao que o outro diz parece vivo. Um boneco que só se mexe enquanto fala parece um objeto. Vale treinar diante do espelho ou gravar um pequeno vídeo com o celular para observar.',
      'O boneco também é um excelente mediador da conversa com as crianças. Ele pode chegar para "ouvir" a história junto com a turma, fazer perguntas, esquecer partes que as crianças completam, ficar triste ou com medo e pedir ajuda. Muitas vezes, uma criança que não responde à professora responde ao boneco, porque a relação com ele é de brincadeira.',
      'É importante, porém, não usar o boneco para ameaçar, vigiar ou corrigir o comportamento ("o fantoche está vendo quem não obedece"). O boneco pertence ao mundo da imaginação e da brincadeira, e usá-lo para controlar quebra a confiança das crianças nessa linguagem.'

CURSO.ap.m5 = {
  intro: 'Este capítulo apresenta a teoria da imaginação de Vigotski e suas consequências para a escola, propõe formas de tornar a narrativa interativa, apresenta técnicas de invenção de histórias de Gianni Rodari, discute o reconto e a produção de histórias pelas crianças e mostra como brincar com a linguagem desenvolve a oralidade e a consciência fonológica.',
  secoes: [
    { t: '5.1 A imaginação segundo Vigotski', fig: 'imaginacao', p: [
      'Em Imaginação e criação na infância, Vigotski (2009) contesta a ideia de que a imaginação seja algo que surge do nada ou um dom de poucos. Para o autor, a imaginação é uma função psicológica que combina e reelabora elementos tirados da experiência. Daí decorre a sua primeira e mais importante consequência pedagógica: a atividade criadora da imaginação depende diretamente da riqueza e da diversidade da experiência anterior da pessoa.',
      'O autor descreve quatro formas de relação entre imaginação e realidade. Na primeira, tudo o que a imaginação cria é feito de elementos da experiência real: o dragão é feito de partes de animais conhecidos. Na segunda, a imaginação permite conhecer o que nunca vimos, por meio da experiência dos outros: ao ouvir a descrição do deserto, a criança o imagina. Na terceira, há um vínculo emocional: os sentimentos influenciam o que imaginamos, e o que imaginamos desperta sentimentos verdadeiros. Na quarta, a imaginação se cristaliza em algo novo, como um desenho, uma história ou um objeto inventado.',
      'Vigotski (2009) conclui que, se quisermos criar bases sólidas para a atividade criadora da criança, é preciso ampliar a sua experiência. As histórias são um dos caminhos mais poderosos para isso: elas levam a criança a lugares, épocas e situações que ela não conhece, oferecem palavras e imagens novas e despertam emoções. Por isso, ouvir muitas e variadas histórias é alimento para a imaginação.',
      'O terceiro vínculo, o emocional, explica por que a criança sente medo de verdade diante do lobo, mesmo sabendo que ele é inventado. Essa emoção vivida com segurança, no espaço protegido da roda e da brincadeira, ajuda a criança a conhecer e a nomear os próprios sentimentos.'
    ], av: { e: 'Segundo Vigotski (2009), a imaginação da criança:', o: ['surge do nada e independe da experiência.', 'depende da riqueza e da diversidade da sua experiência anterior.', 'é um dom de poucas crianças.', 'deve ser substituída pela razão na escola.'], a: 1, r: 'A imaginação combina elementos da experiência; quanto mais rica a experiência, mais rica a imaginação.' } },
    { t: '5.2 Narrativas interativas: a criança participa', p: [
      'Uma narrativa interativa é aquela em que as crianças não apenas ouvem, mas participam da construção da história. Os contos acumulativos e de repetição são naturalmente interativos: depois de ouvir duas ou três vezes o refrão, as crianças o repetem junto com o contador e antecipam o que vem a seguir.',
      'O contador pode combinar com a turma, antes de começar, alguns gestos e sons: toda vez que o vento soprar, todos sopram; toda vez que o gigante aparecer, todos batem os pés; quando a porta ranger, todos fazem "nhéééc". Assim, a escuta se torna ativa, e as crianças precisam prestar atenção para participar no momento certo. A sonoplastia com instrumentos simples, como chocalhos, tambores e papel amassado, também é uma forma de participação.',
      'Outra possibilidade é oferecer escolhas: "O menino encontrou dois caminhos, um com flores e outro escuro. Qual ele deve seguir?". A turma decide, e o contador continua a partir da escolha, improvisando. Esse tipo de narrativa exige do contador conhecimento da estrutura da história e segurança para improvisar, mas resulta em grande envolvimento das crianças.',
      'É preciso equilíbrio. Interromper a história a todo momento pode fazer as crianças perderem o fio da narrativa. Algumas histórias pedem participação; outras pedem escuta silenciosa e atenta, especialmente as de mistério e as mais emocionantes. O contador escolhe o modo de acordo com a história e com a turma.'
    ], av: { e: 'De acordo com o texto, uma narrativa interativa é aquela em que as crianças:', o: ['apenas ouvem em silêncio.', 'participam da construção da história com falas, gestos, sons ou escolhas.', 'leem sozinhas.', 'desenham durante a contação.'], a: 1, r: 'Na narrativa interativa, refrões, gestos, sons e escolhas tornam os ouvintes participantes.' } },
    { t: '5.3 A gramática da fantasia de Gianni Rodari', fig: 'rodari', p: [
      'O escritor e educador italiano Gianni Rodari (1982) reuniu, em Gramática da fantasia, técnicas para inventar histórias com crianças. O autor parte da ideia de que a imaginação pode ser estimulada por meio de jogos com a linguagem, e de que inventar histórias é um direito de todos, e não apenas dos escritores.',
      'A técnica mais conhecida é o binômio fantástico. Rodari observa que uma única palavra não basta para criar uma história; é preciso uma faísca entre duas palavras distantes, que normalmente não aparecem juntas. "Cão" e "gato" são próximos demais; "cão" e "armário" provocam a imaginação: um cão que mora no armário? Um armário que late? A partir do encontro inesperado, nasce a história.',
      'Outra técnica é a hipótese fantástica, que começa com a pergunta "o que aconteceria se...?". O que aconteceria se as casas voassem? Se a chuva fosse de suco? Se o lobo fosse vegetariano? Rodari propõe também "errar as histórias", contando um conto conhecido de forma trocada (Chapeuzinho Amarelo, um lobo bonzinho), o que provoca as crianças a corrigir e, depois, a aceitar o jogo e inventar; a "salada de fábulas", que mistura personagens de histórias diferentes; e a continuação de um conto: o que aconteceu depois do "felizes para sempre"?',
      'Na educação infantil, essas técnicas funcionam muito bem com o apoio de objetos e imagens: duas figuras sorteadas de uma caixa, dois objetos tirados de um saco, um personagem de uma história que encontra o personagem de outra. O professor anota as ideias, faz perguntas para encadear os acontecimentos e ajuda a turma a chegar a um final.'
    ], av: { e: 'O binômio fantástico de Rodari (1982) consiste em:', o: ['juntar duas palavras distantes para provocar uma história nova.', 'contar a mesma história duas vezes.', 'ler dois livros por dia.', 'dividir a história em dois capítulos.'], a: 0, r: 'O encontro de duas palavras distantes gera a faísca que provoca a invenção.' } },
    { t: '5.4 Reconto e produção de histórias pelas crianças', fig: 'reconto', p: [
      'Recontar uma história ouvida é uma das atividades mais completas da educação infantil. Ao recontar, a criança precisa lembrar os acontecimentos, organizá-los em sequência, escolher palavras, usar os conectores que ouviu ("era uma vez", "então", "no fim") e considerar o ouvinte. O reconto revela ao professor o que a criança compreendeu e o que lhe chamou a atenção.',
      'A BNCC prevê, para as crianças pequenas, recontar histórias ouvidas e planejar coletivamente roteiros de vídeos e encenações (EI03EF04), recontar histórias ouvidas para produção de reconto escrito, tendo o professor como escriba (EI03EF05), e produzir as próprias histórias orais e escritas, em escrita espontânea, em situações com função social significativa (EI03EF06) (Brasil, 2018).',
      'O reconto pode ser apoiado por recursos: uma sequência de imagens da história embaralhada que a turma organiza, objetos tirados de uma caixa que lembram cada parte, os fantoches construídos no módulo anterior, ou o próprio livro, que a criança "lê" pelas imagens. Os recontos podem ser individuais, em pequenos grupos ou coletivos.',
      'Quando as crianças ditam e o professor escreve, em um cartaz ou em um livro da turma, elas observam que a fala pode ser registrada, que a escrita tem uma linguagem própria (diferente da conversa) e que o texto pode ser relido e melhorado: "Será que dá para entender? O que falta contar?". Essa produção coletiva, ilustrada pelas crianças, pode virar um livro da turma, que circula entre as famílias e entra no acervo da sala.'
    ], av: { e: 'Segundo o texto, quando as crianças ditam o reconto e o professor escreve, elas aprendem que:', o: ['só o professor pode contar histórias.', 'a fala pode ser registrada e que a escrita tem uma linguagem própria.', 'não precisam mais ouvir histórias.', 'a escrita não tem relação com a fala.'], a: 1, r: 'Com o professor como escriba, a criança percebe a relação entre fala e escrita e as marcas da linguagem escrita (EI03EF05).' } },
    { t: '5.5 Brincar com a linguagem: rimas, parlendas e trava-línguas', p: [
      'As crianças pequenas adoram brincar com os sons das palavras. Parlendas ("Hoje é domingo, pede cachimbo..."), cantigas de roda, trava-línguas ("O rato roeu a roupa do rei de Roma"), adivinhas e poemas com rimas fazem parte da cultura da infância e são, muitas vezes, aprendidos de cor com prazer, pelo ritmo e pela musicalidade.',
      'Magda Soares (2020) mostra que essas brincadeiras desenvolvem a consciência fonológica, isto é, a capacidade de prestar atenção aos sons da língua, independentemente do significado das palavras: perceber que "pão" e "mão" rimam, que "sapo" e "sino" começam com o mesmo som, que "borboleta" é uma palavra comprida. Essa sensibilidade aos sons é uma das bases da futura aprendizagem da escrita alfabética.',
      'Na educação infantil, o trabalho com a consciência fonológica deve ser lúdico, oral e integrado às histórias e às brincadeiras, sem treinos mecânicos nem exigência de escrita. Exemplos: completar a rima que falta em um poema conhecido, inventar nomes que rimam para os personagens ("o gato Pato, o sapo Gaspo"), brincar de "o que é, o que é" com sons, bater palmas para cada pedaço da palavra e recitar trava-línguas cada vez mais rápido.',
      'A BNCC prevê, para as crianças pequenas, inventar brincadeiras cantadas, poemas e canções, criando rimas, aliterações e ritmos (EI03EF02), e, para os bebês e crianças bem pequenas, participar de situações com cantigas e parlendas (Brasil, 2018). Assim, as histórias, os poemas e as brincadeiras com a língua formam um único movimento: o de descobrir o prazer de falar, ouvir e criar com as palavras.'
    ], av: { e: 'Segundo Soares (2020), rimas, parlendas e trava-línguas desenvolvem principalmente:', o: ['a consciência fonológica.', 'a caligrafia.', 'a leitura silenciosa.', 'o cálculo mental.'], a: 0, r: 'Brincar com os sons da língua desenvolve a consciência fonológica, base da futura aprendizagem da escrita.' } }
  ],
  refs: [

CURSO.ap.m6 = {
  intro: 'Este capítulo reúne o que foi estudado em uma prática planejada: como organizar sequências e projetos de contação de histórias, como garantir que todas as crianças participem, como envolver as famílias e a comunidade e como observar, registrar e avaliar as aprendizagens na educação infantil.',
  secoes: [
    { t: '6.1 Planejar sequências e projetos de contação', fig: 'planejar', p: [
      'Para que a contação de histórias cumpra o seu papel, ela precisa de lugar garantido na rotina, e não apenas nos momentos de sobra. Isso não significa rigidez: a hora da história pode acontecer todos os dias, em horários previsíveis, e também surgir em outros momentos, quando uma situação pede uma história. O planejamento define os objetivos, ligados aos campos de experiências da BNCC, o repertório, os recursos e as propostas que continuam depois da leitura.',
      'Uma sequência reúne várias sessões em torno de um eixo: um autor (vários livros de Ruth Rocha ou de Eva Furnari), um gênero (contos acumulativos, fábulas), um personagem (lobos em diferentes histórias) ou um tema (medos, amizade). A sequência permite comparar, aprofundar e criar expectativa. Cosson (2006) recomenda, para o letramento literário, articular a leitura de diferentes textos e ampliar progressivamente o repertório.',
      'Um projeto vai além: organiza as atividades em torno de um produto com função social, decidido, sempre que possível, com as crianças. Exemplos: um livro da turma com recontos e ilustrações; uma apresentação de teatro de fantoches para outra turma; uma biblioteca circulante; um podcast de histórias gravadas pelas crianças; uma mostra de bonecos construídos. O produto dá sentido às etapas e envolve as crianças no planejamento.',
      'Um roteiro de planejamento pode incluir: objetivo e campos de experiências envolvidos; história e justificativa da escolha; preparação do contador; forma de contar e recurso; organização do espaço e ritual; momento de participação ou conversa; desdobramentos (reconto, desenho, dramatização, construção); e o que observar e registrar.'
    ], av: { e: 'Segundo o texto, a diferença entre sequência e projeto é que o projeto:', o: ['não tem planejamento.', 'organiza as atividades em torno de um produto com função social.', 'é feito apenas pelo professor.', 'tem uma única sessão.'], a: 1, r: 'O projeto tem um produto compartilhado (livro, apresentação, biblioteca circulante); a sequência aprofunda um eixo.' } },
    { t: '6.2 Contação para todos: acessibilidade e inclusão', fig: 'inclusao', p: [
      'A Lei Brasileira de Inclusão assegura sistema educacional inclusivo em todos os níveis e o direito da pessoa com deficiência de participar, em igualdade de condições, das atividades culturais e de lazer (Brasil, 2015). Na roda de história, isso significa planejar para que todas as crianças possam ouvir, ver, compreender e participar.',
      'Para crianças cegas ou com baixa visão, o contador descreve as imagens do livro, oferece objetos e texturas que representem personagens e elementos da história (um pedaço de lã para a ovelha, uma pena para o pássaro) e usa livros táteis e com letras ampliadas. Para crianças surdas, a Língua Brasileira de Sinais é reconhecida como meio legal de comunicação e expressão (Brasil, 2002); a presença de intérprete, de professor bilíngue ou de contador surdo e o uso de imagens, expressões e gestos tornam a história acessível. Toda a turma pode aprender alguns sinais dos personagens.',
      'Crianças autistas se beneficiam da previsibilidade: avisar com antecedência que a história vai começar, manter o mesmo ritual, mostrar o livro antes, usar apoio visual da sequência, reduzir ruídos e permitir que a criança fique em um lugar confortável, inclusive um pouco afastada, ou segure um objeto de regulação. Para crianças que não falam ou falam pouco, figuras de comunicação alternativa permitem escolher, responder e participar.',
      'A inclusão se estende às crianças que estão aprendendo português, como filhos de imigrantes, e às crianças indígenas: livros bilíngues, histórias da cultura de origem contadas pelas famílias e a valorização da outra língua na roda enriquecem toda a turma. Planejar a contação para todos, desde o início, é melhor do que adaptar depois.'
    ], av: { e: 'Para uma criança cega participar da roda de história, o texto recomenda:', o: ['dispensá-la da atividade.', 'descrever as imagens e oferecer objetos e texturas que representem elementos da história.', 'contar apenas histórias muito curtas.', 'pedir que ela apenas escute.'], a: 1, r: 'Descrição das imagens e objetos táteis garantem a participação da criança cega.' } },
    { t: '6.3 Famílias e comunidade: a história continua em casa', p: [
      'As DCNEI determinam que as propostas pedagógicas garantam a participação, o diálogo e a escuta cotidiana das famílias e o respeito e a valorização de suas formas de organização (Brasil, 2009, art. 8º). No campo da leitura, a parceria com as famílias amplia o tempo e os espaços de contato da criança com as histórias.',
      'A sacola literária, ou mala de leitura, é uma estratégia simples: a cada semana, uma criança leva para casa uma sacola com um ou dois livros, um caderno de registros e uma proposta (ler juntos, desenhar a parte preferida, contar uma história da família). No retorno, a criança conta à turma como foi. Para famílias com pouca familiaridade com a leitura, o professor pode sugerir que contem a história a partir das imagens, conversem sobre ela ou peçam que a criança conte.',
      'Convidar familiares e pessoas da comunidade para contar histórias na escola valoriza saberes que não estão nos livros: os causos dos avós, as histórias de outras regiões e países, as lendas indígenas e africanas, as cantigas de ninar. Essas visitas mostram às crianças que todos podem ser narradores e fortalecem o vínculo entre escola e comunidade.',
      'Outras ações possíveis são o empréstimo regular de livros da biblioteca da escola, a exposição dos livros produzidos pela turma na reunião de pais, as rodas de leitura com as famílias e a orientação sobre a escolha de livros adequados à idade. A Política Nacional de Leitura e Escrita, instituída pela Lei nº 13.696/2018, reconhece a leitura como direito e prevê a articulação entre escolas, bibliotecas e comunidades para formar leitores (Brasil, 2018).'
    ], av: { e: 'A sacola literária consiste em:', o: ['uma prova de leitura para os pais.', 'uma sacola com livros e propostas que a criança leva para casa e compartilha com a família.', 'um castigo para quem não lê.', 'a compra obrigatória de livros pelas famílias.'], a: 1, r: 'A sacola leva livros e propostas de leitura compartilhada para casa e aproxima escola e família.' } },
    { t: '6.4 Observar, registrar e avaliar', fig: 'registro', p: [
      'A avaliação na educação infantil tem características próprias. A LDB determina que ela seja feita mediante acompanhamento e registro do desenvolvimento das crianças, sem o objetivo de promoção, mesmo para o acesso ao ensino fundamental (Brasil, 1996, art. 31, I). As DCNEI acrescentam que as instituições devem criar procedimentos para o acompanhamento do trabalho pedagógico e para a avaliação do desenvolvimento das crianças, sem objetivo de seleção, promoção ou classificação (Brasil, 2009, art. 10).',
      'No trabalho com histórias, o professor pode observar: o interesse das crianças pelos livros e pela hora da história; as escolhas que fazem no cantinho de leitura; as perguntas e comentários durante e depois da história; o uso de palavras e expressões novas; a organização da sequência no reconto; a participação nos jogos dramáticos e com os fantoches; e as histórias que inventam nas brincadeiras.',
      'O registro transforma a observação em documentação. Anotações curtas e datadas sobre o que cada criança disse e fez, fotos, vídeos e gravações de recontos, desenhos e produções coletivas compõem portfólios e relatórios que mostram o percurso de cada criança. Um bom registro descreve fatos e falas, evita rótulos ("é tímida", "não presta atenção") e permite ver avanços ao longo do tempo.',
      'A avaliação também é do trabalho do professor: quais histórias envolveram mais a turma? Que recursos funcionaram? Que crianças participaram pouco, e por quê? Que mudanças no espaço, no horário ou na forma de contar podem ajudar? Com essas perguntas, a avaliação deixa de ser julgamento e se torna instrumento para planejar as próximas histórias.'
    ], av: { e: 'Segundo a LDB e as DCNEI, a avaliação na educação infantil deve:', o: ['classificar as crianças por desempenho.', 'acompanhar e registrar o desenvolvimento, sem objetivo de promoção ou classificação.', 'ser feita com provas escritas.', 'definir quem pode ir para o ensino fundamental.'], a: 1, r: 'A avaliação na educação infantil é acompanhamento e registro (LDB, art. 31; DCNEI, art. 10).' } }
  ],
  refs: [

    'BRASIL. Lei nº 10.436, de 24 de abril de 2002. Dispõe sobre a Língua Brasileira de Sinais – Libras e dá outras providências. <b>Diário Oficial da União</b>, Brasília, DF, 25 abr. 2002.',
    'BRASIL. Conselho Nacional de Educação. Câmara de Educação Básica. Resolução nº 5, de 17 de dezembro de 2009. Fixa as Diretrizes Curriculares Nacionais para a Educação Infantil. <b>Diário Oficial da União</b>, Brasília, DF, 18 dez. 2009.',
    'BRASIL. Lei nº 13.146, de 6 de julho de 2015. Institui a Lei Brasileira de Inclusão da Pessoa com Deficiência (Estatuto da Pessoa com Deficiência). <b>Diário Oficial da União</b>, Brasília, DF, 7 jul. 2015.',
    'BRASIL. Lei nº 13.696, de 12 de julho de 2018. Institui a Política Nacional de Leitura e Escrita. <b>Diário Oficial da União</b>, Brasília, DF, 13 jul. 2018.',
    'COSSON, Rildo. <b>Letramento literário</b>: teoria e prática. São Paulo: Contexto, 2006.'

/* Siglas: na primeira vez que aparecem em cada capítulo/módulo, vêm por extenso. */
CURSO.siglas = [
  ['DCNEI', 'Diretrizes Curriculares Nacionais para a Educação Infantil'],
  ['BNCC', 'Base Nacional Comum Curricular'],
  ['LDB', 'Lei de Diretrizes e Bases da Educação Nacional'],
  ['LBI', 'Lei Brasileira de Inclusão'],
  ['CNE/CEB', 'Conselho Nacional de Educação/Câmara de Educação Básica'],
  ['CAA', 'Comunicação Aumentativa e Alternativa'],
  ['AEE', 'atendimento educacional especializado'],
  ['MEC', 'Ministério da Educação']
];
CURSO.sigla = function (txt, vistos) {
  CURSO.siglas.forEach(function (s) {
    var sig = s[0], ext = s[1], q = sig.replace(/[.*+?^${}()|[\]\\\/-]/g, '\\$&');
    var re = new RegExp('(^|[^A-Za-zÀ-ú])' + q + '(?![A-Za-zÀ-ú])');
    if (vistos[sig]) return;
    var m = re.exec(txt); if (!m) return;
    vistos[sig] = true;
    var i = m.index + m[1].length;
    /* já veio por extenso ou está dentro de citação (Sigla, ano) */
    if (txt.slice(Math.max(0, i - ext.length - 3), i).toLowerCase().indexOf(ext.toLowerCase().slice(0, 20)) >= 0) return;
    if (/^[A-Z\/-]+, \d{4}/.test(txt.slice(i))) { vistos[sig] = false; return; }
    txt = txt.slice(0, i) + ext + ' (' + sig + ')' + txt.slice(i + sig.length);
  });
  return txt;
};
