*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Source Sans 3',system-ui,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3,.sora{font-family:Sora,system-ui,sans-serif;line-height:1.25;margin:0}
button{font:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.previa{background:var(--gold-wash);color:#6b4b00;font-size:13.5px;text-align:center;padding:6px 12px;border-bottom:1px solid #EBD9A8}
header.top{background:var(--sheet);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--brand);cursor:pointer}
.logo img{width:34px;height:34px}
.logo b{font-family:Sora;font-size:15px;line-height:1.05}.logo b i{font-style:normal;color:var(--gold);display:block}
.tag{margin-left:auto;font-size:13px;color:var(--soft);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--brand);color:#fff;text-decoration:none;min-height:46px}
.btn.gold{background:var(--gold2);color:#1d1400}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:14.5px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.hero{background:linear-gradient(135deg,#13285E,#1d3a80);color:#fff;padding:34px 0 30px}
.hero.foto{position:relative;padding:0 0 34px;background:#13285E}.hero.foto .ft{height:clamp(190px,34vw,430px);background:linear-gradient(180deg,rgba(19,40,94,0) 55%,#13285E 100%),var(--foto) center 28%/cover no-repeat}.hero.foto .wrap{margin-top:-28px;position:relative}
.hero .kick{color:#F5C04A;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.hero h1{font-size:clamp(24px,5vw,34px);margin:8px 0 12px}
.hero p{color:#D9E0F2;margin:0 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600}
.price{font-family:Sora;font-size:28px;font-weight:800;color:#F5C04A}.price small{font-size:14px;color:#D9E0F2;font-weight:600;font-family:'Source Sans 3'}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0}
.card h2{font-size:19px;margin-bottom:10px;color:var(--brand)}
.mods{list-style:none;margin:0;padding:0}
.mods li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.mods li:first-child{border-top:0}
.num{flex:0 0 32px;height:32px;border-radius:50%;background:var(--brand-wash);color:var(--brand);display:grid;place-items:center;font-weight:800;font-family:Sora;font-size:14px}
.mods .h{margin-left:auto;font-weight:700;color:var(--gold);white-space:nowrap;font-size:14px}
ul.ok{padding-left:20px;margin:0}ul.ok li{margin:4px 0}
.note{font-size:14px;color:var(--soft)}

/* sala */

.mi.done .num{background:var(--ok);color:#fff}.st.done{color:var(--ok)}.st.go{color:var(--gold)}

.mtitle{font-size:20px;color:var(--brand);margin:6px 0 4px}

/* cartões */
.flash{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:22px 20px;min-height:260px;display:flex;flex-direction:column;box-shadow:0 6px 20px rgba(19,40,94,.06)}

.dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:6px 0}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.v{background:var(--brand)}
/* leitura */
details.acc{background:var(--sheet);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}

.seen{color:var(--ok);font-size:14px}
/* atividades */

.assoc{display:grid;gap:10px}@media(min-width:640px){.assoc{grid-template-columns:1fr 1.6fr}}

.secoes .wrap{display:flex!important;height:auto!important;gap:2px;padding-block:5px;justify-content:space-between}
.secoes .sec{display:inline-flex;align-items:center;gap:7px;color:#DCE4F7;font:600 .9rem/1.1 Sora,sans-serif;padding:9px 8px;border-radius:12px;text-decoration:none;white-space:nowrap}
.secoes .sec svg{width:19px;height:19px;flex:none}
.secoes .sec:hover{background:rgba(255,255,255,.09);color:#fff}
.secoes .sec.on{background:#fff;color:#13285E}
.secoes .sec .ss{display:none}
@media(max-width:700px){.secoes .wrap{display:grid!important;grid-template-columns:repeat(6,minmax(0,1fr))}.secoes .sec{flex-direction:column;gap:4px;padding:8px 1px 7px;font-size:10.5px;letter-spacing:-.01em;border-radius:10px;min-width:0}.secoes .sec svg{width:21px;height:21px}.secoes .sec .sl{display:none}.secoes .sec .ss{display:inline}header.top.site .tag{display:none}.loginbtn{margin-left:auto;padding:8px 11px}.loginbtn span{display:none}}

header.top.site{background:#F7F5EF}
header.top.site .r1{padding-block:12px 6px}
header.top.site .logo{display:flex;align-items:center;gap:10px;text-decoration:none}
header.top.site .logo img{width:48px;height:48px}
header.top.site .wm{display:grid;line-height:1;border-left:2px solid #13285E;padding-left:10px}
header.top.site .wm b{color:#13285E;font:800 1.05rem/1 Sora,sans-serif}
header.top.site .wm i{color:#E0A100;font:800 1.3rem/1.05 Sora,sans-serif;font-style:normal}
header.top.site .loginbtn{margin-left:auto}
header.top.site .vozb{width:34px;height:34px;border-radius:50%;border:1px solid #E2DED2;background:#fff;display:flex;align-items:center;justify-content:center;color:#13285E;margin-left:8px}
header.top.site .r2{display:flex;gap:8px;align-items:center;padding-block:4px 12px;height:auto}
header.top.site .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #E2DED2;background:#fff;border-radius:999px;padding:8px 13px;font:700 .86rem/1 Sora,sans-serif;color:#13285E;text-decoration:none;white-space:nowrap}
header.top.site .busca{flex:1;display:flex;align-items:center;gap:8px;border:1px solid #E2DED2;background:#fff;border-radius:999px;padding:9px 14px;color:#6B7390;text-decoration:none;font-size:.9rem;min-width:0}
header.top.site .busca span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.secoes .sec.on{background:rgba(242,190,69,.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(242,190,69,.6)}
@media(max-width:700px){header.top.site .logo img{width:40px;height:40px}header.top.site .r2 .pill{padding:8px 10px;font-size:.8rem}header.top.site .busca span{font-size:.82rem}}
@media(max-width:420px){header.top.site .busca span{display:none}header.top.site .busca{flex:0 0 auto}}
/* ---------- plano de estudo (versão 2) ---------- */
.eyebrow{display:block;font:700 .72rem/1.3 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#9A6B00}
.plano-top{border-top:5px solid #F2BE45;margin-top:16px}
.plano-top .mtitle{margin:6px 0 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 14px}
.stats div{background:#F4F6FB;border-radius:14px;padding:12px;text-align:center}
.stats b{display:block;font:800 1.6rem/1 Sora,sans-serif;color:#13285E}
.stats b small{font-size:.9rem;color:#6B7390;font-weight:700}
.stats span{font-size:.82rem;color:#4A5470}
.btn.big{width:100%;padding:16px 18px;font-size:1.02rem;text-align:left;white-space:normal;line-height:1.3}
details.mcardp{background:#fff;border:1px solid #E2DED2;border-radius:16px;margin-top:12px;overflow:hidden}
details.mcardp.done{border-color:#BFE3CC}
details.mcardp summary{list-style:none;display:flex;gap:12px;align-items:center;padding:14px 16px;cursor:pointer}
details.mcardp summary::-webkit-details-marker{display:none}
details.mcardp summary .num{flex:0 0 38px;height:38px;border-radius:50%;background:#13285E;color:#fff;display:flex;align-items:center;justify-content:center;font:800 1rem Sora,sans-serif}
details.mcardp.done summary .num{background:#0B7A45}
details.mcardp .mt{flex:1;display:grid;gap:3px}
details.mcardp .mt b{color:#13285E;font-size:1rem;line-height:1.3}
.mbar{display:block;height:6px;background:#EEF1F7;border-radius:99px;overflow:hidden;margin-top:4px}.mbar i{display:block;height:100%;background:linear-gradient(90deg,#1F55A0,#F2BE45)}
details.mcardp summary:after{content:'⌄';font-size:1.3rem;color:#6B7390;transition:transform .2s}
details.mcardp[open] summary:after{transform:rotate(180deg)}
.aulas{border-top:1px solid #EEF1F7;padding:6px 10px 10px}
button.aula{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:12px;padding:10px 8px;text-align:left;cursor:pointer;font:inherit;color:inherit}
button.aula:hover{background:#F4F6FB}
button.aula .ai{flex:0 0 42px;height:32px;border-radius:10px;background:#E6EAF5;color:#13285E;display:flex;align-items:center;justify-content:center;font:700 .85rem Sora,sans-serif}
button.aula.done .ai{background:#DDF3E6;color:#0B7A45}
button.aula .at{flex:1;display:grid;font-weight:600;color:#0F1B3D;line-height:1.3}
button.aula .at small{font-weight:400;color:#4A5470;font-size:.82rem}
button.aula .ab{font:700 .82rem Sora,sans-serif;color:#13285E;border:1.5px solid #13285E;border-radius:999px;padding:6px 12px;white-space:nowrap}
button.aula.done .ab{border-color:#BFE3CC;color:#0B7A45}
button.aula.rev .ai{background:#FBF1D9;color:#9A6B00}
button.aula.lock{opacity:.55;cursor:default}button.aula.lock .ab{border-color:#ccc;color:#888}
.fases{display:flex;gap:6px;margin:4px 0 16px;flex-wrap:wrap}
.fases span{font:700 .8rem Sora,sans-serif;padding:7px 12px;border-radius:999px;background:#EEF1F7;color:#6B7390}
.fases span.on{background:#13285E;color:#fff}.fases span.ok{background:#DDF3E6;color:#0B7A45}
.memo{background:linear-gradient(135deg,#FFF7E0,#FBEFCF);border:1px solid #F2D58A;border-left:6px solid #F2BE45;border-radius:16px;padding:16px 18px;margin:14px 0}
.memo p{margin:6px 0 0;font:700 1.08rem/1.45 Sora,sans-serif;color:#13285E}
.fimaula{text-align:center}.fimaula .big{width:64px;height:64px;margin:0 auto 6px;border-radius:50%;background:#DDF3E6;color:#0B7A45;font:800 2rem/64px Sora,sans-serif}
.fimaula h3{margin:0 0 4px;color:#13285E}
p.row{display:flex;gap:10px;flex-wrap:wrap}
details.resumo summary{cursor:pointer}
.resumo .cards{display:grid;gap:10px;margin-top:12px}@media(min-width:640px){.resumo .cards{grid-template-columns:1fr 1fr}}
.resumo .rc{background:#F7F9FD;border:1px solid #E3E9F5;border-radius:12px;padding:12px}
.resumo .rc p{margin:6px 0;font-size:.92rem}.resumo .rc .m{font-weight:700;color:#9A6B00;font-size:.9rem}
.aulasp{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.aulasp span{font-size:.78rem;background:#F4F6FB;border-radius:8px;padding:4px 8px;color:#4A5470}
header.top.site{position:relative!important}

.apbox{display:flex;align-items:center;gap:12px;background:#F7F9FD;border:1px solid #E3E9F5;border-radius:14px;padding:12px;margin-top:12px}
.apbox .ic{flex:0 0 46px}.apbox .ic svg{width:46px;height:46px}.apbox div{flex:1;display:grid}.apbox small{color:#4A5470}

.cvs{display:none}@media(max-width:700px){.cvl{display:none}.cvs{display:inline}header.top.site .r2 .busca{display:none}header.top.site .r2 .pill{padding:8px 9px;font-size:.78rem;gap:4px}}

    { t: 'A brincadeira cria uma zona de desenvolvimento', x: 'Vigotski (2008) afirma que, na brincadeira, a criança age como se fosse maior do que é: segue regras, controla impulsos e opera com significados. Por isso o brincar cria uma zona de desenvolvimento iminente.', m: 'Brincando, a criança fica "uma cabeça acima" de si mesma.' },

    { t: 'Seis direitos de aprendizagem', x: 'A BNCC garante à criança os direitos de conviver, brincar, participar, explorar, expressar e conhecer-se. Um bom jogo matemático mobiliza vários deles ao mesmo tempo.', m: 'Conviver, brincar, participar, explorar, expressar, conhecer-se.' },

CURSO.ap.m1 = {
  intro: 'Este capítulo apresenta o brincar como atividade principal da criança pequena, distingue jogo, brinquedo e brincadeira, explica como se constrói o conhecimento lógico-matemático segundo a teoria de Piaget e situa a matemática nas diretrizes e na base curricular da educação infantil.',
  secoes: [
    { t: '1.1 Brincar é coisa séria', fig: 'brincar', p: [
      'Em Homo ludens, o historiador holandês Johan Huizinga sustenta que o jogo é mais antigo do que a cultura e está presente em todas as suas manifestações. O jogo é definido como uma atividade livre, exercida dentro de limites de tempo e de espaço, segundo regras livremente consentidas, mas absolutamente obrigatórias, acompanhada de um sentimento de tensão e de alegria e da consciência de ser diferente da vida cotidiana (Huizinga, 2019). Quem observa crianças brincando de pega-pega, de casinha ou de amarelinha reconhece facilmente esses traços: a seriedade com que se discute uma regra, a tensão do momento decisivo, a alegria da vitória e a fronteira bem marcada entre "valendo" e "não valendo".',
      'Na psicologia histórico-cultural, Vigotski (2008) afirma que a brincadeira de faz de conta é a atividade que mais impulsiona o desenvolvimento da criança em idade pré-escolar. Ao brincar de ser a mãe, o motorista ou o vendedor, a criança precisa seguir as regras daquele papel, controlar seus impulsos e operar com significados que se descolam dos objetos: o cabo de vassoura passa a ser um cavalo, a tampinha passa a ser uma moeda. Por isso o autor diz que, na brincadeira, a criança está sempre acima da média da sua idade, como se fosse "uma cabeça mais alta" do que ela mesma, e que o brincar cria uma zona de desenvolvimento iminente.',
      'Para a matemática, essa ideia tem uma consequência direta. Quando a criança "paga" a fruta na feirinha com três tampinhas, quando divide os pratos da casinha entre as bonecas ou quando marca quantas casas andou na trilha, ela está pensando matematicamente em um contexto que tem sentido para ela. Kishimoto (2011) lembra que a brincadeira é uma forma de a criança se apropriar da cultura, inclusive da cultura matemática: contar, comparar, repartir, medir e localizar-se fazem parte das brincadeiras tradicionais de todas as épocas.',
      'Brougère (2010) acrescenta que a criança não brinca no vazio: ela aprende a brincar, e o faz a partir de uma cultura lúdica, isto é, de um repertório de regras, esquemas e significações que recebe dos outros e recria. Essa observação ajuda a entender o papel da escola: oferecer tempo, espaço, parceiros e materiais para que a cultura lúdica se amplie, incluindo jogos e brincadeiras em que contar, comparar e localizar sejam necessários para brincar.'
    ], av: { e: 'De acordo com o texto, por que o brincar é importante para o pensamento matemático da criança?', o: ['Porque substitui a necessidade de o professor planejar.', 'Porque, ao brincar, a criança conta, compara, reparte e localiza em situações que têm sentido para ela.', 'Porque a brincadeira só serve para descansar entre as atividades sérias.', 'Porque a criança aprende a escrever os números corretamente.'], a: 1, r: 'O texto mostra que, na brincadeira, a criança pensa matematicamente em contextos com sentido: pagar a fruta, dividir os pratos, marcar as casas da trilha.' } },

    { t: '1.2 Jogo, brinquedo e brincadeira', fig: 'jbb', p: [
      'No Brasil, os estudos de Tizuko Morchida Kishimoto ajudaram a organizar um vocabulário comum para tratar do lúdico na escola. A autora reconhece que a palavra jogo é polissêmica, pois designa desde o xadrez até o faz de conta, e propõe distinguir três termos (Kishimoto, 2011). O brinquedo é o objeto, o suporte da brincadeira: a boneca, o carrinho, a bola, o dado. A brincadeira é a ação que a criança desempenha ao concretizar as regras do jogo, ao mergulhar na ação lúdica. O jogo, por sua vez, é uma atividade com regras mais explícitas, que existe dentro de uma cultura e que a criança aprende com os outros.',
      'A mesma autora chama a atenção para duas funções do jogo educativo: a função lúdica, que garante diversão, prazer e liberdade de escolha, e a função educativa, que ensina algo que completa o conhecimento da criança. O desafio pedagógico é manter o equilíbrio entre elas. Quando só a função lúdica está presente, perde-se a oportunidade de aprender; quando só a função educativa domina, o jogo vira exercício disfarçado e a criança percebe que não está mais brincando (Kishimoto, 2011).',
      'Moura (2011), ao discutir o jogo na educação matemática, aproxima o jogo da resolução de problemas: ao jogar, a criança precisa compreender as regras, antecipar jogadas, criar estratégias e avaliar resultados. Nesse sentido, o jogo aproxima-se da resolução de problemas e permite que a matemática apareça como ferramenta para ganhar, para ser justo na divisão ou para registrar quem fez mais pontos.',
      'Na prática da educação infantil, convivem brincadeiras livres, em que a criança escolhe o que fazer e com quem, e propostas planejadas pelo professor, com materiais e desafios escolhidos com intenção. As duas são necessárias. A brincadeira livre oferece ao professor um rico material de observação; a proposta planejada amplia o repertório e cria situações em que determinadas noções matemáticas se tornam necessárias.'
    ], av: { e: 'Segundo Kishimoto (2011), o que diferencia o jogo da brincadeira?', o: ['O jogo tem regras mais explícitas e faz parte de uma cultura.', 'O jogo é sempre feito com tabuleiro.', 'A brincadeira só acontece com brinquedos comprados.', 'Não há diferença entre os termos.'], a: 0, r: 'O brinquedo é o objeto, a brincadeira é a ação lúdica e o jogo é a atividade com regras mais explícitas, inserida numa cultura.' } },

    { t: '1.3 Como a criança constrói o conhecimento matemático', fig: 'conhecimentos', p: [
      'Constance Kamii, colaboradora de Jean Piaget, escreveu um dos livros mais lidos por professores de educação infantil no Brasil, A criança e o número. Com base na epistemologia genética, a autora distingue três tipos de conhecimento (Kamii, 1990). O conhecimento físico refere-se às propriedades observáveis dos objetos: a bola é vermelha, a pedra é pesada, a água escorre. Sua fonte está, em parte, nos próprios objetos. O conhecimento social é formado pelas convenções construídas pelas pessoas, como os nomes dos números, os símbolos numéricos e o fato de o Natal ser comemorado em 25 de dezembro; sua fonte são as outras pessoas. O conhecimento lógico-matemático consiste nas relações que cada sujeito cria entre os objetos.',
      'Kamii (1990) usa um exemplo simples. Diante de uma ficha vermelha e de uma ficha azul, a criança pode notar que elas são diferentes. A diferença, porém, não está na ficha vermelha nem na ficha azul: é uma relação criada mentalmente por quem as coloca em relação. A mesma criança poderia, se quisesse, considerar as fichas semelhantes (ambas são fichas) ou dizer que são duas. O número dois, assim como a semelhança e a diferença, é uma relação construída pelo sujeito.',
      'Piaget distingue ainda dois tipos de abstração. Na abstração empírica, a criança focaliza uma propriedade do objeto e ignora as outras, como quando observa apenas a cor. Na abstração reflexiva, ela constrói relações entre os objetos, como "mais", "menos", "igual" e "dois". As duas acontecem juntas na criança pequena, mas o conhecimento lógico-matemático depende da abstração reflexiva (Kamii, 1990). Daí uma consequência pedagógica fundamental: o número não pode ser simplesmente transmitido nem "visto" no material; ele é construído pela criança a partir de sua própria ação de relacionar.',
      'Por esse motivo, Kamii (1990) recomenda que o professor encoraje a criança a pensar ativamente e a estabelecer todo tipo de relação entre objetos, eventos e ações; que a incentive a quantificar em situações significativas, como distribuir materiais ou votar; e que favoreça a interação com os colegas, já que a troca de pontos de vista, as discordâncias e as negociações de regras nos jogos obrigam a criança a coordenar ideias. O jogo em grupo é, nessa perspectiva, um dos melhores contextos para o desenvolvimento do pensamento lógico-matemático.'
    ], av: { e: 'Para Kamii (1990), onde está o número "dois" quando a criança olha para duas fichas?', o: ['Na ficha vermelha.', 'Na ficha azul.', 'Na relação que a criança cria entre as fichas.', 'No livro de matemática.'], a: 2, r: 'O número é uma relação construída mentalmente pela criança: não está em nenhum dos objetos isolados.' } },

    { t: '1.4 A matemática nas DCNEI e na BNCC', fig: 'bncc', p: [
      'As Diretrizes Curriculares Nacionais para a Educação Infantil, fixadas pela Resolução CNE/CEB nº 5, de 17 de dezembro de 2009, concebem a criança como sujeito histórico e de direitos, que, nas interações, relações e práticas cotidianas, constrói sua identidade e produz cultura (Brasil, 2009). O art. 9º estabelece que as práticas pedagógicas devem ter como eixos norteadores as interações e a brincadeira e garantir experiências que, entre outras finalidades, "recriem, em contextos significativos para as crianças, relações quantitativas, medidas, formas e orientações espaçotemporais" (Brasil, 2009, art. 9º, IV).',
      'A Base Nacional Comum Curricular, homologada para a educação infantil em 2017, reafirma esses eixos e organiza o currículo em seis direitos de aprendizagem e desenvolvimento (conviver, brincar, participar, explorar, expressar e conhecer-se) e em cinco campos de experiências (Brasil, 2018). As noções matemáticas aparecem sobretudo no campo "Espaços, tempos, quantidades, relações e transformações", que reconhece que as crianças vivem inseridas em espaços e tempos de diferentes dimensões e demonstram curiosidade sobre o mundo físico e sociocultural.',
      'Nesse campo, a BNCC lembra que as crianças se deparam, frequentemente, com conhecimentos matemáticos, como contagem, ordenação, relações entre quantidades, dimensões, medidas, comparação de pesos e de comprimentos, avaliação de distâncias, reconhecimento de formas geométricas e conhecimento e reconhecimento de numerais cardinais e ordinais, e que esses conhecimentos despertam a curiosidade e devem ser ampliados pela escola (Brasil, 2018). Os objetivos de aprendizagem estão organizados em três grupos etários: bebês (zero a 1 ano e 6 meses), crianças bem pequenas (1 ano e 7 meses a 3 anos e 11 meses) e crianças pequenas (4 anos a 5 anos e 11 meses).',
      'Entre os objetivos das crianças pequenas, encontram-se, por exemplo, "classificar objetos e figuras de acordo com suas semelhanças e diferenças" (EI03ET05) e "relacionar números às suas respectivas quantidades e identificar o antes, o depois e o entre em uma sequência" (EI03ET07). Para as crianças bem pequenas, aparecem objetivos como "contar oralmente objetos, pessoas, livros etc., em contextos diversos" (EI02ET07). O documento não propõe aulas de matemática no formato escolar: os objetivos devem ser alcançados em experiências, especialmente nas interações e na brincadeira.',
      'Vale lembrar que a matemática não se restringe a um único campo. Ao organizar a fila e contar quem chegou, a turma também vive o campo "O eu, o outro e o nós"; ao pular amarelinha, o campo "Corpo, gestos e movimentos"; ao contar uma história com números, o campo "Escuta, fala, pensamento e imaginação". O planejamento por campos de experiências convida o professor a perceber essas conexões.'
    ], av: { e: 'Segundo o texto, como a BNCC propõe que os objetivos matemáticos sejam alcançados na educação infantil?', o: ['Por meio de aulas expositivas e listas de exercícios.', 'Por meio de experiências, especialmente nas interações e na brincadeira.', 'Somente no último ano da pré-escola.', 'Por meio de provas mensais.'], a: 1, r: 'A BNCC organiza a educação infantil por campos de experiências, tendo as interações e a brincadeira como eixos, e não por aulas no formato escolar.' } },

    { t: '1.5 O papel do professor: intencionalidade, observação e escuta', p: [
      'Se a criança constrói o conhecimento matemático por meio de sua própria ação, qual é o papel do professor? Lorenzato (2011) responde que cabe a ele criar situações que favoreçam a percepção matemática das crianças, explorar o que elas já sabem e ajudá-las a avançar, falando com elas, propondo desafios e valorizando suas descobertas. O autor insiste que a matemática da educação infantil deve partir do concreto, do corpo e das vivências, e que o professor precisa conhecer bem as noções que pretende desenvolver para reconhecê-las nas brincadeiras.',
      'A BNCC usa a expressão intencionalidade educativa para designar esse trabalho: organizar e propor experiências que permitam às crianças conhecer a si e ao outro e conhecer e compreender as relações com a natureza, com a cultura e com a produção científica (Brasil, 2018). Intencionalidade não significa controlar a brincadeira, mas planejar o ambiente, os materiais, os tempos e as perguntas. Uma caixa de tampinhas colocada no canto da casinha, por exemplo, provoca situações de contagem e de troca que não aconteceriam sem ela.',
      'Smole, Diniz e Cândido (2000) destacam que, nas brincadeiras, a matemática se torna visível quando o professor conversa com as crianças sobre o que fizeram: "Quantos pulos você deu?", "Quem ficou mais perto do alvo?", "Como você descobriu?". Essas perguntas transformam a ação em reflexão e ajudam a criança a tomar consciência de suas estratégias. As autoras propõem, ainda, que as brincadeiras sejam repetidas várias vezes, pois a cada repetição a criança domina melhor as regras e pode concentrar-se em novos desafios.',
      'Por fim, a observação e o registro são ferramentas essenciais. Anotar o que a criança diz, fotografar uma construção com blocos ou guardar o desenho de uma trilha permite ao professor acompanhar o desenvolvimento e planejar os próximos passos. Esse tema será aprofundado no módulo 6, quando discutiremos a avaliação na educação infantil.'
    ], av: { e: 'No texto, "intencionalidade educativa" significa:', o: ['controlar cada passo da brincadeira das crianças.', 'planejar ambiente, materiais, tempos e perguntas para provocar aprendizagens.', 'deixar as crianças brincarem sem nenhum acompanhamento.', 'transformar todas as brincadeiras em exercícios.'], a: 1, r: 'Intencionalidade é planejar e propor experiências: organizar o ambiente, os materiais e as boas perguntas, sem controlar a brincadeira.' } }
  ],

CURSO.ap.m2 = {
  intro: 'Este capítulo trata da construção da noção de quantidade e de número: o senso numérico e a subitização, os processos mentais básicos, os princípios da contagem, a conservação de quantidades e os jogos que tornam a contagem necessária.',
  secoes: [
    { t: '2.1 Senso numérico e subitização', fig: 'subitizacao', p: [
      'Pesquisas em psicologia cognitiva e em neurociência mostram que bebês de poucos meses já reagem a mudanças em pequenas quantidades e que crianças pequenas conseguem comparar, de forma aproximada, coleções maiores, como perceber que um monte com muitas balas tem "mais" do que um monte com poucas. Dehaene (1997) chama de senso numérico essa capacidade, que compartilhamos com outras espécies e que serve de ponto de partida para a construção, pela cultura e pela escola, dos números exatos.',
      'Um componente importante do senso numérico é a subitização, termo cunhado em 1949 por Kaufman e colaboradores para designar a percepção imediata da quantidade de um pequeno grupo de objetos, sem contá-los. Clements (1999) distingue dois tipos. Na subitização perceptiva, a criança reconhece de relance grupos de até quatro ou cinco objetos. Na subitização conceitual, ela reconhece partes e as compõe: vê o oito do dominó como "quatro e quatro" ou os dedos de uma mão e mais dois como "sete".',
      'Para Clements (1999), a subitização é uma habilidade fundamental, que apoia a contagem, a compreensão das quantidades e, mais tarde, a adição e a subtração. Ela pode ser desenvolvida com brincadeiras rápidas, como mostrar por um instante cartões com pontinhos e perguntar "quantos você viu?", jogar dados e dominós, cantar músicas com os dedos ou usar as "molduras de cinco e de dez", em que as quantidades aparecem sempre organizadas da mesma maneira.',

    ], av: { e: 'No texto, a subitização conceitual acontece quando a criança:', o: ['conta um a um todos os objetos.', 'reconhece partes e as junta, como ver o oito do dominó como "quatro e quatro".', 'decora a sequência dos números.', 'escreve o numeral correspondente.'], a: 1, r: 'Na subitização conceitual, a criança reconhece pequenos grupos e os compõe para chegar ao total.' } },

    { t: '2.2 Os sete processos mentais básicos', fig: 'processos', p: [
      'Lorenzato (2011) defende que, antes e durante a construção do número, a criança precisa exercitar sete processos mentais básicos, sem os quais terá dificuldade em compreender conceitos matemáticos. São eles: correspondência, comparação, classificação, sequenciação, seriação, inclusão e conservação. O autor ressalta que esses processos não seguem uma ordem rígida nem se esgotam na educação infantil: eles se desenvolvem juntos, ao longo de muitos anos, a partir das vivências das crianças.',
      'A correspondência é o ato de estabelecer a relação "um a um": um prato para cada pessoa, uma meia para cada pé. A comparação é o ato de estabelecer diferenças ou semelhanças, como "mais alto", "mais pesado", "tem a mesma cor". A classificação consiste em separar objetos em categorias de acordo com semelhanças ou diferenças, como guardar os carrinhos em uma caixa e as bonecas em outra (Lorenzato, 2011).',
      'A sequenciação é o ato de fazer suceder a cada elemento um outro, sem considerar uma ordem de grandeza, como na fila de chegada ou na sequência das atividades da rotina. A seriação é ordenar segundo um critério, como do menor para o maior ou do mais claro para o mais escuro. A inclusão é perceber que um conjunto está contido em outro: as rosas e as margaridas são flores; o 3 está "dentro" do 5. A conservação é perceber que a quantidade não depende da arrumação, da forma ou da posição (Lorenzato, 2011).',
      'Kamii (1990), apoiada em Piaget, afirma que o número é uma síntese de dois tipos de relação que a criança cria entre os objetos: a ordem, que garante que cada objeto seja contado uma única vez, e a inclusão hierárquica, que faz a criança perceber que o "três" inclui o "um" e o "dois". Por isso, brincadeiras que envolvem ordenar, juntar, separar e comparar são tão importantes quanto as que pedem para contar.'
    ], av: { e: 'De acordo com Lorenzato (2011), organizar as crianças pela ordem de chegada, sem critério de tamanho, é um exemplo de:', o: ['seriação.', 'sequenciação.', 'conservação.', 'inclusão.'], a: 1, r: 'Sequenciar é fazer suceder um elemento a outro sem critério de grandeza, como na fila de chegada. Seriar exige um critério, como do menor para o maior.' } },

    { t: '2.3 Contar de verdade: os princípios da contagem', fig: 'contagem', p: [
      'Contar parece simples para o adulto, mas exige da criança a coordenação de várias ideias. Gelman e Gallistel (1978) descreveram cinco princípios que estão em jogo quando contamos uma coleção de objetos. O primeiro é a correspondência um a um: cada objeto recebe uma, e apenas uma, palavra-número. O segundo é a ordem estável: as palavras-número são ditas sempre na mesma ordem. O terceiro é a cardinalidade: a última palavra dita representa a quantidade total da coleção.',
      'Os outros dois princípios dizem respeito ao que pode ser contado e ao modo de contar. Pelo princípio da abstração, qualquer coisa pode ser contada, inclusive objetos diferentes entre si, sons, pulos ou ideias. Pelo princípio da irrelevância da ordem, a ordem em que os objetos são contados não altera o resultado: posso começar pela esquerda ou pela direita, e sempre terei a mesma quantidade (Gelman; Gallistel, 1978).',
      'É importante distinguir recitação de contagem. Muitas crianças aprendem cedo a "música" dos números e recitam até dez ou vinte, o que é um conhecimento social valioso. Contudo, ao contar objetos, podem pular um, contar outro duas vezes ou continuar falando números depois que os objetos acabaram. Kamii (1990) observa que esses erros não se corrigem com mais treino de recitação, mas com a construção da ordem mental, isto é, a necessidade lógica de não esquecer nenhum objeto e de não contar nenhum duas vezes.',

    { t: '2.4 Comparar e conservar quantidades', fig: 'conservacao', p: [
      'Em A gênese do número na criança, Piaget e Szeminska (1971) descrevem uma situação que se tornou clássica. O experimentador alinha seis fichas vermelhas e pede que a criança coloque o mesmo número de fichas azuis. Depois, diante dela, afasta as fichas de uma das fileiras, deixando-a mais comprida. Muitas crianças de quatro ou cinco anos afirmam que agora a fileira comprida tem mais fichas, porque ocupa mais espaço. Elas ainda julgam a quantidade pelo aspecto perceptivo, e não pela correspondência.',

    { t: '2.5 Jogos e brincadeiras de quantidade', fig: 'boliche', p: [
      'Os jogos são contextos privilegiados para a quantificação porque, neles, contar, comparar e registrar tornam-se necessários para brincar. No boliche feito com garrafas de plástico, a criança conta quantas garrafas derrubou, compara com os colegas e pode registrar os pontos com tracinhos, desenhos ou numerais. Smole, Diniz e Cândido (2000) sugerem variar o número de garrafas, a distância e o tipo de bola, e conversar ao final sobre quem derrubou mais, quantas faltaram e quantas ficaram em pé.',
      'Jogos de percurso, como as trilhas com dado, exigem que a criança reconheça a quantidade no dado (às vezes por subitização), avance o mesmo número de casas, fazendo a correspondência entre pulos e números, e compare posições: quem está na frente, quem está atrás, quantas casas faltam para chegar. Kamii e DeVries (1991) consideram os jogos em grupo particularmente valiosos porque as crianças se corrigem mutuamente e precisam justificar suas jogadas.',

CURSO.ap.m3 = {
  intro: 'Este capítulo aborda três grupos de noções lógico-matemáticas que se desenvolvem nas brincadeiras: classificar e incluir, ordenar e seriar, perceber sequências e padrões, incluindo as sequências do tempo vividas na rotina.',
  secoes: [
    { t: '3.1 Classificar: atributos e critérios', fig: 'classificacao', p: [
      'Classificar é uma das ações mais frequentes das crianças: elas separam os carrinhos das bonecas, juntam as pedrinhas brancas, escolhem "só os lápis azuis". Lorenzato (2011) define a classificação como o ato de separar em categorias de acordo com semelhanças ou diferenças. Para isso, a criança precisa perceber atributos dos objetos, como cor, forma, tamanho, textura, material e uso, e escolher um deles como critério.',
      'Em A gênese das estruturas lógicas elementares, Piaget e Inhelder (1975) descrevem como essa capacidade se desenvolve. As crianças menores tendem a formar coleções figurais: arrumam os objetos de modo a compor uma figura, como uma "casa" ou um "trem", e mudam de critério no meio do caminho. Em seguida, passam a formar coleções não figurais, agrupando por semelhança, ainda sem coordenar bem as partes e o todo. Só mais tarde, em geral por volta dos sete ou oito anos, chegam à classificação operatória, com critério estável e compreensão da inclusão.',
      'A BNCC acompanha esse percurso. Para as crianças bem pequenas, o objetivo é "classificar objetos, considerando determinado atributo (tamanho, peso, cor, forma etc.)" (EI02ET05); para as crianças pequenas, "classificar objetos e figuras de acordo com suas semelhanças e diferenças" (EI03ET05) (Brasil, 2018). Ou seja, espera-se que a criança pequena seja capaz de explicar por que juntou certos objetos e de perceber que é possível classificar a mesma coleção de maneiras diferentes.',
      'Uma boa estratégia do professor é pedir que a criança conte "por que esses estão juntos". Muitas vezes, o critério dela é diferente do esperado, mas é coerente: "esses são os que eu gosto", "esses rolam". Valorizar critérios criativos e desafiar a turma a descobrir o critério do colega ("adivinhe como eu separei") transforma a classificação em um jogo de pensamento.'
    ], av: { e: 'Segundo Piaget e Inhelder (1975), o que são as "coleções figurais" das crianças menores?', o: ['Grupos organizados por um critério estável.', 'Arrumações que formam uma figura, como uma casa ou um trem, com mudança de critério.', 'Coleções de figurinhas.', 'Classificações com inclusão de classes.'], a: 1, r: 'Nas coleções figurais, a criança compõe uma figura com os objetos e muda de critério no meio do caminho.' } },

    { t: '3.2 Brincadeiras de classificação: do cesto de tesouros aos blocos lógicos', fig: 'blocos', p: [
      'A classificação começa muito cedo, na exploração dos objetos. Goldschmied e Jackson (2006) propõem, para bebês que já se sentam, o cesto de tesouros: uma cesta baixa com objetos do cotidiano feitos de materiais variados, como madeira, metal, tecido, couro, cortiça e escovas, que o bebê explora livremente, levando à boca, batendo, comparando sons e texturas. Para crianças de um a dois anos, as autoras descrevem o brincar heurístico, em que a criança recebe muitos objetos e recipientes (latas, tampas, correntes, rolos) para encher, esvaziar, encaixar, juntar e separar.',
      'Nessas propostas, o adulto organiza o ambiente e observa, sem intervir na exploração. Ao final, as crianças ajudam a guardar os objetos, separando-os por tipo, o que constitui uma experiência de classificação com sentido. Arrumar os brinquedos da sala em caixas identificadas com figuras também é uma situação cotidiana de classificar: "onde vão os blocos?", "e os animais?".',
      'Com crianças maiores, os blocos lógicos, criados pelo matemático Zoltan Dienes, são um material estruturado bastante conhecido. O conjunto tradicional tem 48 peças que combinam quatro atributos: três cores (amarelo, azul e vermelho), quatro formas (círculo, quadrado, triângulo e retângulo), dois tamanhos (grande e pequeno) e duas espessuras (grosso e fino). É possível propor jogos como "separar as peças em dois grupos e pedir que o colega descubra o critério", "adivinhar a peça escondida fazendo perguntas de sim ou não" e o "dominó das diferenças", em que cada peça colocada deve diferir da anterior em apenas um atributo.',
      'Materiais não estruturados também são excelentes: botões, tampinhas, folhas, conchas, figurinhas e retalhos. Eles têm a vantagem de apresentar atributos menos óbvios (furos, brilho, cheiro) e de permitir que as crianças inventem critérios. Smole, Diniz e Cândido (2000) sugerem ainda brincadeiras com o próprio corpo, como "quem estiver de tênis vai para o bambolê azul", em que a turma se classifica e confere os grupos formados.'
    ], av: { e: 'Na proposta do cesto de tesouros (Goldschmied; Jackson, 2006), qual é o papel do adulto?', o: ['Dizer ao bebê o que fazer com cada objeto.', 'Organizar o ambiente e observar, sem interferir na exploração.', 'Ensinar as cores dos objetos.', 'Retirar os objetos que o bebê coloca na boca e encerrar a atividade.'], a: 1, r: 'O adulto prepara o cesto com objetos seguros e variados, fica disponível e observa a exploração livre do bebê.' } },

    { t: '3.3 Seriar e ordenar', fig: 'seriacao', p: [
      'Seriar é ordenar elementos segundo diferenças crescentes ou decrescentes de um atributo: do menor para o maior, do mais leve para o mais pesado, do mais claro para o mais escuro. Lorenzato (2011) diferencia a seriação da sequenciação: na sequenciação, os elementos sucedem-se sem critério de grandeza, como na fila de chegada; na seriação, a posição de cada um depende de sua relação com os demais.',
      'Piaget e Inhelder (1975) estudaram como as crianças ordenam um conjunto de varetas de comprimentos diferentes. Inicialmente, formam pares ou pequenos trios (uma pequena e uma grande) sem coordená-los. Depois, conseguem construir a série por tentativa e erro, comparando e corrigindo. Por volta dos sete anos, aparece um método sistemático: a criança procura a menor de todas, depois a menor das que restaram, e assim por diante, compreendendo que cada vareta é, ao mesmo tempo, maior que a anterior e menor que a seguinte. Essa dupla relação é chamada de reversibilidade.',
      'Na educação infantil, as experiências de seriação aparecem em brinquedos como as bonecas de encaixe, os copos empilháveis, as torres de argolas e os quebra-cabeças de encaixe por tamanho. Também surgem em situações do dia a dia: organizar a turma por altura para uma foto, arrumar os livros do menor para o maior na prateleira, comparar os sapatos dos colegas. A história dos três ursos, com tigelas, cadeiras e camas em três tamanhos, é um clássico para conversar sobre "pequeno, médio e grande".',

    ], av: { e: 'Qual é a diferença entre sequenciar e seriar, segundo o texto?', o: ['Não há diferença.', 'Na seriação a posição depende de um critério de grandeza; na sequenciação os elementos se sucedem sem esse critério.', 'Seriar é contar; sequenciar é classificar.', 'Sequenciar exige ordem crescente.'], a: 1, r: 'Sequenciar é pôr um depois do outro (como na fila de chegada); seriar é ordenar por um critério, como o tamanho.' } },

    { t: '3.4 Sequências e padrões', fig: 'padroes', p: [
      'Padrões estão em toda parte: nas estações do ano, nos dias da semana, nas músicas, nos azulejos, nas roupas listradas. Na matemática da educação infantil, trabalha-se principalmente com padrões de repetição, que têm uma unidade, chamada núcleo, repetida várias vezes: AB (vermelho, azul, vermelho, azul...), AAB (palma, palma, pé...), ABC (círculo, quadrado, triângulo...). Clements e Sarama (2009) consideram o trabalho com padrões uma das bases do raciocínio algébrico, pois exige perceber regularidades e prever o que vem depois.',
      'Os autores descrevem uma trajetória de aprendizagem. Primeiro, a criança reconhece que algo se repete; depois, consegue continuar um padrão simples, completar um elemento que falta e copiar um padrão com outro material. Mais tarde, identifica o núcleo e consegue traduzir um padrão de uma linguagem para outra, por exemplo, transformar "vermelho, azul, vermelho, azul" em "palma, pé, palma, pé". Criar os próprios padrões é um passo importante, que revela a compreensão da regra (Clements; Sarama, 2009).',
      'O corpo e o som são excelentes pontos de partida. Sequências rítmicas com palmas, pés e estalos, canções com refrão, danças de roda e brincadeiras como "siga o mestre" permitem viver o padrão antes de vê-lo no papel. Depois, colares de contas, carimbos, pinturas com dois tipos de folha, trenzinhos de blocos coloridos e enfeites para a sala tornam os padrões visíveis e permitem conversar sobre eles.',
      'Algumas perguntas ajudam: "o que vem depois?", "qual parte se repete?", "como você explicaria esse padrão para um colega?", "o que está faltando aqui?". Um bom desafio é o padrão "com erro", em que o professor troca um elemento e as crianças descobrem onde está o problema. Também é interessante apresentar padrões de crescimento simples, como uma escada de blocos (1, 2, 3...), para crianças que já dominam os de repetição.'
    ], av: { e: 'No texto, o "núcleo" de um padrão de repetição é:', o: ['o primeiro elemento.', 'a unidade que se repete.', 'o último elemento.', 'o elemento de cor diferente.'], a: 1, r: 'O núcleo é a parte que se repete, como "palma, palma, pé" no padrão AAB.' } },

    { t: '3.5 Parte e todo, antes e depois: inclusão e tempo', fig: 'tempo', p: [
      'Piaget e Inhelder (1975) propunham às crianças uma situação que revela como elas pensam a relação entre parte e todo. Diante de um ramalhete com, por exemplo, sete margaridas e três rosas, perguntavam: "há mais margaridas ou mais flores?". Muitas crianças de quatro a seis anos respondiam "mais margaridas", porque comparavam as margaridas com as rosas, e não com o conjunto de flores. A inclusão de classes, isto é, a compreensão de que a subclasse está contida na classe, consolida-se mais tarde e está ligada à compreensão do número: o cinco inclui o quatro, que inclui o três.',
      'O professor não precisa "ensinar" a resposta, mas pode criar situações que provoquem esse pensamento: "Quem está de tênis? E quem está de sapato? Quantas crianças vieram hoje?", "Todos os cachorros são animais? Todos os animais são cachorros?". Brincadeiras com conjuntos dentro de conjuntos, como bambolês sobrepostos e caixas dentro de caixas, ajudam a visualizar a ideia de estar contido.',

CURSO.ap.m4 = {
  intro: 'Este capítulo trata da construção do espaço pela criança, das relações topológicas às projetivas e euclidianas, do reconhecimento das formas tridimensionais e planas e das primeiras experiências de medida, sempre a partir do corpo, do movimento e da brincadeira.',
  secoes: [
    { t: '4.1 Como a criança constrói o espaço', fig: 'espaco', p: [
      'Em A representação do espaço na criança, Piaget e Inhelder (1993) mostram que a criança não nasce com uma noção pronta de espaço: ela a constrói a partir de suas ações. O bebê explora o espaço próximo com a boca, as mãos e o olhar; ao engatinhar e andar, amplia esse espaço e aprende a contornar obstáculos, a entrar e sair, a subir e descer. Essa construção prática precede, em muito, a capacidade de representar o espaço em desenhos e mapas.',
      'Segundo os autores, as primeiras relações espaciais construídas pela criança são as topológicas, que não dependem de medidas nem de ponto de vista: vizinhança (perto, longe, ao lado), separação (junto, separado), ordem (antes, depois, entre), envolvimento (dentro, fora, em volta) e continuidade. Os desenhos das crianças pequenas mostram bem isso: os olhos ficam "dentro" do rosto e os braços "ligados" ao corpo, ainda que as proporções e as posições não correspondam à realidade (Piaget; Inhelder, 1993).',
      'Mais tarde, a criança constrói as relações projetivas, que dependem do ponto de vista do observador: o que está na frente ou atrás, à direita ou à esquerda, depende de onde estou. Compreender que o colega à minha frente tem a direita do lado oposto ao meu é uma conquista difícil, que se completa por volta dos oito ou nove anos. Paralelamente, desenvolvem-se as relações euclidianas, ligadas a distâncias, medidas, ângulos e paralelismo, que permitem, por exemplo, desenhar uma mesa com as pernas na proporção correta.',
      'A BNCC prevê que as crianças bem pequenas identifiquem relações espaciais como "dentro e fora, em cima, embaixo, acima, abaixo, entre e do lado" (EI02ET04) (Brasil, 2018). Na prática, isso significa oferecer muitas experiências em que essas palavras sejam vividas e ditas: "guarde a bola dentro da caixa", "passe por baixo da mesa", "fique entre a Ana e o Pedro". O vocabulário espacial se aprende no uso, em situações reais.'
    ], av: { e: 'Segundo Piaget e Inhelder (1993), quais são as primeiras relações espaciais construídas pela criança?', o: ['As euclidianas, com medidas e ângulos.', 'As topológicas, como dentro, fora, perto e entre.', 'As projetivas, com direita e esquerda do outro.', 'As cartográficas, com escalas.'], a: 1, r: 'As relações topológicas, que não dependem de medida nem de ponto de vista, são as primeiras.' } },

    { t: '4.2 Corpo, movimento e localização', fig: 'mapa', p: [
      'O corpo é a primeira referência espacial da criança. Antes de localizar objetos em relação a outros objetos, ela os localiza em relação a si mesma: em cima da minha cabeça, atrás de mim, perto do meu pé. Por isso, as brincadeiras de movimento são fundamentais para a construção do espaço. Circuitos com obstáculos para passar por cima, por baixo, por dentro e em volta; brincadeiras como "siga o mestre", "morto-vivo" e "estátua"; e danças com comandos ("mão na cabeça, mão no joelho") permitem viver as relações espaciais com o corpo inteiro.',
      'Smole, Diniz e Cândido (2003) propõem um percurso que vai do espaço vivido ao espaço representado. Primeiro, a criança percorre um trajeto, como ir da sala ao parque. Depois, descreve esse trajeto oralmente, usando pontos de referência: "passo pela porta, viro perto do bebedouro, desço a escada". Em seguida, representa o trajeto por meio de desenhos, maquetes ou mapas simples. Cada etapa exige um nível maior de abstração e deve ser retomada várias vezes.',
      'A caça ao tesouro é uma brincadeira privilegiada para esse percurso. O professor esconde um objeto e dá pistas orais ("está embaixo de algo que tem quatro pernas"), depois pistas desenhadas e, com as crianças maiores, um mapa simples da sala ou do pátio. As crianças também podem esconder o tesouro e produzir as pistas para os colegas, o que exige descrever posições com precisão. Brincadeiras com fantoches atrás de uma caixa, com "o que mudou de lugar?" e com a montagem de cenários com blocos completam o repertório.',
      'Lorenzato (2011) chama a atenção para a lateralidade: distinguir direita e esquerda é uma convenção (conhecimento social) e depende da coordenação de pontos de vista. Na educação infantil, basta que a criança comece a reconhecer o lado direito e o esquerdo do próprio corpo em brincadeiras e cantigas, sem cobranças. Marcar uma das mãos com uma fitinha durante um jogo pode ajudar.'
    ], av: { e: 'Qual é o percurso proposto por Smole, Diniz e Cândido (2003) para a construção do espaço?', o: ['Desenhar o mapa antes de conhecer o lugar.', 'Percorrer o trajeto, descrevê-lo oralmente e depois representá-lo.', 'Decorar direita e esquerda antes de brincar.', 'Usar apenas fichas impressas.'], a: 1, r: 'Do espaço vivido (percorrer) ao falado (descrever) e ao representado (desenhar, maquete, mapa).' } },

    { t: '4.3 Formas: dos objetos às figuras', fig: 'solidos', p: [
      'As crianças vivem em um mundo de objetos tridimensionais: caixas, bolas, latas, blocos, cones de trânsito. Por isso, Smole, Diniz e Cândido (2003) recomendam que o trabalho com formas comece pelos sólidos, observando o que rola e o que não rola, o que empilha e o que não empilha, quais têm "pontas" e quais são "redondos". As figuras planas podem aparecer depois, como contornos e marcas desses objetos: ao carimbar com tinta a face de uma caixa, a criança obtém um retângulo; com a base de uma lata, um círculo.',
      'O casal de educadores holandeses Pierre van Hiele e Dina van Hiele-Geldof propôs um modelo de desenvolvimento do pensamento geométrico em níveis. No primeiro, chamado de visualização ou reconhecimento, a criança identifica as figuras pela aparência global, comparando-as com objetos conhecidos: o retângulo "é uma porta", o triângulo "é um telhado". Ela ainda não analisa as propriedades, como o número de lados ou de vértices. No nível seguinte, de análise, as propriedades começam a ser percebidas (Crowley, 1994).',
      'O modelo ajuda a entender alguns equívocos comuns. Se a criança só vê triângulos "em pé", com a base para baixo, pode não reconhecer um triângulo virado ou muito alongado. Por isso é importante apresentar as figuras em posições, tamanhos e proporções variados, e não apenas os modelos "de livro". Também é importante usar os nomes corretos (quadrado, retângulo, círculo, triângulo, cubo, cilindro, esfera, cone) sem exigir que a criança os memorize.',
      'Para a criança pequena, a geometria não deve se reduzir a nomear figuras. Construir com blocos, montar torres e pontes, encaixar formas em tabuleiros, desenhar contornos, observar formas na arquitetura e na natureza e criar composições com recortes são experiências que desenvolvem a percepção espacial e a noção de forma, conforme prevê a BNCC ao propor que as crianças explorem e descrevam semelhanças e diferenças entre as características e propriedades dos objetos (Brasil, 2018).'
    ], av: { e: 'De acordo com o texto, por que é importante mostrar triângulos em posições e tamanhos variados?', o: ['Para confundir as crianças.', 'Porque a criança que só vê triângulos "em pé" pode não reconhecer um triângulo virado.', 'Porque o triângulo é a única figura importante.', 'Para que a criança decore o número de lados.'], a: 1, r: 'No nível de visualização, a criança reconhece pela aparência; variar posições amplia o conceito.' } },

    { t: '4.4 Brincadeiras com formas: tangram, quebra-cabeças e construções', fig: 'tangram', p: [
      'O tangram é um quebra-cabeça de origem chinesa formado por sete peças obtidas da divisão de um quadrado: dois triângulos grandes, um triângulo médio, dois triângulos pequenos, um quadrado e um paralelogramo. Com elas, é possível montar centenas de figuras, como animais, pessoas e objetos. Para as crianças pequenas, recomenda-se começar com poucas peças, montando figuras sobre um molde com os contornos de cada peça, e só depois propor moldes apenas com o contorno externo (Smole; Diniz; Cândido, 2003).',
      'Montar figuras com o tangram desenvolve a composição e a decomposição de formas: a criança descobre que dois triângulos pequenos formam um quadrado ou um triângulo maior, que é preciso girar ou virar uma peça para que ela se encaixe. Essas ações envolvem rotações e reflexões, ainda que a criança não use esses nomes. A conversa sobre as estratégias ("como você fez caber essa peça?") ajuda a tornar consciente o que foi feito com as mãos.',
      'Outros materiais têm o mesmo potencial: quebra-cabeças de encaixe, blocos de madeira para construção, peças de encaixar, palitos e massinha para construir contornos, tampinhas de diferentes formatos, mosaicos de papel colorido. As construções com blocos merecem destaque, pois envolvem equilíbrio, simetria, altura, largura e planejamento. Registrar as construções com fotografias e desenhos permite retomá-las e conversar sobre elas.',
      'Brincadeiras com sombras, com espelhos e com dobraduras simples também ampliam as experiências geométricas. Projetar a sombra de um objeto em várias posições mostra que a mesma forma pode produzir contornos diferentes; dobrar um papel ao meio e recortar produz figuras simétricas; observar o reflexo no espelho introduz, de forma lúdica, a ideia de simetria. Mais do que nomear, o objetivo é ampliar o olhar da criança para as formas que a rodeiam.'
    ], av: { e: 'Com crianças pequenas, como o texto recomenda começar o trabalho com o tangram?', o: ['Com moldes apenas com o contorno externo.', 'Com poucas peças, montando sobre um molde com o contorno de cada peça.', 'Pedindo que desenhem as sete peças de memória.', 'Ensinando os nomes de todas as figuras antes de brincar.'], a: 1, r: 'Moldes com o contorno de cada peça e poucas peças tornam a tarefa possível; o contorno externo vem depois.' } },

    { t: '4.5 Medidas no brincar', fig: 'medidas', p: [
      'Medir é comparar uma grandeza com outra da mesma natureza, tomada como unidade. Antes de usar réguas, balanças e relógios, a criança precisa viver muitas situações de comparação direta: quem é mais alto, qual caixa é mais pesada, em qual pote cabe mais água, qual música demora mais. Lorenzato (2011) lembra que as palavras "maior" e "menor" são muito genéricas e que o professor deve ajudar a criança a usar termos mais precisos: mais alto, mais comprido, mais largo, mais grosso, mais pesado, mais cheio.',
      'Em um segundo momento, surgem as unidades não convencionais: medir a mesa com palmos, o pátio com passos, a altura da criança com barbante ou com blocos empilhados. Essas experiências revelam um problema interessante: se cada criança medir com o próprio palmo, os resultados serão diferentes. A conversa sobre "por que deu diferente?" leva as crianças a perceberem a necessidade de uma unidade comum, ideia que está na origem das medidas padronizadas.',
      'As grandezas aparecem naturalmente nas brincadeiras. O comprimento está no "pulo mais longo" e na corrida; a massa, na balança de pratos feita com cabide e potes, em que as crianças comparam objetos; a capacidade, nas brincadeiras com água e areia, enchendo e esvaziando recipientes de formatos diferentes; o tempo, na ampulheta, na contagem até dez do esconde-esconde e na comparação da duração de músicas. A culinária é outro contexto rico, com xícaras, colheres e tempo de forno.',
      'A BNCC prevê que as crianças pequenas expressem medidas, como peso e altura, construindo gráficos básicos (EI03ET08) (Brasil, 2018). Uma proposta clássica é medir a altura das crianças no início e no final do ano, registrando em uma fita na parede, e comparar quanto cada uma cresceu. Outra é montar com a turma um gráfico de colunas com cubos ou figuras, como "a fruta preferida da turma", que envolve contagem, comparação e representação.'
    ], av: { e: 'Segundo o texto, o que as crianças percebem quando cada uma mede a mesa com o próprio palmo?', o: ['Que todos os palmos são iguais.', 'Que os resultados ficam diferentes e é preciso uma unidade comum.', 'Que não é possível medir mesas.', 'Que só a régua mede.'], a: 1, r: 'Resultados diferentes provocam a conversa sobre a necessidade de uma unidade comum, origem das medidas padronizadas.' } }

CURSO.ap.m5 = {
  intro: 'Este capítulo apresenta a resolução de problemas como eixo do trabalho matemático com crianças pequenas: o que é um problema nessa faixa etária, como adaptar as etapas de Polya, como criar problemas a partir de jogos, histórias e do cotidiano, como conversar sobre as soluções e como conduzir o jogo em sala.',
  secoes: [
    { t: '5.1 O que é um problema para a criança pequena', p: [
      'Na linguagem do dia a dia, "problema" costuma ter sentido negativo. Em matemática, porém, problema é toda situação que exige pensar para chegar a um resultado cujo caminho ainda não é conhecido. Smole, Diniz e Cândido (2000), no volume da Coleção Matemática de 0 a 6 dedicado ao tema, defendem que a resolução de problemas seja uma perspectiva metodológica, e não apenas um conteúdo: um modo de organizar o ensino em que as crianças são desafiadas a pensar, a experimentar, a comunicar e a justificar suas ideias.',
      'Para as autoras, o problema na educação infantil não precisa estar escrito nem envolver contas. Pode ser uma situação vivida ("como fazer a torre ficar em pé?"), uma brincadeira ("como chegar ao outro lado sem pisar no chão?"), uma pergunta sobre uma história ou um desafio com materiais. A criança pode resolvê-lo com o corpo, manipulando objetos, desenhando ou explicando oralmente. O que importa é que o desafio tenha sentido para ela e que ela possa agir sobre ele.',
      'As autoras também recomendam variar os tipos de problema. Os problemas convencionais têm todos os dados necessários e uma única resposta. Os não convencionais ampliam a experiência: problemas sem números ("a Ana chegou antes do João e depois da Bia; quem chegou primeiro?"), problemas com várias soluções ("de quantas maneiras podemos vestir o boneco com duas blusas e duas saias?"), problemas com dados a mais ou a menos e problemas sem solução. Esses problemas ensinam a ler a situação com atenção, em vez de procurar automaticamente "a conta" (Smole; Diniz; Cândido, 2000).',
      'Lorenzato (2011) reforça que o professor deve valorizar o processo, e não apenas a resposta. Uma criança que chega a uma resposta "errada" pode ter usado uma estratégia muito interessante, e uma conversa sobre o que ela fez costuma ensinar mais do que a simples correção.'
    ], av: { e: 'Segundo Smole, Diniz e Cândido (2000), um problema na educação infantil:', o: ['precisa estar escrito e envolver contas.', 'pode ser uma situação vivida, uma brincadeira ou uma pergunta sobre uma história, desde que tenha sentido.', 'deve ter sempre uma única resposta.', 'só pode ser resolvido no papel.'], a: 1, r: 'O problema pode ser resolvido com o corpo, com objetos, com desenhos ou com a fala; o essencial é ter sentido para a criança.' } },

    { t: '5.2 As etapas de Polya na educação infantil', fig: 'polya', p: [
      'O matemático húngaro George Polya, em A arte de resolver problemas, descreve quatro fases do trabalho de quem resolve um problema. Primeiro, é preciso compreender o problema: saber o que se pede, quais são os dados e quais as condições. Segundo, estabelecer um plano: encontrar a conexão entre os dados e o que se procura, lembrando problemas parecidos. Terceiro, executar o plano, verificando cada passo. Quarto, fazer o retrospecto: examinar a solução obtida, conferir o resultado e pensar se haveria outro caminho (Polya, 1978).',
      'Com crianças pequenas, essas fases não são ensinadas como regras, mas aparecem nas conversas conduzidas pelo professor. Para compreender, pode-se perguntar: "o que precisamos descobrir?", "o que já sabemos?", "alguém pode contar o problema com as próprias palavras?". Para planejar: "como podemos fazer?", "o que vamos usar?". Para executar: "vamos experimentar!". Para verificar: "deu certo?", "como sabemos?", "alguém fez de outro jeito?".',
      'Polya (1978) dá grande valor ao retrospecto, considerado por ele a fase mais esquecida e uma das mais instrutivas. Na educação infantil, ela corresponde à roda de conversa após a atividade, quando as crianças mostram o que fizeram, comparam estratégias e descobrem que há diferentes caminhos para a mesma resposta. Esse momento desenvolve a linguagem matemática e a capacidade de argumentar.',
      'É importante respeitar o tempo das crianças. Muitas vezes, elas precisam de várias tentativas, de mexer nos materiais e de conversar com os colegas antes de chegar a uma solução. O professor que entrega a resposta rápido demais tira da criança a oportunidade de pensar. Dar pistas por meio de perguntas, e não de respostas, é uma arte que se aprende com a prática.'
    ], av: { e: 'Na educação infantil, como aparecem as etapas de Polya?', o: ['Como regras que a criança decora.', 'Nas conversas conduzidas pelo professor: o que descobrir, como fazer, vamos tentar, deu certo?', 'Apenas em provas escritas.', 'Não se aplicam a crianças pequenas.'], a: 1, r: 'As fases viram perguntas na conversa com a turma, sem ser ensinadas como regras.' } },

    { t: '5.3 Problemas a partir de jogos, histórias e do cotidiano', fig: 'cotidiano', p: [
      'O cotidiano da educação infantil oferece problemas reais a todo momento. Há cadeiras para todos na roda? Quantos pratos precisamos pôr na mesa se dois colegas faltaram? Como dividir igualmente as massinhas entre quatro crianças? Quantos dias faltam para a festa? Cabe todo mundo no tapete? Esses problemas são especialmente significativos porque a turma precisa, de fato, da resposta, e a criança percebe a matemática como ferramenta para resolver questões da vida (Smole; Diniz; Cândido, 2000).',
      'Os jogos também geram problemas. Na trilha: "faltam quatro casas para você chegar; que número precisa sair no dado?". No boliche: "você derrubou três; quantas ficaram em pé?". No jogo de cartas: "quem tem mais pontos? quantos a mais?". Depois de jogar, o professor pode propor problemas a partir de jogadas simuladas, como "se o Pedro tirou cinco e estava na casa três, aonde ele foi?", o que leva as crianças a pensar sobre o jogo em vez de apenas jogá-lo.',
      'A literatura infantil é outra fonte valiosa. Smole, Diniz e Cândido (2000) sugerem criar problemas a partir das histórias lidas: quantos animais cabem na casa, quantos dias durou a viagem, quem chegou primeiro, como repartir o bolo. As histórias acumulativas e as de contagem são particularmente ricas. As próprias crianças podem inventar problemas sobre a história para os colegas resolverem, o que exige compreender a estrutura de um problema.',
      'Ao propor problemas, convém variar os significados das operações, mesmo sem nomeá-las: juntar e acrescentar ("chegaram mais dois"), retirar e comparar ("quantos a mais?"), completar ("quantos faltam?"), repartir e distribuir ("um para cada"). A criança resolve essas situações com os materiais e com contagem, construindo as ideias que mais tarde darão sentido às operações formais.'
    ], av: { e: 'Por que os problemas do cotidiano são especialmente significativos para as crianças?', o: ['Porque são mais fáceis.', 'Porque a turma precisa, de fato, da resposta, e percebe a matemática como ferramenta.', 'Porque não têm números.', 'Porque o professor já sabe a resposta.'], a: 1, r: 'Quando a resposta é necessária (há cadeiras para todos?), a matemática ganha sentido como ferramenta.' } },

    { t: '5.4 Conversar e registrar: a linguagem matemática', p: [
      'A comunicação ocupa lugar central na resolução de problemas. Smole, Diniz e Cândido (2000) destacam que, ao explicar como resolveram um problema, as crianças organizam o próprio pensamento, tomam consciência de suas estratégias e aprendem com as estratégias dos colegas. Por isso, a roda de conversa após uma brincadeira ou um desafio não é tempo perdido: é parte essencial da aprendizagem.',
      'O professor tem papel decisivo nessas conversas. Perguntas fechadas, que admitem apenas uma resposta curta ("quanto deu?"), devem dar espaço a perguntas abertas: "como você pensou?", "por que você fez assim?", "alguém fez de outro jeito?", "e se fossem dez crianças?", "como você explicaria para quem faltou hoje?". Essas perguntas estimulam a explicação, a comparação de estratégias e a generalização. É importante também dar tempo para a criança pensar antes de responder.',
      'Além da fala, as crianças registram suas soluções por desenhos e, aos poucos, por marcas e escritas. O desenho é um registro legítimo, que revela o caminho de pensamento: a criança que desenha três pratos e riscos para cada colega está mostrando a correspondência que fez. Smole, Diniz e Cândido (2000) propõem que esses registros sejam expostos e comparados, para que a turma perceba diferentes formas de representar e, gradualmente, se aproxime das notações convencionais.',
      'O vocabulário matemático também se aprende no uso. Palavras como "metade", "dobro", "igual", "a mais", "a menos", "sobrou", "faltou", "primeiro", "último", "entre" devem ser usadas pelo professor em contextos reais e retomadas pelas crianças. A linguagem é ponte entre a ação e o pensamento: o que a criança faz com as mãos ganha forma quando ela consegue dizer.'
    ], av: { e: 'Qual destas é uma pergunta aberta, recomendada no texto?', o: ['"Quanto deu?"', '"Como você pensou para resolver?"', '"Está certo ou errado?"', '"Terminou?"'], a: 1, r: 'Perguntas abertas como "como você pensou?" estimulam a explicação e a comparação de estratégias.' } },

    { t: '5.5 O jogo em sala: regras, estratégias, ganhar e perder', fig: 'grando', p: [
      'Grando (2004), ao estudar o uso de jogos nas aulas de matemática, propõe uma sequência de momentos para o trabalho com o jogo. O primeiro é a familiarização com o material, quando a criança explora as peças livremente. O segundo é o reconhecimento das regras, que podem ser explicadas pelo professor, lidas ou descobertas jogando. O terceiro é o "jogo pelo jogo", em que se joga para garantir que as regras foram compreendidas. Seguem-se a intervenção pedagógica verbal, com perguntas sobre as jogadas; o registro do jogo; a intervenção escrita, com problemas a partir de situações de jogo; e, por fim, jogar com "competência", isto é, voltar ao jogo usando as estratégias construídas.',
      'Na educação infantil, essa sequência é simplificada, mas a ideia central permanece: primeiro brincar com o jogo, depois pensar sobre ele. A criança precisa de muitas partidas para dominar as regras; só então consegue perceber estratégias, como escolher o número que a leva mais perto da chegada. As intervenções do professor (perguntas, problemas a partir do jogo, registros) transformam o jogo em situação de aprendizagem, sem tirar dele o prazer de jogar.',
      'Jogar envolve ganhar e perder. Kamii e DeVries (1991) observam que lidar com a derrota é uma aprendizagem social e emocional importante e que a competição, em jogos de regras adequados à idade, não precisa ser evitada; o professor, porém, deve observar como cada criança reage e ajudá-la a compreender que perder faz parte do jogo. Jogos cooperativos, em que todos jogam juntos contra um desafio, são uma alternativa valiosa, especialmente com as crianças menores.',
      'Por fim, o erro no jogo deve ser visto como fonte de informação. Quando a criança conta a casa em que está como a primeira do movimento, ou acha que tirar seis no dado é sempre bom, está revelando uma hipótese. Investigar essa hipótese com perguntas ("conta para mim como você andou") é mais produtivo do que simplesmente corrigir. Lorenzato (2011) lembra que o erro faz parte do processo de construção do conhecimento e que a criança precisa de um ambiente em que errar não seja motivo de vergonha.'
    ], av: { e: 'Qual é a ideia central dos momentos do jogo propostos por Grando (2004), segundo o texto?', o: ['Explicar todas as estratégias antes de jogar.', 'Primeiro brincar com o jogo, depois pensar sobre ele.', 'Evitar perguntas durante o jogo.', 'Jogar apenas uma vez.'], a: 1, r: 'A criança precisa jogar várias vezes para dominar as regras; depois, as intervenções levam a pensar sobre o jogo.' } }

CURSO.ap.m6 = {
  intro: 'Este capítulo final reúne as ferramentas do trabalho cotidiano: organizar ambientes e sequências de brincadeiras, adaptar jogos para que todas as crianças participem, avaliar por meio da observação e de múltiplos registros, e valorizar a cultura lúdica das famílias.',
  secoes: [
    { t: '6.1 Ambientes e sequências de brincadeiras', fig: 'ambiente', p: [
      'Horn (2004), em seu estudo sobre a organização dos espaços na educação infantil, mostra que o modo como a sala está arrumada revela a concepção de criança e de educação de quem a organizou. Salas com mesas enfileiradas e materiais guardados fora do alcance comunicam que a criança deve esperar a ordem do adulto; salas organizadas em cantos ou ambientes, com materiais acessíveis e bem identificados, comunicam que a criança pode escolher, explorar e interagir. Para a matemática, esses ambientes são preciosos: o canto da construção, o da casinha (com "mercadinho", balança e dinheiro de brincadeira), o dos jogos e o da natureza (com pedras, sementes e folhas para classificar).',
      'Os materiais não estruturados, como tampinhas, caixas, botões, sementes, conchas, carretéis e retalhos, merecem lugar de destaque. Eles podem ser contados, classificados, seriados, usados em padrões, trocados na "feirinha" e empregados em construções. Organizados em potes transparentes e etiquetados com figuras, também favorecem a autonomia e a classificação no momento de guardar.',
      'O planejamento deve prever, além dos ambientes, sequências de brincadeiras. Uma sequência é a retomada da mesma brincadeira várias vezes ao longo de dias ou semanas, com variações e desafios crescentes. Por exemplo: o boliche começa com seis garrafas e registro com tracinhos; depois passa a ter dez garrafas e registro com numerais; mais tarde, as garrafas ganham números e conta-se a soma dos pontos. Smole, Diniz e Cândido (2000) lembram que essa repetição é necessária para que as crianças dominem as regras e possam concentrar-se nas estratégias.',
      'Para cada sequência, convém definir os objetivos (com base no campo "Espaços, tempos, quantidades, relações e transformações" da BNCC), os materiais, a organização da turma (individual, duplas, pequenos grupos, roda), as perguntas que o professor pretende fazer e a forma de registro. Esse planejamento não engessa a brincadeira: ele dá ao professor segurança para observar, intervir e aproveitar o que as crianças trazem.'
    ], av: { e: 'Segundo Horn (2004), o que comunica uma sala organizada em cantos, com materiais acessíveis?', o: ['Que a criança deve esperar a ordem do adulto.', 'Que a criança pode escolher, explorar e interagir.', 'Que os materiais são apenas decorativos.', 'Que a sala está desorganizada.'], a: 1, r: 'Ambientes com materiais acessíveis expressam uma concepção de criança ativa, que escolhe e investiga.' } },

    { t: '6.2 Jogos para todos: inclusão e adaptação', fig: 'adaptar', p: [
      'A educação inclusiva parte do princípio de que todas as crianças têm o direito de brincar e aprender juntas. O Decreto nº 12.686/2025 instituiu a Política Nacional de Educação Especial Inclusiva, cujo público são estudantes com deficiência, com transtorno do espectro autista e com altas habilidades ou superdotação, assegurando-lhes a matrícula na escola comum e os apoios necessários (Brasil, 2025). Na educação infantil, isso significa planejar brincadeiras e jogos em que todas as crianças possam participar, e não atividades paralelas para algumas.',
      'O Desenho Universal para a Aprendizagem (DUA), proposto pelo CAST, oferece uma referência útil. Seus três princípios recomendam proporcionar múltiplos meios de engajamento (o porquê da aprendizagem), de representação (o quê) e de ação e expressão (o como) (CAST, 2018). Aplicado aos jogos matemáticos, o DUA sugere planejar desde o início alternativas que beneficiem todos: dados grandes e com pontos em relevo, peças de tamanhos variados e fáceis de pegar, cores contrastantes, cartões com figuras e números, regras apresentadas também por imagens e por demonstração.',
      'Algumas adaptações são simples e eficazes. Para crianças com baixa visão, materiais em relevo, com contraste e com texturas diferentes. Para crianças surdas, o uso dos números em Libras, o apoio visual e a combinação de gestos claros. Para crianças com deficiência física, peças maiores, tabuleiros fixos à mesa e a possibilidade de indicar a jogada apontando ou por um colega. Para crianças autistas, a antecipação das etapas do jogo com cartões, regras curtas e visuais, e o cuidado com ruídos e esperas longas. Para crianças com altas habilidades, desafios a mais, como criar novas regras ou registrar estratégias.',
      'Jogos cooperativos e de pequenos grupos favorecem a participação de todos. O mais importante é a atitude do professor: observar as possibilidades de cada criança, conversar com a família e com o profissional do atendimento educacional especializado quando houver, e lembrar que ajustar o jogo para que todos joguem é, em si, um ótimo problema matemático para a turma resolver junto.'
    ], av: { e: 'Segundo o texto, o que significa inclusão nos jogos da educação infantil?', o: ['Propor atividades paralelas para algumas crianças.', 'Planejar jogos em que todas as crianças possam participar juntas, com os apoios necessários.', 'Deixar de jogar quando há crianças com deficiência.', 'Separar as crianças por nível.'], a: 1, r: 'Inclusão é todos brincando juntos, com adaptações planejadas desde o início, e não atividades paralelas.' } },

    { t: '6.3 Observar, registrar e avaliar', fig: 'avaliacao', p: [
      'A Lei de Diretrizes e Bases da Educação Nacional, com a redação dada pela Lei nº 12.796/2013, determina que, na educação infantil, a avaliação se faça "mediante acompanhamento e registro do desenvolvimento das crianças, sem o objetivo de promoção, mesmo para o acesso ao ensino fundamental" (Brasil, 1996, art. 31, I). Não há notas, provas ou retenção: avaliar, nessa etapa, é acompanhar o percurso de cada criança para planejar melhor.',
      'As DCNEI detalham esse processo no art. 10. As instituições devem criar procedimentos para acompanhar o trabalho pedagógico e avaliar o desenvolvimento das crianças, garantindo a observação crítica e criativa das atividades, das brincadeiras e interações das crianças no cotidiano; a utilização de múltiplos registros realizados por adultos e crianças, como relatórios, fotografias, desenhos e álbuns; a continuidade dos processos de aprendizagem nas transições; a documentação específica que permita às famílias conhecer o trabalho da instituição; e a não retenção das crianças (Brasil, 2009).',
      'No caso das aprendizagens matemáticas, a observação das brincadeiras é a principal fonte de informação. O professor pode anotar como a criança conta (aponta? move os objetos? pula algum?), que critérios usa para classificar, se reconhece quantidades no dado sem contar, como descreve um trajeto, que estratégias usa na trilha. Pequenas anotações datadas, fotografias de construções e registros das próprias crianças compõem, ao longo do tempo, um retrato do seu desenvolvimento.',
      'Esses registros devem retornar ao planejamento. Se várias crianças ainda não fazem correspondência um a um ao contar, vale planejar brincadeiras de distribuição e de pegar "tantos quantos"; se uma criança já domina os padrões de repetição, pode receber desafios de criar padrões. A avaliação, assim entendida, é um ciclo contínuo: observar, registrar, refletir e planejar novamente. Portfólios e relatórios descritivos, que contam o que a criança já faz e como faz, em vez de listar o que lhe falta, são a forma mais coerente de comunicar esse percurso às famílias.'
    ], av: { e: 'De acordo com o texto, como deve ser a avaliação na educação infantil?', o: ['Com provas e notas para decidir a aprovação.', 'Acompanhamento e registro do desenvolvimento, sem objetivo de promoção.', 'Apenas no final do ano, com conceito.', 'Por comparação entre as crianças da turma.'], a: 1, r: 'A LDB (art. 31, I) e as DCNEI (art. 10) indicam acompanhamento, observação e múltiplos registros, sem retenção.' } },

    { t: '6.4 Brincadeiras tradicionais e parceria com as famílias', p: [
      'Kishimoto (1993) estudou os jogos tradicionais infantis e mostrou que eles fazem parte da cultura popular, são transmitidos de geração em geração, principalmente pela oralidade, e se transformam ao longo do tempo e de região para região. Amarelinha, cinco-marias, pega-varetas, bolinha de gude, pião, cabra-cega, esconde-esconde, as parlendas de contar ("um, dois, feijão com arroz") e as de escolha ("uni, duni, tê") são exemplos de um patrimônio que reúne movimento, linguagem e muita matemática.',
      'Na amarelinha, a criança percorre uma sequência numérica, equilibra-se, calcula a força para jogar a pedrinha na casa certa e respeita uma ordem. No pega-varetas, as cores valem pontos diferentes, e a soma ao final define o vencedor. Nas cinco-marias, as etapas do jogo seguem uma sequência de quantidades (pegar uma, depois duas, depois três). No esconde-esconde, a contagem marca o tempo. Nas parlendas, a contagem ganha ritmo e rima. Explorar essas brincadeiras é, ao mesmo tempo, valorizar a cultura e ampliar as experiências matemáticas.',
      'As famílias são parceiras importantes nesse trabalho. A escola pode convidar pais, mães, avós e responsáveis a ensinar à turma as brincadeiras de sua infância, montar com eles um "livro de brincadeiras da turma", com as regras registradas e ilustradas, e enviar para casa jogos simples (uma trilha de papel, um jogo de cartas de pontinhos) acompanhados de um bilhete que explique o que a criança aprende ao jogar. Essas ações aproximam a escola da comunidade e mostram que a matemática está presente na vida.',
      'Encerramos o curso retomando a ideia central: na educação infantil, a criança aprende matemática brincando, desde que o professor planeje com intencionalidade, observe com atenção, faça boas perguntas e registre o que vê. Jogos e brincadeiras não são um "intervalo" da aprendizagem, mas o próprio caminho pelo qual quantidade, classificação, sequência, forma, espaço e resolução de problemas ganham sentido para a criança.'
    ], av: { e: 'Segundo Kishimoto (1993), como os jogos tradicionais infantis são transmitidos?', o: ['Apenas pelos livros escolares.', 'De geração em geração, principalmente pela oralidade, transformando-se com o tempo.', 'Somente pela televisão.', 'Por regras fixas que nunca mudam.'], a: 1, r: 'Os jogos tradicionais fazem parte da cultura popular, são transmitidos oralmente e se transformam conforme o tempo e o lugar.' } }
