    if (vistos[sig]) return;
    var m = re.exec(txt); if (!m) return;
    vistos[sig] = true;
    var i = m.index + m[1].length;
    /* já veio por extenso ou está dentro de citação (Sigla, ano) */
    if (txt.slice(Math.max(0, i - ext.length - 3), i).toLowerCase().indexOf(ext.toLowerCase().slice(0, 20)) >= 0) return;

  });

};

<script>/* Formação Continuada no site publicado: login Google (mesmo projeto Firebase do Plano de Estudo), matrícula pelo

  function certStatus() {
    if (S.cert) return 'Emitido · código ' + S.cert.cod;

    if (PROD && S.fin.ok) return 'Pronto para emitir';

  }

  /* ---------- módulo ---------- */
  var AV = {};
  function aulaTela() {
    var m = C.modulos[V.mod], s = M(m.id), secs = C.ap[m.id].secoes, sc = secs[V.sec], VS = {}, QS = (C.mais[m.id] || [])[V.sec] || [];

    var h = barra() + '<div class="wrap"><button class="back" data-go="sala">← Meu plano</button><div class="eyebrow">Módulo ' + (V.mod + 1) + ' · Aula ' + (V.sec + 1) + ' de ' + secs.length + '</div><h2 class="mtitle">' + esc(sc.t.replace(/^\d+\.\d+\s*/, '')) + '</h2>' +
      '<div class="fases">' + fases.map(function (f, k) { return '<span class="' + (k === fi ? 'on' : k < fi ? 'ok' : '') + '">' + (k < fi ? '✓' : k + 1) + ' ' + f[1] + '</span>'; }).join('') + '</div>';
    if (V.fase === 'ler') {
      h += '<div class="apost">' + sc.p.map(function (p) { return p.slice(0, 2) === '>>' ? '<p class="cit">' + esc(p.slice(2)) + '</p>' : '<p>' + esc(C.sigla(p, VS)) + '</p>'; }).join('');
      if (sc.fig && C.figs[sc.fig]) h += '<figure class="fg"><figcaption><b>Figura</b> – ' + esc(C.figs[sc.fig].t) + '</figcaption>' + C.figs[sc.fig].svg + '<div class="fonte">Fonte: elaboração própria (2026)' + (C.figs[sc.fig].svg.indexOf('data-ud') >= 0 ? ', com ilustrações adaptadas de unDraw (undraw.co)' : '') + '.</div></figure>';
      h += '</div>';
      var q = sc.av, o = ordem(m.id + 'av' + V.sec, q.o.length), w = AV[m.id + V.sec], ok = s.e.indexOf(V.sec) >= 0 || V.lido;

      o.forEach(function (oi, z) { var cls = ok ? (oi === q.a ? ' right' : '') : (w && w.indexOf(oi) >= 0 ? ' wrong' : ''); h += '<button class="opt' + cls + '" data-av="' + oi + '"' + (ok || (w && w.indexOf(oi) >= 0) ? ' disabled' : '') + '><span class="l">' + LET[z] + '</span><span>' + esc(q.o[oi]) + '</span></button>'; });
      if (ok) h += '<div class="res okk"><b class="t">✓ Isso mesmo!</b>' + esc(q.r) + '</div><p><button class="btn gold" data-fase="q">Ir para as questões comentadas →</button></p>';
      else if (w) h += '<div class="res nok"><b class="t">Quase! Dê uma olhada no texto acima e tente outra alternativa.</b></div>';
      return h + '</div></div>';
    }
    if (V.fase === 'q') {
      var x = QS[V.qi], key = m.id + 'q' + V.sec + '.' + V.qi, oo = ordem(key, x.o.length), r = V.resp[V.qi];
      h += '<div class="act"><div class="tp">Questão ' + (V.qi + 1) + ' de ' + QS.length + '</div><div class="en">' + esc(x.e) + '</div>';
      oo.forEach(function (oi, z) { var cls = r == null ? '' : oi === x.a ? ' right' : oi === r ? ' wrong' : ''; h += '<button class="opt' + cls + '" data-qc="' + oi + '"' + (r != null ? ' disabled' : '') + '><span class="l">' + LET[z] + '</span><span>' + esc(x.o[oi]) + '</span></button>'; });
      if (r != null) {
        h += '<div class="res ' + (r === x.a ? 'okk' : 'nok') + '"><b class="t">' + (r === x.a ? '✓ Correto!' : '✗ Não foi dessa vez. A resposta certa está em verde.') + '</b><b>Resolução:</b> ' + esc(x.r) + '</div>';
        h += '<p><button class="btn gold" data-' + (V.qi < QS.length - 1 ? 'qn="1">Próxima questão →' : 'fase="fim">Ver o resumo da aula →') + '</button></p>';
      }
      return h + '</div></div>';
    }
    var qa = (s.qa || {})[V.sec] || [], n = qa.filter(Boolean).length, mem = (C.mem[m.id] || [])[V.sec];
    h += '<div class="card fimaula"><div class="big">✓</div><h3>Aula concluída!</h3><p>Você acertou <b>' + n + ' de ' + qa.length + '</b> questões.</p></div>';
    if (mem) h += '<div class="memo"><span class="eyebrow">Para memorizar</span><p>' + esc(mem) + '</p></div>';
    var prox = V.sec < secs.length - 1 ? '<button class="btn gold" data-aula="' + V.mod + '.' + (V.sec + 1) + '">Próxima aula →</button>' : '<button class="btn gold" data-rev="' + V.mod + '">Fazer a revisão do módulo →</button>';
    return h + '<p class="row">' + prox + ' <button class="btn ghost" data-go="sala">Voltar ao plano</button></p></div>';
  }
  function revTela() {
    var m = C.modulos[V.mod], s = M(m.id);
    var h = barra() + '<div class="wrap"><button class="back" data-go="sala">← Meu plano</button><div class="eyebrow">Módulo ' + (V.mod + 1) + ' · ' + m.h + ' horas</div><h2 class="mtitle">Revisão do módulo: ' + esc(m.titulo) + '</h2>';
    if (s.fim) h += '<div class="banner ok">✓ Módulo concluído em ' + dataC(s.fim) + '. ' + m.h + ' horas creditadas.</div>';
    h += '<details class="card resumo"><summary><b>Resumo do módulo para revisar antes</b> <span class="note">(' + m.cartoes.length + ' pontos)</span></summary><div class="cards">' + m.cartoes.map(function (c) { return '<div class="rc"><b>' + esc(c.t) + '</b><p>' + esc(C.sigla(c.x, {})) + '</p><div class="m">' + esc(c.m) + '</div></div>'; }).join('') + '</div></details>';
    h += quiz(m);
    return h + '</div>';
  }
  function quiz(m) {
    var s = M(m.id), h = '';
    if (s.q && s.q.ok && !V.quiz) {
      h += '<div class="banner ok">✓ Revisão aprovada com ' + s.q.best + '%.</div>';
      if (s.fim) h += next(m);
      h += '<p><button class="btn ghost sm" data-a="refazq">Refazer para treinar</button></p>';
      return h;
    }
    if (!V.quiz) V.quiz = { qs: m.quiz.map(function (q, i) { return { q: q, k: m.id + 'q' + i + '-' + Date.now() }; }), r: {}, fim: false };

    return '<p><button class="btn gold" data-go="final">Ir para a avaliação final →</button></p>';
  }
  function prova(P, titulo, intro, min, comRes) {

      h += '<div class="card score ' + (ok ? 'okk' : 'nok') + '"><div class="big">' + pct + '%</div><b>' + n + ' de ' + P.qs.length + ' acertos · ' + (ok ? 'Aprovado!' : 'Ainda não foi desta vez') + '</b></div>';
    }
    P.qs.forEach(function (x, qi) {
      var o = ordem(x.k, x.q.o.length), r = P.r[x.k];

      });
      if (P.fim && comRes && x.q.r) h += '<div class="res ' + (r === x.q.a ? 'okk' : 'nok') + '"><b class="t">' + (r === x.q.a ? '✓ Correto' : '✗ Resposta correta em verde') + '</b>' + esc(x.q.r) + '</div>';
      h += '</div>';

  function finalTela() {

    if (S.fin.ok && !V.prova) {
      h += '<div class="banner ok">✓ Aprovado com ' + S.fin.nota + '% em ' + dataC(S.fin.em) + '. As ' + C.horas + ' horas do curso estão cumpridas.</div>';
