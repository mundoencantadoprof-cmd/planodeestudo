# Atualizado em 15/10/2026 (e-mail pelo Gmail).
# Publica as funções de pagamento no Firebase quando a pasta functions muda (ou à mão, em Actions).
# Precisa de dois segredos em Settings > Secrets and variables > Actions:
#   FIREBASE_SERVICE_ACCOUNT: o arquivo JSON da chave da conta de serviço do Firebase
#   MP_ACCESS_TOKEN: o Access Token de produção do Mercado Pago
name: Publicar funções de pagamento
on:
  push:
    branches: [main]
    paths: ['functions/**', 'firebase.json', '.github/workflows/funcoes.yml']
  workflow_dispatch:
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Conferir segredos
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MP: ${{ secrets.MP_ACCESS_TOKEN }}
        run: |
          if [ -z "$SA" ] || [ -z "$MP" ]; then echo "::warning::Faltam os segredos FIREBASE_SERVICE_ACCOUNT e/ou MP_ACCESS_TOKEN. Nada foi publicado."; echo "pular=1" >> "$GITHUB_ENV"; fi
      - name: Instalar
        if: env.pular != '1'
        run: npm install --prefix functions --omit=dev
      - name: Gravar a chave do Mercado Pago
        if: env.pular != '1'
        env:
          MP: ${{ secrets.MP_ACCESS_TOKEN }}
          GM: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          printf 'MP_ACCESS_TOKEN=%s\n' "$MP" > functions/.env
          if [ -n "$GM" ]; then printf 'GMAIL_APP_PASSWORD=%s\n' "$GM" >> functions/.env; fi
      - uses: google-github-actions/auth@v2
        if: env.pular != '1'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Ligar as APIs do Google Cloud
        if: env.pular != '1'
        run: gcloud services enable cloudbilling.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com cloudfunctions.googleapis.com run.googleapis.com --project mundo-encantado-77c43
      - name: Publicar no Firebase
        if: env.pular != '1'
        run: |
          set +e
          npx --yes firebase-tools@13 deploy --only functions --project mundo-encantado-77c43 --non-interactive --force 2>&1 | tee saida.txt
          st=${PIPESTATUS[0]}
          if [ "$st" != "0" ]; then msg=$(grep -v '^\s*$' saida.txt | tail -25 | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g'); echo "::error title=Falha ao publicar::$msg"; fi
          exit $st
      - name: Conferir se as funções respondem
        if: env.pular != '1'
        run: |
          B=https://southamerica-east1-mundo-encantado-77c43.cloudfunctions.net
          a=$(curl -s -o /dev/null -w "%{http_code}" -X OPTIONS -H "Origin: https://planodeestudo.net.br" $B/pePagamento)
          b=$(curl -s -X POST -H "Content-Type: application/json" -d '{}' $B/pePagamento)
          c=$(curl -s -w " %{http_code}" -X POST -H "Content-Type: application/json" -d '{"type":"teste"}' $B/peWebhook)
          d=$(curl -s -w " %{http_code}" -X POST -H "Content-Type: application/json" -d '{}' $B/peTeste)
          e=$(curl -s -w " %{http_code}" -X POST -H "Content-Type: application/json" -d '{}' $B/peApostila)
          echo "::notice title=Teste das funções::OPTIONS=$a | pePagamento sem login=$b | peWebhook=$c | peTeste vazio=$d | peApostila sem login=$e"
