# Teste do download das apostilas (peApostila).
name: Teste das apostilas
on:
  push:
    branches: [main]
    paths: ['.github/workflows/e2e-apostila.yml', 'tools/e2e-apostila.js', 'functions/catalogo.js']
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --prefix functions --omit=dev
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: ITEM=ap-paraguacu-p1 node tools/e2e-apostila.js
      - run: ITEM=ap-paraguacu-art node tools/e2e-apostila.js
      - run: ITEM=ap-paraguacu-cie node tools/e2e-apostila.js
      - run: ITEM=ap-paraguacu-esp node tools/e2e-apostila.js
      - run: ITEM=ap-paraguacu-lib node tools/e2e-apostila.js
      - run: ITEM=ap-paraguacu-edf node tools/e2e-apostila.js
      - run: ITEM=ap-paraguacu-geo node tools/e2e-apostila.js
      - run: ITEM=ap-paraguacu-his node tools/e2e-apostila.js
      - run: ITEM=ap-paraguacu-ing node tools/e2e-apostila.js
      - run: ITEM=ap-paraguacu-lp node tools/e2e-apostila.js
      - run: ITEM=ap-paraguacu-mt node tools/e2e-apostila.js
