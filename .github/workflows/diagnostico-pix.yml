# Diagnóstico dos pagamentos (pedidos recentes, pagamentos no Mercado Pago, validade do código Pix).
name: Diagnostico de pagamentos
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostico-pix.yml', 'tools/diagnostico-pix.js']
  workflow_dispatch:
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --prefix functions --omit=dev
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: node tools/diagnostico-pix.js
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
