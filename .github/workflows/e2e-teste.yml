# Teste de ponta a ponta do cadastro do teste grátis no site publicado.
name: E2E teste gratis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/e2e-teste.yml', 'tools/e2e-teste.js']
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --prefix functions --omit=dev
      - run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: node tools/e2e-teste.js
