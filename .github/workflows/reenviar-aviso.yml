# Reenvia o e-mail de "acesso liberado" de um pedido pago. Muda o código do pedido abaixo e publica.
name: Reenviar aviso de acesso
on:
  push:
    branches: [main]
    paths: ['.github/workflows/reenviar-aviso.yml']
  workflow_dispatch:
env:
  PEDIDO: PEACCJMU
jobs:
  reenviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --prefix functions --omit=dev
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: node tools/reenviar-aviso.js "$PEDIDO"
