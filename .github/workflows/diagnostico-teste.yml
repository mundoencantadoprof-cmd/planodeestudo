# Diagnóstico do cadastro do teste grátis (função peTeste e coleção "testes").
name: Diagnostico do teste gratis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostico-teste.yml', 'tools/diagnostico-teste.js']
  workflow_dispatch:
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --prefix functions --omit=dev
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: node tools/diagnostico-teste.js
      - name: Erros recentes da função
        run: |
          l=$(gcloud logging read 'resource.labels.service_name="peteste" AND severity>=WARNING' --project mundo-encantado-77c43 --freshness=3h --limit=8 --format='value(timestamp,textPayload)' 2>&1 | cut -c1-250 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::notice title=Log peTeste::${l:-sem erros}"
