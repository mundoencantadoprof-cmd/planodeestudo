# Teste do progresso na conta Google (peProgresso).
name: Teste do progresso
on:
  push:
    branches: [main]
    paths: ['.github/workflows/e2e-progresso.yml', 'tools/e2e-progresso.js']
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --prefix functions --omit=dev
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: node tools/e2e-progresso.js
