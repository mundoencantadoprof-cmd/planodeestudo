# Diagnóstico só de leitura (rodado 13:50): para onde o domínio aponta e se HTTPS e o app respondem.
name: Diagnóstico do domínio
on:
  push:
    branches: [claude/project-thread-fwdzzh]
  workflow_dispatch:
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir
        run: |
          D=planodeestudo.net.br
          {
          echo "== delegacao .br"; dig NS $D @a.dns.br +norec | grep -A4 -E "AUTHORITY|ANSWER"
          for ns in nova.dns-parking.com cosmos.dns-parking.com; do
            echo "== $ns ip: $(dig +short A $ns)"
            dig A $D @$ns | grep -E "status|^$D|ANSWER:"
            dig A www.$D @$ns | grep -E "status|^www"
            dig NS $D @$ns +short
          done
          for p in / version.json manifest.webmanifest sw.js offline.html img/app/apple-touch-icon.png; do
            echo "== github /$p $(curl -s -o /tmp/b -w '%{http_code} %{content_type}' https://$D/$p --max-time 30) $([ $p = version.json ] && head -c 100 /tmp/b)"
          done
          } > out.txt 2>&1
          cat out.txt
          echo "::notice title=resultado::$(tr '\n' '|' < out.txt | cut -c1-3900)"
