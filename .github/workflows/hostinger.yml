# Criado em 30/10/2026 (migração para a Hostinger).
# Envia o site para a Hostinger por FTP sempre que o main muda (ou à mão, em Actions).
# Só envia os arquivos que mudaram desde o último envio.
# Precisa de três segredos em Settings > Secrets and variables > Actions:
#   HOSTINGER_FTP_HOST: o endereço FTP (ex.: ftp.planodeestudo.net.br ou o IP mostrado no painel)
#   HOSTINGER_FTP_USER: o usuário FTP
#   HOSTINGER_FTP_PASS: a senha FTP
# Sem os segredos, não envia nada (o site continua só no GitHub Pages).
name: Publicar na Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: hostinger, cancel-in-progress: false }
jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Conferir segredos
        env:
          H: ${{ secrets.HOSTINGER_FTP_HOST }}
          U: ${{ secrets.HOSTINGER_FTP_USER }}
          P: ${{ secrets.HOSTINGER_FTP_PASS }}
        run: |
          if [ -z "$H" ] || [ -z "$U" ] || [ -z "$P" ]; then echo "::warning::Faltam os segredos HOSTINGER_FTP_HOST, HOSTINGER_FTP_USER e/ou HOSTINGER_FTP_PASS. Nada foi enviado."; echo "pular=1" >> "$GITHUB_ENV"; fi
      - uses: actions/checkout@v4
        if: env.pular != '1'
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        if: env.pular != '1'
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASS }}
          protocol: ftps
          server-dir: public_html/
          timeout: 600000
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            functions/**
            tools/**
            firebase.json
            LEIA-ME.md
            CNAME
