# Diagnóstico do progresso dos alunos (somente leitura).
name: Diagnostico do progresso
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnostico-progresso.yml', 'tools/diagnostico-progresso.js']
  workflow_dispatch:
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --prefix functions --omit=dev
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: node tools/diagnostico-progresso.js
